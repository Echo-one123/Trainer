otective conductors, cross-sectional area'. Use the adiabatic equation in Regulation 543.1.3, S = √(I²t) ÷ k, then round up to the next standard size.","w":{"1":"1.16 mm² rounds up to the next standard size, 1.5 mm², not 2.5 mm².","2":"You probably left out √t (I ÷ k = 400 ÷ 134 ≈ 3 mm²); the time must go in the equation.","3":"Far too big; recheck that you took the square root of I²t before dividing by k."}},{"id":"p5.6","t":"6","c":0,"q":"A firefighter’s switch should be installed at not more than","o":["2m from the ground and the off position at the top","2m from the ground and the off position at the bottom","2.75m from the ground and the off position at the bottom","2.75m from the ground and the off position at the top"],"a":3,"x":"","r":"","n":"","k":1000449.0,"m":"","f":"Index: 'firefighter's switch'. Go to Regulation 537.4 (Chapter 53): 537.4.2.2(iii) gives the height, 537.4.4 says the handle off position shall be up.","w":{"0":"2 m isn't the figure; 537.4.2.2 says not more than 2.75 m.","1":"Wrong height (2.75 m) and the off position is up, not down.","2":"Height is right but the handle off position must be at the top (537.4.4)."}},{"id":"p5.7","t":"7","c":0,"q":"Where the main earthing terminal is separate from the main switchgear, a permanent label should be fixed in a visible position with the wording","o":["Danger Electrical Connection – Do Not Remove","Safety Electrical Connection – Do Not Remove","Danger Earth Connection – Do Not Remove","Safety Earth Connection – Do Not Remove"],"a":1,"x":"","r":"","n":"","k":1000450.0,"m":"","f":"Index: 'warning notices, earthing and bonding'. Go to Regulation 514.13.1 (Chapter 51).","w":{"0":"The label starts 'Safety', not 'Danger'.","2":"Wrong on both words; the wording is 'Safety Electrical Connection – Do Not Remove'.","3":"It says 'Electrical', not 'Earth'."}},{"id":"p5.8","t":"9","c":0,"q":"Except where PME conditions apply, the main protective bonding conductor should have a cross-sectional area of not less than","o":["Half the required csa of the earthing conductor of the installation subject to a minimum of 6mm²","The csa of the earthing conductor of the installation subject to a minimum of 6mm²","Twice the csa of the earthing conductor","100mm²"],"a":0,"x":"","r":"","n":"","k":1000451.0,"m":"","f":"Index: 'main protective bonding conductors'. Go to Regulation 544.1.1 (Chapter 54); PME cases use Table 54.8 instead.","w":{"1":"It's half the earthing conductor csa, not equal to it.","2":"Twice is wrong; 544.1.1 says half, minimum 6 mm², need not exceed 25 mm² copper.","3":"100 mm² isn't in 544.1.1; copper need not exceed 25 mm² where PME doesn't apply."}},{"id":"p5.9","t":"7","c":0,"q":"A conductor used for functional earthing shall be coloured","o":["Green","Green and yellow","Cream","Pink"],"a":3,"x":"Table 51: functional earthing conductor, pink.","r":"","n":"Corrected: the source paper keyed cream, which was the first 2018 printing. The current book (since the 2018 corrigendum) gives pink.","k":1000452.0,"m":"","f":"Index: 'identification of conductors' or 'colour'. Go to Table 51 (Chapter 51), functional earthing conductor row.","w":{"0":"Plain green isn't used for functional earth in Table 51.","1":"Green-and-yellow is reserved for protective conductors (514.4.2), not functional earth.","2":"Cream was in the first 2018 printing; the corrected book gives pink."}},{"id":"p5.10","t":"9","c":0,"q":"Which of the following is excluded as a protective earth electrode?","o":["Underground structural metalwork embedded in foundation","Welded metal reinforcement of concrete embedded in the earth","Earth plates","Metalwork of water utility supply"],"a":3,"x":"","r":"","n":"","k":1000453.0,"m":"","f":"Index: 'earth electrodes'. Go to Regulation 542.2.6 (Chapter 54), and compare with the permitted types in 542.2.1.","w":{"0":"Underground structural metalwork in foundations is a permitted electrode type (542.2.1(iv)).","1":"Welded reinforcement in concrete in the ground is permitted (542.2.1(v)), except pre-stressed concrete.","2":"Earth plates are a permitted electrode type (542.2.1(iii))."}},{"id":"p5.11","t":"10","c":0,"q":"Which class of thermally protected ballast/transformer is permitted to be mounted on a flammable surface?","o":["Class F","Class P","Class B","Class T"],"a":1,"x":"","r":"","n":"","k":1000454.0,"m":"","f":"Index: 'ballasts' or 'controlgear, independent lamp'. Go to Regulation 559.6 (Chapter 55): class P or temperature-declared types only.","w":{"0":"Class F is an insulation/temperature marking, not the thermally protected class named in 559.6.","2":"Class B isn't named in 559.6 for flammable surfaces.","3":"Class T isn't named; 559.6 allows class P or temperature-declared thermally protected types."}},{"id":"p5.12","t":"9","c":0,"q":"Which of the following in NOT permitted for use as a cpc?","o":["A conductor in a cable","The steel wire armouring of a cable","Metallic flexible conduit","A fixed bare conductor"],"a":2,"x":"","r":"","n":"","k":1000455.0,"m":"","f":"Index: 'protective conductors, types'. Go to Regulation 543.2.3 (Chapter 54), which excludes flexible or pliable conduit.","w":{"0":"A conductor in a cable is a permitted cpc (543.2.1).","1":"Steel wire armour can be a cpc if it meets the csa/adiabatic check (543.2.1).","3":"A fixed bare or insulated conductor is a permitted cpc (543.2.1)."}},{"id":"p5.13","t":"10","c":0,"q":"In the case of lighting for premises where machines with moving parts are in operation, consideration shall be given to","o":["Stationary effects","Synchronisation effects","Stroboscopic effects","Acrobatic effect"],"a":2,"x":"","r":"","n":"","k":1000456.0,"m":"","f":"Index: 'stroboscopic effect'. Go to Regulation 559.9 (Chapter 55).","w":{"0":"'Stationary' is what the strobe effect makes moving parts appear to be, not the name of the effect.","1":"'Synchronisation effects' isn't the term used in 559.9.","3":"Not a term in BS 7671; it's stroboscopic."}},{"id":"p5.14","t":"7","c":0,"q":"A bare busbar used as a protective conductive, should be identified where necessary by equal green and yellow stripes.  The minimum width of each stripe would be not less than:","o":["100m","15mm","20mm","25mm"],"a":1,"x":"","r":"","n":"","k":1000457.0,"m":"","f":"Index: 'identification, protective conductor' or 'busbar'. Go to Regulation 514.4.2 (Chapter 51): stripes 15 mm to 100 mm wide.","w":{"0":"100 mm is the maximum stripe width (and the option says metres).","2":"20 mm isn't the figure; the minimum is 15 mm.","3":"25 mm isn't the figure; the minimum is 15 mm."}},{"id":"p5.15","t":"6","c":0,"q":"Which of the following devices must not be used for emergency switching?","o":["Push-button controlling a contactor","Manually-operated switch","Circuit-breaker","Plug and socket"],"a":3,"x":"","r":"","n":"","k":1000458.0,"m":"","f":"Index: 'emergency switching'. Go to Regulation 537.3.3.3 (Chapter 53): plugs and socket-outlets shall not be used for emergency switching off.","w":{"0":"A push-button controlling a contactor is acceptable if it fails to safety (537.3.3.4).","1":"A hand-operated switch that cuts the supply directly is preferred (537.3.3.4).","2":"A circuit-breaker can cut the supply directly in one action, so it can be used for emergency switching off."}},{"id":"p67.1","t":"11","c":1,"q":"For circuits having a nominal voltage above 500V, the minimum insulation resistance is:","o":["0.25 MΩ","0.50 MΩ","0.75 MΩ","1.0 MΩ"],"a":3,"x":"","r":"","n":"","k":1000459.0,"m":"","f":"Index: 'insulation resistance'. Go to Table 61 (Chapter 64, Regulation 643.3): above 500 V row, 1000 V test.","w":{"0":"0.25 MΩ isn't a minimum in the 2018 Table 61.","1":"0.5 MΩ is the SELV/PELV minimum, not for circuits above 500 V.","2":"0.75 MΩ isn't a value in Table 61."}},{"id":"p67.2","t":"11","c":0,"q":"Which one of the following tests may only be carried out after the supply is connected?","o":["Continuity of protective conductors","Continuity of Ring final conductors","Insulation Resistance","Earth Fault Loop Impedance"],"a":3,"x":"","r":"","n":"","k":1000460.0,"m":"","f":"Index: 'testing, sequence'. Chapter 64, Regulation 643: dead tests (643.2, 643.3) come first; earth fault loop impedance (643.7.3) needs the supply on.","w":{"0":"Protective conductor continuity is a dead test done before energising.","1":"Ring final continuity is a dead test done before energising.","2":"Insulation resistance is a dead test, done before energising."}},{"id":"p67.3","t":"11","c":1,"q":"The test voltage and the minimum insulation resistance for a SELV circuit must be","o":["250V  0.5 MΩ","500V  0.5 MΩ","250V  1 MΩ","500V  1 MΩ"],"a":0,"x":"","r":"","n":"The source paper printed option A twice; option D has been replaced.","k":1000461.0,"m":"","f":"Index: 'insulation resistance'. Go to Table 61 (Chapter 64, Regulation 643.3): SELV and PELV row.","w":{"1":"500 V is the test voltage for circuits up to 500 V, not SELV.","2":"Test voltage is right, but SELV's minimum is 0.5 MΩ, not 1 MΩ.","3":"That's the row for circuits up to 500 V (e.g. 230 V), not SELV."}},{"id":"p67.4","t":"11","c":0,"q":"A Minor Works Certificate should be issued","o":["When an additional circuit is connected to an existing installation","For new installations connected to a single phase supplies of 100A or less","For alterations or additions that do not extend to the provision of a new circuit","For new installations limited to the domestic application only"],"a":2,"x":"","r":"","n":"","k":1000462.0,"m":"","f":"Index: 'Minor Electrical Installation Works Certificate' or 'minor works' in Part 2. Then see Appendix 6.","w":{"0":"A new circuit needs an Electrical Installation Certificate, not a minor works certificate.","1":"New installations need an EIC, whatever the supply rating.","3":"New installations need an EIC; the form isn't limited to domestic."}},{"id":"p67.5","t":"11","c":0,"q":"The following items are required to be tested on completion of an installation, in the correct sequence: 1. Earth electrode resistance  2. Insulation resistance  3. Continuity of protective conductors  4. Continuity of ring final circuit conductors. What is the correct order?","o":["1, 2, 3 and 4","3, 4, 2 and 1","2, 3, 1 and 4","4,2,1 and 3"],"a":1,"x":"","r":"","n":"The source paper misprinted option b and its key. Dead-test order is continuity of protective conductors, ring continuity, insulation resistance, then earth electrode: 3, 4, 2, 1.","k":1000463.0,"m":"","f":"Index: 'testing, sequence'. Chapter 64, Regulation 643: continuity of protective conductors (643.2.1), ring continuity, insulation resistance (643.3), then earth electrode resistance (643.7.2).","w":{"0":"Earth electrode resistance and insulation resistance come after the continuity tests, not first.","2":"Insulation resistance comes after both continuity tests.","3":"Protective conductor continuity is first; it can't be done last."}},{"id":"p67.6","t":"12","c":0,"q":"In a bathroom, where the space below the bathtub or shower basin is accessible only with the use of a tool, this space is classified as","o":["Zone 0","Zone 1","Zone 2","Outside the zones"],"a":3,"x":"","r":"","n":"","k":1000464.0,"m":"","f":"Index: 'bathrooms' or 'zones'. Section 701, Regulation 701.32, and the note to Fig 701.1: spaces under the bath accessible only with a tool are outside the zones.","w":{"0":"Zone 0 is the interior of the bath or shower basin.","1":"Zone 1 is above the bath; space under it needing a tool to reach is outside the zones.","2":"Zone 2 extends 0.6 m beyond zone 1; it doesn't include tool-access space under the bath."}},{"id":"p67.7","t":"12","c":0,"q":"All circuits in a bathroom must have","o":["Protection by a 30 mA RCD","A disconnection time of 5s","Supplementary bonding","Protection by a circuit-breaker"],"a":0,"x":"","r":"","n":"","k":1000465.0,"m":"","f":"Index: 'bathrooms, RCD'. Section 701, Regulation 701.411.3.3: all circuits of the location protected by 30 mA RCD.","w":{"1":"5 s is for distribution circuits (TN); bathroom final circuits need 30 mA RCD protection.","2":"Supplementary bonding can be omitted if 701.415.2 conditions are met.","3":"No regulation requires a circuit-breaker; a fuse is fine if 30 mA RCD protection is provided."}},{"id":"p67.8","t":"12","c":0,"q":"In Zone 2 of an indoor swimming pool where water jets are not likely to be used for cleaning purposes, the minimum degree of protection is","o":["IPX8","IPX4","IPX2","IPXXD"],"a":2,"x":"","r":"","n":"","k":1000466.0,"m":"","f":"Index: 'swimming pools, external influences'. Section 702, Regulation 702.512.2: zone 2, indoor, no water jets.","w":{"0":"IPX8 is for zone 0.","1":"IPX4 is for zone 1 or for zone 2 outdoors; this is indoors.","3":"IPXXD is protection against wire access, not water ingress."}},{"id":"p67.9","t":"12","c":0,"q":"With regard to external influences, equipment used in horticultural premises under normal conditions must have a degree of protection of at least","o":["IP22","IP33","IP44","IP55"],"a":2,"x":"","r":"","n":"","k":1000467.0,"m":"","f":"Index: 'agricultural and horticultural premises'. Section 705, Regulation 705.512.2: minimum IP44 under normal conditions.","w":{"0":"IP22 is below the IP44 minimum in 705.512.2.","1":"IP33 is below the IP44 minimum.","3":"IP55 exceeds the minimum; the question asks for the 'at least' figure, IP44."}},{"id":"p67.10","t":"12","c":0,"q":"In a caravan park the minimum height of a supply cable above ground level within an area not subject to vehicle movement is","o":["2m","2.5m","3.5m","6m"],"a":2,"x":"","r":"","n":"","k":1000468.0,"m":"","f":"Index: 'caravan parks, overhead'. Section 708, Regulation 708.521.7.3: 6 m where vehicles move, 3.5 m elsewhere.","w":{"0":"2 m isn't in 708.521.7.3; the minimum away from vehicles is 3.5 m.","1":"2.5 m isn't in 708.521.7.3.","3":"6 m applies to areas subject to vehicle movement."}},{"id":"p67.11","t":"12","c":0,"q":"For an exhibition or show, any cable intended to supply temporary structures must have at its origin, an RCD with a rated residual current not exceeding","o":["500mA","300mA","100mA","30mA"],"a":1,"x":"","r":"","n":"","k":1000469.0,"m":"","f":"Index: 'exhibitions, shows and stands'. Section 711, Regulation 711.410.3.4: RCD at origin of the cable, not exceeding 300 mA, time-delayed or Type S.","w":{"0":"500 mA isn't the figure; 711.410.3.4 sets 300 mA maximum.","2":"100 mA isn't used in 711.410.3.4.","3":"30 mA is for final circuits/sockets; the supply cable RCD is 300 mA, delayed for selectivity."}},{"id":"p67.12","t":"12","c":0,"q":"Which of the following is not regarded as a mobile or transportable unit?","o":["Motor caravan","Mobile catering unit","Medical services mobile unit","Mobile workshop"],"a":0,"x":"","r":"","n":"","k":1000470.0,"m":"","f":"Index: 'mobile or transportable units'. Section 717, Regulation 717.1 scope: lists examples and excludes caravans to Section 721.","w":{"1":"Catering units are given as examples in 717.1.","2":"Medical or health screening units are given as examples in 717.1.","3":"Workshops are given as examples in 717.1."}},{"id":"p67.13","t":"12","c":0,"q":"Electric dodgems at a fairground must only be operated at voltages not exceeding","o":["50V dc or 120V ac","50V ac or 120V dc","110V dc or 115V ac","500V dc or 400V ac"],"a":1,"x":"","r":"","n":"","k":1000471.0,"m":"","f":"Index: 'dodgems' or 'fairgrounds'. Section 740, Regulation 740.55.9.","w":{"0":"Values swapped; it's 50 V AC or 120 V DC (same as the ELV limits).","2":"These aren't the 740.55.9 limits; dodgems are ELV, 50 V AC/120 V DC.","3":"Low voltage values; dodgems must be ELV."}},{"id":"p67.14","t":"12","c":0,"q":"In Zone 0 and 1 of a fountain, an acceptable protective measure would be:","o":["Class II equipment]","Non-conducting locations","SELV","Earth free protection"],"a":2,"x":"","r":"","n":"","k":1000472.0,"m":"","f":"Index: 'fountains'. Section 702, Regulation 702.410.3.4.2: zones 0 and 1 of fountains allow SELV, ADS with 30 mA RCD, or electrical separation.","w":{"0":"Class II equipment isn't one of the measures listed in 702.410.3.4.2.","1":"Non-conducting location is prohibited in pool/fountain locations (702.410.3.6).","3":"Earth-free local equipotential bonding is prohibited (702.410.3.6)."}},{"id":"p67.15","t":"12","c":0,"q":"The electrical inlet to a caravan should be mounted so that its maximum height from ground level does not exceed","o":["2.25m","1.8m","1.0m","0.75m"],"a":1,"x":"","r":"","n":"","k":1000473.0,"m":"","f":"Index: 'caravans, inlet'. Section 721, Regulation 721.55.1.2: not more than 1.8 m above ground, IP44.","w":{"0":"2.25 m isn't the figure; the maximum height is 1.8 m.","2":"1.0 m isn't the maximum in 721.55.1.2.","3":"0.75 m isn't the figure; 1.8 m is the maximum."}},{"id":"p67.16","t":"13","c":1,"q":"A 60A protective device to BS3036 operates 5s after a fault.  What is the value of fault current flowing?","o":["360A","800A","87A","205A"],"a":3,"x":"Appendix 3, BS 3036 curve: go across from 5 s to the 60 A curve, then down: about 205 A.","r":"","n":"","k":1000474.0,"m":"","f":"Index: 'time/current characteristics'. Appendix 3, Fig 3A2(a) (BS 3036): go across from 5 s to the 60 A curve and read the current below.","w":{"0":"Too high; at 360 A a 60 A BS 3036 fuse operates faster than 5 s. Don't guess a multiple of In.","1":"Too high; 800 A would blow the fuse much faster than 5 s.","2":"Too low; at 87 A the fuse would take far longer than 5 s, if it blew at all."}},{"id":"p67.17","t":"3","c":0,"q":"Equipment to be installed must be capable of being submerged in water and withstand a temperature range of -25°C to +55°C. The categories of classification of external influences for this equipment are","o":["AD7 and AA3","AA4 and AF3","AK2 and AD7","AD8 and AA7"],"a":3,"x":"","r":"","n":"","k":1000475.0,"m":"","f":"Index: 'external influences'. Appendix 5: AA (ambient temperature) and AD (presence of water) codes.","w":{"0":"AD7 is immersion, not submersion; AA3 is -25°C to +5°C.","1":"AA4 is -5°C to +40°C, and AF3 is corrosion, not water.","2":"AK2 is flora hazard, and AD7 is immersion, not submersion."}},{"id":"p67.18","t":"13","c":1,"q":"A 230V single-phase heating circuit has a design current of20A. The length of the thermoplastic insulated cable is 25m. The cable used is 6mm2 having a voltage drop of 7.3mV/A/m.  The actual voltage drop under full load conditions is","o":["3.65V","5.7V","7.3V","3650V"],"a":0,"x":"Vd = mV/A/m × Ib × L ÷ 1000<br>7.3 × 20 × 25 = 3650<br>3650 ÷ 1000 = 3.65 V","r":"","n":"","k":1000476.0,"m":"","f":"Index: 'voltage drop'. Appendix 4, Table 4D1B gives mV/A/m; Vd = mV/A/m × Ib × L ÷ 1000.","w":{"1":"Not from the formula; recheck 7.3 × 20 × 25 ÷ 1000.","2":"7.3 is the mV/A/m figure itself, not the voltage drop.","3":"You didn't divide by 1000 to convert millivolts to volts."}},{"id":"p67.19","t":"7","c":0,"q":"A busbar trunking system must comply with","o":["BS EN 61439-6","BS EN 61534-1","BS EN 60947-2","BS EN 60309-2"],"a":0,"x":"","r":"","n":"","k":1000477.0,"m":"","f":"Index: 'busbar trunking'. Regulation 521.4 (Chapter 52): busbar trunking to BS EN 61439-6, powertrack to BS EN 61534.","w":{"1":"BS EN 61534 is for powertrack systems.","2":"BS EN 60947-2 is for circuit-breakers.","3":"BS EN 60309-2 is for industrial plugs and socket-outlets."}},{"id":"p67.20","t":"13","c":1,"q":"Which of the following is the correct grouping factor for six circuits installed on a cable ladder system?","o":["0.57","0.72","0.79","0.73"],"a":2,"x":"","r":"","n":"","k":1000478.0,"m":"","f":"Index: 'grouping'. Appendix 4, Table 4C1, item 4 (single layer multicore on cable ladder or cleats), 6 circuits column.","w":{"0":"0.57 is item 1 (bunched/enclosed), 6 circuits.","1":"0.72 is item 2 (single layer on wall or floor), 6 circuits.","3":"0.73 is item 3 (perforated tray), 6 circuits."}},{"id":"pdf10.1","t":"1","c":0,"q":"Risk of injury from an electrical installation can arise from which of the following?","o":["Power supply interruptions and/or interruption of safety services","Slips trips and falls","Lone working","Cuts and abrasions from fibre optic cabling"],"a":0,"x":"","r":"","n":"","k":1000479.0,"m":"","f":"Index: 'safety, protection for'. Go to Regulation 131.1 (Chapter 13), list (i) to (vii).","w":{"1":"Slips, trips and falls aren't risks arising from the installation in 131.1.","2":"Lone working is a working practice, not a 131.1 risk.","3":"Fibre optic cuts aren't in the 131.1 list."}},{"id":"pdf10.2","t":"1","c":0,"q":"Electric fence installations are?","o":["Covered by BS 7671","Excluded from BS 7671","Included in the scope of BS 7671","Only to be connected to a TN-S earthing arrangement"],"a":1,"x":"","r":"","n":"","k":1000480.0,"m":"","f":"Index: 'exclusions from scope' or 'electric fence'. Go to Regulation 110.2(xii) (Chapter 11): electric fences to BS EN 60335-2-76 are excluded.","w":{"0":"Electric fences are excluded by 110.2(xii).","2":"Same meaning as 'covered'; 110.2 excludes them.","3":"No such earthing requirement; electric fences are outside BS 7671."}},{"id":"pdf10.3","t":"2","c":0,"q":"A wiring system designed to provide mechanical flexibility in use without degradation of the electrical components is called?","o":["Twin and earth","Flexible cable","PVC conduit","Steel wire armoured"],"a":1,"x":"","r":"","n":"","k":1000481.0,"m":"","f":"Index: Part 2 definitions, 'flexible wiring system' and 'flexible cable'.","w":{"0":"Twin and earth is fixed wiring, not designed for repeated flexing.","2":"PVC conduit is rigid containment, not a flexible system.","3":"SWA is a fixed wiring cable, not designed for flexing in use."}},{"id":"pdf10.4","t":"2","c":0,"q":"Band II voltages do not exceed?","o":["1500 V AC","50 V AC","1000 V AC","230 V AC"],"a":2,"x":"","r":"","n":"","k":1000482.0,"m":"","f":"Index: Part 2 definitions, 'voltage bands' or 'Band II': note gives 1000 V AC rms or 1500 V DC.","w":{"0":"1500 V is the Band II DC limit; for AC it's 1000 V.","1":"50 V AC is the top of Band I (ELV).","3":"230 V is a nominal supply voltage, not the Band II limit."}},{"id":"pdf10.5","t":"2","c":0,"q":"A device which protects against voltage surges is referred to as","o":["PELV","SELV","LV","SPD"],"a":3,"x":"","r":"","n":"","k":1000483.0,"m":"","f":"Index: Part 2 definitions, 'surge protective device (SPD)'; also Section 534.","w":{"0":"PELV is protective extra-low voltage, a shock-protection system.","1":"SELV is separated extra-low voltage, a shock-protection system.","2":"LV is the low voltage range, not a device."}},{"id":"pdf10.6","t":"1","c":0,"q":"The csa of conductors under normal operating and fault conditions shall be determined, where appropriate, according to?","o":["The ESQCR regulations","The understanding to ensure fault current is kept to a minimum","The admissible voltage drop","The nature of the location"],"a":2,"x":"","r":"132.6","n":"Corrected: the source key gave “nature of the location”, but that is in 132.7 (choice of wiring system). Regulation 132.6 lists admissible voltage drop as a factor for conductor csa.","k":1000484.0,"m":"","f":"Index: 'cross-sectional area of conductors'. Go to Regulation 132.6 (Chapter 13), list of factors.","w":{"0":"ESQCR is supply legislation, not a 132.6 factor.","1":"Not a 132.6 factor; fault current withstand is, not minimising it.","3":"Nature of the location is in 132.7 (type of wiring), not 132.6."}},{"id":"pdf10.7","t":"1","c":0,"q":"A circuit is designed with knowledge of the loads to be expected on the various circuits in order to determine the?","o":["Nature of demand","Voltage present","Voltage drop","Circuit grouping"],"a":0,"x":"","r":"","n":"","k":1000485.0,"m":"","f":"Index: 'nature of demand' or 'design'. Go to Regulation 132.3 (Chapter 13).","w":{"1":"Voltage is a supply characteristic (132.2), not determined from loads.","2":"Voltage drop is a 132.6 factor for csa.","3":"Grouping affects cable rating, not the 132.3 heading."}},{"id":"pdf10.8","t":"12","c":0,"q":"Mode 3 is commonly associated with?","o":["Cable installation methods","Electric vehicle charging","Zones within a bathroom","Zones within a swimming pool"],"a":1,"x":"","r":"","n":"The source key gives “cable installation methods”. That is a misprint: Mode 3 is an EV charging mode (Section 722 and IEC 61851). Installation methods are “reference methods”, not modes.","k":1000486.0,"m":"","f":"Index: 'electric vehicle charging' or 'Mode 3'. Part 2 definitions and Section 722.","w":{"0":"Installation methods are 'reference methods' (Appendix 4), not modes.","2":"Bathroom areas are zones (Section 701), not modes.","3":"Swimming pool areas are zones (Section 702), not modes."}},{"id":"pdf10.9","t":"2","c":0,"q":"What type of function is intended to make dead for reasons of safety?","o":["Isolator","Functional switching","Mechanical maintenance","Isolation"],"a":3,"x":"","r":"","n":"","k":1000487.0,"m":"","f":"Index: Part 2 definitions, 'isolation' (a function) and 'isolator' (a device).","w":{"0":"Isolator is the device, not the function.","1":"Functional switching controls normal operation, not safety.","2":"Switching for mechanical maintenance is for non-electrical work."}},{"id":"pdf10.10","t":"7","c":0,"q":"Every electrical joint and connection shall be?","o":["Installed so that design temperatures are not exceeded","Of proper construction in relation to conductance and insulation","Accompanied by a warning sign","Accessible"],"a":1,"x":"","r":"","n":"","k":1000488.0,"m":"","f":"Index: 'joints and connections'. Go to Regulation 134.1.4 (Chapter 13); see also 526.1.","w":{"0":"Not the 134.1.4 wording; it's about conductance, insulation, strength and protection.","2":"No warning sign is required for every joint.","3":"Accessibility is 526.3, which has exceptions (e.g. maintenance-free joints)."}},{"id":"b1.00.00","t":"1","c":0,"q":"BS 7671 includes requirements for circuits supplied at nominal voltages up to and including:","o":["1000 V AC or 1500 V DC","600 V AC or 900 V DC","1000 V AC or 1000 V DC","1500 V AC or 1000 V DC"],"a":0,"x":"Regulation 110.1.2(i): circuits supplied at nominal voltages up to and including 1000 V AC or 1500 V DC.","r":"110.1.2 (page 15 of the 2018 book)","n":"","k":638,"m":"","f":"Index: 'scope'. Go to Regulation 110.1.2 (Chapter 11), item (i).","w":{"1":"600 V/900 V isn't the scope limit.","2":"DC limit is 1500 V, not 1000 V.","3":"AC and DC values swapped."}},{"id":"b1.00.01","t":"1","c":0,"q":"Which statement correctly describes the legal status of BS 7671?","o":["It is a statutory document made under the Health and Safety at Work etc. Act 1974","It is an Approved Code of Practice made under Section 16 of the Health and Safety at Work etc. Act 1974","It is non-statutory but may be used in a court of law in evidence to claim compliance with a statutory requirement","It is non-statutory and cannot be referred to in a court of law"],"a":2,"x":"Regulation 114.1: the Regulations are non-statutory, but may be used in a court of law in evidence to claim compliance with a statutory requirement.","r":"114.1 (page 16 of the 2018 book)","n":"","k":691,"m":"","f":"Index: 'statutory regulations' or 'legal status'. Go to Regulation 114.1 (Chapter 11) and Appendix 2.","w":{"0":"BS 7671 is non-statutory.","1":"It isn't an Approved Code of Practice.","3":"It can be used in court as evidence of compliance (114.1)."}},{"id":"b1.00.02","t":"1","c":0,"q":"For low voltage installations, 'basic protection' generally corresponds to protection against:","o":["indirect contact","direct contact","overcurrent","thermal effects"],"a":1,"x":"Note to Regulation 131.2.1: basic protection generally corresponds to protection against 'direct contact'. Fault protection corresponds to indirect contact (131.2.2).","r":"131.2.1 (page 18 of the 2018 book)","n":"","k":745,"m":"","f":"Index: 'basic protection'. Go to Regulation 131.2.1 (Chapter 13) and its note.","w":{"0":"Indirect contact corresponds to fault protection (131.2.2).","2":"Overcurrent is 131.4, separate from shock protection.","3":"Thermal effects is 131.3."}},{"id":"b1.00.03","t":"1","c":0,"q":"A single-pole fuse, switch or circuit-breaker shall be inserted in:","o":["the neutral conductor only","either the line or the neutral conductor","the protective conductor","the line conductor only"],"a":3,"x":"Regulation 132.14.1: a single-pole fuse, switch or circuit-breaker shall be inserted in the line conductor only.","r":"132.14.1 (page 21 of the 2018 book)","n":"","k":904,"m":"","f":"Index: 'single-pole devices'. Go to Regulation 132.14.1 (Chapter 13).","w":{"0":"Never in the neutral only; it must be in the line.","1":"Not either; a single-pole device must be in the line.","2":"No switching device goes in a protective conductor."}},{"id":"b1.00.04","t":"2","c":0,"q":"In BS 7671, an 'appliance' is defined as an item of current-using equipment other than:","o":["a socket-outlet or a plug","fixed or stationary equipment","an accessory or a switch","a luminaire or an independent motor"],"a":3,"x":"Part 2 definition of Appliance: an item of current-using equipment other than a luminaire or an independent motor.","r":"Part 2 (page 24 of the 2018 book)","n":"","k":1017,"m":"","f":"Index: Part 2 definitions, 'appliance'.","w":{"0":"Sockets and plugs are accessories, not part of this definition.","1":"Fixed/stationary isn't the exclusion in the definition.","2":"Accessories aren't current-using equipment, so not part of the definition."}},{"id":"b1.00.05","t":"2","c":0,"q":"Equipment in which protection against electric shock relies on basic insulation plus additional precautions such as supplementary insulation, with no provision for connecting exposed metalwork to a protective conductor, is:","o":["Class 0 equipment","Class II equipment","Class I equipment","Class III equipment"],"a":1,"x":"Part 2 definition of Class II equipment: additional safety precautions such as supplementary insulation, with no provision for connection of exposed metalwork to a protective conductor.","r":"Part 2 (page 26 of the 2018 book)","n":"","k":1107,"m":"","f":"Index: Part 2 definitions, 'Class II equipment'.","w":{"0":"Class 0 relies on basic insulation only, with no supplementary insulation and no earthing provision.","2":"Class I has provision for connecting exposed metalwork to a protective conductor.","3":"Class III relies on being supplied at SELV, not on supplementary insulation."}},{"id":"b1.00.06","t":"2","c":0,"q":"A conductive part liable to introduce a potential, generally Earth potential, and not forming part of the electrical installation is called:","o":["an extraneous-conductive-part","an exposed-conductive-part","a protective conductor","a live part"],"a":0,"x":"Part 2 definition of Extraneous-conductive-part. An exposed-conductive-part is part of the equipment that can become live under fault conditions.","r":"Part 2 (page 30 of the 2018 book)","n":"","k":1293,"m":"","f":"Index: Part 2 definitions, 'extraneous-conductive-part'.","w":{"1":"Exposed-conductive-part is part of the equipment, live under fault.","2":"A protective conductor is part of the installation.","3":"A live part is energised in normal use."}},{"id":"b1.00.07","t":"2","c":0,"q":"The extra-low voltage range is defined as not exceeding:","o":["25 V AC or 60 V ripple-free DC","50 V AC or 50 V ripple-free DC","50 V AC or 120 V ripple-free DC","110 V AC or 120 V ripple-free DC"],"a":2,"x":"Part 2, Voltage, nominal: extra-low is not exceeding 50 V AC or 120 V ripple-free DC, whether between conductors or to Earth.","r":"Part 2 (page 38 of the 2018 book)","n":"","k":1727,"m":"","f":"Index: Part 2 definitions, 'voltage, nominal' (extra-low).","w":{"0":"25 V AC/60 V DC are the lower thresholds in 414.4.5 for SELV basic protection, not the ELV range limits.","1":"DC limit is 120 V, not 50 V.","3":"110 V AC is reduced low voltage."}},{"id":"b2.00.08","t":"1","c":0,"q":"For AC, the preferred frequencies taken into account in BS 7671 are:","o":["50 Hz and 60 Hz only","50 Hz only","50 Hz, 60 Hz and 400 Hz","25 Hz, 50 Hz and 60 Hz"],"a":2,"x":"Regulation 110.1.2(i): for AC, the preferred frequencies taken into account are 50 Hz, 60 Hz and 400 Hz; other frequencies for special purposes are not excluded.","r":"110.1.2 (page 15 of the 2018 book)","n":"","k":639,"m":"","f":"Index: 'scope'. Go to Regulation 110.1.2(i) (Chapter 11).","w":{"0":"400 Hz is also included.","1":"60 Hz and 400 Hz are also included.","3":"25 Hz isn't listed."}},{"id":"b2.00.09","t":"1","c":0,"q":"Which of the following is excluded from the scope of BS 7671?","o":["Lightning protection systems for buildings covered by BS EN 62305","Fixed wiring for information and communication technology","Solar photovoltaic (PV) power supply systems","Extra-low voltage lighting"],"a":0,"x":"Regulation 110.2(ix) excludes lightning protection systems for buildings and structures covered by BS EN 62305. The other options are within scope (110.1.1 and 110.1.2).","r":"110.2 (page 16 of the 2018 book)","n":"","k":677,"m":"","f":"Index: 'exclusions from scope'. Go to Regulation 110.2 (Chapter 11), item (ix).","w":{"1":"ICT fixed wiring is within scope (110.1.2).","2":"Solar PV is within scope (Section 712).","3":"ELV lighting is within scope (Section 715)."}},{"id":"b2.00.10","t":"1","c":0,"q":"Which of the following is NOT one of the methods by which fault protection can be achieved under Regulation 131.2.2?","o":["Preventing fault current from passing through the body","Limiting the magnitude of fault current through the body to a non-hazardous value","Limiting the duration of fault current through the body to a non-hazardous time period","Placing live parts out of reach"],"a":3,"x":"Regulation 131.2.2 lists preventing, limiting the magnitude and limiting the duration of fault current through the body. Placing out of reach relates to basic protection against contact with live parts.","r":"131.2.2 (page 18 of the 2018 book)","n":"","k":757,"m":"","f":"Index: 'fault protection'. Go to Regulation 131.2.2 (Chapter 13).","w":{"0":"Preventing fault current passing through the body is one of the three 131.2.2 methods, so it is valid.","1":"Limiting the magnitude of fault current is one of the 131.2.2 methods, so it is valid.","2":"Limiting the duration of fault current is one of the 131.2.2 methods, so it is valid."}},{"id":"b2.00.11","t":"1","c":0,"q":"Where there is no appropriate British or Harmonized Standard for an item of equipment, reference shall first be made to:","o":["the manufacturer's instructions only","the appropriate International (IEC) standard or the appropriate standard of another country","the Electricity at Work Regulations 1989","the distributor's requirements"],"a":1,"x":"Regulation 133.1.1: in the absence of a British or Harmonized Standard, reference shall be made to the appropriate International (IEC) standard or the appropriate standard of another country.","r":"133.1.1 (page 21 of the 2018 book)","n":"","k":921,"m":"","f":"Index: 'standards'. Go to Regulation 133.1.1 (Chapter 13).","w":{"0":"Manufacturer's instructions alone aren't the 133.1.1 reference.","2":"EAWR are statutory, not an equipment standard.","3":"Distributor's requirements don't replace equipment standards."}},{"id":"b2.00.12","t":"2","c":0,"q":"A 'circuit' is defined as an assembly of electrical equipment supplied from the same origin and:","o":["controlled by the same isolator","protected against overcurrent by the same protective device(s)","connected to the same main earthing terminal","wired in the same cable type"],"a":1,"x":"Part 2 definition of Circuit: an assembly of electrical equipment supplied from the same origin and protected against overcurrent by the same protective device(s).","r":"Part 2 (page 26 of the 2018 book)","n":"","k":1093,"m":"","f":"Index: Part 2 definitions, 'circuit'.","w":{"0":"An isolator can control several circuits; not the definition.","2":"All circuits share the MET; not the definition.","3":"Cable type doesn't define a circuit."}},{"id":"b2.00.13","t":"2","c":0,"q":"The protective conductor connecting the main earthing terminal of an installation to an earth electrode or other means of earthing is the:","o":["circuit protective conductor","main protective bonding conductor","supplementary bonding conductor","earthing conductor"],"a":3,"x":"Part 2 definition of Earthing conductor, also item 3 in Fig 2.1.","r":"Part 2 (page 28 of the 2018 book)","n":"","k":1217,"m":"","f":"Index: Part 2 definitions, 'earthing conductor'; Fig 2.1 item 3.","w":{"0":"A cpc connects exposed-conductive-parts to the MET.","1":"Main bonding connects extraneous-conductive-parts to the MET.","2":"Supplementary bonding connects parts locally."}},{"id":"b2.00.14","t":"2","c":0,"q":"An extra-low voltage system which is not electrically separated from Earth, but which otherwise satisfies all the requirements for SELV, is:","o":["FELV","Reduced low voltage","PELV","Band II"],"a":2,"x":"Part 2 definition of PELV (protective extra-low voltage).","r":"Part 2 (page 34 of the 2018 book)","n":"","k":1503,"m":"","f":"Index: Part 2 definitions, 'PELV'.","w":{"0":"FELV doesn't meet all SELV requirements.","1":"Reduced low voltage is 110 V centre-tapped, not ELV.","3":"Band II is low voltage."}},{"id":"b2.00.15","t":"2","c":0,"q":"Stationary equipment is equipment which is either fixed or which has a mass exceeding:","o":["18 kg and is not provided with a carrying handle","10 kg and is not provided with a carrying handle","18 kg whether or not it has a carrying handle","25 kg and is not provided with a carrying handle"],"a":0,"x":"Part 2 definition of Stationary equipment: fixed, or having a mass exceeding 18 kg and not provided with a carrying handle.","r":"Part 2 (page 37 of the 2018 book)","n":"","k":1666,"m":"","f":"Index: Part 2 definitions, 'stationary equipment'.","w":{"1":"10 kg isn't the figure; it's 18 kg.","2":"Carrying handle matters; it must be without one.","3":"25 kg isn't the figure; it's 18 kg."}},{"id":"b3.00.16","t":"1","c":0,"q":"BS 7671 may need to be supplemented by other standards. Which standard is listed in Regulation 110.1.3 for emergency lighting?","o":["BS 5839","BS 6701","BS 7909","BS 5266"],"a":3,"x":"Regulation 110.1.3(ii): emergency lighting, BS 5266 and BS EN 1838. BS 5839 is fire detection, BS 6701 telecommunications, BS 7909 temporary systems for events.","r":"110.1.3 (page 16 of the 2018 book)","n":"","k":657,"m":"","f":"Index: 'scope' or 'standards'. Go to Regulation 110.1.3 (Chapter 11), item (ii).","w":{"0":"BS 5839 is fire detection and alarm systems.","1":"BS 6701 is telecommunications.","2":"BS 7909 is temporary systems for events."}},{"id":"b3.00.17","t":"1","c":0,"q":"For a supply given in accordance with the ESQCR, BS 7671 states that it shall be deemed that:","o":["the external earth fault loop impedance will not exceed 0.35 ohm","the connection with Earth of the neutral of the supply is permanent","the supply will never be interrupted","the prospective fault current will not exceed 16 kA"],"a":1,"x":"Regulation 114.1: for a supply given in accordance with the ESQCR, it shall be deemed that the connection with Earth of the neutral of the supply is permanent.","r":"114.1 (page 16 of the 2018 book)","n":"","k":696,"m":"","f":"Index: 'Electricity Safety, Quality and Continuity Regulations'. Go to Regulation 114.1 (Chapter 11).","w":{"0":"0.35 Ω is a typical distributor-quoted Ze for TN-C-S, not something 114.1 deems.","2":"Supply interruption isn't deemed impossible.","3":"PFC isn't deemed in 114.1."}},{"id":"b3.00.18","t":"1","c":0,"q":"Regulation 132.1 requires the electrical installation to be designed by:","o":["a chartered engineer only","the distributor","one or more skilled persons","an instructed person under supervision"],"a":2,"x":"Regulation 132.1: the installation shall be designed by one or more skilled persons to provide for protection of persons, livestock and property and proper functioning.","r":"132.1 (page 19 of the 2018 book)","n":"","k":806,"m":"","f":"Index: 'design'. Go to Regulation 132.1 (Chapter 13).","w":{"0":"Not a requirement; it says skilled persons.","1":"The distributor doesn't design the installation.","3":"Instructed persons don't design; skilled persons do."}},{"id":"b3.00.19","t":"1","c":0,"q":"Who shall make a recommendation for the interval to the first periodic inspection and test?","o":["The designer of the installation","The distributor","The person ordering the work","The building control body"],"a":0,"x":"Regulation 134.2.2: the designer of the installation shall make a recommendation for the interval to the first periodic inspection and test.","r":"134.2.2 (page 23 of the 2018 book)","n":"","k":986,"m":"","f":"Index: 'periodic inspection'. Go to Regulation 134.2.2 (Chapter 13).","w":{"1":"The distributor doesn't set the interval.","2":"The person ordering the work isn't named in 134.2.2.","3":"Building control isn't named in 134.2.2."}},{"id":"b3.00.20","t":"2","c":0,"q":"Cables are said to be 'bunched' when two or more are:","o":["contained within a single conduit, duct, ducting or trunking or, if not enclosed, are not separated from each other by a specified distance","clipped direct to the same surface, whatever the spacing","installed in the same building void","supplied from the same distribution board"],"a":0,"x":"Part 2 definition of Bunched.","r":"Part 2 (page 25 of the 2018 book)","n":"","k":1053,"m":"","f":"Index: Part 2 definitions, 'bunched'.","w":{"1":"Spacing matters: cables separated by the specified distance aren't bunched, even on the same surface.","2":"Sharing a void doesn't make cables bunched; it depends on enclosure or spacing.","3":"Being fed from the same board has nothing to do with bunching."}},{"id":"b3.00.21","t":"2","c":0,"q":"By definition, a 'live part' includes:","o":["a PEN conductor but not a neutral conductor","both the neutral and the PEN conductor","a neutral conductor but, by convention, not a PEN conductor","line conductors only"],"a":2,"x":"Part 2 definition of Live part: a conductor or conductive part intended to be energized in normal use, including a neutral conductor but, by convention, not a PEN conductor.","r":"Part 2 (page 32 of the 2018 book)","n":"","k":1392,"m":"","f":"Index: Part 2 definitions, 'live part'.","w":{"0":"That's reversed: the neutral is a live part, the PEN conductor by convention is not.","1":"The neutral is included, but by convention the PEN conductor is not.","3":"Too narrow: the neutral conductor is also a live part."}},{"id":"b3.00.22","t":"2","c":0,"q":"A reduced low voltage system is one in which the nominal line-to-line voltage and the nominal line-to-Earth voltage do not exceed:","o":["110 V and 55 V respectively","230 V and 110 V respectively","120 V and 50 V respectively","110 V and 63.5 V respectively"],"a":3,"x":"Part 2 definition of Reduced low voltage system: line-to-line not exceeding 110 V and line-to-Earth not exceeding 63.5 V.","r":"Part 2 (page 35 of the 2018 book)","n":"","k":1575,"m":"","f":"Index: Part 2 definitions, 'reduced low voltage system'.","w":{"0":"55 V is what a single-phase centre-tapped 110 V supply gives to Earth, but the definition limit is 63.5 V.","1":"230 V is ordinary low voltage; reduced low voltage is at most 110 V line-to-line.","2":"50 V is the ELV AC limit; the definition gives 110 V and 63.5 V."}},{"id":"b3.00.23","t":"2","c":0,"q":"A system having one point of the source of energy directly earthed, with the exposed-conductive-parts of the installation connected to earth electrodes electrically independent of those of the source, is a:","o":["TN-S system","TT system","TN-C-S system","IT system"],"a":1,"x":"Part 2, System: TT system definition (see Figure 3.10).","r":"Part 2 (page 38 of the 2018 book)","n":"","k":1696,"m":"","f":"Index: Part 2 definitions, 'system' (TT); see Fig 3.10.","w":{"0":"In TN-S the exposed parts connect back to the source earth through a separate protective conductor, not their own electrodes.","2":"In TN-C-S the exposed parts connect to the source earth via the supply's combined PEN conductor.","3":"In IT the source is isolated from Earth or earthed through an impedance, not directly earthed."}},{"id":"b4.00.24","t":"1","c":0,"q":"BS 7671 does not apply to the electrical equipment of machines covered by:","o":["BS EN 60079","BS EN 60204","BS EN 61439","BS EN 61140"],"a":1,"x":"Regulation 110.2(xi): electrical equipment of machines covered by BS EN 60204 is excluded from scope.","r":"110.2 (page 16 of the 2018 book)","n":"","k":680,"m":"","f":"Index: 'exclusions from scope'. Go to Regulation 110.2 (Chapter 11), item (xi).","w":{"0":"BS EN 60079 is explosive atmospheres.","2":"BS EN 61439 is switchgear assemblies.","3":"BS EN 61140 is protection against electric shock."}},{"id":"b4.00.25","t":"1","c":0,"q":"Which Part of BS 7671 deals with special installations or locations?","o":["Part 3","Part 5","Part 6","Part 7"],"a":3,"x":"Regulation 120.3: Part 3 assessment of general characteristics, Part 4 protection for safety, Part 5 selection and erection, Part 6 inspection and testing, Part 7 special installations or locations.","r":"120.3 (page 17 of the 2018 book)","n":"","k":716,"m":"","f":"Index: 'plan of the Regulations'. Go to Regulation 120.3 (Chapter 12).","w":{"0":"Part 3 is assessment of general characteristics.","1":"Part 5 is selection and erection.","2":"Part 6 is inspection and testing."}},{"id":"b4.00.26","t":"1","c":0,"q":"Regulation 132.2 states that information on the characteristics of the available supply shall be determined by:","o":["calculation, measurement, enquiry or inspection","measurement only","enquiry of the distributor only","calculation only"],"a":0,"x":"Regulation 132.2: supply characteristics shall be determined by calculation, measurement, enquiry or inspection; they include external earth fault loop impedance and prospective fault current.","r":"132.2 (page 19 of the 2018 book)","n":"","k":812,"m":"","f":"Index: 'supply, characteristics'. Go to Regulation 132.2 (Chapter 13).","w":{"1":"Measurement is only one of the four routes; 132.2 also allows calculation, enquiry or inspection.","2":"Enquiry is only one route; 132.2 also allows calculation, measurement or inspection.","3":"Calculation is only one route; 132.2 also allows measurement, enquiry or inspection."}},{"id":"b4.00.27","t":"1","c":0,"q":"Every electrical joint and connection shall be of proper construction as regards:","o":["accessibility, labelling, colour and size","current rating, voltage rating, frequency and power","conductance, insulation, mechanical strength and protection","conductance, cost, appearance and ease of maintenance"],"a":2,"x":"Regulation 134.1.4: conductance, insulation, mechanical strength and protection.","r":"134.1.4 (page 22 of the 2018 book)","n":"","k":971,"m":"","f":"Index: 'joints and connections'. Chapter 13, Regulation 134.1.4 (Selection and erection of equipment, 134.1).","w":{"0":"Accessibility is covered elsewhere (526.3); labelling, colour and size are not the four properties 134.1.4 lists.","1":"Those are equipment ratings, not the construction properties of a joint; 134.1.4 lists conductance, insulation, mechanical strength and protection.","3":"Cost and appearance are never regulatory requirements; 134.1.4 lists conductance, insulation, mechanical strength and protection."}},{"id":"b4.00.28","t":"2","c":0,"q":"A part of a closed wiring system allowing cables to be drawn in and/or replaced, but not inserted laterally, is:","o":["cable trunking","cable tray","conduit","cable ladder"],"a":2,"x":"Part 2 definition of Conduit. Trunking has one removable or hinged side, so cables can be laid in laterally.","r":"Part 2 (page 26 of the 2018 book)","n":"","k":1128,"m":"","f":"Part 2 Definitions, alphabetical: look up 'Conduit' and compare with 'Trunking', 'Cable tray' and 'Cable ladder'.","w":{"0":"Trunking has a removable or hinged side, so cables can be laid in laterally; conduit cannot.","1":"Cable tray is an open support with a continuous base, not a closed system that cables are drawn into.","3":"Cable ladder is an open support of rungs fixed to side members, not a closed wiring system."}},{"id":"b4.00.29","t":"2","c":0,"q":"An 'obstacle' is a part that:","o":["prevents unintentional contact with live parts but does not prevent deliberate contact","prevents both unintentional and deliberate contact with live parts","provides a defined degree of protection from any usual direction of access","provides protection against external influences and basic protection in any direction"],"a":0,"x":"Part 2 definition of Obstacle. A barrier gives a defined degree of protection from any usual direction of access; an enclosure gives protection in any direction.","r":"Part 2 (page 33 of the 2018 book)","n":"","k":1483,"m":"","f":"Part 2 Definitions: look up 'Obstacle', then read 'Barrier' and 'Enclosure' next to it to see the difference.","w":{"1":"An obstacle only stops unintentional contact; it is not designed to stop someone deliberately reaching past it.","2":"That is the definition of a barrier, not an obstacle.","3":"That describes an enclosure, which protects from any direction; an obstacle only prevents unintentional contact."}},{"id":"b4.00.30","t":"2","c":0,"q":"An overcurrent occurring in a circuit which is electrically sound is called:","o":["a short-circuit current","an overload current","an earth fault current","a protective conductor current"],"a":1,"x":"Part 2 definition of Overload current. Short-circuit and earth fault currents result from a fault.","r":"Part 2 (page 34 of the 2018 book)","n":"","k":1500,"m":"","f":"Part 2 Definitions: look up 'Overload current' and compare with 'Short-circuit current' and 'Earth fault current'.","w":{"0":"A short-circuit current results from a fault between live conductors, so the circuit is not electrically sound.","2":"Earth fault current flows because of a fault to earth, so the circuit is not electrically sound.","3":"Protective conductor current flows in the cpc under normal conditions; it is not an overcurrent."}},{"id":"b4.00.31","t":"2","c":0,"q":"In Fig 2.1 (illustration of earthing and protective conductor terms), the conductor connecting the main earthing terminal to the main metallic water pipe is the:","o":["earthing conductor","circuit protective conductor","supplementary protective bonding conductor","main protective bonding conductor"],"a":3,"x":"Fig 2.1: item 2 is the main protective bonding conductor connecting B (main earthing terminal) to P (main metallic water pipe, an extraneous-conductive-part).","r":"Fig 2.1 (page 39 of the 2018 book)","n":"","k":1786,"m":"","f":"Part 2, end of the definitions: Fig 2.1 and its key. Find P (water pipe) and B (MET) and read the conductor number between them.","w":{"0":"The earthing conductor connects the MET to the means of earthing, not to a water pipe.","1":"A cpc connects exposed-conductive-parts of equipment to the MET, not an extraneous service pipe.","2":"Supplementary bonding links parts locally (e.g. in a location); the conductor from the MET to the incoming water pipe is main bonding."}},{"id":"b5.00.32","t":"1","c":0,"q":"For installations in premises over which a licensing or other authority exercises statutory control, the requirements of that authority shall be:","o":["ascertained and complied with in the design and execution of the installation","applied only where they are more onerous than BS 7671","recorded as departures on the certificate","ignored where the installation complies with BS 7671"],"a":0,"x":"Regulation 115.1: the requirements of that authority shall be ascertained and complied with in the design and execution of the installation.","r":"115.1 (page 17 of the 2018 book)","n":"","k":705,"m":"","f":"Part 1, Chapter 11 Scope: Regulation 115.1 (relationship with statutory regulations / licensing authorities).","w":{"1":"115.1 does not limit them to being more onerous; the authority's requirements must simply be ascertained and complied with.","2":"Departures are for designs not complying with BS 7671 (120.3); statutory requirements must be complied with, not recorded.","3":"Complying with BS 7671 does not override statutory control; the authority's requirements still apply."}},{"id":"b5.00.33","t":"1","c":0,"q":"Regulation 131.1 lists sources of risk of injury in electrical installations. Arcing or burning is listed because it is likely to cause:","o":["electromagnetic disturbances","undervoltage on other circuits","harmonic currents","blinding effects, excessive pressure and/or toxic gases"],"a":3,"x":"Regulation 131.1(vii): arcing or burning, likely to cause blinding effects, excessive pressure and/or toxic gases.","r":"131.1 (page 17 of the 2018 book)","n":"","k":740,"m":"","f":"Chapter 13, Regulation 131.1 (Protection for safety): read the numbered list of risks, item (vii).","w":{"0":"Electromagnetic disturbances are a separate item in Chapter 44 / 131.6, not the effect of arcing or burning.","1":"Undervoltage is listed separately in 131.6; arcing is listed for blinding, pressure and toxic gases.","2":"Harmonic currents are a supply-quality issue, not the hazard listed for arcing or burning."}},{"id":"b5.00.34","t":"1","c":0,"q":"Where a linked switch or linked circuit-breaker is inserted in an earthed neutral conductor, it shall be arranged to:","o":["break the neutral before the line conductors","break the neutral only","break all the related line conductors","be fitted with a warning notice only"],"a":2,"x":"Regulation 132.14.2: any linked switch or linked circuit-breaker inserted in an earthed neutral conductor shall be arranged to break all the related line conductors.","r":"132.14.2 (page 21 of the 2018 book)","n":"","k":905,"m":"","f":"Index: 'neutral conductor, switching'. Chapter 13, Regulation 132.14.2 (Switching devices).","w":{"0":"No such sequence is required by 132.14.2; it requires the device to break all related line conductors.","1":"Breaking only the neutral would leave line conductors live, which is exactly what 132.14.2 prevents.","3":"A notice is not enough; the linked device must break all the related line conductors."}},{"id":"b5.00.35","t":"1","c":0,"q":"Where there are no applicable standards for an item of equipment, it shall be selected by:","o":["the distributor","special agreement between the person specifying the installation and the installer","the manufacturer alone","the local building control body"],"a":1,"x":"Regulation 133.1.2: selected by special agreement between the person specifying the installation and the installer.","r":"133.1.2 (page 21 of the 2018 book)","n":"","k":924,"m":"","f":"Chapter 13, Regulation 133.1 (Selection of electrical equipment), then 133.1.2.","w":{"0":"The distributor is not involved in selecting equipment with no standard; 133.1.2 requires special agreement.","2":"The manufacturer cannot decide alone; it is agreed between the person specifying the installation and the installer.","3":"Building control has no role in 133.1.2; it is agreed between the specifier and the installer."}},{"id":"b5.00.36","t":"2","c":0,"q":"Double insulation comprises:","o":["basic insulation and reinforced insulation","basic insulation and supplementary insulation","two layers of reinforced insulation","basic insulation and an earthed metal screen"],"a":1,"x":"Part 2 definition of Double insulation: insulation comprising both basic insulation and supplementary insulation.","r":"Part 2 (page 27 of the 2018 book)","n":"","k":1190,"m":"","f":"Part 2 Definitions: look up 'Double insulation' (and compare 'Reinforced insulation' just after it).","w":{"0":"Reinforced insulation is a single system equivalent to double insulation; it is not one of its two layers.","2":"Reinforced insulation is an alternative to double insulation, not a component of it.","3":"An earthed screen is a protective screening method, not insulation; double insulation is basic plus supplementary."}},{"id":"b5.00.37","t":"2","c":0,"q":"The maximum current rating of a powertrack system is:","o":["32 A","45 A","63 A","100 A"],"a":2,"x":"Note to the Part 2 definition of Powertrack system (PT system): the maximum current rating is 63 A.","r":"Part 2 (page 34 of the 2018 book)","n":"","k":1519,"m":"","f":"Part 2 Definitions: look up 'Powertrack system (PT system)' and read the note under it.","w":{"0":"32 A is a common circuit rating, but the PT system note gives 63 A.","1":"45 A is a cooker-circuit style figure; the PT system note gives 63 A.","3":"100 A is too high; the note to the PT system definition gives 63 A."}},{"id":"b5.00.38","t":"2","c":0,"q":"Residual current is defined as:","o":["the algebraic sum of the currents in the live conductors of a circuit at a point in the installation","the current flowing in the protective conductor under normal conditions","the current that causes an RCD to operate","the difference between the line current and the earth fault current"],"a":0,"x":"Part 2 definition of Residual current. The current causing an RCD to operate is the residual operating current.","r":"Part 2 (page 36 of the 2018 book)","n":"","k":1591,"m":"","f":"Part 2 Definitions: look up 'Residual current' and compare 'Residual operating current' next to it.","w":{"1":"That is protective conductor current, a separate definition.","2":"That is the residual operating current, not residual current itself.","3":"Residual current is the algebraic sum of currents in the live conductors, not a line minus fault figure."}},{"id":"b5.00.39","t":"2","c":0,"q":"Low voltage is defined as exceeding extra-low voltage but not exceeding 1000 V AC or 1500 V DC between conductors, or, between conductors and Earth, not exceeding:","o":["400 V AC or 600 V DC","230 V AC or 400 V DC","1000 V AC or 1500 V DC","600 V AC or 900 V DC"],"a":3,"x":"Part 2, Voltage, nominal: low voltage does not exceed 1000 V AC or 1500 V DC between conductors, or 600 V AC or 900 V DC between conductors and Earth.","r":"Part 2 (page 38 of the 2018 book)","n":"","k":1728,"m":"","f":"Part 2 Definitions: look up 'Voltage, nominal' and read the low voltage line.","w":{"0":"400 V AC is the UK three-phase line voltage, not the low voltage limit to Earth.","1":"230 V is the UK nominal Uo, not the definition limit; LV to Earth is up to 600 V AC or 900 V DC.","2":"Those are the limits between conductors, not between conductors and Earth."}},{"id":"b1.01.00","t":"3","c":0,"q":"Regulation 301.1 requires an assessment of the general characteristics of an installation. Which chapter deals with its maintainability?","o":["Chapter 32","Chapter 34","Chapter 35","Chapter 36"],"a":1,"x":"301.1(iv): maintainability is assessed in accordance with Chapter 34. Chapter 32 is external influences, 35 safety services and 36 continuity of service.","r":"301.1 (page 45 of the 2018 book)","n":"","k":2196,"m":"","f":"Part 3, Regulation 301.1: read the list (i) to (vi) which names the chapter for each characteristic.","w":{"0":"Chapter 32 is classification of external influences, not maintainability.","2":"Chapter 35 is safety services, not maintainability.","3":"Chapter 36 is continuity of service, not maintainability."}},{"id":"b1.01.01","t":"3","c":0,"q":"A TN-C-S system, in which the neutral and protective functions are combined in a single PEN conductor in part of the system, is also known as","o":["a TT system","a TN-S system","an IT system","protective multiple earthing"],"a":3,"x":"312.2.1.1, Fig 3.9: TN-C-S distribution is also known as protective multiple earthing (PME). In TN-S the neutral and protective conductors are separate throughout.","r":"312.2.1.1 (page 48 of the 2018 book)","n":"","k":2364,"m":"","f":"Chapter 31, Regulation 312.2.1.1 and Fig 3.9 (TN-C-S): read the figure caption.","w":{"0":"In TT the installation has its own independent earth electrode; there is no PEN conductor.","1":"In TN-S the neutral and protective conductors are separate throughout; TN-C-S is PME.","2":"In IT the source is isolated from Earth or earthed through a high impedance; no PEN conductor."}},{"id":"b1.01.02","t":"3","c":0,"q":"Which of the following is NOT one of the supply characteristics that Regulation 313.1 requires to be determined?","o":["The nature of the current and frequency","The type and rating of the overcurrent protective device(s) acting at the origin","The resistance of the installation's own earth electrode","The prospective short-circuit current at the origin of the installation"],"a":2,"x":"313.1 lists: (i) nominal voltage and characteristics including harmonic distortion, (ii) nature of current and frequency, (iii) prospective short-circuit current at the origin, (iv) Ze, (v) suitability including maximum demand, (vi) type and rating of the overcurrent protective device(s) at the origin. The installation earth electrode resistance is not a supply characteristic.","r":"313.1 (page 49 of the 2018 book)","n":"","k":2430,"m":"","f":"Chapter 31, Regulation 313.1 (Supplies): check each option against the list (i) to (vi).","w":{"0":"Nature of current and frequency is item (ii) of 313.1, so it is required.","1":"Type and rating of the overcurrent device at the origin is item (vi) of 313.1, so it is required.","3":"Prospective short-circuit current at the origin is item (iii) of 313.1, so it is required."}},{"id":"b1.01.03","t":"3","c":0,"q":"Chapter 32 refers to Appendix 5 for the classification of external influences. Equipment in a location classified AD4 (splashes) needs a degree of protection of at least","o":["IPX2","IPX3","IPX4","IPX5"],"a":2,"x":"Appendix 5, AD4 Splashes (possibility of splashes from any direction): IPX4. AD3 sprays is IPX3 and AD5 jets is IPX5. Chapter 32 refers to Appendix 5 for the classification.","r":"Appendix 5 (page 449 of the 2018 book)","n":"","k":21041,"m":"","f":"Appendix 5, AD (presence of water) section: find AD4 Splashes and read the IP code column.","w":{"0":"IPX2 is for AD2 Free-falling drops, not splashes.","1":"IPX3 is AD3 Sprays; splashes from any direction (AD4) need IPX4.","3":"IPX5 is AD5 Jets; splashes (AD4) need IPX4."}},{"id":"b2.01.04","t":"3","c":0,"q":"When determining the maximum demand of an installation or part of it, Regulation 311.1 states that","o":["every load must be assumed to run at full load","only fixed equipment is counted","diversity may be taken into account","the demand must be measured over a 24-hour period"],"a":2,"x":"311.1: the maximum demand shall be determined for economic and reliable design within thermal limits and admissible voltage drop, and diversity may be taken into account.","r":"311.1 (page 45 of the 2018 book)","n":"","k":2203,"m":"","f":"Chapter 31, Regulation 311.1 (Maximum demand and diversity).","w":{"0":"311.1 allows diversity, so you do not have to assume every load at full load.","1":"311.1 does not exclude non-fixed equipment; it allows diversity across the installation.","3":"No 24-hour measurement is required; maximum demand is determined in design, taking diversity into account."}},{"id":"b2.01.05","t":"3","c":0,"q":"In the system earthing codes of Regulation 312.2, the second letter N means that the exposed-conductive-parts of the installation have","o":["a direct electrical connection to the earthed point of the power system","a connection to an independent earth electrode","no connection to Earth","a connection to Earth through a high impedance"],"a":0,"x":"312.2 Note 3: second letter N = direct electrical connection of the exposed-conductive-parts to the earthed point of the power system (normally the neutral point in AC systems).","r":"312.2 (page 47 of the 2018 book)","n":"","k":2283,"m":"","f":"Chapter 31, Regulation 312.2 Note 3: read what the second letter (T or N) means.","w":{"1":"Connection to an independent earth electrode is second letter T (as in TT).","2":"No second letter means 'no connection to Earth'; N is a direct connection to the source earthed point.","3":"Earthing through a high impedance relates to first letter I (the source), not second letter N."}},{"id":"b2.01.06","t":"3","c":0,"q":"One reason Regulation 314.1 gives for dividing an installation into circuits is to reduce the possibility of unwanted RCD tripping caused by","o":["lightning surges","high ambient temperature","low insulation resistance between L and N","excessive protective conductor (PE) currents not due to a fault"],"a":3,"x":"314.1(iv): circuits are divided to reduce the possibility of unwanted tripping of RCDs due to excessive protective conductor (PE) currents not due to a fault.","r":"314.1 (page 50 of the 2018 book)","n":"","k":2452,"m":"","f":"Chapter 31, Regulation 314.1 (Division of installation): read item (iv).","w":{"0":"Lightning surges are covered by Chapter 44 / Section 443, not the circuit division reasons in 314.1.","1":"Ambient temperature affects cable rating, not unwanted RCD tripping in 314.1.","2":"L-N insulation faults do not trip an RCD; 314.1(iv) is about excessive PE currents not due to a fault."}},{"id":"b2.01.07","t":"3","c":0,"q":"In Appendix 5, external influence AE3 relates to the presence of very small foreign solid bodies. What is the smallest dimension of these bodies?","o":["0.5 mm","1 mm","2.5 mm","12.5 mm"],"a":1,"x":"Appendix 5, AE3 Very small objects: foreign solid bodies with smallest dimension not less than 1 mm, needing IP4X. AE2 small objects is 2.5 mm.","r":"Appendix 5 (page 450 of the 2018 book)","n":"","k":21096,"m":"","f":"Appendix 5, AE (presence of foreign solid bodies) section: find AE3 Very small objects.","w":{"0":"0.5 mm is not an AE threshold; AE3 is bodies not less than 1 mm.","2":"2.5 mm is AE2 Small objects (IP3X), not AE3.","3":"12.5 mm is the IP2X finger-size object, not the AE3 threshold."}},{"id":"b3.01.08","t":"3","c":0,"q":"In the system earthing codes of Regulation 312.2, a first letter I indicates that","o":["the exposed-conductive-parts are connected to an independent electrode","the neutral and protective functions are combined","one point of the source is directly connected to Earth","all live parts are isolated from Earth, or one point is connected to Earth through a high impedance"],"a":3,"x":"312.2 Note 3: first letter I = all live parts isolated from Earth, or one point connected to Earth through a high impedance. First letter T = direct connection of one point to Earth.","r":"312.2 (page 47 of the 2018 book)","n":"","k":2279,"m":"","f":"Chapter 31, Regulation 312.2 Note 3: read what the first letter (T or I) means.","w":{"0":"That describes second letter T (exposed parts to an independent electrode), not first letter I.","1":"Combined neutral and protective functions is the subsequent letter C.","2":"Direct connection of one point of the source to Earth is first letter T."}},{"id":"b3.01.09","t":"3","c":0,"q":"In a TT system, the exposed-conductive-parts of the installation are connected to","o":["the PEN conductor of the supply","an earth electrode electrically independent of the source earth","the metallic sheath of the supply cable","the neutral at the main earthing terminal"],"a":1,"x":"312.2.2.1, Fig 3.10: in a TT system the exposed-conductive-parts are connected to earth electrodes electrically independent of the earth electrode of the supply system (the source earth).","r":"312.2.2.1 (page 49 of the 2018 book)","n":"","k":2374,"m":"","f":"Chapter 31, Regulation 312.2.2.1 and Fig 3.10 (TT system).","w":{"0":"Connection to the supply PEN conductor is TN-C-S (PME), not TT.","2":"Using the supply cable sheath as the earth is TN-S.","3":"Linking the MET to the neutral is TN-C-S; in TT the earth is independent of the source."}},{"id":"b3.01.10","t":"3","c":0,"q":"Where an installation has more than one final circuit, Regulation 314.4 requires each final circuit to be","o":["protected by its own RCD","wired in a separate containment system","connected to a separate way in a distribution board","limited to a maximum of 12 points"],"a":2,"x":"314.4: each final circuit shall be connected to a separate way in a distribution board, and its wiring kept electrically separate to prevent indirect energizing of a circuit intended to be isolated.","r":"314.4 (page 50 of the 2018 book)","n":"","k":2462,"m":"","f":"Chapter 31, Regulation 314.4 (Division of installation, final circuits).","w":{"0":"314.4 does not require an RCD per circuit; it requires a separate way in a distribution board.","1":"No separate containment is required; 314.4 requires separate ways and electrically separate wiring.","3":"There is no 12-point limit in 314.4."}},{"id":"b3.01.11","t":"3","c":0,"q":"Which of the following is listed in Regulation 351.1 as a recognized electrical source for safety services?","o":["Primary cells","A socket-outlet circuit from the normal supply","A second circuit from the same distribution board as the normal supply","A generator set that relies on the normal supply to run"],"a":0,"x":"351.1 recognizes storage batteries, primary cells, generator sets independent of the normal supply, and a separate feeder effectively independent of the normal feeder.","r":"351.1 (page 52 of the 2018 book)","n":"","k":2518,"m":"","f":"Chapter 35, Regulation 351.1: read the list of recognized sources for safety services.","w":{"1":"A socket-outlet circuit from the normal supply is not independent, so it is not a safety source.","2":"A second circuit from the same board shares the normal supply; 351.1 needs an effectively independent feeder.","3":"351.1 only recognizes generator sets independent of the normal supply."}},{"id":"b4.01.12","t":"3","c":0,"q":"According to Regulation 312.1.1 (Fig 3.5), a PEN conductor is by definition","o":["not a live conductor, but a conductor carrying an operating current","a live conductor","a protective conductor that never carries current","a functional earthing conductor only"],"a":0,"x":"312.1.1, Fig 3.5 text: by definition the PEN conductor is not a live conductor but a conductor carrying an operating current.","r":"312.1.1 (page 46 of the 2018 book)","n":"","k":2252,"m":"","f":"Chapter 31, Regulation 312.1.1 and the text under Fig 3.5 (live conductors).","w":{"1":"By definition the PEN is not a live conductor, even though it carries operating current.","2":"A PEN carries the neutral's operating current, so it is not a never-current protective conductor.","3":"A PEN combines protective and neutral functions; it is not just a functional earthing conductor."}},{"id":"b4.01.13","t":"3","c":0,"q":"In a TN-C-S (PME) supply system, the supply PEN conductor is earthed","o":["only at the source","only at the consumer's installation","at two or more points","through a high impedance"],"a":2,"x":"312.2.1.1, Fig 3.9: the supply system PEN conductor is earthed at two or more points, and an earth electrode may be necessary at or near a consumer's installation.","r":"312.2.1.1 (page 48 of the 2018 book)","n":"","k":2365,"m":"","f":"Chapter 31, Regulation 312.2.1.1 and the caption to Fig 3.9 (TN-C-S).","w":{"0":"Earthing only at the source describes the basic TN source, not the multiple earthing of a PME PEN.","1":"The PEN is earthed at multiple points on the supply system, not only at the consumer.","3":"High impedance earthing is an IT system feature."}},{"id":"b4.01.14","t":"3","c":0,"q":"In the Appendix 5 codes for external influences (e.g. AA4, BA4, CB2), what does a first letter B indicate?","o":["Environment","Construction of buildings","Building materials","Utilization"],"a":3,"x":"Appendix 5: first letter A = Environment, B = Utilization, C = Construction of buildings.","r":"Appendix 5 (page 444 of the 2018 book)","n":"","k":20717,"m":"","f":"Appendix 5, the introduction explaining the code letters (first letter A, B or C).","w":{"0":"Environment is first letter A.","1":"Construction of buildings is first letter C.","2":"Building materials is CA (second letter under C), not first letter B."}},{"id":"b4.01.15","t":"3","c":0,"q":"Under Regulation 331.1, where equipment in an installation supplied from an external source has a characteristic likely to have a significant influence on the supply, who shall be consulted?","o":["The Health and Safety Executive","The distributor","The equipment manufacturer","The local building control body"],"a":1,"x":"331.1: for an external source of energy the distributor shall be consulted regarding any equipment having a characteristic likely to have significant influence on the supply.","r":"331.1 (page 51 of the 2018 book)","n":"","k":2488,"m":"","f":"Chapter 33, Regulation 331.1 (Compatibility of characteristics).","w":{"0":"The HSE is not consulted under 331.1; for an external source it is the distributor.","2":"The manufacturer is not named in 331.1; the distributor is consulted about effects on the supply.","3":"Building control is not concerned with supply effects; 331.1 names the distributor."}},{"id":"b5.01.16","t":"3","c":0,"q":"In a TN-S system (Fig 3.8), the protective conductor (PE) supplying the installation may be","o":["the combined PEN conductor","the metallic covering of the supply cable or a separate conductor","an earth electrode at the consumer's premises only","the gas or water service pipe"],"a":1,"x":"312.2.1.1, Fig 3.8: in TN-S the PE is the metallic covering of the cable supplying the installations or a separate conductor, with separate neutral and protective conductors throughout.","r":"312.2.1.1 (page 48 of the 2018 book)","n":"","k":2328,"m":"","f":"Chapter 31, Regulation 312.2.1.1 and the caption to Fig 3.8 (TN-S).","w":{"0":"A combined PEN conductor is TN-C-S, not TN-S.","2":"An installation earth electrode only is a TT arrangement.","3":"Gas and water pipes are never used as the protective conductor; they are bonded, not used as earth."}},{"id":"b5.01.17","t":"3","c":0,"q":"According to Regulation 313.2, what particular requirements do the Regulations place on standby systems?","o":["They must be supplied by storage batteries","They must change over within 0.5 s","They must comply with Chapter 56","There are no particular requirements in these Regulations"],"a":3,"x":"313.2 Note 2: for standby systems, there are no particular requirements in these Regulations. Chapter 56 applies to safety services.","r":"313.2 (page 50 of the 2018 book)","n":"","k":2446,"m":"","f":"Chapter 31, Regulation 313.2 and its Notes (supplies for safety services and standby systems).","w":{"0":"Storage batteries are one possible safety source (351.1); no such rule applies to standby systems.","1":"No changeover time is set for standby systems in 313.2.","2":"Chapter 56 applies to safety services, not standby systems."}},{"id":"b5.01.18","t":"3","c":0,"q":"When assessing maintainability under Regulation 341.1, who shall be consulted?","o":["The person or body responsible for the operation and/or maintenance of the installation","The electricity distributor","The fire authority","The equipment manufacturer"],"a":0,"x":"341.1: the frequency and quality of maintenance shall be assessed and the person or body responsible for the operation and/or maintenance of the installation shall be consulted.","r":"341.1 (page 51 of the 2018 book)","n":"","k":2500,"m":"","f":"Chapter 34, Regulation 341.1 (Maintainability).","w":{"1":"The distributor is consulted on supply matters (331.1), not maintainability.","2":"The fire authority is not named in 341.1.","3":"The manufacturer is not named in 341.1; consult whoever operates or maintains the installation."}},{"id":"b5.01.19","t":"3","c":0,"q":"When assessing a circuit's need for continuity of service (e.g. life-support systems), which of the following is one of the characteristics Regulation 361.1 requires to be considered?","o":["Colour identification of conductors","Cable route lengths","Selection of the protective device to achieve selectivity","Type of wiring accessories"],"a":2,"x":"361.1 lists: selection of system earthing, selection of the protective device to achieve selectivity, number of circuits, multiple power supplies and use of monitoring devices.","r":"361.1 (page 52 of the 2018 book)","n":"","k":2527,"m":"","f":"Chapter 36, Regulation 361.1 (Continuity of service): read the list of characteristics.","w":{"0":"Colour identification is Section 514 and is not one of the 361.1 characteristics.","1":"Cable route length is not listed in 361.1.","3":"Type of wiring accessories is not listed in 361.1."}},{"id":"b1.91.00","t":"3","c":0,"q":"In the system earthing codes of Regulation 312.2 (e.g. TN-S), what does the subsequent letter S indicate?","o":["The source is earthed at a single point only","The protective function is provided by a conductor separate from the neutral conductor","The supply is single-phase","The exposed-conductive-parts are connected to a separate earth electrode"],"a":1,"x":"312.2 Note 3: subsequent letter S = protective function provided by a conductor separate from the neutral conductor (or from the earthed line conductor). C would mean the functions are combined in a PEN conductor.","r":"312.2 (page 47 of the 2018 book)","n":"","k":2287,"m":"","f":"Chapter 31, Regulation 312.2 Note 3: read the subsequent letters S and C.","w":{"0":"S does not mean single-point earthing; it means a separate protective conductor.","2":"S is not 'single-phase'; it means the protective function is separate from the neutral.","3":"Connection to a separate electrode is second letter T, as in TT."}},{"id":"b1.91.01","t":"3","c":0,"q":"Appendix 5 (referred to by Chapter 32) lists external influences for the presence of water. For a location such as a swimming pool, where electrical equipment is permanently and totally covered with water, what minimum degree of protection is required?","o":["IPX5","IPX6","IPX7","IPX8"],"a":3,"x":"Appendix 5, AD8 Submersion (permanent and total covering by water, e.g. swimming pools): IPX8. AD7 Immersion is IPX7, AD6 Waves IPX6 and AD5 Jets IPX5.","r":"Appendix 5 (page 449 of the 2018 book)","n":"","k":21071,"m":"","f":"Appendix 5, AD (presence of water) section: find AD8 Submersion and read the IP code.","w":{"0":"IPX5 is AD5 Jets.","1":"IPX6 is AD6 Waves.","2":"IPX7 is AD7 Immersion (may be flooded); permanent total covering is AD8, IPX8."}},{"id":"b2.91.02","t":"3","c":0,"q":"Regulation 313.1 requires characteristics of the supply, such as Ze and the prospective short-circuit current at the origin, to be determined. By what means may this be done?","o":["By calculation, measurement, enquiry or inspection","By measurement only","By enquiry of the distributor only","By calculation only"],"a":0,"x":"313.1: the characteristics of the supply shall be determined by calculation, measurement, enquiry or inspection. They are ascertained for an external supply and determined for a private source.","r":"313.1 (page 49 of the 2018 book)","n":"","k":2427,"m":"","f":"Chapter 31, Regulation 313.1 (Supplies), opening sentence.","w":{"1":"313.1 does not limit you to measurement; calculation, enquiry or inspection are also allowed.","2":"Enquiry is only one of four permitted methods.","3":"Calculation is only one of four permitted methods."}},{"id":"b2.91.03","t":"3","c":0,"q":"Regulation 331.1 requires an assessment of characteristics of equipment likely to have harmful effects on other equipment or services or to impair the supply. Which of the following is one of the characteristics listed?","o":["Ambient temperature","Cable colour identification","Power factor","Conductor cross-sectional area"],"a":2,"x":"331.1 lists, for example, transient overvoltages, undervoltage, unbalanced loads, rapidly fluctuating loads, starting currents, harmonic currents, earth leakage current, excessive PE current, DC feedback, high-frequency oscillations, additional connections to Earth and power factor.","r":"331.1 (page 51 of the 2018 book)","n":"","k":2487,"m":"","f":"Chapter 33, Regulation 331.1: read its list of characteristics (power factor is near the end).","w":{"0":"Ambient temperature is an external influence (Chapter 32), not a 331.1 characteris
