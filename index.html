tic.","1":"Cable colours are Section 514, not something that impairs the supply.","3":"Conductor csa is a cable-sizing matter, not a 331.1 characteristic."}},{"id":"b3.91.04","t":"3","c":0,"q":"In a TN-C-S (PME) system (Fig 3.9), the exposed-conductive-parts of the installation are connected to the PEN conductor via","o":["an installation earth electrode only","the main earthing terminal and the neutral terminal, these terminals being linked together","a separate protective conductor run from the source earth","the metallic sheath of the supply cable, kept separate from the neutral"],"a":1,"x":"312.2.1.1, Fig 3.9: all exposed-conductive-parts are connected to the PEN conductor via the main earthing terminal and the neutral terminal, these terminals being linked together.","r":"312.2.1.1 (page 48 of the 2018 book)","n":"","k":2367,"m":"","f":"Chapter 31, Regulation 312.2.1.1 and the caption to Fig 3.9 (TN-C-S).","w":{"0":"An installation electrode alone is TT; in PME the exposed parts go to the PEN via the linked MET and neutral.","2":"A separate PE run from the source is TN-S.","3":"Using the sheath kept separate from the neutral is TN-S, not TN-C-S."}},{"id":"b3.91.05","t":"3","c":0,"q":"Under Appendix 5, a location which may be flooded, so that equipment may be immersed in water, is classified as which external influence and requires what degree of protection?","o":["AD5 Jets, IPX5","AD6 Waves, IPX6","AD8 Submersion, IPX8","AD7 Immersion, IPX7"],"a":3,"x":"Appendix 5, AD7 Immersion: locations which may be flooded and/or where equipment is immersed: IPX7. AD8 is permanent total covering (IPX8).","r":"Appendix 5 (page 449 of the 2018 book)","n":"","k":21057,"m":"","f":"Appendix 5, AD section: find AD7 Immersion and compare with AD8 Submersion.","w":{"0":"AD5 Jets (IPX5) is water jets from any direction, not flooding.","1":"AD6 Waves (IPX6) is for seashore locations like piers, not flooding.","2":"AD8 Submersion is permanent total covering; a location that may be flooded is AD7."}},{"id":"b4.91.06","t":"3","c":0,"q":"Regulation 314.1 requires an installation to be divided into circuits as necessary to take account of hazards that may arise from","o":["the failure of a single circuit such as a lighting circuit","overloading of the supply cut-out","voltage drop in the distributor's network","the use of portable equipment outdoors"],"a":0,"x":"314.1(iii): circuits are divided to take account of hazards that may arise from the failure of a single circuit such as a lighting circuit.","r":"314.1 (page 50 of the 2018 book)","n":"","k":2451,"m":"","f":"Chapter 31, Regulation 314.1 (Division of installation): read item (iii).","w":{"1":"Overloading the cut-out is not one of the 314.1 reasons for division.","2":"Distributor network voltage drop is outside the installation and not in 314.1.","3":"Portable equipment outdoors relates to RCD additional protection (411.3.3), not 314.1."}},{"id":"b4.91.07","t":"3","c":0,"q":"Which of the following is given in Chapter 35 as an example of a safety service?","o":["A standby generator for a computer suite","A security CCTV system","Firefighters lifts","An intruder alarm system"],"a":2,"x":"351 Note 2: examples of safety services are emergency escape lighting, fire detection and fire alarm systems, installations for fire pumps, firefighters lifts, and smoke and heat extraction equipment.","r":"351 (page 52 of the 2018 book)","n":"","k":2514,"m":"","f":"Chapter 35, Regulation 351 Note 2: the list of examples of safety services.","w":{"0":"A standby supply for a computer suite is a standby system, not a safety service.","1":"CCTV is not in the 351 list of safety services.","3":"Intruder alarms protect property, not life; they are not listed as safety services."}},{"id":"b5.91.08","t":"3","c":0,"q":"Chapter 31 illustrates TN-S, TN-C-S and TT systems. Where are IT, multiple source, DC and other systems covered?","o":["Appendix 2","Appendix 5","Appendix 9","Appendix 14"],"a":2,"x":"312.4 (and 312.2 Note 1): for IT, multiple source, DC and other systems see Appendix 9.","r":"312.4 (page 49 of the 2018 book)","n":"","k":2422,"m":"","f":"Chapter 31, Regulation 312.4 (or 312.2 Note 1): it points to the appendix for other systems.","w":{"0":"Appendix 2 is statutory regulations and associated requirements.","1":"Appendix 5 is classification of external influences.","3":"Appendix 14 is about determining prospective fault current, not earthing systems."}},{"id":"b5.91.09","t":"3","c":0,"q":"Under Appendix 5, a location with light dust (AE4), where dust penetration is not harmful to the functioning of the equipment, requires a minimum degree of protection of","o":["IP4X","IP5X","IP6X","IP3X"],"a":1,"x":"Appendix 5, AE4 Light dust: IP5X if dust penetration is not harmful to functioning (IP6X if it is). AE3 very small objects is IP4X and AE2 small objects IP3X.","r":"Appendix 5 (page 450 of the 2018 book)","n":"","k":21109,"m":"","f":"Appendix 5, AE section: find AE4 Light dust and read both conditions.","w":{"0":"IP4X is AE3 Very small objects (1 mm), not dust.","2":"IP6X is only needed where dust penetration would harm functioning.","3":"IP3X is AE2 Small objects (2.5 mm)."}},{"id":"b1.02.00","t":"4","c":0,"q":"For the purposes of BS 7671, DC is conventionally regarded as ripple-free where the rms ripple voltage does not exceed what percentage of the DC component?","o":["10%","5%","15%","25%"],"a":0,"x":"Regulation 410.3.1: ripple-free is conventionally defined as an rms ripple voltage of not more than 10% of the DC component.","r":"410.3.1 (page 56 of the 2018 book)","n":"","k":2662,"m":"","f":"Chapter 41, Regulation 410.3.1 and its note on ripple-free DC. Index: 'ripple-free'.","w":{"1":"5% is not the figure; ripple-free is not more than 10% rms ripple.","2":"15% is too high; the conventional limit is 10%.","3":"25% is too high; the conventional limit is 10%."}},{"id":"b1.02.01","t":"4","c":0,"q":"The maximum disconnection times of Table 41.1 apply to final circuits with one or more socket-outlets having a rated current not exceeding","o":["32 A","20 A","100 A","63 A"],"a":3,"x":"Regulation 411.3.2.2(i): Table 41.1 applies to final circuits rated up to 63 A with one or more socket-outlets (32 A applies to circuits supplying only fixed equipment).","r":"411.3.2.2 (page 58 of the 2018 book)","n":"","k":2765,"m":"","f":"Chapter 41, Regulation 411.3.2.2: items (i) socket-outlet circuits and (ii) fixed equipment circuits.","w":{"0":"32 A is the limit for circuits supplying only fixed equipment (411.3.2.2(ii)).","1":"20 A is not a limit in 411.3.2.2.","2":"100 A is not the limit; socket-outlet final circuits up to 63 A are covered."}},{"id":"b1.02.02","t":"4","c":1,"q":"Using Zs × Ia ≤ Uo × Cmin, with Uo = 230 V and Cmin = 0.95, calculate the maximum Zs for a 40 A Type C circuit-breaker to BS EN 60898, where instantaneous operation occurs at 10 × In.","o":["0.58 Ω","0.55 Ω","0.27 Ω","1.09 Ω"],"a":1,"x":"Zs = (Uo × Cmin) ÷ Ia<br>Ia = 10 × 40 = 400 A<br>230 × 0.95 = 218.5<br>218.5 ÷ 400 = 0.546 Ω → 0.55 Ω (agrees with Table 41.3(b)).","r":"411.4.4 (page 60 of the 2018 book)","n":"","k":2834,"m":"","f":"Regulation 411.4.4 formula Zs = Uo × Cmin ÷ Ia; Ia = 10 × In for Type C. Check against Table 41.3(b), 40 A.","w":{"0":"You left out Cmin: 230 ÷ 400 = 0.58 Ω; multiply by 0.95 first.","2":"0.27 Ω is the Type D value (20 × In); Type C trips at 10 × In.","3":"1.09 Ω is the 40 A Type B value (5 × In)."}},{"id":"b1.02.03","t":"4","c":0,"q":"In the formula Zs × Ia ≤ Uo × Cmin, what value is given to Cmin for a low voltage supply given in accordance with the Electricity Safety, Quality and Continuity Regulations?","o":["0.8","0.95","1.0","1.05"],"a":1,"x":"Regulation 411.4.4 Note: for a low voltage supply in accordance with the ESQCR, Cmin is given the value 0.95.","r":"411.4.4 (page 60 of the 2018 book)","n":"","k":2850,"m":"","f":"Chapter 41, Regulation 411.4.4 and the Note defining Cmin.","w":{"0":"0.8 is the rule-of-thumb factor for measured Zs (Appendix 3), not Cmin.","2":"1.0 ignores the supply tolerance; the Note gives 0.95.","3":"1.05 is not Cmin; Cmin allows for voltage below nominal, so it is less than 1."}},{"id":"b1.02.04","t":"4","c":0,"q":"What is the maximum earth fault loop impedance (Zs) for a 32 A BS 88-2 gG fuse protecting a final circuit requiring 0.4 s disconnection with Uo of 230 V?","o":["1.7 Ω","0.75 Ω","1.29 Ω","0.99 Ω"],"a":3,"x":"Table 41.2(a), BS 88-2 fuse, 32 A rating: 0.99 Ω for 0.4 s. (1.7 Ω is the 5 s value from Table 41.4.)","r":"Table 41.2 (page 61 of the 2018 book)","n":"","k":2880,"m":"","f":"Table 41.2 (Chapter 41, 0.4 s fuses), part (a) BS 88-2, 32 A column. Index: 'earth fault loop impedance'.","w":{"0":"1.7 Ω is the 5 s value from Table 41.4; final circuits need 0.4 s (Table 41.2).","1":"0.75 Ω is the 40 A row; you read the wrong rating.","2":"1.29 Ω is the 25 A row; you read the wrong rating."}},{"id":"b1.02.05","t":"4","c":0,"q":"For fault protection in a FELV system, the exposed-conductive-parts of the FELV circuit equipment must be connected to","o":["an independent earth electrode","nothing, as they must be left unearthed","the protective conductor of the primary circuit of the source","the neutral of the FELV circuit"],"a":2,"x":"Regulation 411.7.3: exposed-conductive-parts of FELV equipment shall be connected to the protective conductor of the primary circuit of the source, provided that circuit is protected by automatic disconnection.","r":"411.7.3 (page 67 of the 2018 book)","n":"","k":3200,"m":"","f":"Chapter 41, Section 411.7 (FELV), Regulation 411.7.3.","w":{"0":"411.7.3 requires connection to the primary circuit's protective conductor, not an independent electrode.","1":"Leaving them unearthed is not allowed for FELV; they go to the primary circuit's protective conductor.","3":"Exposed parts are never connected to a neutral for fault protection."}},{"id":"b1.02.06","t":"4","c":0,"q":"For the purposes of placing out of reach, two parts are deemed to be simultaneously accessible if they are not more than what distance apart?","o":["1.25 m","2.00 m","2.50 m","3.00 m"],"a":2,"x":"Regulation 417.3.1 Note: two parts are deemed simultaneously accessible if they are not more than 2.50 m apart (see Figure 417).","r":"417.3.1 (page 75 of the 2018 book)","n":"","k":3620,"m":"","f":"Chapter 41, Section 417, Regulation 417.3.1 Note and Figure 417 (arm's reach).","w":{"0":"1.25 m is the horizontal arm's reach distance in Figure 417, not the simultaneously accessible distance.","1":"2.00 m is not the figure; parts within 2.50 m are deemed simultaneously accessible.","3":"3.00 m is too far; the Note gives 2.50 m."}},{"id":"b2.02.07","t":"4","c":0,"q":"The protective measures of obstacles and placing out of reach (Section 417) shall only be used in installations restricted to","o":["skilled persons, or instructed persons under the supervision of skilled persons","ordinary persons in dwellings","instructed persons working unsupervised","any persons, provided warning notices are fixed"],"a":0,"x":"Regulation 410.3.5: Section 417 measures shall only be used in installations restricted to skilled persons, or instructed persons under the supervision of skilled persons.","r":"410.3.5 (page 57 of the 2018 book)","n":"","k":2686,"m":"","f":"Chapter 41, Regulation 410.3.5 (Section 417 restrictions).","w":{"1":"Section 417 measures are not for ordinary persons or dwellings.","2":"Instructed persons must be supervised by skilled persons.","3":"Warning notices do not make Section 417 acceptable for any persons."}},{"id":"b2.02.08","t":"4","c":0,"q":"Table 41.1 disconnection times apply to final circuits supplying only fixed connected current-using equipment with a rated current not exceeding","o":["32 A","63 A","16 A","45 A"],"a":0,"x":"Regulation 411.3.2.2(ii): Table 41.1 applies to final circuits rated up to 32 A supplying only fixed connected current-using equipment.","r":"411.3.2.2 (page 58 of the 2018 book)","n":"","k":2768,"m":"","f":"Chapter 41, Regulation 411.3.2.2 item (ii), fixed equipment circuits.","w":{"1":"63 A is the limit for socket-outlet final circuits (411.3.2.2(i)).","2":"16 A is not a limit in 411.3.2.2.","3":"45 A is not a limit in 411.3.2.2; fixed equipment circuits up to 32 A are covered."}},{"id":"b2.02.09","t":"4","c":0,"q":"What is the maximum earth fault loop impedance for a 30 A semi-enclosed fuse to BS 3036 for 0.4 s disconnection at Uo of 230 V?","o":["2.51 Ω","1.68 Ω","0.56 Ω","1.04 Ω"],"a":3,"x":"Table 41.2(c), BS 3036, 30 A: 1.04 Ω. (2.51 Ω is the 5 s value in Table 41.4(c).)","r":"Table 41.2 (page 61 of the 2018 book)","n":"","k":2889,"m":"","f":"Table 41.2 (0.4 s), part (c) BS 3036 semi-enclosed fuses, 30 A column.","w":{"0":"2.51 Ω is the 5 s value from Table 41.4(c), not 0.4 s.","1":"1.68 Ω is the 20 A BS 3036 value.","2":"0.56 Ω is the 45 A BS 3036 value."}},{"id":"b2.02.10","t":"4","c":1,"q":"A ring final circuit is protected by a 16 A Type B circuit-breaker (tabulated maximum Zs 2.73 Ω, Table 41.3). Applying the commonly used 0.8 rule of thumb to allow for conductor temperature rise during a fault, what is the maximum Zs measured at room temperature?","o":["2.73 Ω","2.18 Ω","1.37 Ω","3.41 Ω"],"a":1,"x":"Table 41.3 values apply with conductors at maximum operating temperature (Note 2; see Appendix 3). Appendix 3 compares the measured value at ambient temperature with 0.8 × Uo × Cmin ÷ Ia, i.e. 0.8 × the tabulated value.<br>2.73 × 0.8 = 2.184<br>Maximum measured Zs ≈ 2.18 Ω.","r":"Table 41.3 (page 62 of the 2018 book)","n":"","k":2923,"m":"","f":"Table 41.3 for the tabulated value and its Note 2, then Appendix 3 for the 0.8 factor. Multiply 2.73 × 0.8.","w":{"0":"2.73 Ω is the tabulated value at operating temperature; a room-temperature reading must be lower.","2":"1.37 Ω is the 32 A Type B value from Table 41.3, not 0.8 × 2.73.","3":"You divided by 0.8 instead of multiplying; the measured limit is lower, not higher."}},{"id":"b2.02.11","t":"4","c":0,"q":"In a TT system, which type of protective device is stated as preferred for fault protection?","o":["An overcurrent protective device","An RCD","A BS 3036 semi-enclosed fuse","An insulation monitoring device"],"a":1,"x":"Regulation 411.5.2: one or more of (i) an RCD or (ii) an overcurrent protective device shall be used, the former (the RCD) being preferred.","r":"411.5.2 (page 64 of the 2018 book)","n":"","k":3029,"m":"","f":"Chapter 41, Regulation 411.5.2 (TT system).","w":{"0":"Overcurrent devices are allowed in TT but the RCD is stated as preferred.","2":"A BS 3036 fuse is an overcurrent device; the RCD is preferred in TT.","3":"An IMD is for IT systems, not TT fault protection."}},{"id":"b2.02.12","t":"4","c":0,"q":"The nominal voltage of reduced low voltage circuits shall not exceed 110 V AC rms between lines. What is the corresponding voltage of a single-phase system to its earthed midpoint?","o":["55 V","63.5 V","50 V","25 V"],"a":0,"x":"Regulation 411.8.1.2: 110 V between lines, i.e. three-phase 63.5 V to earthed neutral and single-phase 55 V to earthed midpoint.","r":"411.8.1.2 (page 67 of the 2018 book)","n":"","k":3220,"m":"","f":"Chapter 41, Section 411.8 (reduced low voltage), Regulation 411.8.1.2.","w":{"1":"63.5 V is the three-phase line-to-neutral value, not single-phase to midpoint.","2":"50 V is the ELV touch-voltage figure, not reduced low voltage.","3":"25 V is a special-location touch voltage, not reduced low voltage."}},{"id":"b2.02.13","t":"4","c":1,"q":"Supplementary bonding is relied on where a 30 mA RCD provides fault protection in an AC system. Using R ≤ 50 V ÷ Ia, what is the maximum resistance permitted between simultaneously accessible exposed- and extraneous-conductive-parts?","o":["833 Ω","167 Ω","1667 Ω","1.67 Ω"],"a":2,"x":"Regulation 415.2.2: R ≤ 50 V ÷ Ia, with Ia = IΔn for an RCD.<br>30 mA = 0.03 A<br>50 ÷ 0.03 = 1666.7 Ω ≈ 1667 Ω.","r":"415.2.2 (page 74 of the 2018 book)","n":"","k":3546,"m":"","f":"Chapter 41, Regulation 415.2.2: R ≤ 50 V ÷ Ia, with Ia = IΔn for an RCD. Convert mA to A first.","w":{"0":"You used 25 V instead of 50 V; 415.2.2 uses 50 V for AC.","1":"167 Ω is 50 ÷ 0.3, i.e. a 300 mA RCD, not 30 mA.","3":"You didn't convert mA to A: 50 ÷ 30 gives 1.67, but 30 mA = 0.03 A."}},{"id":"b3.02.14","t":"4","c":0,"q":"Fault protection may be omitted for exposed-conductive-parts which cannot be gripped owing to their reduced dimensions. What approximate maximum size is given?","o":["50 mm × 50 mm","25 mm × 25 mm","100 mm × 100 mm","12 mm × 12 mm"],"a":0,"x":"Regulation 410.3.9(iii): approximate maximum of 50 mm × 50 mm, e.g. bolts, rivets, nameplates, cable clips and screws.","r":"410.3.9 (page 57 of the 2018 book)","n":"","k":2706,"m":"","f":"Chapter 41, Regulation 410.3.9 (exemptions from fault protection), item (iii).","w":{"1":"25 mm × 25 mm is not the figure; 410.3.9(iii) gives 50 mm × 50 mm.","2":"100 mm × 100 mm is too large; 410.3.9(iii) gives 50 mm × 50 mm.","3":"12 mm is the IP2X finger size, not the 410.3.9 dimension."}},{"id":"b3.02.15","t":"4","c":0,"q":"What is the maximum disconnection time for a 32 A AC socket-outlet final circuit in a TT system with Uo of 230 V?","o":["0.2 s","0.4 s","1 s","0.07 s"],"a":0,"x":"Table 41.1, TT system, 120 V < Uo ≤ 230 V, AC: 0.2 s. (0.4 s is the TN value; 1 s applies only to TT distribution circuits under 411.3.2.4.)","r":"Table 41.1 (page 59 of the 2018 book)","n":"","k":2780,"m":"","f":"Table 41.1 (Chapter 41): TT row, 120 V < Uo ≤ 230 V, AC column.","w":{"1":"0.4 s is the TN value; TT final circuits at 230 V need 0.2 s.","2":"1 s is the TT distribution circuit time (411.3.2.4), not final circuits.","3":"0.07 s is the TT value for 230 V < Uo ≤ 400 V."}},{"id":"b3.02.16","t":"4","c":0,"q":"In which system shall an RCD NOT be used?","o":["TN-S","TN-C-S","TT","TN-C"],"a":3,"x":"Regulation 411.4.5: an RCD shall not be used in a TN-C system.","r":"411.4.5 (page 60 of the 2018 book)","n":"","k":2862,"m":"","f":"Chapter 41, Regulation 411.4.5 (TN system). Index: 'RCD, TN-C system'.","w":{"0":"RCDs are commonly used in TN-S; only TN-C is prohibited.","1":"RCDs are used on PME (TN-C-S) installations, where the installation side has a separate PE.","2":"RCDs are the preferred device in TT (411.5.2)."}},{"id":"b3.02.17","t":"4","c":1,"q":"What is the maximum earth fault loop impedance for a 32 A Type B circuit-breaker to BS EN 60898 for 0.4 s disconnection with Uo of 230 V?","o":["0.68 Ω","1.09 Ω","1.37 Ω","1.75 Ω"],"a":2,"x":"Table 41.3(a), Type B, 32 A: 1.37 Ω (check: 218.5 ÷ (5 × 32) = 1.37 Ω).","r":"Table 41.3 (page 62 of the 2018 book)","n":"","k":2923,"m":"","f":"Table 41.3(a), Type B circuit-breakers, 32 A, 0.4 s. Check: 218.5 ÷ (5 × In).","w":{"0":"0.68 Ω is the 32 A Type C value (or 16 A Type D).","1":"1.09 Ω is the 40 A Type B value.","3":"1.75 Ω is not in the Type B column; recalculate 218.5 ÷ 160."}},{"id":"b3.02.18","t":"4","c":1,"q":"A TT installation is protected by a 100 mA RCD. Using RA × IΔn ≤ 50 V, what is the maximum value of RA?","o":["200 Ω","167 Ω","5000 Ω","500 Ω"],"a":3,"x":"Regulation 411.5.3(ii): RA ≤ 50 ÷ IΔn.<br>100 mA = 0.1 A<br>50 ÷ 0.1 = 500 Ω.","r":"411.5.3 (page 64 of the 2018 book)","n":"","k":3038,"m":"","f":"Chapter 41, Regulation 411.5.3(ii): RA × IΔn ≤ 50 V. Convert 100 mA to 0.1 A, then 50 ÷ 0.1.","w":{"0":"200 Ω is 50 ÷ 0.25; you used the wrong current.","1":"167 Ω is 50 ÷ 0.3, the 300 mA answer.","2":"5000 Ω is 50 ÷ 0.01; a decimal slip converting 100 mA."}},{"id":"b3.02.19","t":"4","c":0,"q":"In a reduced low voltage system, the earth fault loop impedance at every point of utilization, including socket-outlets, shall be such that the disconnection time does not exceed","o":["0.4 s","5 s","0.2 s","1 s"],"a":1,"x":"Regulation 411.8.3: disconnection time shall not exceed 5 s at every point of utilization, including socket-outlets.","r":"411.8.3 (page 68 of the 2018 book)","n":"","k":3233,"m":"","f":"Chapter 41, Section 411.8 (reduced low voltage), Regulation 411.8.3; Table 41.6 is for 5 s.","w":{"0":"0.4 s is the TN 230 V final circuit time, not reduced low voltage.","2":"0.2 s is the TT final circuit time.","3":"1 s is the TT distribution circuit time."}},{"id":"b3.02.20","t":"4","c":0,"q":"The upper limit of voltage Band I for SELV and PELV systems is","o":["25 V AC or 60 V DC","12 V AC or 30 V DC","50 V AC or 120 V DC","110 V AC or 150 V DC"],"a":2,"x":"Regulation 414.1.1(iii): limitation of voltage to the upper limit of Band I, 50 V AC or 120 V DC.","r":"414.1.1 (page 72 of the 2018 book)","n":"","k":3434,"m":"","f":"Chapter 41, Section 414 (SELV/PELV), Regulation 414.1.1(iii); Part 2 'Voltage bands' also helps.","w":{"0":"25 V AC/60 V DC are lower limits used in some special locations, not the Band I upper limit.","1":"12 V AC/30 V DC are lower special-location limits, not the Band I limit.","3":"110 V is reduced low voltage, which is above Band I."}},{"id":"b4.02.21","t":"4","c":0,"q":"Which of the following is NOT one of the protective measures generally permitted by Regulation 410.3.3?","o":["Non-conducting location","Automatic disconnection of supply","Double or reinforced insulation","Extra-low voltage (SELV and PELV)"],"a":0,"x":"Regulation 410.3.3 lists ADS, double or reinforced insulation, electrical separation for one item of equipment and SELV/PELV. Non-conducting location is in Section 418 and only for supervised installations (410.3.6).","r":"410.3.3 (page 56 of the 2018 book)","n":"","k":2674,"m":"","f":"Chapter 41, Regulation 410.3.3 list, then 410.3.6 for measures limited to supervised installations.","w":{"1":"ADS is listed in 410.3.3, so it is generally permitted.","2":"Double or reinforced insulation is listed in 410.3.3.","3":"SELV and PELV are listed in 410.3.3."}},{"id":"b4.02.22","t":"4","c":0,"q":"In a TT system, what maximum disconnection time is permitted for a distribution circuit?","o":["5 s","0.4 s","1 s","0.2 s"],"a":2,"x":"Regulation 411.3.2.4: in a TT system a disconnection time not exceeding 1 s is permitted for a distribution circuit (5 s is the TN figure in 411.3.2.3).","r":"411.3.2.4 (page 59 of the 2018 book)","n":"","k":2793,"m":"","f":"Chapter 41, Regulation 411.3.2.4 (TT distribution circuits), next to 411.3.2.3 for TN.","w":{"0":"5 s is the TN distribution circuit time (411.3.2.3).","1":"0.4 s is the TN final circuit time at 230 V.","3":"0.2 s is the TT final circuit time at 230 V."}},{"id":"b4.02.23","t":"4","c":1,"q":"What is the maximum earth fault loop impedance for a 16 A Type D circuit-breaker to BS EN 60898 for 0.4 s disconnection with Uo of 230 V?","o":["0.68 Ω","1.37 Ω","0.34 Ω","2.73 Ω"],"a":0,"x":"Table 41.3(c), Type D, 16 A, 0.4 s: 0.68 Ω (check: 218.5 ÷ (20 × 16) = 0.68 Ω).","r":"Table 41.3 (page 62 of the 2018 book)","n":"","k":2936,"m":"","f":"Table 41.3(c), Type D circuit-breakers, 16 A, 0.4 s. Check: 218.5 ÷ (20 × In).","w":{"1":"1.37 Ω is the 16 A Type C value (10 × In).","2":"0.34 Ω is the 32 A Type D value.","3":"2.73 Ω is the 16 A Type B value (5 × In)."}},{"id":"b4.02.24","t":"4","c":1,"q":"A TT installation has a measured RA of 180 Ω. What is the highest of the following RCD rated residual operating currents that satisfies RA × IΔn ≤ 50 V?","o":["300 mA","100 mA","500 mA","30 mA"],"a":1,"x":"Regulation 411.5.3(ii): IΔn ≤ 50 ÷ RA<br>50 ÷ 180 = 0.278 A = 278 mA<br>300 mA: 180 × 0.3 = 54 V (fails)<br>100 mA: 180 × 0.1 = 18 V (complies), so 100 mA is the highest that complies.","r":"411.5.3 (page 64 of the 2018 book)","n":"","k":3038,"m":"","f":"Chapter 41, Regulation 411.5.3(ii): IΔn ≤ 50 ÷ RA, then test each option.","w":{"0":"180 × 0.3 = 54 V, which exceeds 50 V, so 300 mA fails.","2":"180 × 0.5 = 90 V, well over 50 V.","3":"30 mA complies, but 100 mA also complies and is higher."}},{"id":"b4.02.25","t":"4","c":0,"q":"Where an IT system is designed not to disconnect on a first fault, the first fault may be indicated by","o":["a time-delayed RCD","a BS 88-3 fuse","an insulation monitoring device (IMD)","an overcurrent protective device"],"a":2,"x":"Regulation 411.6.4: the first fault shall be indicated by an insulation monitoring device (IMD), possibly with an IFLS, or by a residual current monitor (RCM).","r":"411.6.4 (page 65 of the 2018 book)","n":"","k":3126,"m":"","f":"Chapter 41, Section 411.6 (IT system), Regulation 411.6.4.","w":{"0":"A time-delayed RCD disconnects; the first fault in IT is only indicated, by an IMD or RCM.","1":"A fuse disconnects; it cannot indicate an insulation fault.","3":"An overcurrent device disconnects; IT first-fault indication is by IMD or RCM."}},{"id":"b4.02.26","t":"4","c":0,"q":"Except where Regulation 412.1.2 applies, why must a circuit supplying Class II equipment still have a circuit protective conductor run to each point and accessory?","o":["To provide functional earthing for the Class II equipment","To reduce the earth fault loop impedance of the circuit","To satisfy the requirements for supplementary bonding","To allow for the user replacing Class II equipment with Class I equipment"],"a":3,"x":"Regulation 412.2.3.2 and its Note: the requirement takes account of the replacement by the user of Class II equipment by Class I equipment.","r":"412.2.3.2 (page 70 of the 2018 book)","n":"","k":3372,"m":"","f":"Chapter 41, Section 412 (double/reinforced insulation), Regulation 412.2.3.2 and its Note.","w":{"0":"Class II equipment needs no earth; the cpc is for later replacement with Class I.","1":"A cpc to Class II equipment does not exist to lower Zs; it covers Class I replacement.","2":"Supplementary bonding is not the reason; the Note refers to replacement with Class I."}},{"id":"b4.02.27","t":"4","c":0,"q":"A readily accessible horizontal top surface of a barrier or enclosure shall provide a degree of protection of at least","o":["IPXXB or IP2X","IP44","IPX4","IPXXD or IP4X"],"a":3,"x":"Regulation 416.2.2: readily accessible horizontal top surfaces require at least IPXXD or IP4X (other surfaces IPXXB or IP2X, 416.2.1).","r":"416.2.2 (page 74 of the 2018 book)","n":"","k":3572,"m":"","f":"Chapter 41, Section 416 (barriers or enclosures), Regulation 416.2.2.","w":{"0":"IPXXB/IP2X applies to other surfaces (416.2.1); horizontal top surfaces need IPXXD/IP4X.","1":"IP44 includes water protection; 416.2.2 is about finger/wire access, IPXXD or IP4X.","2":"IPX4 is splash protection, nothing to do with basic protection from objects."}},{"id":"b5.02.28","t":"4","c":0,"q":"A circuit protective conductor shall be run to and terminated at each point in wiring and at each accessory, except","o":["a ceiling rose","a lampholder having no exposed-conductive-parts and suspended from such a point","a switch with an insulated plate","any accessory supplying Class II equipment"],"a":1,"x":"Regulation 411.3.1.1: the exception is a lampholder having no exposed-conductive-parts and suspended from such a point.","r":"411.3.1.1 (page 58 of the 2018 book)","n":"","k":2739,"m":"","f":"Chapter 41, Regulation 411.3.1.1 (Protective earthing).","w":{"0":"A ceiling rose is a point and needs a cpc terminated at it.","2":"Switches still need a cpc run to them, even with insulated plates.","3":"Accessories for Class II equipment still need a cpc (412.2.3.2)."}},{"id":"b5.02.29","t":"4","c":0,"q":"In a TN system, what is the maximum AC disconnection time for a final circuit within the scope of 411.3.2.2 where Uo exceeds 230 V but does not exceed 400 V?","o":["0.4 s","0.1 s","0.2 s","0.07 s"],"a":2,"x":"Table 41.1, TN system, 230 V < Uo ≤ 400 V, AC column: 0.2 s.","r":"Table 41.1 (page 59 of the 2018 book)","n":"","k":2778,"m":"","f":"Table 41.1: TN row, 230 V < Uo ≤ 400 V, AC column.","w":{"0":"0.4 s is for 120 V < Uo ≤ 230 V in TN.","1":"0.1 s is the TN value for Uo above 400 V.","3":"0.07 s is the TT value for 230 V < Uo ≤ 400 V."}},{"id":"b5.02.30","t":"4","c":1,"q":"What is the maximum earth fault loop impedance for a 20 A Type C circuit-breaker to BS EN 60898 for 0.4 s disconnection with Uo of 230 V?","o":["2.19 Ω","0.55 Ω","1.09 Ω","0.87 Ω"],"a":2,"x":"Table 41.3(b), Type C, 20 A: 1.09 Ω (check: 218.5 ÷ (10 × 20) = 1.09 Ω).","r":"Table 41.3 (page 62 of the 2018 book)","n":"","k":2929,"m":"","f":"Table 41.3(b), Type C circuit-breakers, 20 A, 0.4 s. Check: 218.5 ÷ (10 × In).","w":{"0":"2.19 Ω is the 20 A Type B value (5 × In).","1":"0.55 Ω is the 20 A Type D value (20 × In), or 40 A Type C.","3":"0.87 Ω is 0.8 × 1.09, the measured-value rule of thumb, not the tabulated maximum."}},{"id":"b5.02.31","t":"4","c":0,"q":"A distribution circuit in a TN system is protected by a 63 A BS 88-2 gG fuse. What is the maximum Zs for 5 s disconnection at Uo of 230 V?","o":["0.44 Ω","0.99 Ω","0.55 Ω","0.78 Ω"],"a":3,"x":"Table 41.4(a), BS 88-2, 63 A, 5 s: 0.78 Ω. (0.44 Ω is the 0.4 s value in Table 41.2.)","r":"Table 41.4 (page 63 of the 2018 book)","n":"","k":2983,"m":"","f":"Table 41.4 (5 s for distribution circuits), part (a) BS 88-2, 63 A.","w":{"0":"0.44 Ω is the 0.4 s value from Table 41.2; distribution circuits use 5 s.","1":"0.99 Ω is the 32 A BS 88-2 value at 0.4 s.","2":"0.55 Ω is a circuit-breaker value, not the BS 88-2 fuse at 5 s."}},{"id":"b5.02.32","t":"4","c":0,"q":"A 110 V single-phase centre-tapped site supply (Uo 55 V) circuit is protected by a 16 A Type B circuit-breaker. What is the maximum Zs from Table 41.6?","o":["0.75 Ω","0.65 Ω","0.33 Ω","0.95 Ω"],"a":1,"x":"Table 41.6, Type B, 16 A, Uo 55 V: 0.65 Ω (0.75 Ω is the 63.5 V value; 0.33 Ω is Type C/D).","r":"Table 41.6 (page 68 of the 2018 book)","n":"","k":3261,"m":"","f":"Table 41.6 (reduced low voltage, 5 s): Type B column, 16 A row, Uo 55 V.","w":{"0":"0.75 Ω is the 63.5 V (three-phase) value; centre-tapped single-phase uses 55 V.","2":"0.33 Ω is the Type C/D column.","3":"0.95 Ω is the 16 A BS 88-2 fuse value at 55 V, not a Type B breaker."}},{"id":"b5.02.33","t":"4","c":0,"q":"Where electrical separation is used, the voltage of the separated circuit shall not exceed","o":["230 V","500 V","400 V","1000 V"],"a":1,"x":"Regulation 413.3.2: the separated circuit shall be supplied through a source with at least simple separation and its voltage shall not exceed 500 V.","r":"413.3.2 (page 71 of the 2018 book)","n":"","k":3407,"m":"","f":"Chapter 41, Section 413 (electrical separation), Regulation 413.3.2.","w":{"0":"230 V is the UK Uo, not the 413.3.2 limit of 500 V.","2":"400 V is the UK line voltage, not the limit.","3":"1000 V is the LV upper limit, not the separated circuit limit."}},{"id":"b5.02.34","t":"4","c":0,"q":"For electrical separation supplying more than one item of equipment, the product of nominal voltage and wiring system length shall not exceed 100 000 Vm. What is the maximum length of the wiring system?","o":["500 m","100 m","435 m","1000 m"],"a":0,"x":"Regulation 418.3.8: Vm product not exceeding 100 000 Vm and the wiring system length shall not exceed 500 m.","r":"418.3.8 (page 78 of the 2018 book)","n":"","k":3725,"m":"","f":"Chapter 41, Section 418.3 (electrical separation for more than one item), Regulation 418.3.8.","w":{"1":"100 m is not the limit; 418.3.8 allows up to 500 m.","2":"435 m is 100 000 ÷ 230; the regulation also caps length at 500 m, which is the stated maximum.","3":"1000 m exceeds the 500 m cap in 418.3.8."}},{"id":"b1.03.00","t":"5","c":0,"q":"In a location with BE2 conditions (risk of fire due to processed or stored materials), an enclosure of electrical equipment such as a heater shall be prevented from exceeding which temperature under normal conditions?","o":["90 °C","70 °C","115 °C","160 °C"],"a":0,"x":"Regulation 422.3.2 limits such enclosures to 90 °C under normal conditions and 115 °C under fault conditions.","r":"422.3.2 (page 82 of the 2018 book)","n":"","k":3918,"m":"","f":"Chapter 42, Section 422.3 (BE2 locations), Regulation 422.3.2.","w":{"1":"70 °C is not the 422.3.2 limit; it's 90 °C normal, 115 °C fault.","2":"115 °C is the fault-condition limit, not normal.","3":"160 °C is a conductor final temperature from Chapter 43, not an enclosure limit."}},{"id":"b1.03.01","t":"5","c":0,"q":"According to Table 42.1, what is the maximum temperature under normal load conditions for a metallic hand-held part of fixed equipment within arm's reach?","o":["65 °C","70 °C","55 °C","80 °C"],"a":2,"x":"Table 42.1 (Regulation 423.1): a hand-held part with a metallic surface is limited to 55 °C; a non-metallic hand-held part is limited to 65 °C.","r":"423.1 (page 85 of the 2018 book)","n":"","k":4068,"m":"","f":"Chapter 42, Regulation 423.1 and Table 42.1 (accessible part temperatures).","w":{"0":"65 °C is for a non-metallic hand-held part.","1":"70 °C is for metallic parts intended to be touched but not hand-held.","3":"80 °C is for non-metallic parts touched but not hand-held, or metallic parts not touched."}},{"id":"b1.03.02","t":"5","c":0,"q":"Where a switch is placed in a neutral conductor, which of the following is required by Regulation 431.3?","o":["The neutral shall be disconnected before the line conductors and reconnected after them","The neutral shall not be disconnected before the line conductors and shall be reconnected at the same time as or before them","The neutral shall be disconnected after the line conductors and reconnected after them","The neutral may be disconnected and reconnected in any sequence provided an RCD is fitted"],"a":1,"x":"Regulation 431.3: the neutral must not be disconnected before the line conductors and must be reconnected at the same time as or before the line conductors.","r":"431.3 (page 88 of the 2018 book)","n":"","k":4197,"m":"","f":"Chapter 43, Regulation 431.3 (protection of the neutral, switching).","w":{"0":"That's the reverse; the neutral must not break before the lines.","2":"The neutral must reconnect at the same time as or before the lines, not after.","3":"An RCD doesn't relax the sequence in 431.3."}},{"id":"b1.03.03","t":"5","c":1,"q":"A circuit has a design current (Ib) of 26 A and is protected by a 32 A circuit-breaker to BS EN 60898. What is the minimum current-carrying capacity (Iz) the cable must have to meet Regulation 433.1.1?","o":["26 A","44.1 A","46.4 A","32 A"],"a":3,"x":"Regulation 433.1.1 requires Ib ≤ In ≤ Iz.<br>Ib = 26 A ≤ In = 32 A<br>In ≤ Iz, so Iz must be at least 32 A<br>For a BS EN 60898 device, meeting (i) and (ii) also meets (iii) (Regulation 433.1.201).","r":"433.1.1 (page 89 of the 2018 book)","n":"","k":4230,"m":"","f":"Chapter 43, Regulation 433.1.1: Ib ≤ In ≤ Iz; 433.1.201 for BS EN 60898 devices.","w":{"0":"26 A is Ib; Iz must be at least In (32 A).","1":"44.1 A is 32 ÷ 0.725, the BS 3036 rule, not for a BS EN 60898 breaker.","2":"46.4 A is 1.45 × 32, i.e. I2; you used the overload test current."}},{"id":"b1.03.04","t":"5","c":1,"q":"A cable has a current-carrying capacity (Iz) of 27 A and is to be protected against overload by a semi-enclosed fuse to BS 3036. What is the maximum rated current (In) of the fuse to satisfy Regulation 433.1.202?","o":["24.3 A","27 A","19.6 A","37.2 A"],"a":2,"x":"Regulation 433.1.202: In must not exceed 0.725 × Iz.<br>0.725 × 27 = 19.575<br>Maximum In = 19.6 A.","r":"433.1.202 (page 89 of the 2018 book)","n":"","k":4249,"m":"","f":"Chapter 43, Regulation 433.1.202 (BS 3036 fuses): In ≤ 0.725 × Iz.","w":{"0":"24.3 A is 0.9 × 27; the BS 3036 factor is 0.725.","1":"27 A ignores the 0.725 factor for semi-enclosed fuses.","3":"You divided by 0.725 instead of multiplying."}},{"id":"b1.03.05","t":"5","c":1,"q":"A fault current of 1500 A is disconnected in 0.4 s. The conductor is copper with 70 °C thermoplastic insulation (k = 115 from Table 43.1). Using the adiabatic equation, what is the minimum standard conductor size?","o":["10 mm²","4 mm²","6 mm²","16 mm²"],"a":0,"x":"S = √(I²t) ÷ k = I × √t ÷ k (Regulation 434.5.2)<br>√0.4 = 0.632<br>1500 × 0.632 = 948.7<br>948.7 ÷ 115 = 8.25 mm²<br>Next standard size up = 10 mm².","r":"434.5.2 (page 92 of the 2018 book)","n":"","k":4404,"m":"","f":"Chapter 43, Regulation 434.5.2 adiabatic equation S = √(I²t) ÷ k; k from Table 43.1.","w":{"1":"4 mm² is smaller than the 8.25 mm² required.","2":"6 mm² is smaller than the 8.25 mm² required.","3":"16 mm² complies but is not the minimum; 10 mm² is the next size up."}},{"id":"b1.03.06","t":"5","c":1,"q":"In an installation with U0 = 230 V, a short-circuit occurs between a line conductor and the neutral. To what value can the voltage between the other line conductors and neutral rise, and for how long?","o":["398 V for a time up to 5 s","460 V for a time up to 0.4 s","480 V for a time exceeding 5 s","333.5 V for a time up to 5 s"],"a":3,"x":"Regulation 442.5: the voltage can reach 1.45 × U0 for a time up to 5 s.<br>1.45 × 230 = 333.5 V.","r":"442.5 (page 100 of the 2018 book)","n":"","k":4764,"m":"","f":"Chapter 44, Regulation 442.5 (stress voltage on short-circuit): 1.45 × U0, up to 5 s.","w":{"0":"398 V is √3 × 230, the line voltage; the regulation gives 1.45 × U0.","1":"460 V is 2 × 230 with a 0.4 s time; neither matches 442.5.","2":"480 V and 'exceeding 5 s' don't match; 442.5 gives 1.45 × U0 up to 5 s."}},{"id":"b2.03.07","t":"5","c":0,"q":"Where electrical equipment in a single location contains flammable liquid, what is the generally accepted lower limit for a 'significant quantity' requiring precautions such as a retention pit?","o":["5 litres","25 litres","10 litres","50 litres"],"a":1,"x":"Regulation 421.1.5 Note 2: the generally accepted lower limit for a significant quantity is 25 litres; below that it is sufficient to prevent the escape of liquid.","r":"421.1.5 (page 80 of the 2018 book)","n":"","k":3823,"m":"","f":"Chapter 42, Regulation 421.1.5 Note 2 (flammable liquid in equipment).","w":{"0":"5 litres is too low; the significant quantity is 25 litres.","2":"10 litres is too low; the Note gives 25 litres.","3":"50 litres is too high; the limit is 25 litres."}},{"id":"b2.03.08","t":"5","c":0,"q":"Unless otherwise recommended by the manufacturer, what is the minimum distance from combustible materials for a small spotlight rated at 250 W in a location with BE2 conditions?","o":["0.8 m","0.5 m","1.0 m","1.5 m"],"a":0,"x":"Regulation 422.3.1: up to 100 W 0.5 m; over 100 W and up to 300 W 0.8 m; over 300 W and up to 500 W 1.0 m. 250 W falls in the 0.8 m band.","r":"422.3.1 (page 82 of the 2018 book)","n":"","k":3907,"m":"","f":"Index: 'fire, protection against' or 'spotlights'. Go to Section 422, Regulation 422.3.1, and read the wattage bands for minimum distance from combustible materials.","w":{"1":"0.5 m is the band for lamps up to 100 W; 250 W is over 100 W.","2":"1.0 m is the band for over 300 W up to 500 W; 250 W is below that.","3":"1.5 m isn't one of the bands in 422.3.1; the largest listed is 1.0 m."}},{"id":"b2.03.09","t":"5","c":1,"q":"A cable has a current-carrying capacity (Iz) of 24 A. Under Regulation 433.1.1(iii), what is the maximum value of I2, the current causing effective operation of the overload protective device?","o":["16.6 A","17.4 A","34.8 A","24 A"],"a":2,"x":"Regulation 433.1.1(iii): I2 ≤ 1.45 × Iz.<br>1.45 × 24 = 34.8<br>Maximum I2 = 34.8 A.","r":"433.1.1 (page 89 of the 2018 book)","n":"","k":4234,"m":"","f":"Index: 'overload protection'. Go to Chapter 43, Regulation 433.1.1, condition (iii): I2 ≤ 1.45 × Iz. Multiply the given Iz by 1.45.","w":{"0":"You divided by 1.45 instead of multiplying: I2 may be up to 1.45 × Iz.","1":"You multiplied by 0.725 (the BS 3036 factor from 433.1.202), not 1.45.","3":"That's Iz itself; condition (iii) allows I2 up to 1.45 × Iz."}},{"id":"b2.03.10","t":"5","c":0,"q":"A ring final circuit supplying BS 1363 accessories is protected by a 32 A device. Under Regulation 433.1.204 the circuit is deemed to meet Regulation 433.1.1 provided the current-carrying capacity (Iz) of the cable is not less than:","o":["16 A","20 A","27 A","32 A"],"a":1,"x":"Regulation 433.1.204: the ring is deemed to comply if Iz of the cable is not less than 20 A and the load in any part is unlikely to exceed Iz for long periods.","r":"433.1.204 (page 89 of the 2018 book)","n":"","k":4261,"m":"","f":"Index: 'ring final circuits'. Go to Regulation 433.1.204 in Chapter 43 and read the minimum Iz for a 30 or 32 A ring.","w":{"0":"16 A isn't the ring figure; 433.1.204 sets a minimum Iz of 20 A.","2":"27 A is a typical 2.5 mm² clipped-direct rating, not the 433.1.204 minimum of 20 A.","3":"Iz need not equal the 32 A device rating for a ring; 433.1.204 allows 20 A."}},{"id":"b2.03.11","t":"5","c":0,"q":"Regulation 434.1 requires the prospective fault current to be determined at every relevant point of the installation. By what means may this be done?","o":["Measurement only","Calculation only","Enquiry of the distributor only","Calculation, measurement or enquiry"],"a":3,"x":"Regulation 434.1: prospective fault current shall be determined by calculation, measurement or enquiry.","r":"434.1 (page 91 of the 2018 book)","n":"","k":4338,"m":"","f":"Index: 'prospective fault current'. Go to Section 434, Regulation 434.1, and read how it may be determined.","w":{"0":"Measurement is only one of three permitted methods.","1":"Calculation is only one of three permitted methods.","2":"Enquiry is only one of three; calculation and measurement are also allowed."}},{"id":"b2.03.12","t":"5","c":1,"q":"A 2.5 mm² copper conductor with 70 °C thermoplastic insulation (k = 115) carries a fault current of 500 A. Using t = k²S² ÷ I², what is the maximum disconnection time before the conductor reaches its limiting temperature?","o":["0.17 s","0.58 s","0.33 s","3.0 s"],"a":2,"x":"t = k²S² ÷ I² (Regulation 434.5.2)<br>k × S = 115 × 2.5 = 287.5<br>287.5² = 82 656<br>500² = 250 000<br>82 656 ÷ 250 000 = 0.33 s.","r":"434.5.2 (page 92 of the 2018 book)","n":"","k":4406,"m":"","f":"Index: 'fault current, protection against'. Go to Regulation 434.5.2 for t = k²S²/I²; k comes from Table 43.1 (given here as 115).","w":{"0":"0.17 s is about half the right answer; check you squared k × S correctly.","1":"0.58 s doesn't come from k²S²/I²; recheck the squaring of 287.5 and 500.","3":"3.0 s is far too long; check you squared I (500² = 250 000)."}},{"id":"b2.03.13","t":"5","c":0,"q":"For a TN or TT installation fed from multiple sources, how shall the system be earthed to minimise electromagnetic disturbances?","o":["At one point only","At the star point of every source","At each distribution board","At every source and at the main earthing terminal"],"a":0,"x":"Regulation 444.4.6: for TN or TT multiple-source supplies the system shall be earthed at one point only, so neutral current does not flow through the protective conductor.","r":"444.4.6 (page 112 of the 2018 book)","n":"","k":5269,"m":"","f":"Index: 'electromagnetic disturbances' or 'multiple sources'. Go to Section 444, Regulation 444.4.6, for TN/TT multiple-source supplies.","w":{"1":"Earthing every star point lets neutral current flow in protective conductors, which 444.4.6 aims to prevent.","2":"Earthing at each board creates multiple earth points; 444.4.6 requires one point only.","3":"Multiple earth points are what 444.4.6 avoids; earth at one point only."}},{"id":"b3.03.14","t":"5","c":0,"q":"Where switchgear is installed inside a location with BE2 conditions in the presence of non-conductive dust, what minimum degree of protection must its enclosure provide if it is not otherwise suitable for the location?","o":["IP4X","IP3X","IP6X","IP5X"],"a":3,"x":"Regulation 422.3.3(ii): at least IP4X, or IP5X in the presence of dust, or IP6X in the presence of electrically conductive dust.","r":"422.3.3 (page 82 of the 2018 book)","n":"","k":3928,"m":"","f":"Index: 'fire, protection against'. Go to Section 422, Regulation 422.3.3, and read the IP codes for normal, dusty and conductive-dust conditions.","w":{"0":"IP4X is the basic requirement; with dust present 422.3.3 asks for IP5X.","1":"IP3X isn't listed in 422.3.3; the minimum there is IP4X.","2":"IP6X is for electrically conductive dust; this dust is non-conductive."}},{"id":"b3.03.15","t":"5","c":0,"q":"According to Table 42.1, what is the maximum temperature for a non-metallic accessible part of fixed equipment that is intended to be touched but not hand-held?","o":["65 °C","80 °C","70 °C","90 °C"],"a":1,"x":"Table 42.1: a part intended to be touched but not hand-held is limited to 70 °C if metallic and 80 °C if non-metallic.","r":"423.1 (page 85 of the 2018 book)","n":"","k":4071,"m":"","f":"Index: 'thermal effects' or 'burns'. Go to Section 423, Table 42.1, row 'touched but not hand-held', non-metallic column.","w":{"0":"65 °C is the non-metallic hand-held limit.","2":"70 °C is the metallic figure for this row; non-metallic is 80 °C.","3":"90 °C is the non-metallic limit for parts not needing to be touched."}},{"id":"b3.03.16","t":"5","c":1,"q":"A direct buried cable has a tabulated current-carrying capacity (Iz), based on 20 °C ambient, of 40 A. Under Regulation 433.1.203, what is the maximum rated current of the protective device?","o":["36 A","29 A","40 A","44.4 A"],"a":0,"x":"Regulation 433.1.203: In must not exceed 0.9 × Iz for direct buried cables or cables in buried ducts.<br>0.9 × 40 = 36<br>Maximum In = 36 A.","r":"433.1.203 (page 89 of the 2018 book)","n":"","k":4254,"m":"","f":"Index: 'buried cables' or 'overload protection'. Go to Regulation 433.1.203: In ≤ 0.9 × Iz for direct buried cables. Multiply Iz by 0.9.","w":{"1":"You multiplied by 0.725 (the BS 3036 factor), not 0.9.","2":"In can't equal Iz for buried cables; 433.1.203 limits it to 0.9 × Iz.","3":"You divided by 0.9 instead of multiplying."}},{"id":"b3.03.17","t":"5","c":0,"q":"Overload protection may be omitted for safety reasons where unexpected disconnection could cause danger. Which of the following is given as an example in Regulation 433.3.3?","o":["A ring final circuit supplying socket-outlets","A cooker circuit in a dwelling","The supply circuit of a lifting magnet","A lighting circuit in an escape route"],"a":2,"x":"Regulation 433.3.3 examples include the exciter circuit of a rotating machine, the supply circuit of a lifting magnet, the secondary of a CT, and fire extinguishing and safety service circuits.","r":"433.3.3 (page 90 of the 2018 book)","n":"","k":4310,"m":"","f":"Index: 'overload protection, omission of'. Go to Regulation 433.3.3 in Chapter 43 and read the list of examples.","w":{"0":"A ring final circuit isn't a safety-reason example; it needs overload protection (433.1.204).","1":"A cooker circuit isn't listed in 433.3.3; disconnecting it causes no danger.","3":"An escape-route lighting circuit isn't one of the examples listed in 433.3.3."}},{"id":"b3.03.18","t":"5","c":0,"q":"Where more than two conductors in parallel cannot be relied on to be protected by a single fault current device, where must fault current protective devices be provided?","o":["At the supply end of each parallel conductor only","At the supply and load ends of each parallel conductor","At the load end of each parallel conductor only","At the origin of the installation only"],"a":1,"x":"Regulation 434.4(iii): for more than two conductors in parallel, a fault current protective device shall be provided at the supply and load ends of each parallel conductor; for two conductors, at the supply end only.","r":"434.4 (page 92 of the 2018 book)","n":"","k":4386,"m":"","f":"Index: 'parallel conductors'. Go to Regulation 434.4 and compare the two-conductor and more-than-two-conductor cases.","w":{"0":"Supply end only is the rule for two conductors in parallel, not more than two.","2":"Load end only isn't an option; for more than two, both ends are needed.","3":"A device at the origin alone is exactly the single device that can't be relied on here."}},{"id":"b3.03.19","t":"5","c":1,"q":"A fault current of 2500 A is cleared in 0.1 s. The cable is copper with 90 °C thermosetting insulation. Using k from Table 43.1, what is the minimum standard conductor size by the adiabatic equation?","o":["4 mm²","10 mm²","16 mm²","6 mm²"],"a":3,"x":"Table 43.1: copper, 90 °C thermosetting, k = 143.<br>S = I × √t ÷ k<br>√0.1 = 0.316<br>2500 × 0.316 = 790.6<br>790.6 ÷ 143 = 5.53 mm² → next standard size 6 mm².","r":"Table 43.1 (page 93 of the 2018 book)","n":"","k":4433,"m":"","f":"Index: 'fault current, protection against'. Take k from Table 43.1 (copper, 90 °C thermosetting), then S = I√t ÷ k (434.5.2) and round up to a standard size.","w":{"0":"4 mm² is smaller than the 5.53 mm² calculated; always round up.","1":"10 mm² is bigger than needed; 6 mm² is the next size above 5.53 mm².","2":"16 mm² is well above the next standard size; check k = 143 and √0.1."}},{"id":"b3.03.20","t":"5","c":1,"q":"An earth fault in the high voltage system is disconnected in 5 s or less. Using Table 44.2, what is the permissible power frequency stress voltage on equipment in a low voltage installation where U0 = 230 V?","o":["480 V","1200 V","1430 V","1660 V"],"a":2,"x":"Table 44.2: for t ≤ 5 s the permissible stress voltage is U0 + 1200 V (U0 + 250 V for t > 5 s).<br>230 + 1200 = 1430 V.","r":"442.2.2 (page 99 of the 2018 book)","n":"","k":4724,"m":"","f":"Index: 'stress voltage' or 'overvoltage'. Go to Section 442, Table 44.2, row t ≤ 5 s, and add the figure to U0.","w":{"0":"480 V is U0 + 250 V, the row for faults lasting longer than 5 s.","1":"1200 V is only the added part; the table says U0 + 1200 V.","3":"You added U0 twice; it's 230 + 1200 = 1430 V."}},{"id":"b4.03.21","t":"5","c":0,"q":"In locations where particular risks of fire exist (Section 422), how must a temperature cut-out device be reset?","o":["By manual reset only","Automatically after the equipment has cooled","By remote reset from the distribution board","Automatically after a time delay"],"a":0,"x":"Regulation 422.1.3: a temperature cut-out device shall have manual reset only.","r":"422.1.3 (page 81 of the 2018 book)","n":"","k":3859,"m":"","f":"Index: 'temperature cut-out'. Go to Section 422, Regulation 422.1.3.","w":{"1":"Automatic reset is what 422.1.3 rules out; it must be manual reset only.","2":"Remote reset isn't permitted; 422.1.3 requires manual reset only.","3":"Any automatic reset, delayed or not, is excluded; manual reset only."}},{"id":"b4.03.22","t":"5","c":0,"q":"In a CA2 location, prefabricated hollow walls contain a pre-installed wiring system. Where the wall is liable to be drilled during erection, what minimum degree of protection must boxes and enclosures have?","o":["IP2X","IP4X","IP5X","IP3X"],"a":3,"x":"Regulation 422.4.1: all boxes and enclosures shall have a degree of protection of at least IP3X where the wall is liable to be drilled during erection.","r":"422.4.1 (page 84 of the 2018 book)","n":"","k":4005,"m":"","f":"Index: 'prefabricated hollow walls' or 'combustible constructional materials'. Go to Regulation 422.4.1 in Section 422.","w":{"0":"IP2X is too low; 422.4.1 requires at least IP3X where drilling is likely.","1":"IP4X is the 422.3 (BE2) enclosure figure, not the CA2 hollow-wall one.","2":"IP5X is the dusty-location figure from 422.3.3, not 422.4.1."}},{"id":"b4.03.23","t":"5","c":1,"q":"A 30 A semi-enclosed fuse to BS 3036 provides overload protection. What is the minimum current-carrying capacity (Iz) of the cable to satisfy Regulation 433.1.202?","o":["21.8 A","41.4 A","30 A","43.5 A"],"a":1,"x":"Regulation 433.1.202: In ≤ 0.725 × Iz, so Iz ≥ In ÷ 0.725.<br>30 ÷ 0.725 = 41.38<br>Minimum Iz = 41.4 A.","r":"433.1.202 (page 89 of the 2018 book)","n":"","k":4250,"m":"","f":"Index: 'semi-enclosed fuses' or 'overload protection'. Go to Regulation 433.1.202: In ≤ 0.725 × Iz, so Iz ≥ In ÷ 0.725.","w":{"0":"You multiplied by 0.725 instead of dividing; Iz must be larger than In.","2":"Iz equal to In ignores the 0.725 factor required for BS 3036 fuses.","3":"You used 1.45 (30 × 1.45); the BS 3036 rule is In ÷ 0.725."}},{"id":"b4.03.24","t":"5","c":0,"q":"An overload protective device may be installed along the run of a conductor after a reduction in current-carrying capacity, with no branch circuits or outlets in between. If that part is not protected against fault current under Section 434, what maximum length is permitted?","o":["3 m","1 m","5 m","10 m"],"a":0,"x":"Regulation 433.2.2(ii): the length must not exceed 3 m, installed to reduce the risk of fault and of fire or danger to persons to a minimum.","r":"433.2.2 (page 90 of the 2018 book)","n":"","k":4277,"m":"","f":"Index: 'overload protective devices, position of'. Go to Regulation 433.2.2, item (ii).","w":{"1":"1 m isn't the figure in 433.2.2; the permitted length is 3 m.","2":"5 m exceeds the 3 m limit in 433.2.2(ii).","3":"10 m is far beyond the 3 m limit in 433.2.2(ii)."}},{"id":"b4.03.25","t":"5","c":1,"q":"Two identical cables, each with a current-carrying capacity of 76 A, are connected in parallel and share current equally. They are protected by a single device. What value of Iz is used in Regulation 433.1.1?","o":["38 A","76 A","152 A","110.2 A"],"a":2,"x":"Regulation 433.4.1: with equal current sharing, Iz is the sum of the current-carrying capacities of the parallel conductors.<br>76 + 76 = 152 A.","r":"433.4.1 (page 91 of the 2018 book)","n":"","k":4326,"m":"","f":"Index: 'parallel conductors'. Go to Regulation 433.4.1: with equal sharing, Iz is the sum of the conductors' capacities.","w":{"0":"You halved it; parallel capacities add together.","1":"That's one cable only; with equal sharing both capacities add.","3":"You applied 1.45 to one cable; 433.4.1 just sums the Iz values."}},{"id":"b4.03.26","t":"5","c":1,"q":"For a fault of very short duration (less than 0.1 s) with a current-limiting device, k²S² must be greater than the let-through energy (I²t). What is k²S² for a 1.5 mm² copper conductor with 70 °C thermoplastic insulation (k = 115)?","o":["172.5 A²s","29 756 A²s","19 838 A²s","44 634 A²s"],"a":1,"x":"Regulation 434.5.2, k = 115 from Table 43.1.<br>k² = 115 × 115 = 13 225<br>S² = 1.5 × 1.5 = 2.25<br>13 225 × 2.25 = 29 756 A²s.","r":"434.5.2 (page 92 of the 2018 book)","n":"","k":4400,"m":"","f":"Index: 'fault current, protection against'. Go to Regulation 434.5.2 (k²S² ≥ I²t), with k from Table 43.1. Square k and S, then multiply.","w":{"0":"That's k × S (115 × 1.5) with nothing squared.","2":"You used S = 1.5 instead of S² = 2.25.","3":"You squared 1.5 twice or miscalculated; k² × S² = 13 225 × 2.25."}},{"id":"b4.03.27","t":"5","c":0,"q":"Where screened signal cables are common to several buildings supplied from an installation forming part of a TT system, what is the minimum cross-sectional area of a copper bypass bonding conductor (supply live conductors not exceeding 35 mm²)?","o":["6 mm²","10 mm²","25 mm²","16 mm²"],"a":3,"x":"Regulation 444.4.4: the bypass conductor shall have a minimum cross-sectional area of 16 mm² copper or equivalent; above 35 mm² live conductors, Table 54.8 applies.","r":"444.4.4 (page 111 of the 2018 book)","n":"","k":5242,"m":"","f":"Index: 'bypass conductor' or 'electromagnetic disturbances'. Go to Section 444, Regulation 444.4.4.","w":{"0":"6 mm² is a common bonding minimum, not the 444.4.4 bypass conductor size.","1":"10 mm² is the Table 54.8 PME bonding minimum, not 444.4.4.","2":"25 mm² is too large; 444.4.4 sets 16 mm² for live conductors up to 35 mm²."}},{"id":"b5.03.28","t":"5","c":0,"q":"Where must the overload and fault current protective devices be located for circuits supplying or traversing a location where BE2 conditions exist?","o":["Inside the location at the point of entry","At the load end of each circuit within the location","Outside and on the supply side of the location","Anywhere, provided they are enclosed to IP4X"],"a":2,"x":"Regulation 422.3.10: such circuits shall be protected against overload and fault current by devices located outside and on the supply side of these locations.","r":"422.3.10 (page 83 of the 2018 book)","n":"","k":3975,"m":"","f":"Index: 'fire, protection against'. Go to Section 422, Regulation 422.3.10, on where to place overcurrent devices.","w":{"0":"Devices inside the location are what 422.3.10 avoids; they go outside it.","1":"Load-end devices inside the location aren't allowed; place them outside, supply side.","3":"IP4X relates to enclosures in 422.3.3, not device location."}},{"id":"b5.03.29","t":"5","c":0,"q":"In locations of national, commercial, industrial or public significance, cables may be installed in areas with fire-resisting partitions. What fire-resisting time is given for locations housing staircases needed for emergency escape?","o":["90 minutes","30 minutes","60 minutes","120 minutes"],"a":0,"x":"Regulation 422.6(iv): partitions with a fire-resisting capability of 30 minutes or 90 minutes, the latter in locations housing staircases needed for emergency escape.","r":"422.6 (page 85 of the 2018 book)","n":"","k":4055,"m":"","f":"Index: 'fire, protection against' or 'national significance'. Go to Regulation 422.6, item (iv).","w":{"1":"30 minutes is the general figure; escape staircases need 90 minutes.","2":"60 minutes isn't given in 422.6; it's 30 or 90 minutes.","3":"120 minutes isn't given in 422.6; escape staircases need 90 minutes."}},{"id":"b5.03.30","t":"5","c":1,"q":"In an IT system the neutral is distributed and the circuit is protected by an RCD instead of neutral overcurrent detection. The neutral has a current-carrying capacity of 35 A. What is the maximum rated residual operating current of the RCD?","o":["1.75 A","17.5 A","35 A","7 A"],"a":3,"x":"Regulation 431.2.2(iii): IΔn must not exceed 0.2 × the current-carrying capacity of the neutral.<br>0.2 × 35 = 7<br>Maximum IΔn = 7 A.","r":"431.2.2 (page 88 of the 2018 book)","n":"","k":4187,"m":"","f":"Index: 'neutral conductor, protection of' or 'IT system'. Go to Regulation 431.2.2(iii): IΔn ≤ 0.2 × neutral Iz.","w":{"0":"You used 0.05 instead of 0.2.","1":"You used 0.5 instead of 0.2.","2":"IΔn can't equal the neutral's Iz; 431.2.2 limits it to 0.2 × Iz."}},{"id":"b5.03.31","t":"5","c":0,"q":"For which of the following protective devices does compliance with conditions (i) and (ii) of Regulation 433.1.1 NOT automatically result in compliance with condition (iii)?","o":["gG fuse to BS 88-2","Semi-enclosed fuse to BS 3036","Circuit-breaker to BS EN 60898","RCBO to BS EN 61009-1"],"a":1,"x":"Regulation 433.1.201 lists BS 88-2 gG, BS 88-3, BS EN 60898, BS EN 60947-2 and BS EN 61009-1 RCBOs. BS 3036 fuses are dealt with by the 0.725 factor in Regulation 433.1.202.","r":"433.1.201 (page 89 of the 2018 book)","n":"","k":4244,"m":"","f":"Index: 'overload protection'. Go to Regulation 433.1.201 for the devices where (i) and (ii) give (iii) automatically, then 433.1.202 for BS 3036.","w":{"0":"BS 88-2 gG fuses are listed in 433.1.201, so they comply automatically.","2":"BS EN 60898 circuit-breakers are listed in 433.1.201.","3":"BS EN 61009-1 RCBOs are listed in 433.1.201."}},{"id":"b5.03.32","t":"5","c":1,"q":"A fault current of 2000 A is cleared in 0.2 s on an aluminium conductor with 70 °C thermoplastic insulation (300 mm² or less). Using k from Table 43.1, what is the minimum standard conductor size?","o":["16 mm²","10 mm²","25 mm²","35 mm²"],"a":0,"x":"Table 43.1: aluminium, 70 °C thermoplastic, k = 76.<br>S = I × √t ÷ k<br>√0.2 = 0.447<br>2000 × 0.447 = 894.4<br>894.4 ÷ 76 = 11.77 mm² → next standard size 16 mm².","r":"Table 43.1 (page 93 of the 2018 book)","n":"","k":4435,"m":"","f":"Index: 'fault current, protection against'. Take k from Table 43.1 (aluminium, 70 °C thermoplastic), then S = I√t ÷ k (434.5.2) and round up.","w":{"1":"10 mm² is below the 11.77 mm² calculated; always round up.","2":"25 mm² is larger than the next standard size; check k = 76.","3":"35 mm² is far too big; check √0.2 and k = 76."}},{"id":"b5.03.33","t":"5","c":0,"q":"Under Section 436, conductors are considered protected against both overload and fault current where they are supplied from a source incapable of supplying a current exceeding their current-carrying capacity. Which is given as an example of such a source?","o":["A distribution network transformer","A standby diesel generator","Certain bell transformers","A battery inverter for a UPS"],"a":2,"x":"Section 436 gives the examples of certain bell transformers, certain welding transformers and certain types of thermoelectric generating set.","r":"436 (page 94 of the 2018 book)","n":"","k":4474,"m":"","f":"Index: 'overload protection, omission of' or 'source incapable'. Go to Section 436 and read the examples.","w":{"0":"A distribution transformer can supply very high fault currents, so it isn't an example.","1":"A standby generator isn't listed; Section 436 names bell and welding transformers and thermoelectric sets.","3":"A UPS inverter isn't one of the Section 436 examples."}},{"id":"b5.03.34","t":"5","c":1,"q":"If the neutral conductor of a three-phase TN or TT system is interrupted, insulation rated for line-to-neutral voltage can be stressed with up to √3 × U0. What is this stress voltage where U0 = 230 V?","o":["333.5 V","398 V","460 V","480 V"],"a":1,"x":"Regulation 442.3: the stress voltage can reach U = √3 × U0.<br>√3 = 1.732<br>1.732 × 230 = 398 V.","r":"442.3 (page 99 of the 2018 book)","n":"","k":4749,"m":"","f":"Index: 'overvoltage' or 'loss of neutral'. Go to Regulation 442.3 and multiply U0 by √3 (1.732).","w":{"0":"You multiplied by 1.45 instead of √3.","2":"You doubled U0; the multiplier is √3, not 2.","3":"480 V is U0 + 250 V from Table 44.2, not √3 × U0."}},{"id":"b1.04.00","t":"7","c":0,"q":"Unless the equipment manufacturer confirms suitability, switchgear, protective devices and accessories shall not be connected to conductors intended to operate in normal service at a temperature exceeding:","o":["70 °C","60 °C","90 °C","105 °C"],"a":0,"x":"Regulation 512.1.5: equipment shall not be connected to conductors intended to operate above 70 °C unless the manufacturer confirms suitability, or the conductor is sized on 70 °C cable ratings.","r":"512.1.5 (page 128 of the 2018 book)","n":"","k":5924,"m":"","f":"Index: 'conductors, operating temperature' or 'compatibility'. Go to Chapter 51, Regulation 512.1.5.","w":{"1":"60 °C isn't the 512.1.5 limit; it's 70 °C.","2":"90 °C is the thermosetting cable rating, which 512.1.5 says needs manufacturer confirmation.","3":"105 °C isn't the 512.1.5 limit; it's 70 °C."}},{"id":"b2.04.01","t":"7","c":0,"q":"For the purposes of BS 7671, which class of ambient temperature (AA) is conventionally regarded as normal?","o":["AA1","AA5","AA4","AA6"],"a":2,"x":"The NOTE to Regulation 512.2.4 lists AA4 as the normal ambient temperature class (with AB4 for atmospheric humidity and XX1 for most other parameters).","r":"512.2.4 (page 128 of the 2018 book)","n":"","k":5962,"m":"","f":"Index: 'external influences'. Go to Regulation 512.2.4 and read the NOTE listing the normal classes.","w":{"0":"AA1 is a very cold class, not the normal one.","1":"AA5 isn't the normal class; the NOTE gives AA4.","3":"AA6 is a very hot class, not the normal one."}},{"id":"b3.04.02","t":"7","c":0,"q":"In the green-and-yellow bi-colour combination used to identify a protective conductor, one of the colours shall cover:","o":["at least 15 % and at most 85 % of the surface","at least 30 % and at most 70 % of the surface","at least 40 % and at most 60 % of the surface","exactly 50 % of the surface"],"a":1,"x":"Regulation 514.4.2: one colour shall cover at least 30 % and at most 70 % of the surface, the other colour covering the remainder.","r":"514.4.2 (page 129 of the 2018 book)","n":"","k":5999,"m":"","f":"Index: 'identification, protective conductors' or 'green-and-yellow'. Go to Section 514, Regulation 514.4.2.","w":{"0":"15–85 % isn't the 514.4.2 range; it's 30–70 %.","2":"40–60 % is too narrow; 514.4.2 allows 30–70 %.","3":"An exact 50/50 split isn't required; 30–70 % is permitted."}},{"id":"b4.04.03","t":"7","c":0,"q":"Where a bare busbar used as a protective conductor needs identification by equal green-and-yellow stripes, each stripe shall be:","o":["not less than 10 mm and not more than 50 mm wide","not less than 25 mm and not more than 150 mm wide","not less than 5 mm and not more than 15 mm wide","not less than 15 mm and not more than 100 mm wide"],"a":3,"x":"Regulation 514.4.2: equal green-and-yellow stripes, each not less than 15 mm and not more than 100 mm wide, close together.","r":"514.4.2 (page 129 of the 2018 book)","n":"","k":6005,"m":"","f":"Index: 'identification, protective conductors' or 'busbars'. Go to Regulation 514.4.2 and read the stripe widths.","w":{"0":"10–50 mm isn't the 514.4.2 range; it's 15–100 mm.","1":"25–150 mm isn't the 514.4.2 range; it's 15–100 mm.","2":"5–15 mm is too narrow; stripes must be 15–100 mm."}},{"id":"b5.04.04","t":"7","c":0,"q":"An insulated PEN conductor may be identified by being:","o":["blue throughout its length with brown markings at the terminations","green-and-yellow throughout its length with no further marking","black throughout its length with green-and-yellow sleeving at the terminations","green-and-yellow throughout its length with blue markings at the terminations"],"a":3,"x":"Regulation 514.4.3: green-and-yellow throughout with blue markings at the terminations, or blue throughout with green-and-yellow markings at the terminations.","r":"514.4.3 (page 129 of the 2018 book)","n":"","k":6008,"m":"","f":"Index: 'PEN conductor, identification'. Go to Section 514, Regulation 514.4.3.","w":{"0":"Brown marks a line conductor; a blue PEN needs green-and-yellow marks.","1":"Green-and-yellow alone shows a protective conductor; a PEN also needs blue at the ends.","2":"Black isn't a permitted PEN colour; 514.4.3 uses green-and-yellow or blue."}},{"id":"b1.04.05","t":"7","c":0,"q":"When conductors are identified by numbers, which unattached numerals shall be underlined to avoid confusion?","o":["0 and 8","6 and 9","1 and 7","2 and 5"],"a":1,"x":"Regulation 514.5.1: to avoid confusion, unattached numerals 6 and 9 shall be underlined.","r":"514.5.1 (page 130 of the 2018 book)","n":"","k":6026,"m":"","f":"Index: 'identification by numbers' or 'numerals'. Go to Regulation 514.5.1.","w":{"0":"0 and 8 aren't named; 514.5.1 underlines 6 and 9.","2":"1 and 7 aren't named; 514.5.1 underlines 6 and 9.","3":"2 and 5 aren't named; 514.5.1 underlines 6 and 9."}},{"id":"b2.04.06","t":"7","c":0,"q":"According to Table 51, what colour identifies the negative conductor of a two-wire unearthed DC power circuit?","o":["Grey","Blue","Black","Brown"],"a":0,"x":"Table 51, two-wire unearthed DC power circuit: positive (L+) brown, negative (L−) grey. Blue is used for the earthed conductor (M) of an earthed DC circuit.","r":"Table 51 (page 131 of the 2018 book)","n":"","k":6046,"m":"","f":"Index: 'identification, colour'. Go to Table 51, DC power circuits, two-wire unearthed, L− row.","w":{"1":"Blue is for the earthed mid-wire (M) of a DC circuit, not L− of an unearthed circuit.","2":"Black isn't the L− colour for a two-wire unearthed DC circuit in Table 51.","3":"Brown is the positive (L+), not the negative."}},{"id":"b3.04.07","t":"7","c":0,"q":"According to Table 51, Line 3 (L3) of a three-phase AC power circuit is identified by the colour:","o":["black","brown","grey","blue"],"a":2,"x":"Table 51: L1 brown, L2 black, L3 grey, neutral blue.","r":"Table 51 (page 131 of the 2018 book)","n":"","k":6052,"m":"","f":"Index: 'identification, colour'. Go to Table 51, three-phase AC power circuit rows.","w":{"0":"Black is L2.","1":"Brown is L1.","3":"Blue is the neutral."}},{"id":"b4.04.08","t":"7","c":0,"q":"A warning of the maximum voltage present must be clearly visible before access is gained to live parts in equipment or an enclosure where the nominal voltage to earth exceeds:","o":["50 V AC in any location","400 V between lines in any location","230 V and such a voltage would not normally be expected","120 V DC and such a voltage would not normally be expected"],"a":2,"x":"Regulation 514.10.1: where a nominal voltage exceeding 230 V to earth exists and its presence would not normally be expected, a warning of the maximum voltage to earth must be visible before access to a live part.","r":"514.10.1 (page 132 of the 2018 book)","n":"","k":6097,"m":"","f":"Index: 'warning notices, voltage'. Go to Section 514, Regulation 514.10.1.","w":{"0":"50 V AC is the ELV limit, not the 514.10.1 warning threshold.","1":"400 V between lines in any location isn't the condition; it's over 230 V to earth where not expected.","3":"120 V DC is the ELV DC limit, not the 514.10.1 threshold."}},{"id":"b5.04.09","t":"7","c":0,"q":"The durable label to BS 951 fixed at the point of connection of a bonding conductor to an extraneous-conductive-part must carry the words:","o":["Safety Electrical Connection - Do Not Remove","Danger - Earth Connection - Do Not Disturb","Main Protective Bonding - Do Not Disconnect","Caution - Earthing Conductor - Isolate Before Removal"],"a":0,"x":"Regulation 514.13.1 requires a BS 951 label reading 'Safety Electrical Connection - Do Not Remove' at earth electrode connections, bonding connections to extraneous-conductive-parts and a separate main earthing terminal.","r":"514.13.1 (page 133 of the 2018 book)","n":"","k":6130,"m":"","f":"Index: 'warning notices, earthing and bonding'. Go to Regulation 514.13.1 for the BS 951 label wording.","w":{"1":"Not the required wording; BS 951 labels read 'Safety Electrical Connection - Do Not Remove'.","2":"Not the required wording; see 514.13.1.","3":"Not the required wording; see 514.13.1."}},{"id":"b1.04.10","t":"7","c":0,"q":"Single-core cables armoured with steel wire or steel tape:","o":["may be used for an AC circuit only if the armour is bonded at one end","may be used for an AC circuit only where the csa exceeds 50 mm²","may be used for an AC circuit only when installed in trefoil","shall not be used for an AC circuit"],"a":3,"x":"Regulation 521.5.2: single-core cables with steel wire or steel tape armour shall not be used for an AC circuit, as the steel armour acts as a ferromagnetic enclosure. Aluminium armour may be considered.","r":"521.5.2 (page 137 of the 2018 book)","n":"","k":6282,"m":"","f":"Index: 'single-core cables, armoured' or 'electromagnetic effects'. Go to Section 521, Regulation 521.5.2.","w":{"0":"Bonding the armour doesn't help; steel-armoured single-core cables aren't allowed on AC at all.","1":"No size exemption exists in 521.5.2; they shall not be used for AC.","2":"Trefoil doesn't make steel armour acceptable; 521.5.2 bans it for AC."}},{"id":"b2.04.11","t":"7","c":0,"q":"Non-sheathed cables may be installed in a cable trunking system without further enclosure provided the trunking gives at least which degree of protection, with a cover removable only by a tool or deliberate action?","o":["IPXXB or IP2X","IPXXD or IP4X","IP33","IPX4"],"a":1,"x":"Regulation 521.10.1: non-sheathed cables are permitted if the trunking provides at least IPXXD or IP4X and the cover can only be removed by a tool or deliberate action.","r":"521.10.1 (page 137 of the 2018 book)","n":"","k":6319,"m":"","f":"Index: 'non-sheathed cables' or 'trunking'. Go to Regulation 521.10.1.","w":{"0":"IPXXB/IP2X is too low; 521.10.1 needs IPXXD or IP4X.","2":"IP33 is the 527.2.3 fire-sealing test, not the trunking requirement.","3":"IPX4 is about splashing water, not finger/wire access; 521.10.1 needs IPXXD or IP4X."}},{"id":"b3.04.12","t":"7","c":0,"q":"To prevent premature collapse of wiring systems in a fire (Regulation 521.10.202), which of the following would NOT be acceptable as the sole means of support for cables clipped direct to a ceiling?","o":["Suitably spaced steel clips","Non-metallic cable clips","Copper saddles","Steel cable tray"],"a":1,"x":"Regulation 521.10.202 Note 3 precludes non-metallic cable clips or ties as the sole means of support; Notes 2 and 4 accept steel containment and steel or copper clips, saddles or ties.","r":"521.10.202 (page 138 of the 2018 book)","n":"","k":6327,"m":"","f":"Index: 'wiring systems, premature collapse'. Go to Regulation 521.10.202 and read its Notes.","w":{"0":"Steel clips are accepted by the Notes to 521.10.202.","2":"Copper saddles are accepted by the Notes to 521.10.202.","3":"Steel cable tray is accepted as steel containment."}},{"id":"b4.04.13","t":"7","c":0,"q":"A cable passing through a floor joist under floorboards, not otherwise protected per 522.6.204, must be installed at least what distance measured vertically from the top or bottom of the joist?","o":["25 mm","75 mm","100 mm","50 mm"],"a":3,"x":"Regulation 522.6.201(i): at least 50 mm measured vertically from the top, or bottom as appropriate, of the joist or batten.","r":"522.6.201 (page 139 of the 2018 book)","n":"","k":6409,"m":"","f":"Index: 'cables, under floors' or 'joists'. Go to Regulation 522.6.201.","w":{"0":"25 mm is too shallow; 522.6.201 requires 50 mm.","1":"75 mm isn't the 522.6.201 figure; it's 50 mm.","2":"100 mm isn't the 522.6.201 figure; it's 50 mm."}},{"id":"b5.04.14","t":"7","c":0,"q":"A cable buried less than 50 mm deep in a wall, without earthed metallic covering or mechanical protection, may run horizontally in a zone within what distance of the top of the wall?","o":["150 mm","50 mm","100 mm","300 mm"],"a":0,"x":"Regulation 522.6.202(i): zones within 150 mm from the top of the wall or partition, or within 150 mm of an angle formed by two adjoining walls. RCD additional protection is also required.","r":"522.6.202 (page 139 of the 2018 book)","n":"","k":6414,"m":"","f":"Index: 'cables, concealed in walls' or 'safe zones'. Go to Regulation 522.6.202, item (i).","w":{"1":"50 mm is the burial depth trigger, not the zone width.","2":"100 mm isn't the zone width; 522.6.202 uses 150 mm.","3":"300 mm is too wide; the zone is 150 mm."}},{"id":"b1.04.15","t":"7","c":0,"q":"A cable concealed in a partition whose internal construction includes metallic parts (other than nails, screws and similar fixings) and that does not comply with 522.6.204 shall be provided with additional protection by an RCD:","o":["only if it is less than 50 mm from the surface","only if it is outside the prescribed zones","irrespective of its buried depth","only if the partition is more than 100 mm thick"],"a":2,"x":"Regulation 522.6.203: irrespective of its buried depth, such a cable shall have RCD additional protection to 415.1.1 or comply with 522.6.204.","r":"522.6.203 (page 140 of the 2018 book)","n":"","k":6425,"m":"","f":"Index: 'cables, concealed in walls'. Go to Regulation 522.6.203 for partitions with metallic parts.","w":{"0":"Depth doesn't matter here; 522.6.203 applies irrespective of buried depth.","1":"Zones don't help in metal-framed partitions; RCD protection applies regardless.","3":"Partition thickness isn't a condition in 522.6.203."}},{"id":"b2.04.16","t":"7","c":0,"q":"Under Regulation 522.8.10, the location of a cable buried directly in the ground shall be marked by:","o":["cable covers or a suitable marker tape","a painted line on the ground surface","a warning notice at the origin of the installation","a record on the electrical installation certificate only"],"a":0,"x":"Regulation 522.8.10: the location of buried cables shall be marked by cable covers or a suitable marker tape, and the cable shall incorporate an earthed armour or metal sheath unless in a conduit or duct giving equivalent protection.","r":"522.8.10 (page 141 of the 2018 book)","n":"","k":6475,"m":"","f":"Index: 'buried cables' or 'underground cables'. Go to Regulation 522.8.10.","w":{"1":"A painted surface line isn't what 522.8.10 requires; use cable covers or marker tape.","2":"A notice at the origin isn't the 522.8.10 requirement.","3":"A certificate record alone doesn't mark the cable route."}},{"id":"b3.04.17","t":"7","c":0,"q":"According to Table 52.1, the maximum operating temperature for a bare mineral insulated cable not exposed to touch and not in contact with combustible material is:","o":["70 °C at the sheath","105 °C at the sheath","90 °C at the conductor","70 °C at the conductor"],"a":1,"x":"Table 52.1: mineral (bare, not exposed to touch and not in contact with combustible material) 105 °C at the sheath. Thermoplastic covered or bare exposed to touch is 70 °C at the sheath.","r":"Table 52.1 (page 142 of the 2018 book)","n":"","k":6535,"m":"","f":"Index: 'operating temperature' or 'cable insulation'. Go to Section 523, Table 52.1, mineral rows.","w":{"0":"70 °C at the sheath applies to MI that's PVC-covered or bare and exposed to touch.","2":"90 °C at the conductor is the thermosetting figure.","3":"70 °C at the conductor is the thermoplastic figure."}},{"id":"b4.04.18","t":"7","c":0,"q":"When determining the group rating factor, a cable in the group may be ignored if, due to known operating conditions, it is expected to carry a current not greater than what percentage of its grouped current-carrying capacity?","o":["15 %","50 %","30 %","70 %"],"a":2,"x":"Regulation 523.5: a cable expected to carry not more than 30 % of its grouped current-carrying capacity may be ignored for the purpose of obtaining the rating factor for the rest of the group.","r":"523.5 (page 142 of the 2018 book)","n":"","k":6564,"m":"","f":"Index: 'grouping'. Go to Section 523, Regulation 523.5.","w":{"0":"15 % isn't the 523.5 figure; it's 30 %.","1":"50 % isn't the 523.5 figure; it's 30 %.","3":"70 % isn't the 523.5 figure; it's 30 %."}},{"id":"b5.04.19","t":"7","c":0,"q":"In a three-phase circuit, the neutral conductor shall not be smaller than the line conductors where the total harmonic distortion due to third harmonic current (or multiples) exceeds what percentage of the fundamental line current?","o":["10 %","33 %","45 %","15 %"],"a":3,"x":"Regulation 523.6.3: if the third harmonic THD is greater than 15 % of the fundamental line current, the neutral shall not be smaller than the line conductors.","r":"523.6.3 (page 143 of the 2018 book)","n":"","k":6584,"m":"","f":"Index: 'harmonic currents' or 'neutral conductor, cross-sectional area'. Go to Regulation 523.6.3.","w":{"0":"10 % isn't the 523.6.3 threshold; it's 15 %.","1":"33 % is a harmonic level used in Appendix 4 rating factors, not the 523.6.3 trigger of 15 %.","2":"45 % is a harmonic level from Appendix 4, not the 523.6.3 trigger of 15 %."}},{"id":"b1.04.20","t":"7","c":1,"q":"A single cable with a current-carrying capacity of 27 A clipped direct (Reference Method C) is to be totally surrounded by thermal insulation over a length of 0.6 m. In the absence of more precise information, its current-carrying capacity should be taken as:","o":["17.0 A","21.1 A","13.5 A","23.8 A"],"a":2,"x":"Regulation 523.9: totally surrounded for 0.5 m or more, use 0.5 times the Method C rating.<br>0.6 m is more than 0.5 m, so the factor is 0.5<br>27 × 0.5 = 13.5 A","r":"523.9 (page 143 of the 2018 book)","n":"","k":6618,"m":"","f":"Index: 'thermal insulation, cables in'. Go to Regulation 523.9: totally surrounded for 0.5 m or more, use 0.5 × the Method C rating.","w":{"0":"You used 0.63 (Table 52.2, 200 mm); over 0.5 m the factor is 0.5.","1":"You used 0.78 (Table 52.2, 100 mm); over 0.5 m the factor is 0.5.","3":"You used 0.88 (Table 52.2, 50 mm); over 0.5 m the factor is 0.5."}},{"id":"b2.04.21","t":"7","c":1,"q":"A cable rated at 37 A (Reference Method C) passes through 200 mm of thermal insulation (λ greater than 0.04 W/m·K). Using Table 52.2, its derated current-carrying capacity is approximately:","o":["28.9 A","18.9 A","32.6 A","23.3 A"],"a":3,"x":"Table 52.2: 200 mm in insulation gives a derating factor of 0.63.<br>37 × 0.63 = 23.31 A<br>≈ 23.3 A","r":"Table 52.2 (page 144 of the 2018 book)","n":"","k":6632,"m":"","f":"Index: 'thermal insulation, cables in'. Go to Table 52.2, read the 200 mm factor and multiply the Method C rating by it.","w":{"0":"You used 0.78, the 100 mm factor.","1":"You used 0.51, the 400 mm factor.","2":"You used 0.88, the 50 mm factor."}},{"id":"b3.04.22","t":"7","c":0,"q":"In a polyphase circuit with copper line conductors larger than 16 mm², a reduced neutral is permitted provided, among other conditions, the neutral is a
