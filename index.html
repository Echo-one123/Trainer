pply units, socket-outlets are prohibited within 3 m horizontally of the zone 1 boundary. Page 242.","r":"701.512.3 (page 242 of the 2018 book)","n":"","k":11021,"m":"","f":"Index: 'bath or shower, socket-outlets'. Section 701, Regulation 701.512.3.","w":{"0":"0.6 m is the zone 2 width, not the socket-outlet distance.","1":"2.25 m is the zone 1 height.","2":"3.6 m is not stated; 701.512.3 gives 3 m from the zone 1 boundary."}},{"id":"b5.07.26","t":"12","c":0,"q":"Where it is not possible to locate a socket-outlet outside zone 1 of a swimming pool, a socket-outlet may be installed in zone 1, suitably protected, if it is at least:","o":["1.25 m horizontally from the border of zone 0 and 0.3 m above the floor","2.0 m horizontally from the border of zone 0 and 1.0 m above the floor","1.5 m horizontally from the border of zone 0 and 0.3 m above the floor","1.25 m horizontally from the border of zone 0 and 2.5 m above the floor"],"a":0,"x":"Regulation 702.53: the socket-outlet must be at least 1.25 m horizontally from the border of zone 0 and at least 0.3 m above the floor. It must also be protected by SELV (not more than 25 V AC), ADS with a 30 mA RCD, or electrical separation. Page 248.","r":"702.53 (page 248 of the 2018 book)","n":"","k":11273,"m":"","f":"Index: 'swimming pools, socket-outlets'. Section 702, Regulation 702.53.","w":{"1":"2.0 m is the zone 1 width and 1.0 m is not the height; 702.53 gives 1.25 m and 0.3 m.","2":"1.5 m is the zone 2 width; the socket distance is 1.25 m from zone 0.","3":"The distance is right but 2.5 m is the zone 1 height; the socket needs 0.3 m above the floor."}},{"id":"b5.07.27","t":"12","c":0,"q":"Which of the following statements about a room containing a sauna heater is correct?","o":["Socket-outlets may be installed in zone 2 if protected by a 30 mA RCD","Socket-outlets shall not be installed within the location containing the sauna heater","Lighting switches shall be installed in zone 2","Socket-outlets may be installed in zone 3 if rated IPX5"],"a":1,"x":"Regulation 703.537.5: socket-outlets shall not be installed in the location containing the sauna heater, and switchgear such as lighting switches shall be placed outside the sauna room or cabin. Page 255.","r":"703.537.5 (page 255 of the 2018 book)","n":"","k":11558,"m":"","f":"Index: 'sauna, switchgear'. Section 703, Regulation 703.537.5.","w":{"0":"No socket-outlets are allowed in the sauna location, RCD or not.","2":"Lighting switches must be outside the sauna room or cabin.","3":"No socket-outlets are allowed in any zone of the sauna, whatever the IP rating."}},{"id":"b5.07.28","t":"12","c":0,"q":"Under normal conditions, the minimum degree of protection for electrical equipment in agricultural or horticultural premises is:","o":["IP2X","IP33","IP44","IP65"],"a":2,"x":"Regulation 705.512.2: the minimum is IP44. Where IP44 equipment is not available, it must be placed in an enclosure complying with IP44. Page 259.","r":"705.512.2 (page 259 of the 2018 book)","n":"","k":11755,"m":"","f":"Index: 'agricultural premises, external influences'. Section 705, Regulation 705.512.2.","w":{"0":"IP2X is basic finger protection, not the agricultural minimum.","1":"IP33 is the outdoor lighting figure (714.512.2.105).","3":"IP65 is higher than required; the minimum is IP44."}},{"id":"b5.07.29","t":"12","c":0,"q":"In a marina distribution cabinet, one isolating switching device shall be installed for a maximum of:","o":["two socket-outlets","six socket-outlets","eight socket-outlets","four socket-outlets"],"a":3,"x":"Regulation 709.537.2.1.1: one isolating switching device is required for a maximum of four socket-outlets, and it must disconnect all live conductors including the neutral. Page 272.","r":"709.537.2.1.1 (page 272 of the 2018 book)","n":"","k":12256,"m":"","f":"Index: 'marinas, isolation'. Section 709, Regulation 709.537.2.1.1.","w":{"0":"Two is too few; one isolating switching device may serve up to four socket-outlets.","1":"Six exceeds the 709.537.2.1.1 maximum of four.","2":"Eight exceeds the 709.537.2.1.1 maximum of four."}},{"id":"b1.08.00","t":"12","c":0,"q":"For an outdoor lighting installation, what is the maximum disconnection time that applies to all circuits feeding fixed equipment used in highway power supplies?","o":["0.2 s","0.4 s","1 s","5 s"],"a":3,"x":"Regulation 714.411.202 applies a maximum disconnection time of 5 s to all circuits feeding fixed equipment in highway power supplies, for both TN (411.3.2.3) and TT (411.3.2.4) systems.","r":"714.411.202 (page 292 of the 2018 book)","n":"","k":13236,"m":"","f":"Index: 'outdoor lighting installations'. Section 714, Regulation 714.411.202.","w":{"0":"0.2 s is the TT 230 V figure in Table 41.1, not highway power supplies.","1":"0.4 s is the TN final circuit figure in Table 41.1; 714.411.202 allows 5 s.","2":"1 s is the TT distribution circuit figure, not the 714 rule."}},{"id":"b1.08.01","t":"12","c":0,"q":"In an ELV lighting installation, a device providing protection against the risk of fire must automatically disconnect the supply circuit within what time if a short-circuit or failure causes a power increase of more than 60 W?","o":["0.1 s","0.3 s","0.4 s","5 s"],"a":1,"x":"Regulation 715.422.107.2(ii): the device shall automatically disconnect the supply circuit within 0.3 s in the case of a short-circuit or failure causing a power increase of more than 60 W.","r":"715.422.107.2 (page 294 of the 2018 book)","n":"","k":13327,"m":"","f":"Index: 'extra-low voltage lighting installations'. Section 715, Regulation 715.422.107.2(ii).","w":{"0":"0.1 s is not the figure; 715.422.107.2 gives 0.3 s.","2":"0.4 s is the TN final circuit disconnection time, not the ELV lighting fire device.","3":"5 s is the TN distribution circuit time, far too slow here."}},{"id":"b1.08.02","t":"12","c":0,"q":"A caravan is supplied from a 32 A pitch socket-outlet. Using Table 721, what is the minimum cross-sectional area of the flexible connecting cable?","o":["2.5 mm²","4 mm²","6 mm²","16 mm²"],"a":2,"x":"Table 721, rated current 32 A: minimum cross-sectional area 6 mm². (16 A = 2.5 mm², 25 A = 4 mm², 63 A = 16 mm².)","r":"Table 721 (page 309 of the 2018 book)","n":"","k":14182,"m":"","f":"Index: 'caravans, connecting cable'. Section 721, Table 721, 32 A row.","w":{"0":"2.5 mm² is the 16 A row of Table 721.","1":"4 mm² is the 25 A row of Table 721.","3":"16 mm² is the 63 A row of Table 721."}},{"id":"b1.08.03","t":"12","c":0,"q":"At a fairground, electric dodgems shall only be operated at voltages not exceeding","o":["25 V AC or 60 V DC","50 V AC or 120 V DC","110 V AC or 120 V DC","230 V AC or 440 V DC"],"a":1,"x":"Regulation 740.55.9: electric dodgems shall only be operated at voltages not exceeding 50 V AC or 120 V DC, electrically separated from the mains by a BS EN 61558-2-4 transformer or a motor-generator set.","r":"740.55.9 (page 333 of the 2018 book)","n":"","k":15221,"m":"","f":"Index: 'fairgrounds, dodgems'. Section 740, Regulation 740.55.9.","w":{"0":"25 V AC / 60 V DC is the bathroom zone 1 SELV limit, not dodgems.","2":"110 V AC is reduced low voltage, too high for dodgems.","3":"230 V AC is mains voltage; dodgems must be at ELV, up to 50 V AC."}},{"id":"b2.08.04","t":"12","c":0,"q":"In an outdoor lighting installation, a door giving access to electrical equipment must be locked with a key or require a tool for access where it is located less than what height above ground level?","o":["2.50 m","2.00 m","2.25 m","2.80 m"],"a":0,"x":"Regulation 714.411.2.201: a door giving access to electrical equipment located less than 2.50 m above ground level shall be locked with a key or require a tool. (2.80 m is the figure for access to a luminaire's light source.)","r":"714.411.2.201 (page 292 of the 2018 book)","n":"","k":13246,"m":"","f":"Index: 'outdoor lighting installations'. Section 714, Regulation 714.411.2.201.","w":{"1":"2.00 m is not the 714.411.2.201 figure; it is 2.50 m.","2":"2.25 m is the bathroom zone 1 height, not outdoor lighting.","3":"2.80 m is for access to a luminaire's light source, not equipment doors."}},{"id":"b2.08.05","t":"12","c":1,"q":"A 12 V ELV lighting installation is being designed. What is the maximum voltage drop between the transformer and the furthest luminaire for it to be deemed to comply with Section 525?","o":["0.36 V","0.48 V","0.6 V","1.2 V"],"a":2,"x":"Regulation 715.525 allows 5% of the nominal ELV voltage.<br>5 ÷ 100 = 0.05<br>12 × 0.05 = 0.6 V","r":"715.525 (page 296 of the 2018 book)","n":"","k":13383,"m":"","f":"Index: 'extra-low voltage lighting, voltage drop'. Section 715, Regulation 715.525: 5 % of the nominal voltage.","w":{"0":"0.36 V is 3 % of 12 V; 715.525 allows 5 %.","1":"0.48 V is 4 % of 12 V; 715.525 allows 5 %.","3":"1.2 V is 10 % of 12 V; 715.525 allows 5 %."}},{"id":"b2.08.06","t":"12","c":0,"q":"In a restricted access area where basic protection is provided by barriers or enclosures, what is the minimum gangway width between barriers or enclosures and the wall?","o":["500 mm","600 mm","900 mm","700 mm"],"a":3,"x":"Regulation 729.513.2.1(ii) and Figure 729.1: minimum gangway width 700 mm. (500 mm is the minimum passing width with a circuit-breaker completely extracted, Annex A729.)","r":"729.513.2.1 (page 320 of the 2018 book)","n":"","k":14622,"m":"","f":"Index: 'operating and maintenance gangways'. Section 729, Regulation 729.513.2.1 and Figure 729.1.","w":{"0":"500 mm is the passing width with a circuit-breaker fully extracted (Annex A729).","1":"600 mm is not the barrier/enclosure gangway width; it is 700 mm.","2":"900 mm is not the minimum in 729.513.2.1."}},{"id":"b2.08.07","t":"12","c":0,"q":"Which of the following is prohibited for circuits supplying heating units covered by Section 753 (heating cables and embedded heating systems)?","o":["Time-delayed type RCDs","RCDs with a rated residual operating current of 30 mA","Overcurrent protective devices","Cold tails connected by crimped connections"],"a":0,"x":"Regulation 753.415.1: circuits supplying heating units shall have additional protection by RCDs to Regulation 415.1.1; time-delayed type RCDs shall not be used.","r":"753.415.1 (page 334 of the 2018 book)","n":"","k":15277,"m":"","f":"Index: 'heating cables and embedded heating systems'. Section 753, Regulation 753.415.1.","w":{"1":"30 mA RCDs are required, not prohibited, as additional protection to 415.1.1.","2":"Overcurrent devices are still needed; 753.415.1 prohibits only time-delayed RCDs.","3":"Crimped connections for cold tails are not prohibited by 753.415.1."}},{"id":"b3.08.08","t":"12","c":0,"q":"What is the minimum degree of protection required for electrical equipment in an outdoor lighting installation, by construction or by installation?","o":["IP2X","IP33","IP44","IP55"],"a":1,"x":"Regulation 714.512.2.105: electrical equipment shall have, by construction or by installation, a degree of protection of at least IP33.","r":"714.512.2.105 (page 293 of the 2018 book)","n":"","k":13268,"m":"","f":"Index: 'outdoor lighting installations, external influences'. Section 714, Regulation 714.512.2.105.","w":{"0":"IP2X is basic finger protection, not the outdoor lighting minimum.","2":"IP44 is the agricultural (705) minimum, not outdoor lighting.","3":"IP55 is higher than the 714.512.2.105 minimum of IP33."}},{"id":"b3.08.09","t":"12","c":0,"q":"A mobile unit is supplied by means of a plug and socket-outlet. What is the minimum cross-sectional area of the H07RN-F copper flexible cable used to connect the unit to the supply?","o":["1.5 mm²","4 mm²","2.5 mm²","6 mm²"],"a":2,"x":"Regulation 717.52.1: flexible cable to H07RN-F (BS EN 50525-2-21) or equivalent, with a minimum cross-sectional area of 2.5 mm² copper, entering the unit by an insulating inlet.","r":"717.52.1 (page 299 of the 2018 book)","n":"","k":13513,"m":"","f":"Index: 'mobile or transportable units'. Section 717, Regulation 717.52.1.","w":{"0":"1.5 mm² is below the 717.52.1 minimum of 2.5 mm².","1":"4 mm² is the Table 721 caravan size for 25 A, not the mobile unit minimum.","3":"6 mm² is the Table 721 caravan size for 32 A, not the mobile unit minimum."}},{"id":"b3.08.10","t":"12","c":0,"q":"The AC electrical inlet on a caravan shall be installed not more than what height above ground level?","o":["1.0 m","1.5 m","2.0 m","1.8 m"],"a":3,"x":"Regulation 721.55.1.2(i): the inlet shall be installed not more than 1.8 m above ground level, readily accessible, with at least IP44 and not protruding significantly beyond the body of the caravan.","r":"721.55.1.2 (page 309 of the 2018 book)","n":"","k":14155,"m":"","f":"Index: 'caravans, inlets'. Section 721, Regulation 721.55.1.2(i).","w":{"0":"1.0 m is not the inlet limit; it is not more than 1.8 m.","1":"1.5 m is not the 721.55.1.2 figure.","2":"2.0 m exceeds the 1.8 m maximum."}},{"id":"b3.08.11","t":"12","c":0,"q":"Automatic disconnection of supply to a temporary installation at a fairground must be provided at the origin by one or more RCDs with a rated residual operating current not exceeding","o":["300 mA","30 mA","100 mA","500 mA"],"a":0,"x":"Regulation 740.410.3: RCD(s) at the origin with a rated residual operating current not exceeding 300 mA, time-delayed where necessary for selectivity with the 30 mA RCDs on final circuits.","r":"740.410.3 (page 329 of the 2018 book)","n":"","k":15051,"m":"","f":"Index: 'fairgrounds'. Section 740, Regulation 740.410.3.","w":{"1":"30 mA is for final circuits; the origin RCD is up to 300 mA.","2":"100 mA is the agricultural figure for sockets over 32 A, not fairgrounds.","3":"500 mA is the construction site figure for sockets over 32 A."}},{"id":"b4.08.12","t":"12","c":0,"q":"Suspension devices for ELV luminaires, including supporting conductors, must be capable of carrying what load?","o":["Twice the mass of the luminaires, but not less than 2 kg","Three times the mass of the luminaires, but not less than 5 kg","Five times the mass of the luminaires, but not less than 5 kg","Five times the mass of the luminaires, but not less than 10 kg"],"a":2,"x":"Regulation 715.521.107: suspension devices shall be capable of carrying five times the mass of the luminaires (including lamps) to be supported, but not less than 5 kg.","r":"715.521.107 (page 295 of the 2018 book)","n":"","k":13366,"m":"","f":"Index: 'extra-low voltage lighting, suspension'. Section 715, Regulation 715.521.107.","w":{"0":"Both factors are wrong; 715.521.107 requires five times the mass, minimum 5 kg.","1":"Three times is too low; it is five times, minimum 5 kg.","3":"The factor is right but the minimum is 5 kg, not 10 kg."}},{"id":"b4.08.13","t":"12","c":0,"q":"A plug and socket-outlet used outside a mobile unit to connect it to the supply must afford what minimum degrees of protection?","o":["IP44 when connected and IP55 when not connected","IP44 both when connected and when not connected","IP55 when connected and IP44 when not connected","IP33 when connected and IP44 when not connected"],"a":0,"x":"Regulation 717.55.1(ii): at least IP44 when in use or connected, and at least IP55 when not connected, e.g. when the unit is in transit.","r":"717.55.1 (page 299 of the 2018 book)","n":"","k":13544,"m":"","f":"Index: 'mobile or transportable units'. Section 717, Regulation 717.55.1(ii).","w":{"1":"Not connected (e.g. in transit) needs the higher IP55.","2":"These are reversed; IP44 when connected, IP55 when not.","3":"IP33 is the outdoor lighting figure; connected needs IP44 and not connected IP55."}},{"id":"b4.08.14","t":"12","c":0,"q":"Socket-outlets supplying inland navigation vessels on a fixed quay must be placed at a height of not less than what above the highest water level?","o":["0.3 m","1 m","0.6 m","1.8 m"],"a":1,"x":"Regulation 730.553.13: not less than 1 m above the highest water level; this may be reduced to 0.3 m only on floating pontoons or walkways with additional protection against splashing.","r":"730.553.13 (page 326 of the 2018 book)","n":"","k":14872,"m":"","f":"Index: 'inland navigation vessels'. Section 730, Regulation 730.553.13.","w":{"0":"0.3 m applies only on floating pontoons or walkways, not a fixed quay.","2":"0.6 m is not a figure in 730.553.13.","3":"1.8 m is the caravan inlet maximum height."}},{"id":"b4.08.15","t":"12","c":0,"q":"For floor or ceiling heating systems in buildings, measures shall be applied within the zone where heating units are installed to limit the temperature to a maximum of","o":["35 °C","60 °C","70 °C","80 °C"],"a":3,"x":"Regulation 753.424.201: design, installation or protective devices shall limit the temperature in the zone of the heating units to a maximum of 80 °C. (35 °C is the example floor surface limit in the note to 753.423.)","r":"753.424.201 (page 335 of the 2018 book)","n":"","k":15293,"m":"","f":"Index: 'heating cables and embedded heating systems'. Section 753, Regulation 753.424.201.","w":{"0":"35 °C is the example floor surface limit in the note to 753.423, not the heating zone limit.","1":"60 °C is not the 753.424.201 figure.","2":"70 °C is a cable conductor temperature, not this limit."}},{"id":"b5.08.16","t":"12","c":0,"q":"In an ELV lighting installation, self-resetting overcurrent protective devices are permitted only for transformers up to what rating?","o":["50 VA","25 VA","200 VA","60 W"],"a":0,"x":"Regulation 715.430.104: self-resetting overcurrent protective devices are permitted only for transformers up to 50 VA. (200 VA relates to uninsulated conductors, 715.422.107.1; 60 W to the fire protection device.)","r":"715.430.104 (page 295 of the 2018 book)","n":"","k":13340,"m":"","f":"Index: 'extra-low voltage lighting, overcurrent'. Section 715, Regulation 715.430.104.","w":{"1":"25 VA is not the figure; self-resetting devices are allowed up to 50 VA.","2":"200 VA is the limit for uninsulated conductors (715.422.107.1).","3":"60 W is the power increase for the fire protection device (715.422.107.2)."}},{"id":"b5.08.17","t":"12","c":0,"q":"In a caravan, cables not enclosed in rigid conduit must be supported at intervals not exceeding","o":["0.25 m vertical and 0.4 m horizontal","0.3 m vertical and 0.3 m horizontal","0.5 m vertical and 0.4 m horizontal","0.4 m vertical and 0.25 m horizontal"],"a":3,"x":"Regulation 721.522.8.1.3: all cables, unless enclosed in rigid conduit, and all flexible conduit shall be supported at intervals not exceeding 0.4 m for vertical runs and 0.25 m for horizontal runs.","r":"721.522.8.1.3 (page 307 of the 2018 book)","n":"","k":14107,"m":"","f":"Index: 'caravans, wiring systems'. Section 721, Regulation 721.522.8.1.3.","w":{"0":"These are swapped; 0.4 m vertical and 0.25 m horizontal.","1":"0.3 m is not used in 721.522.8.1.3.","2":"0.5 m vertical is too far; the limit is 0.4 m."}},{"id":"b5.08.18","t":"12","c":0,"q":"Operating and maintenance gangways must be accessible from both ends when they are longer than","o":["6 m","10 m","20 m","25 m"],"a":1,"x":"Regulation 729.513.2.3: gangways longer than 10 m shall be accessible from both ends. Closed restricted access areas longer than 20 m need doors at both ends (recommended above 6 m).","r":"729.513.2.3 (page 322 of the 2018 book)","n":"","k":14691,"m":"","f":"Index: 'operating and maintenance gangways'. Section 729, Regulation 729.513.2.3.","w":{"0":"6 m is where doors at both ends of closed areas are only recommended (Note 2).","2":"20 m is for closed restricted access areas needing doors at both ends, not gangways.","3":"25 m is not a figure in 729.513.2.3."}},{"id":"b5.08.19","t":"12","c":0,"q":"When must the temporary electrical installation of a fairground amusement device, between its origin and any electrical equipment, be inspected and tested to Part 6?","o":["Once a year","Every three months","After each assembly on site","Only when first manufactured"],"a":2,"x":"Regulation 740.6: the installation between its origin and any electrical equipment shall be inspected and tested in accordance with Part 6 after each assembly on site.","r":"740.6 (page 333 of the 2018 book)","n":"","k":15236,"m":"","f":"Index: 'fairgrounds, inspection and testing'. Section 740, Regulation 740.6.","w":{"0":"An annual check does not meet 740.6; testing is required after each assembly on site.","1":"740.6 sets no three-monthly interval; testing is required after each assembly on site.","3":"Testing is not only at manufacture; it is after each assembly on site."}},{"id":"b1.09.00","t":"13","c":0,"q":"According to Appendix 1, which British Standard specifies clamps for earthing and bonding?","o":["BS 4177","BS 951","BS 5266","BS 1362"],"a":1,"x":"Appendix 1 lists BS 951:2009 'Electrical earthing. Clamps for earthing and bonding. Specification', referenced by Regulation 514.13.1. BS 4177 is cooker control units, BS 5266 emergency lighting and BS 1362 plug fuse links.","r":"Appendix 1 (page 339 of the 2018 book)","n":"","k":15475,"m":"","f":"Appendix 1 (list of standards), search for 'clamps for earthing and bonding', or look up Regulation 514.13.1.","w":{"0":"BS 4177 is for cooker control units.","2":"BS 5266 is for emergency lighting.","3":"BS 1362 is for plug fuse links."}},{"id":"b1.09.01","t":"1","c":0,"q":"Under Regulation 28 of the Electricity Safety, Quality and Continuity Regulations, which of the following must a distributor provide free of charge to relevant persons?","o":["The maximum demand of the consumer's installation","The cross-sectional area of the consumer's main protective bonding conductors","The insulation resistance of the consumer's meter tails","The maximum earth fault loop impedance of the earth fault path outside the installation (Ze)"],"a":3,"x":"Appendix 2 item 2: ESQCR Regulation 28 requires the distributor to provide, among other things, the maximum prospective short-circuit current, Ze, the type and rating of the cut-out device, the earthing system, number of phases, frequency and voltage.","r":"Appendix 2 item 2 (page 359 of the 2018 book)","n":"","k":16620,"m":"","f":"Appendix 2 (statutory regulations), item 2 on the ESQCR, Regulation 28.","w":{"0":"Maximum demand is assessed by the designer, not supplied by the distributor.","1":"Bonding conductor sizes are the installer's design, from Regulation 544.1.1.","2":"Meter tail insulation resistance is not distributor information under Regulation 28."}},{"id":"b1.09.02","t":"13","c":1,"q":"A final circuit is protected by a 32 A Type B circuit-breaker to BS EN 60898 (Ia = 160 A from Fig 3A4). Using the Appendix 3 method for measured values (0.8 × U0 × Cmin ÷ Ia, with U0 = 230 V and Cmin = 0.95), what is the maximum measured earth fault loop impedance at ambient temperature?","o":["1.09 Ω","1.37 Ω","1.15 Ω","1.44 Ω"],"a":0,"x":"Zs(m) ≤ 0.8 × U0 × Cmin ÷ Ia<br>230 × 0.95 = 218.5<br>218.5 ÷ 160 = 1.366 Ω<br>1.366 × 0.8 = 1.09 Ω. Appendix 3 (Cmin = 0.95 for an ESQCR supply; Ia for a 32 A Type B is 160 A, Fig 3A4).","r":"Appendix 3 (page 362 of the 2018 book)","n":"","k":16761,"m":"","f":"Appendix 3: get Ia from Figure 3A4 (Type B 32 A = 160 A), then apply Zs ≤ 0.8 × U0 × Cmin ÷ Ia.","w":{"1":"1.37 Ω is the Table 41.3 value (U0 × Cmin ÷ Ia); you forgot the 0.8 factor for measured values.","2":"1.15 Ω uses 230 × 0.8 ÷ 160 but leaves out Cmin = 0.95.","3":"1.44 Ω is 230 ÷ 160, with neither Cmin nor the 0.8 factor applied."}},{"id":"b1.09.03","t":"13","c":1,"q":"A circuit is protected against overload by a 30 A semi-enclosed fuse to BS 3036. Ignoring all other rating factors, what is the minimum tabulated current-carrying capacity (It) required of the cable?","o":["21.8 A","43.5 A","41.4 A","30.0 A"],"a":2,"x":"Appendix 4 sec 4: for BS 3036 fuses the rating factor 1.45/2 = 0.725 is applied to the fuse rating as a divisor.<br>It ≥ In ÷ 0.725<br>30 ÷ 0.725 = 41.4 A","r":"Appendix 4 sec 4 (page 376 of the 2018 book)","n":"","k":17482,"m":"","f":"Appendix 4 section 4 (overload, BS 3036 fuses): divide the fuse rating by 0.725.","w":{"0":"You multiplied by 0.725; for BS 3036 fuses you divide.","1":"43.5 A is 30 × 1.45; the correct rule is In ÷ 0.725.","3":"30 A ignores the BS 3036 factor; It must be In ÷ 0.725."}},{"id":"b1.09.04","t":"13","c":1,"q":"A 230 V radial circuit is wired in 2.5 mm² flat twin and earth cable (Table 4D5, 18 mV/A/m). The design current is 20 A and the length of run is 25 m. What is the voltage drop?","o":["7.5 V","4.5 V","9.0 V","11.5 V"],"a":2,"x":"Appendix 4 sec 6: voltage drop = mV/A/m × Ib × L ÷ 1000<br>18 × 20 = 360<br>360 × 25 = 9000 mV<br>9000 ÷ 1000 = 9.0 V","r":"Appendix 4 sec 6 (page 380 of the 2018 book)","n":"","k":17720,"m":"","f":"Appendix 4 section 6: take mV/A/m from Table 4D5, then voltage drop = mV/A/m × Ib × L ÷ 1000.","w":{"0":"7.5 V does not match 18 × 20 × 25 ÷ 1000 = 9.0 V; recheck the multiplication.","1":"4.5 V is half the answer; you may have used 10 A or halved the length.","3":"11.5 V is 5 % of 230 V, the lighting limit, not the calculated drop."}},{"id":"b1.09.05","t":"3","c":0,"q":"A car-washing bay, where hose water is used regularly, is classified for presence of water as which external influence code, and what minimum IP rating does Appendix 5 give for it?","o":["AD5, IPX5","AD4, IPX4","AD6, IPX6","AD3, IPX3"],"a":0,"x":"Appendix 5, AD5 Jets: possibility of jets of water from any direction, e.g. yards and car-washing bays where hose water is used regularly - IPX5. AD4 is splashes (IPX4), AD6 waves (IPX6).","r":"Appendix 5 AD5 (page 449 of the 2018 book)","n":"","k":21047,"m":"","f":"Index: 'external influences'. Go to Appendix 5, AD (presence of water) codes, and read down to the entry mentioning car-washing bays and hose water.","w":{"1":"AD4 is splashes from any direction (IPX4); hose water used regularly in a car-wash bay counts as jets, AD5.","2":"AD6 is waves (IPX6), e.g. seashore locations, not hose jets in a wash bay.","3":"AD3 is spraying (IPX3); regular hose use is jets, which is AD5."}},{"id":"b2.09.06","t":"1","c":0,"q":"According to Appendix 2, which statutory regulations apply to installations associated with work activity and places of work?","o":["The Electricity Safety, Quality and Continuity Regulations 2002","The Building Regulations 2010","The Supply of Machinery (Safety) Regulations 2008","The Electricity at Work Regulations 1989"],"a":3,"x":"Appendix 2 item 1(iii): work activity, places of work and non-domestic installations are subject to the Electricity at Work Regulations 1989 (enforced by the HSE). ESQCR covers distributors' installations; the Building Regulations cover buildings generally.","r":"Appendix 2 item 1(iii) (page 358 of the 2018 book)","n":"","k":16586,"m":"","f":"Index: 'statutory regulations'. Go to Appendix 2 (Statutory regulations and associated memoranda), item 1, and read the sub-items for work activity and places of work.","w":{"0":"ESQCR 2002 covers distributors' and supply equipment, not work activity in places of work.","1":"The Building Regulations cover buildings generally, not electrical safety in work activity.","2":"The Supply of Machinery Regulations cover machinery design and supply, not installations at places of work."}},{"id":"b2.09.07","t":"1","c":1,"q":"Since 1 January 1995 the nominal UK supply voltage has been 230 V with a permitted tolerance of +10 %/-6 %. What is the resulting permitted voltage range?","o":["207.0 V to 253.0 V","216.2 V to 253.0 V","225.6 V to 254.4 V","216.2 V to 243.8 V"],"a":1,"x":"Appendix 2 item 15 table: 230 V +10 %/-6 %<br>230 × 0.94 = 216.2 V<br>230 × 1.10 = 253.0 V. (225.6 - 254.4 V was the pre-1995 240 V ±6 % range.)","r":"Appendix 2 item 15 (page 360 of the 2018 book)","n":"","k":16694,"m":"","f":"Index: 'voltage, nominal' or 'statutory regulations'. Go to Appendix 2, item 15 table; then work out 230 × 0.94 and 230 × 1.10.","w":{"0":"207 V is 230 V minus 10 %; the lower tolerance is only 6 %, giving 216.2 V.","2":"That's the pre-1995 range (240 V ±6 %), not the current 230 V +10 %/-6 %.","3":"You applied 6 % both ways; the upper tolerance is +10 %, giving 253.0 V."}},{"id":"b2.09.08","t":"13","c":0,"q":"From Fig 3A2(a), what current is required to operate a 30 A semi-enclosed fuse to BS 3036 within 0.4 s?","o":["210 A","140 A","87 A","300 A"],"a":0,"x":"Fig 3A2(a) table, 30 A fuse: 0.1 s 450 A, 0.2 s 300 A, 0.4 s 210 A, 1 s 140 A, 5 s 87 A.","r":"Appendix 3 Fig 3A2(a) (page 364 of the 2018 book)","n":"","k":16861,"m":"","f":"Index: 'time/current characteristics'. Go to Appendix 3, Fig 3A2(a) (BS 3036 fuses), use the table under the curves: 30 A column, 0.4 s row.","w":{"1":"140 A is the 1 s value for the 30 A fuse; the question asks for 0.4 s.","2":"87 A is the 5 s value; at 0.4 s the fuse needs 210 A.","3":"300 A is the 0.2 s value; you read one time row too fast."}},{"id":"b2.09.09","t":"13","c":1,"q":"A single-phase circuit in 70 °C thermoplastic single-core cables enclosed in conduit on a wall (Reference Method B, Table 4D1A column 4) is protected by a 32 A circuit-breaker to BS EN 60898. The ambient temperature is 35 °C (Ca = 0.94) and the conduit carries three circuits in total (Cg = 0.70). What is the minimum conductor size?","o":["4 mm²","10 mm²","6 mm²","16 mm²"],"a":1,"x":"It ≥ In ÷ (Ca × Cg)<br>0.94 × 0.70 = 0.658<br>32 ÷ 0.658 = 48.6 A<br>Table 4D1A col 4: 6 mm² = 41 A (too small), 10 mm² = 57 A → 10 mm².","r":"Appendix 4 sec 5.1.2 (page 377 of the 2018 book)","n":"","k":17534,"m":"","f":"Index: 'current-carrying capacity'. Use Appendix 4 sec 5.1 (It ≥ In ÷ (Ca × Cg)), then Table 4D1A column 4 (Method B, two cables single-phase) to pick the first size at or above It.","w":{"0":"4 mm² isn't even enough for 32 A uncorrected; It must be at least 48.6 A after factors.","2":"6 mm² gives 41 A, below the corrected 48.6 A; you may have applied only one factor or none.","3":"16 mm² works but isn't the minimum; 10 mm² (57 A) already exceeds 48.6 A."}},{"id":"b2.09.10","t":"13","c":0,"q":"From Table 4B1, what rating factor (Ca) applies to a 70 °C thermoplastic insulated cable installed in an ambient air temperature of 45 °C?","o":["0.87","0.71","0.94","0.79"],"a":3,"x":"Table 4B1, 70 °C thermoplastic column, 45 °C row: 0.79. (0.87 is the 90 °C thermosetting value at 45 °C; 0.94 is thermoplastic at 35 °C.)","r":"Appendix 4 Table 4B1 (page 393 of the 2018 book)","n":"","k":18450,"m":"","f":"Index: 'rating factors, ambient temperature'. Go to Appendix 4 Table 4B1 (air, not ground), 70 °C thermoplastic column, 45 °C row.","w":{"0":"0.87 is the 90 °C thermosetting value at 45 °C; this cable is 70 °C thermoplastic.","1":"0.71 is the thermoplastic value at 50 °C in Table 4B1; you read one row too far down.","2":"0.94 is the thermoplastic factor for 35 °C, not 45 °C."}},{"id":"b2.09.11","t":"7","c":0,"q":"An addition to a three-phase installation wired in the old cable colours is made in the new harmonized colours. Following Table 7A, the old yellow line conductor (L2) corresponds to which new colour?","o":["Brown","Grey","Black","Blue"],"a":2,"x":"Table 7A: Line 1 red → L1 brown, Line 2 yellow → L2 black, Line 3 blue → L3 grey, neutral black → N blue.","r":"Appendix 7 Table 7A (page 483 of the 2018 book)","n":"","k":22675,"m":"","f":"Index: 'colours, identification' or 'harmonized colours'. Go to Appendix 7, Table 7A, and read across the Line 2 (yellow) row.","w":{"0":"Brown replaces old red (L1), not yellow.","1":"Grey replaces old blue (L3), not yellow (L2).","3":"Blue is now the neutral colour (replacing old black), never a line conductor here."}},{"id":"b3.09.12","t":"13","c":0,"q":"According to Table 3A, what is the maximum trip time for a general (non-delay) 30 mA RCD to BS EN 61008-1 when tested at a residual current of 150 mA (5 IΔn)?","o":["150 ms","300 ms","200 ms","40 ms"],"a":3,"x":"Table 3A, general non-delay type: at IΔn 300 ms max, at 2 IΔn 150 ms max, at 5 IΔn (150 mA for a 30 mA device) 40 ms max.","r":"Appendix 3 Table 3A (page 362 of the 2018 book)","n":"","k":16783,"m":"","f":"Index: 'residual current device, test' or 'RCD operating times'. Go to Appendix 3, Table 3A, general non-delay row, 5 IΔn column.","w":{"0":"150 ms is the maximum at 2 IΔn; at 5 IΔn it's 40 ms.","1":"300 ms is the maximum at 1 × IΔn, not 5 × IΔn.","2":"200 ms isn't a Table 3A limit for a general non-delay RCD at 5 IΔn; it's 40 ms."}},{"id":"b3.09.13","t":"13","c":1,"q":"A distribution circuit (5 s disconnection) is protected by a 32 A fuse to BS 88-3. Fig 3A1 gives 140 A for operation in 5 s. Using U0 = 230 V and Cmin = 0.95, what is the maximum earth fault loop impedance?","o":["0.91 Ω","1.56 Ω","1.64 Ω","1.25 Ω"],"a":1,"x":"Zs = U0 × Cmin ÷ Ia<br>230 × 0.95 = 218.5<br>218.5 ÷ 140 = 1.56 Ω. (Using the 0.4 s current of 240 A would give 0.91 Ω.)","r":"Appendix 3 Fig 3A1 (page 363 of the 2018 book)","n":"","k":16814,"m":"","f":"Index: 'earth fault loop impedance'. Take Ia for 5 s from Appendix 3 Fig 3A1 (32 A fuse) and use Zs = U0 × Cmin ÷ Ia.","w":{"0":"0.91 Ω uses the 0.4 s current (240 A); a distribution circuit is allowed 5 s.","2":"1.64 Ω is 230 ÷ 140; you left out Cmin (0.95).","3":"1.25 Ω doesn't come from 218.5 ÷ 140; check you used the 5 s current for the 32 A curve."}},{"id":"b3.09.14","t":"13","c":1,"q":"A 20 A circuit (circuit-breaker to BS EN 60898) in 70 °C flat twin and earth cable is clipped direct (Reference Method C, Table 4D5 column 6), but for part of its length is totally surrounded by thermal insulation, for which a factor Ci of 0.5 applies. No other factors apply. What is the minimum conductor size?","o":["2.5 mm²","4 mm²","6 mm²","10 mm²"],"a":2,"x":"Appendix 4 sec 5.1.1(ii): divide In by Ci.<br>It ≥ 20 ÷ 0.5 = 40 A<br>Table 4D5 Method C: 4 mm² = 37 A (too small), 6 mm² = 47 A → 6 mm².","r":"Appendix 4 sec 5.1.1 (page 377 of the 2018 book)","n":"","k":17521,"m":"","f":"Index: 'thermal insulation, cables in'. Appendix 4 sec 5.1.1: It ≥ In ÷ Ci, then Table 4D5, Reference Method C column, pick the first size at or above It.","w":{"0":"2.5 mm² ignores Ci; with 0.5 applied the cable must carry 40 A, and 2.5 mm² is far below that.","1":"4 mm² gives only 37 A, just under the required 40 A.","3":"10 mm² works but isn't the minimum; 6 mm² (47 A) already exceeds 40 A."}},{"id":"b3.09.15","t":"13","c":1,"q":"A 230 V cooker circuit (not lighting) supplied from a public LV network is wired in 6 mm² flat twin and earth cable (Table 4D5, 7.3 mV/A/m). The design current is 32 A. What is the maximum length of run that keeps within the Appendix 4 voltage drop limit?","o":["49.2 m","29.5 m","56.2 m","81.7 m"],"a":0,"x":"Table 4Ab: 5 % for other uses<br>230 × 0.05 = 11.5 V = 11 500 mV<br>7.3 × 32 = 233.6<br>11 500 ÷ 233.6 = 49.2 m","r":"Appendix 4 Table 4D5 / Table 4Ab (page 408 of the 2018 book)","n":"","k":19223,"m":"","f":"Index: 'voltage drop'. Appendix 4 Table 4Ab gives 5 % for other uses (11.5 V); then length = allowed mV ÷ (mV/A/m from Table 4D5 × Ib).","w":{"1":"29.5 m uses the 3 % lighting limit (6.9 V); a cooker circuit gets 5 %.","2":"56.2 m doesn't match 11 500 mV ÷ (7.3 × 32); recheck the limit and the design current used.","3":"81.7 m is too long; check you used 7.3 mV/A/m and Ib = 32 A with the 5 % (11.5 V) limit."}},{"id":"b3.09.16","t":"3","c":0,"q":"A high-rise hotel or hospital open to the public, with high density occupation and difficult conditions of evacuation, is classified under Appendix 5 as which code?","o":["BD1","BD4","BD2","BD3"],"a":1,"x":"Appendix 5, BD conditions of evacuation: BD1 low density/easy exit, BD2 low density/difficult exit (high-rise), BD3 high density/easy exit (theatres, cinemas), BD4 high density/difficult exit (high-rise buildings open to the public such as hotels and hospitals).","r":"Appendix 5 BD4 (page 457 of the 2018 book)","n":"","k":21441,"m":"","f":"Index: 'external influences' or 'evacuation'. Go to Appendix 5, BD (conditions of evacuation in an emergency) and match density and ease of exit.","w":{"0":"BD1 is low density, easy evacuation, e.g. ordinary dwellings.","2":"BD2 is low density but difficult evacuation (high-rise); hotels and hospitals open to the public are high density.","3":"BD3 is high density but easy evacuation, e.g. theatres and cinemas."}},{"id":"b3.09.17","t":"13","c":0,"q":"When measuring the impedance of an insulating floor with test electrode 1 (the tripod) to Appendix 13, approximately what force is applied to the electrode?","o":["250 N","500 N","750 N","1000 N"],"a":2,"x":"Appendix 13 sec 3: a force of approximately 750 N for floors or 250 N for walls is applied to the tripod while measurements are made.","r":"Appendix 13 sec 3 (page 501 of the 2018 book)","n":"","k":23613,"m":"","f":"Index: 'insulating floors and walls'. Go to Appendix 13, section 3 (test electrode 1, the tripod) and read the force applied for floors.","w":{"0":"250 N is the force for walls; floors use about 750 N.","1":"500 N isn't the Appendix 13 figure; it's about 750 N for floors, 250 N for walls.","3":"1000 N is too high; Appendix 13 gives approximately 750 N for floors."}},{"id":"b4.09.18","t":"13","c":1,"q":"A three-phase circuit uses a four-core 70 °C thermoplastic armoured cable buried direct in the ground (Reference Method D, Table 4D4A column 7), protected by a 50 A BS 88-2 fuse. The ground temperature is 25 °C (Table 4B2, Ca = 0.95) and the buried-cable factor Cc = 0.9 applies. What is the minimum conductor size?","o":["16 mm²","10 mm²","25 mm²","35 mm²"],"a":0,"x":"It ≥ In ÷ (Ca × Cc)<br>0.95 × 0.9 = 0.855<br>50 ÷ 0.855 = 58.5 A<br>Table 4D4A col 7: 10 mm² = 50 A (too small), 16 mm² = 64 A → 16 mm².","r":"Appendix 4 sec 5.1.1 (page 377 of the 2018 book)","n":"","k":17526,"m":"","f":"Index: 'current-carrying capacity'. Appendix 4 sec 5.1.1: It ≥ In ÷ (Ca × Cc), Ca from Table 4B2 (ground), then Table 4D4A column 7 (Method D).","w":{"1":"10 mm² gives 50 A, equal to In before factors; after Ca and Cc It is 58.5 A.","2":"25 mm² works but isn't the minimum; 16 mm² (64 A) already exceeds 58.5 A.","3":"35 mm² is well oversized; 16 mm² at 64 A is the smallest that exceeds 58.5 A."}},{"id":"b4.09.19","t":"13","c":0,"q":"Appendix 4 defines a perforated cable tray, for which Reference Method E or F may be used, as having holes occupying at least what proportion of the area of the base of the tray?","o":["10 %","25 %","50 %","30 %"],"a":3,"x":"Appendix 4 sec 7.2: a perforated cable tray has holes occupying at least 30 % of the base area. Trays with less than 30 % are unperforated and Reference Method C is used.","r":"Appendix 4 sec 7.2 (page 383 of the 2018 book)","n":"","k":17851,"m":"","f":"Index: 'cable tray, perforated'. Go to Appendix 4 sec 7 (reference methods), the paragraph defining perforated cable tray.","w":{"0":"10 % is too low; at least 30 % of the base area must be holes.","1":"25 % would still count as unperforated; the threshold is 30 %.","2":"50 % is more than required; the definition is at least 30 %."}},{"id":"b4.09.20","t":"13","c":0,"q":"From Table 4C1, what group rating factor (Cg) applies to four circuits bunched and enclosed in conduit (item 1, cables touching)?","o":["0.75","0.70","0.65","0.77"],"a":2,"x":"Table 4C1 item 1 (bunched in air, on a surface, embedded or enclosed): 1 = 1.00, 2 = 0.80, 3 = 0.70, 4 = 0.65. (0.75 is item 2, single layer on a wall, for 4 circuits.)","r":"Appendix 4 Table 4C1 (page 395 of the 2018 book)","n":"","k":18567,"m":"","f":"Index: 'grouping, rating factors'. Go to Appendix 4 Table 4C1, item 1 (bunched, embedded or enclosed), 4-circuit column.","w":{"0":"0.75 is item 2 (single layer on a wall or floor) for 4 circuits, not enclosed in conduit.","1":"0.70 is item 1 for 3 circuits, not 4.","3":"0.77 is item 3 (single layer on perforated tray) for 4 circuits."}},{"id":"b4.09.21","t":"13","c":1,"q":"A balanced 400 V three-phase load of 50 A is supplied by a 16 mm² four-core 70 °C thermoplastic armoured cable 40 m long. Using Table 4D4B (2.4 mV/A/m for three-phase AC), what is the voltage drop?","o":["5.6 V","8.3 V","2.8 V","4.8 V"],"a":3,"x":"Voltage drop = mV/A/m × Ib × L ÷ 1000<br>2.4 × 50 = 120<br>120 × 40 = 4800 mV<br>4800 ÷ 1000 = 4.8 V (the three-phase value is already a line voltage figure).","r":"Appendix 4 Table 4D4B (page 407 of the 2018 book)","n":"","k":19182,"m":"","f":"Index: 'voltage drop'. Take mV/A/m from Table 4D4B column 4 (three- or four-core, three-phase) and use mV/A/m × Ib × L ÷ 1000.","w":{"0":"5.6 V uses the 2.8 mV/A/m single-phase figure; a three-phase circuit uses column 4 (2.4 mV/A/m).","1":"8.3 V is 4.8 × √3; the three-phase mV/A/m already gives a line-to-line drop.","2":"2.8 V is 4.8 ÷ √3; don't convert, the three-phase figure is already a line voltage drop."}},{"id":"b4.09.22","t":"3","c":0,"q":"Where foreign solid bodies with a smallest dimension of not less than 1 mm (such as wires) are present, what external influence code and minimum degree of protection apply?","o":["AE2, IP3X","AE3, IP4X","AE4, IP5X","AE6, IP6X"],"a":1,"x":"Appendix 5: AE2 small objects (2.5 mm) IP3X; AE3 very small objects (1 mm), e.g. wires, IP4X; AE4 light dust IP5X; AE6 heavy dust IP6X.","r":"Appendix 5 AE3 (page 450 of the 2018 book)","n":"","k":21096,"m":"","f":"Index: 'external influences' or 'foreign solid bodies'. Go to Appendix 5, AE codes, and find the 1 mm (very small objects, e.g. wires) entry.","w":{"0":"AE2/IP3X is for small objects of 2.5 mm, not 1 mm wires.","2":"AE4/IP5X is light dust, not 1 mm solid objects.","3":"AE6/IP6X is heavy dust, not 1 mm solid objects."}},{"id":"b4.09.23","t":"7","c":0,"q":"A three-core cable with brown, black and grey cores is used as intermediate/two-way switch wires, all cores being line conductors. According to Appendix 7, how should it be identified at its terminations?","o":["The black and grey cores marked brown or L","The brown core marked L1, black L2 and grey L3","The grey core only marked brown or L","No marking is needed as all colours are permitted line colours"],"a":0,"x":"Appendix 7 sec 4: where a brown, black and grey three-core cable is used as switch wires with all three being line conductors, the black and grey conductors should be marked brown or L at their terminations.","r":"Appendix 7 sec 4 (page 484 of the 2018 book)","n":"","k":22686,"m":"","f":"Index: 'identification of conductors' or 'switch wires'. Go to Appendix 7, section 4 (alterations and additions), the paragraph on brown, black and grey switch wires.","w":{"1":"L1/L2/L3 marking implies three different phases; these are all the same line, so black and grey are marked brown or L.","2":"The black core must be marked too, not just the grey.","3":"Black and grey could be mistaken for other phases, so Appendix 7 requires them to be marked brown or L."}},{"id":"b5.09.24","t":"13","c":1,"q":"A balanced three-phase load with a fundamental line current of 50 A has a third harmonic content of 40 %. Using the Appendix 4 method (Ibn = 3 × h/100 × line current), what is the neutral current due to the third harmonic?","o":["60 A","20 A","50 A","70 A"],"a":0,"x":"Appendix 4 sec 5.5.2: Ibn = 3h/100 × InL<br>3 × 0.40 = 1.2<br>1.2 × 50 = 60 A. As this exceeds 33 %, Table 4Aa sizing is based on the neutral current with a 0.86 factor.","r":"Appendix 4 sec 5.5 (page 379 of the 2018 book)","n":"","k":17677,"m":"","f":"Index: 'harmonic currents'. Go to Appendix 4 sec 5.5 and use Ibn = 3 × (h ÷ 100) × line current.","w":{"1":"20 A is 40 % of 50 A for one phase only; the three phases' triplen harmonics add in the neutral, so multiply by 3.","2":"50 A is just the line current; the neutral current comes from the third harmonic formula.","3":"70 A adds the line current to one phase's harmonic; use Ibn = 3 × 0.40 × 50."}},{"id":"b5.09.25","t":"13","c":1,"q":"For a 230 V installation supplied directly from a public low voltage distribution system, what is the maximum recommended voltage drop between the origin and a lighting point?","o":["11.5 V","13.8 V","6.9 V","9.2 V"],"a":2,"x":"Table 4Ab: lighting 3 %, other uses 5 % for a public LV supply.<br>230 × 0.03 = 6.9 V","r":"Appendix 4 Table 4Ab (page 382 of the 2018 book)","n":"","k":17782,"m":"","f":"Index: 'voltage drop'. Go to Appendix 4 Table 4Ab, public LV supply row, lighting column (3 %), then 230 × 0.03.","w":{"0":"11.5 V is the 5 % 'other uses' limit, not lighting.","1":"13.8 V is 6 %, the lighting limit for a private LV supply, not a public one.","3":"9.2 V is 4 %, which isn't a Table 4Ab limit; lighting from a public supply is 3 %."}},{"id":"b5.09.26","t":"13","c":0,"q":"According to Appendix 10, above what difference in current sharing between parallel conductors should the design current and overload protection of each conductor be considered individually?","o":["5 %","15 %","20 %","10 %"],"a":3,"x":"Appendix 10 sec 2: where the difference in impedance between parallel conductors causes unequal current sharing, for example greater than 10 % difference, each conductor should be considered individually.","r":"Appendix 10 sec 2 (page 496 of the 2018 book)","n":"","k":23413,"m":"","f":"Index: 'parallel conductors'. Go to Appendix 10 (protection of conductors in parallel), section 2, on unequal current sharing.","w":{"0":"5 % is too tight; Appendix 10 gives greater than 10 % as the example.","1":"15 % is not the Appendix 10 figure; it's 10 %.","2":"20 % is too high; consider each conductor individually above 10 %."}},{"id":"b5.09.27","t":"13","c":1,"q":"The prospective fault current measured between line and neutral at the origin of a three-phase installation is 1.8 kA. Using the Appendix 14 approximation, what is the prospective fault current for a simultaneous short-circuit between all line conductors?","o":["3.1 kA","3.6 kA","5.4 kA","1.8 kA"],"a":1,"x":"Appendix 14: three-phase (all line conductors) PFC ≈ line-neutral value × 2.<br>1.8 × 2 = 3.6 kA. (× √3 = 3.1 kA is the approximation for a fault between two line conductors.)","r":"Appendix 14 (page 503 of the 2018 book)","n":"","k":23671,"m":"","f":"Index: 'prospective fault current'. Go to Appendix 14, which gives the approximation of twice the line-neutral value for a three-phase symmetrical fault.","w":{"0":"3.1 kA (× √3) is the approximation for a fault between two line conductors, not all three.","2":"5.4 kA multiplies by 3; Appendix 14 uses × 2.","3":"1.8 kA is the line-neutral value; a three-phase fault is approximately double."}},{"id":"b5.09.28","t":"13","c":0,"q":"In Fig 15B, a radial final circuit wired in 2.5 mm² cable protected by a 20 A device has historically served a floor area limited to what?","o":["75 m²","100 m²","30 m²","50 m²"],"a":3,"x":"Appendix 15 Fig 15B: 20 A radial with 2.5 mm² live conductors - historically limited to 50 m²; 30 A or 32 A radial in 4 mm² - 75 m². A ring final circuit historically served 100 m² (Fig 15A).","r":"Appendix 15 Fig 15B (page 505 of the 2018 book)","n":"","k":23787,"m":"","f":"Index: 'radial final circuits' or 'final circuits, socket-outlet'. Go to Appendix 15, Fig 15B, and read the note for the 20 A, 2.5 mm² radial.","w":{"0":"75 m² is the 30/32 A radial in 4 mm², not the 20 A radial.","1":"100 m² is the ring final circuit figure (Fig 15A).","2":"30 m² isn't the Fig 15B figure; the 20 A radial is 50 m²."}},{"id":"b5.09.29","t":"13","c":1,"q":"A 230 V installation supplied directly from a public low voltage distribution system has a wiring system 160 m long. Applying the Table 4Ab allowance for wiring systems longer than 100 m, what is the maximum recommended voltage drop between the origin and a lighting point?","o":["7.59 V","6.90 V","8.05 V","12.19 V"],"a":0,"x":"Table 4Ab: lighting 3 %, which may be increased by 0.005 % per metre beyond 100 m (increase not to exceed 0.5 %).<br>160 - 100 = 60 m<br>60 × 0.005 = 0.3 %<br>3 + 0.3 = 3.3 %<br>230 × 0.033 = 7.59 V. (6.90 V ignores the allowance; 8.05 V wrongly applies the full 0.5 % cap.)","r":"Appendix 4 Table 4Ab (page 382 of the 2018 book)","n":"","k":17787,"m":"","f":"Index: 'voltage drop'. Go to Appendix 4 Table 4Ab and its note on wiring systems longer than 100 m (0.005 % per metre, max 0.5 %), add to 3 %, then multiply by 230.","w":{"1":"6.90 V is the plain 3 %; you missed the long-run allowance for the extra 60 m.","2":"8.05 V adds the full 0.5 % cap; 60 m × 0.005 % gives only 0.3 %.","3":"12.19 V uses the 5 % 'other uses' limit plus the allowance; this is a lighting point (3 %)."}},{"id":"a1.p4.00","t":"4","c":0,"q":"In AC systems, Regulation 411.3.3 requires additional protection by a 30 mA RCD for certain socket-outlets and mobile equipment. For which of the following may that protection be omitted where a suitably documented risk assessment determines that RCD protection is not necessary?","o":["Socket-outlets rated not exceeding 32 A in locations liable to be used by ordinary persons (BA1) or children (BA2)","Socket-outlets rated not exceeding 32 A in locations other than those liable to be used by ordinary persons or children","Mobile equipment with a rated current not exceeding 32 A for use outdoors","Any socket-outlet rated not exceeding 32 A, provided the installation is not in a dwelling"],"a":1,"x":"411.3.3 permits the risk-assessment exception only for indent (ii), socket-outlets in 'other locations'; it is not permitted for (i) locations used by ordinary persons or children or (iii) mobile equipment outdoors. Introduced by A2:2022 (replacing the 2018 'other than in a dwelling' wording); unchanged in A4.","r":"411.3.3 · changed by A2","n":"","k":7232,"m":"A2","f":"Index: 'additional protection, RCD' or 'socket-outlets, RCD'. Go to Chapter 41, Regulation 411.3.3 (A2 wording), and check which indent allows the risk-assessment exception.","w":{"0":"Locations used by ordinary persons or children (indent i) can't use the risk-assessment exception.","2":"Outdoor mobile equipment (indent iii) can't use the risk-assessment exception.","3":"That's the old 2018 'other than a dwelling' idea; A2 replaced it with the 'other locations' wording."}},{"id":"a1.p4.01","t":"5","c":0,"q":"Regulation 421.1.7 requires arc fault detection devices conforming to BS EN 62606 to be provided for single-phase AC final circuits supplying socket-outlets rated not exceeding 32 A in which of the following?","o":["A two-storey owner-occupied house","A single-storey office building","A purpose-built student accommodation block","A timber barn used for storing hay (BE2 location)"],"a":2,"x":"421.1.7 makes AFDDs mandatory in high-rise residential buildings, houses in multiple occupation, purpose-built student accommodation and care homes; elsewhere they are only recommended. Mandatory list introduced by A2:2022; A4 changed only the HRRB wording.","r":"421.1.7 · changed by A2","n":"","k":5001,"m":"A2","f":"Index: 'arc fault detection devices'. Go to Chapter 42, Regulation 421.1.7, and read the list of premises where AFDDs are mandatory.","w":{"0":"Owner-occupied houses aren't on the mandatory list; AFDDs are only recommended there.","1":"Offices aren't on the mandatory list; AFDDs are only recommended there.","3":"A barn isn't on the 421.1.7 mandatory list; that list is HRRBs, HMOs, student accommodation and care homes."}},{"id":"a1.p4.02","t":"5","c":0,"q":"Regulation 443.4 requires protection against transient overvoltages where the consequence caused by the overvoltage could result in which of the following?","o":["Failure of a safety service, as defined in Part 2","Interruption of the supply to a single domestic appliance","Unwanted tripping of a 30 mA RCD","Damage to equipment which the owner has declared to be tolerable"],"a":0,"x":"443.4.1 (443.4 was split into 443.4.1 and 443.4.2 by A2:2022) lists serious injury to, or loss of, human life; failure of a safety service as defined in Part 2; and significant financial or data loss. This list replaced the 2018 list (public services/cultural heritage, commercial or industrial activity, co-located individuals); not changed by A4.","r":"443.4.1 · changed by A2","n":"","k":5002,"m":"A2","f":"Index: 'overvoltage, transient'. Go to Section 443, Regulation 443.4.1 (A2 numbering), and read the listed consequences.","w":{"1":"Loss of supply to one domestic appliance isn't a listed consequence; the list is life, safety services and significant financial/data loss.","2":"Unwanted RCD tripping isn't a consequence listed in 443.4.","3":"Where the owner declares damage tolerable, that's grounds to omit protection, not require it."}},{"id":"a2.p4.03","t":"4","c":0,"q":"Where a documented risk assessment is used under Regulation 411.3.3 to omit 30 mA RCD additional protection from socket-outlets, what does the regulation require to be done with the risk assessment?","o":["It shall be sent to the distribution network operator before energising","It shall be displayed as a notice at the origin of the installation","It shall be retained by the installer only, for inspection at the next periodic inspection","It shall be provided with the appropriate electrical installation certificate"],"a":3,"x":"411.3.3 states that the documented risk assessment shall be provided with the appropriate electrical installation certificate. Added by A2:2022; unchanged in A4.","r":"411.3.3 · changed by A2","n":"","k":7232,"m":"A2","f":"Index: 'risk assessment' or 'additional protection'. Go to Regulation 411.3.3 (A2) and read the sentence at the end about the documented risk assessment.","w":{"0":"There's no requirement to send it to the DNO; it goes with the electrical installation certificate.","1":"It isn't displayed as a notice; it's provided with the certificate.","2":"Keeping it only with the installer isn't enough; it must go with the installation certificate."}},{"id":"a2.p4.04","t":"5","c":0,"q":"A single-phase ring final circuit supplying 13 A socket-outlets is being installed in an owner-occupied two-storey house. What is the position on AFDDs under Regulation 421.1.7?","o":["AFDDs conforming to BS EN 62606 shall be provided","AFDDs conforming to BS EN 62606 are recommended","AFDDs are required only if the circuit is rated above 20 A","AFDDs are required only for circuits supplying bedrooms"],"a":1,"x":"For premises other than HRRBs, HMOs, purpose-built student accommodation and care homes, 421.1.7 recommends AFDDs for single-phase AC final circuits supplying socket-outlets not exceeding 32 A. Introduced by A2:2022; unchanged in A4.","r":"421.1.7 · changed by A2","n":"","k":5004,"m":"A2","f":"Index: 'arc fault detection devices'. Go to Regulation 421.1.7 and check whether the premises are on the mandatory list; if not, the wording is 'recommended'.","w":{"0":"'Shall' applies only to HRRBs, HMOs, student accommodation and care homes; an owner-occupied house gets a recommendation.","2":"421.1.7 covers socket circuits up to 32 A; there's no 'above 20 A' trigger.","3":"There's no bedroom-only rule in 421.1.7; it covers socket-outlet circuits wherever they are."}},{"id":"a2.p4.05","t":"5","c":0,"q":"A new installation is being designed for a single dwelling. None of the consequences listed in Regulation 443.4 apply. What does the regulation require regarding protection against transient overvoltages?","o":["No protection is needed, as single dwelling units are exempt where the value of the installation does not justify it","Protection is needed only if a calculated risk level (CRL) assessment shows it is necessary","Protection shall be provided unless the owner declares it is not required and accepts the risk of damage and consequential loss","Protection is needed only where the supply is by an overhead line"],"a":2,"x":"Since A2:2022, 443.4.1 requires protection in all other cases unless the owner of the installation declares it is not required due to any loss or damage being tolerable and accepts the risk of damage to equipment and any consequential loss (IET OSG wording). The 2018 single-dwelling exception and the CRL risk assessment (443.5) were removed. Not changed by A4.","r":"443.4.1 · changed by A2","n":"","k":5005,"m":"A2","f":"Index: 'overvoltage, transient'. Go to Section 443, Regulation 443.4.1 (A2), and read the 'in all other cases' paragraph.","w":{"0":"That's the old 2018 single-dwelling exemption; A2 removed it.","1":"The CRL risk assessment (old 443.5) was removed by A2.","3":"Overhead supply isn't the trigger; since A2 protection is needed unless the owner declares otherwise."}},{"id":"a3.p4.06","t":"4","c":0,"q":"A note to Regulation 411.3.3 deals with ordinary persons who have been instructed in the use of an installation. How is an ordinary person (BA1) instructed in the use of the installation regarded?","o":["They do not become an instructed person (electrically)","They become an instructed person (electrically)","They become a skilled person (electrically)","They may carry out the documented risk assessment on their own"],"a":0,"x":"Note 1 to 411.3.3 states that an ordinary person (BA1) instructed in the use of the installation does not become an instructed person (electrically), so socket-outlets they may use still need 30 mA RCD protection. Introduced by A2:2022; unchanged in A4.","r":"411.3.3 · changed by A2","n":"","k":7232,"m":"A2","f":"Index: 'ordinary person' or 'additional protection'. Go to Regulation 411.3.3 and read Note 1 under it.","w":{"1":"Note 1 says the opposite: instruction in using the installation doesn't make them an instructed person.","2":"An ordinary person certainly doesn't become a skilled person by being shown how to use the installation.","3":"The risk assessment is a design matter for a skilled person; an ordinary person can't carry it out."}},{"id":"a3.p4.07","t":"5","c":0,"q":"Under BS 7671:2018+A4:2026, Regulation 421.1.7 requires AFDDs in houses in multiple occupation, purpose-built student accommodation, care homes and which other type of building?","o":["Higher risk residential buildings","All buildings containing sleeping accommodation","Buildings with combustible constructional materials (CA2)","High-rise residential buildings (HRRBs)"],"a":3,"x":"A4:2026 changed the term in 421.1.7 from 'higher risk residential buildings' (A2:2022) to 'high-rise residential buildings', aligning with Building Safety Act terminology; the other premises are unchanged.","r":"421.1.7 · changed by A4","n":"","k":5007,"m":"A4","f":"Index: 'arc fault detection devices'. Go to Regulation 421.1.7 (A4 wording) and read the list of premises where AFDDs shall be provided.","w":{"0":"'Higher risk residential buildings' was the A2 term; A4 changed it to high-rise residential buildings.","1":"421.1.7 doesn't cover all sleeping accommodation; it names specific premises.","2":"CA2 buildings are dealt with elsewhere in Chapter 42, not in the 421.1.7 mandatory list."}},{"id":"a3.p4.08","t":"5","c":0,"q":"Under the current BS 7671 requirements for protected escape routes, cables or other electrical equipment shall not be installed in a fire-fighting shaft or protected stairway of a protected escape route unless they form part of which of the following?","o":["Any circuit wired in fire-resistant cable","An essential fire safety or related system, general needs lighting, or socket-outlets for cleaning or maintenance","Any final circuit protected by an AFDD","Data and telecommunication circuits only"],"a":1,"x":"The permitted list (an essential fire safety or related safety system, general needs lighting, or socket-outlets provided for cleaning or maintenance) was introduced in 422.2 by A2:2022; the 2023 corrigendum limited it to the firefighting lobby, shaft or staircase of a protected escape route, and A4:2026 carries it forward in a new UK-specific regulation in the 422.2 group using the terms fire-fighting shaft and protected stairway.","r":"422.2 · changed by A2","n":"","k":3751,"m":"A2","f":"Index: 'escape routes' or 'protected escape route'. Go to Chapter 42, the 422.2 group, and find the UK regulation listing what may be installed in a fire-fighting shaft or protected stairway.","w":{"0":"Fire-resistant cable alone doesn't qualify; it must serve an essential fire safety system, general needs lighting or cleaning sockets.","2":"AFDD protection doesn't permit cables in these areas.","3":"Data circuits aren't on the permitted list."}},{"id":"a4.p4.09","t":"5","c":0,"q":"Regulation 443.4.2 requires protection against switching overvoltages to be considered where which of the following applies?","o":["The installation is supplied by an underground cable","The installation contains only resistive heating loads","Equipment likely to produce switching overvoltages is installed, such as motors, transformers or capacitor banks","The installation forms part of a single dwelling"],"a":2,"x":"443.4.2 requires protection against overvoltages to be considered for equipment likely to produce switching overvoltages or disturbances exceeding the rated impulse voltage of equipment (Table 443.2), e.g. inductive or capacitive equipment such as motors, transformers, capacitor banks, storage units or high-current loads. In 443.4 in 2018; numbered 443.4.2 from A2; not changed by A4.","r":"443.4.2","n":"","k":5009,"m":"","f":"Index: 'overvoltage, switching'. Go to Section 443, Regulation 443.4.2, and read what equipment triggers consideration.","w":{"0":"Underground supply relates to atmospheric overvoltages, not switching overvoltages.","1":"Resistive heating loads don't produce significant switching overvoltages; inductive or capacitive equipment does.","3":"Being a single dwelling isn't the trigger in 443.4.2; it's equipment producing switching overvoltages."}},{"id":"a4.p4.10","t":"5","c":0,"q":"Regulation 421.1.7 requires AFDDs, where used, to be placed at the origin of the circuit to be protected. For which of the following may the AFDD be placed at a location other than the origin of the circuit?","o":["Busbar systems to BS EN 61439-6 and powertrack systems to BS EN 61534","Ring final circuits supplying 13 A socket-outlets","Circuits supplied by a consumer unit with a non-combustible enclosure","Circuits in purpose-built student accommodation"],"a":0,"x":"A note to 421.1.7 permits the AFDD to be placed other than at the origin of the circuit for busbar systems conforming to BS EN 61439-6 and powertrack systems to BS EN 61534. Note added by A2:2022; unchanged in A4.","r":"421.1.7 · changed by A2","n":"","k":5010,"m":"A2","f":"Index: 'arc fault detection devices'. Go to Regulation 421.1.7 and read the note on where the AFDD is placed.","w":{"1":"Ring finals are ordinary socket circuits; the AFDD goes at the origin of the circuit.","2":"Consumer unit enclosure material doesn't change where the AFDD is placed.","3":"Student accommodation is about whether AFDDs are required, not where they go."}},{"id":"a4.p4.11","t":"5","c":0,"q":"Where switchgear or controlgear is placed in an escape route, what does Regulation 422.2.2 require?","o":["It shall be protected by a 30 mA RCD","It shall be mounted at least 2.5 m above floor level","It shall be of a type containing flammable liquid for arc quenching","It shall be enclosed in a cabinet or enclosure constructed of non-combustible or not readily combustible material"],"a":3,"x":"422.2.2 requires switchgear or controlgear placed in an escape route to be enclosed in a cabinet or an enclosure constructed of non-combustible or not readily combustible material; this does not apply to items installed to facilitate evacuation, such as fire alarm call points. In the 2018 text, retained by A2:2022; no change reported in A4.","r":"422.2.2","n":"","k":3882,"m":"","f":"Index: 'escape routes'. Go to Chapter 42, Regulation 422.2.2, on switchgear and controlgear in escape routes.","w":{"0":"422.2.2 is about fire, not shock; it requires a non-combustible enclosure, not an RCD.","1":"There's no 2.5 m height rule in 422.2.2.","2":"That's backwards; flammable-liquid equipment is the kind of hazard to avoid in escape routes."}},{"id":"a5.p4.12","t":"4","c":0,"q":"Within domestic (household) premises, Regulation 411.3.4 requires additional protection by an RCD with a rated residual operating current not exceeding 30 mA for which of the following?","o":["Only lighting circuits in bathrooms","AC final circuits supplying luminaires","Only luminaires installed outdoors","Only circuits supplying extra-low voltage lighting"],"a":1,"x":"411.3.4 requires 30 mA RCD additional protection for all AC final circuits supplying luminaires in domestic (household) premises. 2018 requirement; not changed by A2 or A4.","r":"411.3.4","n":"","k":5012,"m":"","f":"Index: 'additional protection' or 'luminaires, RCD'. Go to Chapter 41, Regulation 411.3.4.","w":{"0":"411.3.4 covers all AC lighting final circuits in dwellings, not just bathroom ones.","2":"It covers all luminaire circuits in household premises, not only outdoor ones.","3":"It isn't limited to ELV lighting; it covers AC final circuits supplying luminaires."}},{"id":"a5.p4.13","t":"4","c":0,"q":"Amendment 2 added a final paragraph to Regulation 411.4.2 regarding TN systems. What does it say about an additional connection to Earth by means of an earth electrode connected to the main earthing terminal?","o":["It is required for all TN-C-S (PME) installations","It is required only where the PEN conductor exceeds 16 mm²","It is prohibited because it would parallel the PEN conductor","It is recommended, but it is not a requirement"],"a":3,"x":"The A2:2022 addition to 411.4.2 is a recommendation for an additional connection to Earth via an earth electrode to the MET; as NAPIT points out, it is not a requirement. Not changed by A4.","r":"411.4.2 · changed by A2","n":"","k":5013,"m":"A2","f":"Index: 'TN systems' or 'earth electrode'. Go to Chapter 41, Regulation 411.4.2, and read the final paragraph added by A2.","w":{"0":"It isn't required for PME installations; A2 only recommends it.","1":"There's no 16 mm² PEN trigger; the paragraph is a general recommendation.","2":"It isn't prohibited; A2 recommends it."}},{"id":"a5.p4.14","t":"5","c":0,"q":"An electrician is rewiring a house in multiple occupation (HMO). Under Regulation 421.1.7, which of the following circuits must be provided with an AFDD conforming to BS EN 62606?","o":["A single-phase ring final circuit supplying 13 A socket-outlets","A single-phase final circuit supplying luminaires","A three-phase final circuit supplying 32 A industrial socket-outlets","A single-phase radial circuit supplying a 40 A cooker control unit with no socket-outlet"],"a":0,"x":"421.1.7 applies to single-phase AC final circuits supplying socket-outlets rated not exceeding 32 A, so lighting, three-phase and non-socket circuits are not caught by the mandatory requirement. Introduced by A2:2022; unchanged in A4.","r":"421.1.7 · changed by A2","n":"","k":5014,"m":"A2","f":"Index: 'arc fault detection devices'. Go to Regulation 421.1.7 and check the circuit scope: single-phase AC final circuits supplying socket-outlets not exceeding 32 A.","w":{"1":"Lighting circuits aren't caught; 421.1.7 covers socket-outlet circuits.","2":"421.1.7 applies to single-phase circuits only, not three-phase.","3":"A cooker circuit with no socket-outlet isn't covered; the rule is for socket-outlet circuits."}},{"id":"a1.p5.00","t":"8","c":0,"q":"In accordance with BS 7671:2018+A4:2026, an RCD Type AC may only be used to serve","o":["any circuit, as Type AC RCDs may be used for general purposes","fixed equipment where it is known that the load current contains no DC components","socket-outlet circuits rated up to 32 A in dwellings","EV charging circuits where an RDC-DD is also installed"],"a":1,"x":"Regulation 531.3.3 restricts Type AC RCDs to fixed equipment where the load current is known to contain no DC components. The unamended 2018 text said Type AC could be used 'for general purposes'. A2:2022 changed this, and A4 keeps it.","r":"531.3.3 · changed by A2","n":"","k":6916,"m":"A2","f":"Index: 'RCD, types' or 'residual current devices, selection'. Go to Chapter 53, Regulation 531.3.3, and read the Type AC sentence.","w":{"0":"That's the old 2018 wording; A2 restricted Type AC.","2":"Socket circuits may have DC components in the load, so Type AC isn't the intended use.","3":"EV charging needs Type A/F with an RDC-DD or Type B; Type AC isn't allowed."}},{"id":"a1.p5.01","t":"8","c":0,"q":"A protective device where the manufacturer intends a source of supply to be connected to only one defined set of connection terminals is known as a","o":["bidirectional protective device","selective (Type S) protective device","unidirectional protective device","switch-disconnector"],"a":2,"x":"This is the Part 2 definition of a unidirectional protective device. Regulation 530.3.201 requires the appropriate choice between unidirectional and bidirectional devices. Introduced by A3:2024 and retained in A4.","r":"530.3.201 · changed by A3","n":"","k":7001,"m":"A3","f":"Index: 'unidirectional' (Part 2 definitions). Cross-check Regulation 530.3.201 in Chapter 53.","w":{"0":"A bidirectional device allows a source on either or both sets of terminals.","1":"Type S is about time-delay and selectivity, not terminal direction.","3":"A switch-disconnector is an isolating switch, not defined by direction of supply."}},{"id":"a1.p5.02","t":"6","c":0,"q":"Under BS 7671:2018+A4:2026, a firefighter's switch is required","o":["in every low voltage circuit supplying outdoor lighting, whatever the lighting voltage","on every installation that includes a stationary battery system","only where the distribution network operator requests one","in locations specified by the fire engineer to support the fire strategy for the building"],"a":3,"x":"A4 redrafted Regulation 537.4.2 so that firefighter's switches are required where the fire engineer specifies them to support the fire strategy, for example for high-voltage outdoor or indoor discharge lighting. A4 also deleted 537.4.2.1.","r":"537.4.2 · changed by A4","n":"","k":8454,"m":"A4","f":"Index: 'firefighter's switch'. Go to Chapter 53, Regulation 537.4.2 (A4 wording).","w":{"0":"That's closer to the old discharge-lighting wording; A4 ties it to the fire engineer's specification.","1":"Battery systems don't automatically need one; it depends on the fire strategy.","2":"The DNO doesn't decide this; the fire engineer does."}},{"id":"a1.p5.03","t":"8","c":0,"q":"Under BS 7671:2018+A4:2026, the requirements for stationary secondary batteries whose purpose is electrical storage and supply of an installation are found in","o":["Chapter 57","Section 712","Chapter 56","Section 722"],"a":0,"x":"A4:2026 introduced a new Chapter 57, Stationary secondary batteries, covering batteries whose designed purpose is storage and supply for electrical installations. Section 712 covers solar PV, Section 722 EV charging and Chapter 56 safety services.","r":"Chapter 57 · changed by A4","n":"","k":2652,"m":"A4","f":"Index: 'batteries, stationary secondary'. Go to Part 5, new Chapter 57 (A4).","w":{"1":"Section 712 is solar PV.","2":"Chapter 56 is safety services.","3":"Section 722 is EV charging."}},{"id":"a2.p5.04","t":"7","c":0,"q":"Where SPDs are installed, an information notice indicating their presence is required","o":["at the electricity meter position only","at or near the relevant distribution board(s)","adjacent to each socket-outlet protected by the SPD","on the main earthing terminal"],"a":1,"x":"Regulation 514.16.1 requires an information notice at or near the relevant distribution board(s) where SPDs are installed. For domestic and similar installations it may be omitted if the information is recorded on the certificate. Introduced by A2:2022 and unchanged in A4.","r":"514.16.1 · changed by A2","n":"","k":7004,"m":"A2","f":"Index: 'notices' or 'surge protective devices'. Go to Chapter 51, Regulation 514.16.1.","w":{"0":"The notice goes at or near the relevant distribution board(s), not the meter.","2":"It isn't needed at every protected socket-outlet; it's at the distribution board.","3":"The MET isn't where the SPD notice goes; it's at the distribution board."}},{"id":"a2.p5.05","t":"8","c":0,"q":"Product standards require some RCCBs, RCBOs, circuit-breakers and AFDDs to be marked to show they are unidirectional. Typical marking is","o":["'in' and 'out', 'line' and 'load', or arrows","a yellow test button on the front face","the double-insulation symbol","a blue band around the operating toggle"],"a":0,"x":"The note to Regulation 530.3.201 says product standards require these devices to be marked to show if they are unidirectional, for example 'in' and 'out', 'line' and 'load', or arrows. Introduced by A3:2024 and retained in A4.","r":"530.3.201 · changed by A3","n":"","k":7005,"m":"A3","f":"Index: 'unidirectional'. Go to Regulation 530.3.201 and read the note on product marking.","w":{"1":"A test button colour has nothing to do with direction marking.","2":"The double-insulation symbol shows Class II, not direction.","3":"There's no blue toggle band; marking is 'in/out', 'line/load' or arrows."}},{"id":"a2.p5.06","t":"10","c":0,"q":"For the purposes of Regulation 551.7.2.1, a stationary secondary battery (Chapter 57) shall be treated as","o":["a load","a final circuit","an extraneous-conductive-part","a generating set"],"a":3,"x":"A4 split 551.7.2 into two regulations. 551.7.2.1 requires the generating set to be on the supply side of all protective devices, and says stationary batteries are to be treated as a generating set, not as a load.","r":"551.7.2.1 · changed by A4","n":"","k":7006,"m":"A4","f":"Index: 'generating sets' or 'batteries'. Go to Chapter 55, Regulation 551.7.2.1 (A4).","w":{"0":"551.7.2.1 says the battery is treated as a generating set, not as a load.","1":"A battery is a source, not a final circuit.","2":"An extraneous-conductive-part is about earthing, nothing to do with batteries as sources."}},{"id":"a2.p5.07","t":"8","c":0,"q":"Regulation 536.4.202 (A4) sets out how overload protection of an LV switchgear assembly such as a consumer unit is achieved. Which of the following is NOT permitted as a method?","o":["an upstream device with a rated current not exceeding the rated current of the assembly","load curtailment limiting the maximum demand","a total connected load, without diversity, not exceeding the assembly's rated current","applying diversity to the connected load"],"a":3,"x":"A4 redrafted 536.4.202. Overload protection of the assembly is met by an upstream In not exceeding InA (and Inc), by load curtailment, or by a total connected load without diversity not exceeding InA or Inc. Diversity cannot be relied on.","r":"536.4.202 · changed by A4","n":"","k":6963,"m":"A4","f":"Index: 'switchgear assembly' or 'consumer unit'. Go to Chapter 53, Regulation 536.4.202 (A4), and read the permitted methods.","w":{"0":"An upstream device not exceeding the assembly's rating is a permitted method.","1":"Load curtailment is a permitted method.","2":"Total connected load without diversity within the rating is a permitted method."}},{"id":"a3.p5.08","t":"7","c":0,"q":"For a domestic installation, the periodic inspection notice and RCD test notice may be omitted where","o":["the information is given on an up-to-date Electrical Installation Certificate with the guidance for recipients","every circuit is protected by an RCBO","the installation forms part of a TN-C-S system","the consumer unit has a non-combustible enclosure"],"a":0,"x":"A2:2022 allowed the periodic inspection (514.12.1), RCD test (514.12.2) and SPD (514.16.1) notices to be omitted in domestic and similar installations. This applies where the information is provided on the certification, with guidance for recipients. Unchanged in A4.","r":"514.12 · changed by A2","n":"","k":5865,"m":"A2","f":"Index: 'notices'. Go to Chapter 51, Regulations 514.12.1 and 514.12.2, and read the domestic exception.","w":{"1":"RCBOs on every circuit don't remove the need; the info must be on the certification.","2":"The earthing system doesn't affect the notice exception.","3":"Enclosure material is irrelevant to the notice exception."}},{"id":"a3.p5.09","t":"8","c":0,"q":"A protective device supplies a distribution board that a battery storage system can feed, so energy may flow through the device in either direction. In accordance with Regulation 530.3.201 the device should be","o":["a unidirectional device with its 'line' terminals connected to the battery","a bidirectional protective device","a Type AC RCD","a device suitable for functional switching only"],"a":1,"x":"530.3.201 (A3:2024) requires selection to take account of appropriate use of unidirectional or bidirectional devices. A bidirectional device is one where the manufacturer intends a source to be connected to either or both sets of terminals, so it suits two-way energy flow. Retained in A4.","r":"530.3.201 · changed by A3","n":"","k":7009,"m":"A3","f":"Index: 'bidirectional' or 'unidirectional'. Go to Chapter 53, Regulation 530.3.201, and the Part 2 definitions.","w":{"0":"A unidirectional device fed backwards may not work properly; two-way flow needs a bidirectional device.","2":"RCD type is about waveform; Type AC is restricted and doesn't address direction.","3":"Functional switching devices don't provide protection; a protective device is needed."}},{"id":"a3.p5.10","t":"10","c":0,"q":"Under BS 7671:2018+A4:2026, stationary secondary batteries in dwellings shall be installed in a suitable location, taking account of the manufacturer's instructions and","o":["BS 5839-6","PAS 63100","BS EN 50171","BS 5266-1"],"a":1,"x":"Regulation 570.6.7.203 (Chapter 57) requires stationary secondary batteries in dwellings to be installed in a suitable location, taking account of the manufacturer's instructions and PAS 63100. In other buildings, location and fire protection take account of the fire safety risk assessment. New in A4:2026.","r":"570.6.7.203 · changed by A4","n":"","k":7010,"m":"A4","f":"Index: 'batteries, stationary secondary'. Go to Chapter 57, Regulation 570.6.7.203, on location in dwellings.","w":{"0":"BS 5839-6 is fire detection in dwellings, not battery location.","2":"BS EN 50171 covers central safety power supply systems, not dwelling battery storage.","3":"BS 5266-1 is emergency lighting."}},{"id":"a3.p5.11","t":"7","c":0,"q":"Table 52.4 (A4) lists conductor classes. A conductor made of fine wires, which may need suitable terminals or treated ends such as crimps, is","o":["Class 1","Class 2","Class 5","Class 6"],"a":2,"x":"A4 added Table 52.4: Class 1 solid, Class 2 stranded, Class 5 fine wires (flexible), Class 6 very fine wires (flexible). Regulation 526.9.1 requires suitable terminals or suitably treated ends (e.g. crimps) for multi-wire, fine wire and very fine wire conductors, to stop the wires spreading.","r":"526.9.1 / Table 52.4 · changed by A4","n":"","k":6754,"m":"A4","f":"Index: 'conductors, class' or 'terminations'. Go to Chapter 52, Table 52.4 (A4), with Regulation 526.9.1.","w":{"0":"Class 1 is solid.","1":"Class 2 is stranded, not fine wires.","3":"Class 6 is very fine wires."}},{"id":"a4.p5.12","t":"8","c":0,"q":"Under the guidance referred to by the A4 note to Regulation 531.3.3 (Fig A53.2), which series (upstream/downstream) RCD arrangement is NOT suitable, unless the manufacturer declares otherwise?","o":["Type B upstream of Type A","Type A upstream of Type AC","Type AC upstream of Type A","Type F upstream of Type A"],"a":2,"x":"A4 added an informative note to 531.3.3: all series-connected RCDs should suit the residual current types expected (Fig A53.2). Type AC should not be upstream of Type A, F or B, and Type A should not be upstream of Type F or B.","r":"531.3.3 · changed by A4","n":"","k":6916,"m":"A4","f":"Index: 'RCD, types'. Go to Regulation 531.3.3 and its A4 note referring to Fig A53.2 in the appendix.","w":{"0":"Type B upstream of Type A is fine; B covers everything A does.","1":"Type A upstream of Type AC is fine; A covers what AC does.","3":"Type F upstream of Type A is fine; F covers what A does."}},{"id":"a4.p5.13","t":"8","c":0,"q":"The total length of the connecting conductors of an SPD assembly (a + b + c in Fig 534.8) should preferably not exceed 0.5 m and in no case exceed","o":["0.25 m","0.75 m","1.5 m","1.0 m"],"a":3,"x":"Regulation 534
