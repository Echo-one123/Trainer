.4.8 states that the total wiring length should preferably not exceed 0.5 m and in no case exceed 1.0 m. A 1 m conductor carrying 10 kA (8/20) adds about 1000 V to the protection level. 2018 text, not changed by A2–A4.","r":"534.4.8","n":"","k":6948,"m":"","f":"Index: 'surge protective devices, connecting conductors'. Go to Chapter 53, Regulation 534.4.8 and Fig 534.8.","w":{"0":"0.25 m isn't the limit; preferably 0.5 m, never more than 1.0 m.","1":"0.75 m isn't the figure; the absolute max is 1.0 m.","2":"1.5 m is too long; the absolute max is 1.0 m."}},{"id":"a4.p5.14","t":"8","c":0,"q":"New Section 545, introduced by A4:2026, covers","o":["functional earthing and functional-equipotential bonding for ICT equipment","earthing arrangements for the DC side of PV installations","supplementary bonding in locations containing a bath or shower","protective earthing of EV charging points supplied from PME"],"a":0,"x":"Section 545 is new in A4. It covers functional earthing and functional-equipotential bonding for ICT equipment, including minimum csa, identification, the main functional earthing terminal and bonding ring conductors. It keeps functional earthing separate from protective earthing.","r":"Section 545 · changed by A4","n":"","k":2460,"m":"A4","f":"Index: 'functional earthing'. Go to Chapter 54, new Section 545 (A4).","w":{"1":"PV DC earthing is in Section 712.","2":"Bathroom supplementary bonding is in Section 701.","3":"EV PME earthing is in Section 722."}},{"id":"a4.p5.15","t":"8","c":0,"q":"A4 adds the terms 'disconnector' and 'switch-disconnector' to Table 537.4. A disconnector is a device that is","o":["suitable for on-load isolation and emergency switching off","intended for functional switching only","suitable for isolation but intended to be operated off-load","designed to provide overcurrent protection"],"a":2,"x":"A disconnector is an off-load isolating device. A switch-disconnector (isolating switch) can isolate on load. A4 added both terms alongside 'isolating switch' in Table 537.4.","r":"Table 537.4 · changed by A4","n":"","k":1876,"m":"A4","f":"Index: 'isolation' or 'disconnector'. Go to Chapter 53, Table 537.4, with Part 2 definitions.","w":{"0":"On-load isolation is a switch-disconnector; a disconnector is off-load only.","1":"Functional switching only describes a switch, not an isolating device.","3":"A disconnector gives no overcurrent protection."}},{"id":"a5.p5.16","t":"8","c":0,"q":"Under BS 7671:2018+A4:2026, the colour for identifying a functional earthing conductor is","o":["cream","pink","green-and-yellow","white"],"a":1,"x":"Table 51 gives pink for functional earthing conductors. The original 2018 print said cream; this was changed to pink by the 2018 Corrigendum (to align with BS EN 60445), not by A2. A4 also uses pink for functional bonding conductors.","r":"Table 51","n":"","k":1876,"m":"","f":"Index: 'colours, identification'. Go to Chapter 51, Table 51, functional earthing conductor row.","w":{"0":"Cream was the original 2018 print, changed to pink by the 2018 Corrigendum.","2":"Green-and-yellow is protective conductors only.","3":"White isn't the functional earth colour in Table 51."}},{"id":"a5.p5.17","t":"7","c":0,"q":"The note added by A4 to Regulation 521.10.202 (support of wiring systems) clarifies that its intent is to","o":["prevent premature collapse of wiring systems that could hinder evacuation or firefighting","ensure circuit integrity of life safety circuits during a fire","limit the spread of flame along vertical cable runs","protect cables from damage by vermin"],"a":0,"x":"A4's note to 521.10.202 says the aim is to prevent the general collapse of wiring systems in a fire. It does not require circuit integrity, which Chapter 56 and BS 5839, BS 5266 and BS 8519 cover.","r":"521.10.202 · changed by A4","n":"","k":7017,"m":"A4","f":"Index: 'wiring systems, support' or 'fire'. Go to Chapter 52, Regulation 521.10.202, and read the A4 note.","w":{"1":"Circuit integrity for life safety circuits is Chapter 56 and BS 5839/5266/8519, not this regulation.","2":"Flame spread is dealt with elsewhere; this note is about premature collapse.","3":"Vermin damage isn't the purpose of 521.10.202."}},{"id":"a5.p5.18","t":"8","c":0,"q":"Which of the following is excluded from the scope of the new Chapter 57 (stationary secondary batteries)?","o":["a domestic lithium-ion battery store connected via a hybrid inverter","a battery energy storage system in a commercial building charged from PV","batteries for an emergency lighting system to the BS 5266 series","a stationary battery installed in a detached garage"],"a":2,"x":"Chapter 57 (A4:2026) excludes batteries in products covered by product safety standards, central battery systems, fire detection and alarm systems (BS 5839 series) and emergency lighting (BS 5266 series).","r":"Chapter 57 · changed by A4","n":"","k":2652,"m":"A4","f":"Index: 'batteries, stationary secondary'. Go to Chapter 57 (A4), the scope regulation and its exclusions.","w":{"0":"A domestic battery store via hybrid inverter is exactly what Chapter 57 covers.","1":"A commercial BESS charged from PV is in scope.","3":"Installing in a garage doesn't take it out of scope."}},{"id":"a5.p5.19","t":"8","c":0,"q":"Where SPDs are required by Section 443 and the structure has an external lightning protection system, the SPDs installed as close as possible to the origin shall be","o":["Type 2","Type 3","Type 3 at each socket-outlet","Type 1"],"a":3,"x":"Regulation 534.4.1.3 requires Type 1 SPDs at the origin where the structure has an external LPS or protection against direct lightning. Without one, Type 2 is used (534.4.1.4). Unchanged by A2 to A4.","r":"534.4.1.3","n":"","k":7446,"m":"","f":"Index: 'surge protective devices, selection'. Go to Chapter 53, Regulation 534.4.1.3.","w":{"0":"Type 2 is used at the origin where there's no external LPS (534.4.1.4).","1":"Type 3 is for local protection near equipment, not at the origin.","2":"Type 3 at sockets supplements protection; with an LPS, Type 1 is needed at the origin."}},{"id":"a1.p678.00","t":"11","c":0,"q":"When verifying a 30 mA general non-delay RCD provided for additional protection, BS 7671:2018+A4:2026 deems its effectiveness verified where, with an alternating current test at its rated residual operating current (IΔn), it disconnects within a maximum of","o":["40 ms","200 ms","300 ms","500 ms"],"a":2,"x":"The note to 643.8 (and 643.7.1) states that, regardless of RCD type, an AC test at IΔn with an operating time not exceeding 300 ms for a general non-delay RCD verifies effectiveness. Introduced by A2:2022, which replaced the 2018 note of 40 ms at 5 × IΔn; unchanged in A4.","r":"643.8 · changed by A2","n":"","k":10462,"m":"A2","f":"Index: 'residual current device, testing'. Go to Chapter 64, Regulation 643.8 and the note to 643.7.1 (A2).","w":{"0":"40 ms at 5 × IΔn was the old 2018 test; A2 replaced it with the IΔn test.","1":"200 ms isn't the figure; general non-delay at IΔn is 300 ms.","3":"500 ms is the S-type maximum, not general non-delay."}},{"id":"a1.p678.01","t":"12","c":0,"q":"Regulation 722.411.4.1 permits a PME earthing facility for an outdoor EV charging point where a device electrically disconnects the vehicle from the live conductors of the supply and from protective earth if the voltage between the circuit protective conductor and Earth exceeds","o":["50 V rms, within 0.4 s","70 V rms, within 5 s","25 V rms, within 5 s","70 V rms, within 0.4 s"],"a":1,"x":"722.411.4.1(iii): the device must disconnect within 5 s when the cpc-to-Earth voltage exceeds 70 V rms (it need not operate if 70 V rms is exceeded for less than 4 s) and must provide isolation. Retained after A2:2022 deleted indent (i); Section 722 PME options unchanged by A4.","r":"722.411.4.1","n":"","k":14441,"m":"","f":"Index: 'electric vehicle charging' or 'PME'. Go to Section 722, Regulation 722.411.4.1, indent (iii).","w":{"0":"50 V/0.4 s isn't the figure; it's 70 V rms within 5 s.","2":"25 V isn't in this regulation; the threshold is 70 V rms.","3":"The voltage is right but the time is 5 s, not 0.4 s."}},{"id":"a1.p678.02","t":"14","c":0,"q":"In the context of Chapter 82, a prosumer is best described as an entity that","o":["can be both a producer and a consumer of electrical energy","only exports electrical energy to the public network","distributes electricity to the public under a DNO licence","only consumes energy from local storage"],"a":0,"x":"A prosumer is an entity or party that can both produce and consume electrical energy; Chapter 82 covers their low voltage electrical installations (PEIs). Introduced by A2:2022 (new Part 8); retained in A4.","r":"Part 2 / Chapter 82 · changed by A2","n":"","k":15302,"m":"A2","f":"Index: 'prosumer' (Part 2 definitions). Then Part 8, Chapter 82.","w":{"1":"A prosumer both produces and consumes; it doesn't only export.","2":"That describes a distributor, not a prosumer.","3":"A prosumer can draw from any source, not only local storage, and also produces energy."}},{"id":"a1.p678.03","t":"14","c":0,"q":"A prosumer's electrical installation (PEI) that is being supplied by the public distribution network is operating in which mode?","o":["Island mode","Reverse feeding mode","Stand-alone mode","Direct feeding mode"],"a":3,"x":"824.2 divides operation into connected mode (direct feeding or reverse feeding) and island mode; in direct feeding mode the public network supplies the PEI. Introduced by A2:2022; retained in A4.","r":"824.2 · changed by A2","n":"","k":15303,"m":"A2","f":"Index: 'prosumer' or 'PEI'. Go to Chapter 82, Regulation 824.2 (operating modes).","w":{"0":"Island mode is disconnected from the public network.","1":"Reverse feeding is the PEI supplying the network.","2":"Stand-alone isn't one of the 824.2 modes; being network-supplied is direct feeding."}},{"id":"a1.p678.04","t":"14","c":0,"q":"Amendment 4:2026 introduced a new Chapter 81 into Part 8 of BS 7671. This chapter deals with","o":["stationary secondary batteries","power over Ethernet","energy efficiency","functional earthing of ICT equipment"],"a":2,"x":"A4 added Chapter 81 (Energy efficiency), for information only, to Part 8. Batteries are the new Chapter 57, PoE is Section 716 and ICT functional earthing is Section 545.","r":"Chapter 81 · changed by A4","n":"","k":15304,"m":"A4","f":"Index: 'energy efficiency'. Go to Part 8, Chapter 81 (A4).","w":{"0":"Stationary batteries are Chapter 57.","1":"PoE is Section 716.","3":"ICT functional earthing is Section 545."}},{"id":"a2.p678.05","t":"11","c":0,"q":"When an S-type (time-delayed) RCD is tested with an alternating current test at its rated residual operating current IΔn, its operating time should be","o":["not more than 40 ms","between 130 ms and 500 ms","not more than 300 ms","between 200 ms and 1 s"],"a":1,"x":"The A2:2022 note to 643.7.1 gives 130 ms minimum to 500 ms maximum for S-type RCDs tested at IΔn (300 ms max applies to general non-delay types). Introduced by A2; unchanged in A4.","r":"643.7.1 · changed by A2","n":"","k":10459,"m":"A2","f":"Index: 'residual current device, testing'. Go to Chapter 64, Regulation 643.7.1 and its A2 note.","w":{"0":"40 ms was the old 5 × IΔn limit for non-delay RCDs.","2":"300 ms max is for general non-delay; S-types have a 130–500 ms window.","3":"200 ms–1 s isn't the A2 S-type range; it's 130–500 ms."}},{"id":"a2.p678.06","t":"12","c":0,"q":"Since Amendment 2:2022, which one of the following is NO LONGER listed in Regulation 722.411.4.1 as a method permitting a PME earthing facility to be used for an outdoor EV charging point?","o":["An installation earth electrode limiting the MET-to-Earth voltage to 70 V rms on an open-circuit PEN","A device that disconnects the charging point when the cpc-to-Earth voltage exceeds 70 V rms","Relying on the load balance of a three-phase installation that also supplies other loads","A device or equivalent functionality that disconnects the charging point when the line-neutral voltage goes outside set limits"],"a":2,"x":"A2:2022 deleted indent (i) of 722.411.4.1, which relied on the load characteristics (balance) of a three-phase installation to keep the MET-to-Earth voltage within 70 V; the remaining indents (ii) to (v) kept their numbers. The electrode, 70 V cpc-to-Earth device and line-neutral voltage device options remain in A4.","r":"722.411.4.1 · changed by A2","n":"","k":14441,"m":"A2","f":"Index: 'electric vehicle charging' or 'PME'. Go to Section 722, Regulation 722.411.4.1, and note the deleted indent (i).","w":{"0":"The earth electrode option (ii) is still listed.","1":"The 70 V cpc-to-Earth device (iii) is still listed.","3":"The line-neutral voltage device option is still listed."}},{"id":"a2.p678.07","t":"14","c":0,"q":"A PEI whose solar PV and battery storage are exporting energy to the public distribution network is operating in","o":["direct feeding mode","reverse feeding mode","island mode","standby mode"],"a":1,"x":"824.2: in connected mode, reverse feeding is where the PEI (through its generation and/or storage) supplies the public network. Introduced by A2:2022; retained in A4.","r":"824.2 · changed by A2","n":"","k":15307,"m":"A2","f":"Index: 'prosumer' or 'PEI'. Go to Chapter 82, Regulation 824.2.","w":{"0":"Direct feeding is the network supplying the PEI.","2":"Island mode is disconnected from the network.","3":"Standby isn't one of the 824.2 modes."}},{"id":"a2.p678.08","t":"14","c":0,"q":"Within a PEI, the electrical energy management system (EEMS) is a system that","o":["monitors, manages, operates and controls parts of the prosumer's installation","isolates the PEI from the network under fault conditions only","provides earth fault protection for the battery system","meters energy for billing by the supplier"],"a":0,"x":"The EEMS (825.1, defined in Part 2) monitors and controls the PEI, balancing generation, storage and loads and exchanging data with the DSO where required. Introduced by A2:2022; retained in A4.","r":"825.1 · changed by A2","n":"","k":15308,"m":"A2","f":"Index: 'electrical energy management system'. Go to Chapter 82, Regulation 825.1, with the Part 2 definition.","w":{"1":"Fault isolation is a protection function, not the EEMS role.","2":"Earth fault protection is by protective devices, not the EEMS.","3":"Billing metering is a supplier function, not the EEMS."}},{"id":"a2.p678.09","t":"14","c":0,"q":"What did Amendment 4:2026 do with Appendix 17 (Energy efficiency)?","o":["Retained it unchanged as an informative appendix","Made it a normative appendix","Moved it into Chapter 57","Deleted it, with energy efficiency now covered by Chapter 81"],"a":3,"x":"A4 deleted Appendix 17 and introduced Chapter 81 (Energy efficiency) in Part 8 in its place. Appendix 17 had been informative since the 2018 edition.","r":"Appendix 17 · changed by A4","n":"","k":15309,"m":"A4","f":"Index: 'energy efficiency'. Check the A4 contents: Appendix 17 deleted, Part 8 Chapter 81 added.","w":{"0":"A4 didn't keep it; it deleted Appendix 17.","1":"It was never made normative; it was deleted.","2":"Chapter 57 is batteries; energy efficiency went to Chapter 81."}},{"id":"a3.p678.10","t":"11","c":0,"q":"A 230 V circuit includes a fixed socket-outlet with an integral SPD that cannot reasonably be disconnected. For the insulation resistance test of that circuit, BS 7671 permits","o":["the test voltage to be reduced to 250 V DC, with a minimum insulation resistance of 1 MΩ","the test voltage to be reduced to 250 V DC, with a minimum insulation resistance of 0.5 MΩ","the test to be omitted and recorded as N/A","the test to be carried out at 1000 V DC with a minimum of 1 MΩ"],"a":0,"x":"643.3.2: where SPDs cannot reasonably be disconnected (e.g. a fixed socket-outlet incorporating an SPD), the test voltage may be reduced to 250 V DC but the insulation resistance must be at least 1 MΩ. 2018 text; unchanged in A2 and A4.","r":"643.3.2","n":"","k":10583,"m":"","f":"Index: 'insulation resistance'. Go to Chapter 64, Regulation 643.3.2, and Table 64.","w":{"1":"0.5 MΩ is the SELV/PELV minimum; with 250 V here it still must be 1 MΩ.","2":"The test can't be omitted; reduce to 250 V DC.","3":"1000 V would damage the SPD; the voltage is reduced, not raised."}},{"id":"a3.p678.11","t":"12","c":0,"q":"Where an EV charging point with a BS EN 62196 socket-outlet is protected by a Type A RCD and DC fault protection is provided by a residual direct current detecting device (RDC-DD), the RDC-DD should comply with","o":["BS EN 61008-1","BS EN 62423","BS EN 61851-1","BS IEC 62955"],"a":3,"x":"722.531.3.101: unless the charging equipment provides it, DC fault protection is by a Type B RCD, or a Type A or Type F RCD with an RDC-DD complying with BS IEC 62955. Introduced by A1:2020 and retained in A2 and A4.","r":"722.531.3.101","n":"","k":14011,"m":"","f":"Index: 'electric vehicle charging' or 'RDC-DD'. Go to Section 722, Regulation 722.531.3.101.","w":{"0":"BS EN 61008-1 is RCCBs, not RDC-DDs.","1":"BS EN 62423 is Type F and Type B RCDs.","2":"BS EN 61851-1 is EV charging systems generally."}},{"id":"a3.p678.12","t":"14","c":0,"q":"A PEI that has been disconnected from the public distribution network but remains energised by its own solar PV and battery storage is operating in","o":["reverse feeding mode","direct feeding mode","island mode","connected mode"],"a":2,"x":"824.2: in island mode the PEI is disconnected from the public network but remains energised by local generation and storage. Introduced by A2:2022; retained in A4.","r":"824.2 · changed by A2","n":"","k":15312,"m":"A2","f":"Index: 'prosumer' or 'PEI'. Go to Chapter 82, Regulation 824.2.","w":{"0":"Reverse feeding needs a network connection.","1":"Direct feeding is the network supplying the PEI.","3":"Connected mode means connected to the network, the opposite of this case."}},{"id":"a3.p678.13","t":"14","c":0,"q":"Regulation 822.1 recommends that a means of storing energy is provided within a PEI, particularly where","o":["the PEI is supplied by a TT system","island mode operation is expected or self-consumption is to be maximised","the PEI has no solar PV","the maximum demand exceeds 100 A"],"a":1,"x":"822.1 recommends energy storage within a PEI, especially where island mode is expected or self-consumption must be maximised during low generation and high demand. Introduced by A2:2022; retained in A4.","r":"822.1 · changed by A2","n":"","k":15313,"m":"A2","f":"Index: 'prosumer' or 'energy storage'. Go to Chapter 82, Regulation 822.1.","w":{"0":"TT earthing isn't the reason given in 822.1.","2":"A PEI without PV isn't the trigger; island mode or self-consumption is.","3":"There's no 100 A demand threshold in 822.1."}},{"id":"a3.p678.14","t":"14","c":0,"q":"Chapter 81 (Energy efficiency), added by Amendment 4:2026, is for information only. It points out that statutory requirements for the conservation of energy in buildings are found in","o":["the Building Regulations (in Scotland, Section 6 of the Building Standards Technical Handbooks)","the Electricity at Work Regulations 1989","the ESQCR 2002","Section 551 of BS 7671"],"a":0,"x":"Chapter 81 refers to the Building Regulations for England and Wales, Scotland (Section 6 of the Technical Handbooks) and Northern Ireland for energy conservation requirements. New in A4.","r":"Chapter 81 · changed by A4","n":"","k":15314,"m":"A4","f":"Index: 'energy efficiency'. Go to Part 8, Chapter 81 (A4), and read its opening statutory note.","w":{"1":"EAWR 1989 covers electrical safety at work, not energy conservation.","2":"ESQCR covers supply and distribution safety, not energy conservation.","3":"Section 551 is generating sets, not energy conservation law."}},{"id":"a4.p678.15","t":"11","c":0,"q":"Under BS 7671:2018+A4:2026, an observation on an Electrical Installation Condition Report given the code FI (further investigation)","o":["must be upgraded to C2 before the report is issued","automatically makes the overall assessment unsatisfactory","requires the installation to be isolated","should not, by itself, result in an unsatisfactory overall assessment"],"a":3,"x":"The A4 EICR notes in Appendix 6 confirm that issuing an FI code should not result in an unsatisfactory outcome; only C1 and C2 observations make the outcome unsatisfactory. Changed by A4.","r":"653 / Appendix 6 · changed by A4","n":"","k":10470,"m":"A4","f":"Index: 'condition report' or 'classification codes'. Go to Chapter 65 (653) and the Appendix 6 EICR notes (A4).","w":{"0":"FI doesn't have to be upgraded to C2.","1":"Only C1 and C2 make the outcome unsatisfactory.","2":"FI doesn't require isolation; that's a C1 situation."}},{"id":"a4.p678.16","t":"12","c":0,"q":"EV charging equipment installed outdoors must be selected to protect against water splashes (AD4) with a degree of protection of at least","o":["IPX2","IPX4","IPX6","IPX7"],"a":1,"x":"722.512.2.201: where installed outdoors, the equipment shall have at least IPX4 (BS EN 60529) to protect against water splashes (AD4). Also IP4X for solid foreign bodies (AE3). 2018 text; retained in later amendments.","r":"722.512.2.201","n":"","k":14480,"m":"","f":"Index: 'electric vehicle charging, external influences'. Go to Section 722, Regulation 722.512.2.201.","w":{"0":"IPX2 is dripping water when tilted; AD4 splashes need IPX4.","2":"IPX6 is powerful jets, beyond the minimum.","3":"IPX7 is temporary immersion, beyond the minimum."}},{"id":"a4.p678.17","t":"14","c":0,"q":"Before the generation within a PEI is reconnected in parallel with the public network after island mode, it must be synchronised with the network in","o":["current, power factor and frequency","voltage magnitude only","frequency, phase and voltage magnitude","harmonic content and current"],"a":2,"x":"A PEI can switch between operating modes (824.2), but embedded generation must be synchronised in frequency, phase and voltage magnitude before reconnection and meet Section 551 (551.7 prefers automatic synchronising considering frequency, phase and voltage). Chapter 82 introduced by A2:2022.","r":"824.2 / 551.7 · changed by A2","n":"","k":15317,"m":"A2","f":"Index: 'generating sets, parallel operation'. Go to Chapter 55, Regulation 551.7, and Chapter 82 (824.2).","w":{"0":"Synchronising matches frequency, phase and voltage, not current or power factor.","1":"Voltage alone isn't enough; frequency and phase must match too.","3":"Harmonics and current aren't synchronising parameters."}},{"id":"a4.p678.18","t":"14","c":0,"q":"A group of prosumers who share a communal generation source that is managed on behalf of the whole group form which type of PEI?","o":["Collective","Individual","Shared","Islanded"],"a":0,"x":"Chapter 82 describes three PEI types: individual (one installation), collective (a group sharing a communal source managed for the group) and shared (prosumers coordinating their individual supplies into a common source). Introduced by A2:2022; retained in A4 (824).","r":"824 · changed by A2","n":"","k":15318,"m":"A2","f":"Index: 'prosumer'. Go to Chapter 82 (824) and the PEI types.","w":{"1":"Individual is one prosumer's installation.","2":"Shared is prosumers coordinating their own supplies into a common source, not a managed communal one.","3":"Islanded is an operating mode, not a PEI type."}},{"id":"a4.p678.19","t":"14","c":0,"q":"Chapter 81 of BS 7671:2018+A4:2026 refers to which standard for recommendations on energy efficiency of low voltage electrical installations?","o":["BS EN 61851-1","BS EN 62446-1","BS 7909","BS HD 60364-8-1"],"a":3,"x":"Chapter 81 (new in A4) refers to BS HD 60364-8-1 for energy efficiency recommendations; BS EN 61851 is EV charging equipment, BS EN 62446-1 PV testing and BS 7909 temporary installations.","r":"Chapter 81 · changed by A4","n":"","k":15319,"m":"A4","f":"Index: 'energy efficiency'. Go to Part 8, Chapter 81 (A4), and the standard it refers to.","w":{"0":"BS EN 61851-1 is EV charging.","1":"BS EN 62446-1 is PV system testing.","2":"BS 7909 is temporary installations."}},{"id":"a5.p678.20","t":"11","c":0,"q":"Regulation 653.2 of BS 7671:2018+A4:2026 requires an Electrical Installation Condition Report to include","o":["photographic evidence of every C3 observation","a schedule of thermographic images","guidance for the recipient(s) based on the model in Appendix 6","a copy of the previous EIC"],"a":2,"x":"A4 changed 653.2 so that the report must include guidance for the recipient(s) based on the Appendix 6 model; a new note says photographic and/or thermographic images CAN be appended (they are not required). Changed by A4.","r":"653.2 · changed by A4","n":"","k":10852,"m":"A4","f":"Index: 'condition report'. Go to Chapter 65, Regulation 653.2 (A4 wording).","w":{"0":"Photos may be appended but aren't required.","1":"Thermographic images may be appended but aren't required.","3":"A copy of the previous EIC isn't a 653.2 requirement."}},{"id":"a5.p678.21","t":"12","c":0,"q":"Except where electrical separation is used, each EV charging point must be protected by","o":["an RCD of any type with a rated residual operating current not exceeding 30 mA, which may be shared with other charging points","a 100 mA Type A RCD shared with other circuits","a 300 mA Type S RCD at the origin","its own individual RCD with a rated residual operating current not exceeding 30 mA that disconnects all live conductors"],"a":3,"x":"722.531.3.101: except for electrical separation, each charging point is protected individually by an RCD with IΔn not exceeding 30 mA, and the RCD must disconnect all live conductors (722.531.3.1). DC fault protection then requires Type B, or Type A/F with an RDC-DD, so Type AC is never adequate. Introduced by A1:2020; retained in A2 and A4.","r":"722.531.3.101","n":"","k":14021,"m":"","f":"Index: 'electric vehicle charging, RCD'. Go to Section 722, Regulations 722.531.3.101 and 722.531.3.1.","w":{"0":"Each charging point needs its own RCD, and not any type; Type AC is never acceptable.","1":"100 mA is too high and the RCD can't be shared.","2":"300 mA Type S at the origin doesn't give per-point 30 mA protection."}},{"id":"a5.p678.22","t":"14","c":0,"q":"A PEI is typically made up of four functions: supply, distribution system, consumption and","o":["metering","energy management","earthing","protection"],"a":1,"x":"Chapter 82 describes a PEI as typically comprising supply, distribution system, consumption and energy management (the latter via an EEMS). Introduced by A2:2022; retained in A4 (823 PEI concept).","r":"823 · changed by A2","n":"","k":15322,"m":"A2","f":"Index: 'prosumer'. Go to Chapter 82, Regulation 823 (PEI concept).","w":{"0":"Metering isn't one of the four functions.","2":"Earthing isn't one of the four PEI functions.","3":"Protection isn't one of the four PEI functions."}},{"id":"a5.p678.23","t":"14","c":0,"q":"Which statement about a prosumer's low voltage electrical installation (PEI) is correct?","o":["It must always be connected to the public distribution network","It must not include energy storage","It may or may not be connected to a public distribution network","It cannot supply energy to the public network"],"a":2,"x":"A PEI is an LV installation that can both consume and produce electrical energy and may or may not be connected to a public distribution network. Introduced by A2:2022; retained in A4.","r":"821 / Part 2 · changed by A2","n":"","k":15323,"m":"A2","f":"Index: 'prosumer'. Go to Chapter 82 (821) and the Part 2 PEI definition.","w":{"0":"A PEI may or may not be connected to the network.","1":"Energy storage is common in a PEI and recommended by 822.1.","3":"A PEI can export (reverse feeding mode)."}},{"id":"a5.p678.24","t":"14","c":0,"q":"Part 8 of BS 7671:2018+A4:2026, which contains Chapters 81 and 82, is titled","o":["Special installations or locations","Functional requirements","Selection and erection of equipment","Inspection and testing"],"a":1,"x":"Part 8 is 'Functional requirements' (Part 7 is special installations or locations, Part 5 selection and erection, Part 6 inspection and testing). Part 8 was created by A2:2022 with Chapter 82; A4 added Chapter 81.","r":"Part 8 · changed by A2","n":"","k":15324,"m":"A2","f":"Check the contents list at the front of the book: Part 8 heading, Chapters 81 and 82.","w":{"0":"Special installations or locations is Part 7.","2":"Selection and erection is Part 5.","3":"Inspection and testing is Part 6."}}];

const METHODS=[
 {id:"zs",name:"Maximum Zs and the 0.8 rule",re:/loop impedance|\bZs\b|Table 41\.[2-4]|0\.8\b|Type [BCD] (circuit|column)|Ia = \d+ ×/i,
  find:"Index: 'earth fault loop impedance'. Tables 41.2 (fuses, 0.4 s), 41.3 (circuit-breakers), 41.4 (fuses, 5 s). The 0.8 rule for measured values is in Appendix 3.",
  steps:["Decide the disconnection time: final circuits up to 63 A with sockets, or up to 32 A fixed, need 0.4 s on TN. Distribution circuits and bigger final circuits get 5 s (Table 41.1, 411.3.2).","Pick the right table for the device: BS 88-2 / BS 88-3 / BS 3036 / BS 1362 fuses → 41.2 (0.4 s) or 41.4 (5 s) (BS 1361 has been replaced by BS 88-3); BS EN 60898 MCBs and RCBOs → 41.3.","Read across the device rating and type. For a circuit-breaker the formula check is Zs = 230 × 0.95 ÷ Ia, where Ia = 5 × In for Type B, 10 × In for Type C, 20 × In for Type D.","If the question gives a measured value (at room temperature), multiply the table value by 0.8 before comparing."],
  ex:"32 A Type B: Ia = 5 × 32 = 160 A<br>230 × 0.95 = 218.5<br>218.5 ÷ 160 = 1.37 Ω (Table 41.3)<br>Measured limit: 1.37 × 0.8 = 1.09 Ω",
  trap:"Using the 5 s table for a final circuit, or forgetting the 0.8 for a measured reading."},
 {id:"adi",name:"Adiabatic equation (cpc size or time)",re:/adiabatic|√\s*t|I²t|k²S²|S = I|csa of (a|the) protective conductor|for a protective conductor material/i,
  find:"Index: 'adiabatic equation'. Regulation 543.1.3 (protective conductors) and 434.5.2 (fault current). k values: Table 43.1 for live conductors, Tables 54.2 to 54.6 for protective conductors.",
  steps:["Write it down: S = √(I² × t) ÷ k, which is the same as I × √t ÷ k.","Square-root the time first (√t), then multiply by the fault current I.","Divide by k (from the table the question points you to).","Round UP to the next standard size: 1.0, 1.5, 2.5, 4, 6, 10, 16, 25, 35, 50 mm². Never round down.","For time instead of size: t = k² × S² ÷ I², which is the same as (k × S ÷ I)²."],
  ex:"I = 1500 A, t = 0.4 s, k = 115<br>√0.4 = 0.632<br>1500 × 0.632 = 948.7<br>948.7 ÷ 115 = 8.25 mm² → 10 mm²",
  trap:"Squaring the time instead of square-rooting it, or rounding down to the nearest size."},
 {id:"vd",name:"Voltage drop",re:/voltage drop|mV\/A\/m|\bVd\b/i,
  find:"Index: 'voltage drop'. Limits are Table 4Ab (Appendix 4, section 6.4): 3 % lighting, 5 % other uses on a public LV supply. mV/A/m values are the voltage drop tables that go with each cable type in Appendix 4.",
  steps:["Find mV/A/m in the Appendix 4 voltage drop table for that cable (single-phase uses the 2-core / single-phase column, three-phase the 3- or 4-core column).","Multiply: mV/A/m × Ib × L, using the design current Ib, not the device rating In.","Divide by 1000 to turn millivolts into volts.","Compare: 3 % of 230 V = 6.9 V (lighting), 5 % = 11.5 V (other). For 400 V three-phase: 12 V and 20 V."],
  ex:"18 mV/A/m, Ib = 20 A, L = 15 m<br>18 × 20 = 360<br>360 × 15 = 5400 mV<br>5400 ÷ 1000 = 5.4 V (under 11.5 V, so OK)",
  trap:"Using In instead of Ib, or forgetting to divide by 1000."},
 {id:"tt",name:"TT systems: Ra × IΔn ≤ 50 V",re:/\bR\s?A\b|Ra ×|IΔn ≤|50 ÷|earth electrode resistance.*RCD|TT system.*RCD/i,
  find:"Index: 'TT system'. Regulation 411.5.3 and Table 41.5.",
  steps:["The rule: Ra × IΔn ≤ 50 V.","To find the maximum electrode resistance: Ra = 50 ÷ IΔn.","Put IΔn in amps: 30 mA = 0.03 A, 100 mA = 0.1 A, 300 mA = 0.3 A.","To find the largest RCD for a given Ra: IΔn = 50 ÷ Ra."],
  ex:"IΔn = 100 mA = 0.1 A<br>50 ÷ 0.1 = 500 Ω",
  trap:"Leaving IΔn in milliamps (50 ÷ 30 gives 1.67, not 1667)."},

 "1":{find:"Part 1: 110.1 lists what's included, 110.2 what's excluded. Chapter 13 has the fundamental principles. Statutory regulations are listed in Appendix 2.",tips:["Learn the two lists in 110.1 and 110.2. Exam favourites: EV charging, prefabricated buildings and highway equipment are in; lightning protection, public distribution systems, ships and offshore installations are out.","BS 7671 is not statutory, but it can be used in court as evidence of meeting statutory rules such as the Electricity at Work Regulations (114.1).","Chapter 13 questions often just reword a line from 131 or 132. Find the key noun in the stem and scan for it."]},

 "5":{find:"Chapter 42 (fire and burns, AFDDs at 421.1.7), Chapter 43 (overcurrent, adiabatic at 434.5.2), Section 443 (surge protection).",tips:["Overload: Ib ≤ In ≤ Iz and I2 ≤ 1.45 Iz. BS 3036 fuses need Iz ≥ In ÷ 0.725.","AFDDs (421.1.7): required for single-phase socket circuits up to 32 A in high-rise residential buildings (A2 wording: 'higher risk residential buildings'), HMOs, purpose-built student accommodation and care homes. Recommended everywhere else.","Surge protection (443.4): required where an overvoltage could cause serious injury or loss of life, failure of a safety service, or significant financial or data loss. In all other cases it's required unless the owner declares it isn't needed."]},

 "12":{find:"Part 7, by section number: 701 bathrooms, 702 pools, 703 saunas, 704 construction sites, 705 farms, 708 caravan parks, 709 marinas, 711 exhibitions, 722 EV charging.",tips:["Go straight to the section number and look for the 7xx.4xx regulation (protection), 7xx.5xx (selection and erection) or 7xx.3x (zones/assessment).","Bathrooms: zone 0 IPX7, zones 1 and 2 IPX4. All circuits in the location need 30 mA RCD protection. Supplementary bonding can be left out if all the conditions in 701.415.2 are met.","EV charging (722): on a PME supply the earth can't simply be used for an outdoor charge point. Check 722.411.4.1 for the allowed options."]},

// ================= 1. Calculation generator =================
function rint(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function rpick(a){return a[Math.floor(Math.random()*a.length)]}
function r2(x){return Math.round(x*100)/100}
function f2(x){return r2(x).toFixed(2)}
const STD=[1,1.5,2.5,4,6,10,16,25,35,50,70,95,120];
function nextStd(s){return STD.find(v=>v>=s-1e-9)||STD[STD.length-1]}
function prevStd(s){const l=STD.filter(v=>v<s);return l.length?l[l.length-1]:STD[0]}
// build options: correct first in list, then distractors; dedupe; shuffle
function mkQ(mth,t,q,correct,wrongs,x,f){
  const seen=new Set([correct]);const ws=[];
  for(const w of wrongs){if(ws.length<3&&!seen.has(w.v)){seen.add(w.v);ws.push(w)}}
  let k=2;while(ws.length<3){const v=correct+" ("+k+")";ws.push({v,why:"Not a value the working gives."});k++}
  const all=[{v:correct,ok:true},...ws];for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]]}
  const w={};all.forEach((o,i)=>{if(!o.ok)w[i]=o.why});
  return {t,c:1,mth,q,o:all.map(o=>o.v),a:all.findIndex(o=>o.ok),x,f,w,r:"",n:""};
}

const REFRE=/^(\d{3}(?:\.\d+)*(?:\s?\([ivx]+\))?|Table\s+\w+(?:\.\w+)?|Appendix\s+\d+|Section\s+7\d\d|Chapter\s+\d+)/i;
function refOf(Q){const m=(Q.r||"").trim().match(REFRE);return m?m[1].replace(/\s+/g," "):null}
function findSet(n){
  const pool=QS.filter(q=>refOf(q));const out=[];const used=new Set();
  const allRefs=[...new Set(pool.map(refOf))];let tries=0;
  while(out.length<n&&tries++<500){const q=rpick(pool);if(used.has(q.id))continue;used.add(q.id);
    const ref=refOf(q);let pool2=[...new Set(pool.filter(o=>o.t===q.t&&refOf(o)!==ref).map(refOf))];
    if(pool2.length<3)pool2=pool2.concat(allRefs.filter(r=>r!==ref&&!pool2.includes(r)).sort(()=>Math.random()-.5).slice(0,6));
    const others=[];while(others.length<3&&pool2.length){const r=pool2.splice(Math.floor(Math.random()*pool2.length),1)[0];if(r!==ref&&!others.includes(r))others.push(r)}
    if(others.length<3)continue;
    const opts=[ref,...others];for(let i=3;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
    out.push({qid:q.id,fact:q.q+" → "+q.o[q.a],o:opts,a:opts.indexOf(ref),f:q.f||""});}
  return out;
}

// ---------- building exams ----------
function weightFor(id,tw){
  const s=PR.q[id];let w;
  if(!s)w=1;else{const last=s[2].slice(-1),last2=s[2].slice(-2);w=last==="0"?3:last2==="11"?.15:.4}
  return w*tw;
}
function topicWeight(tid){const st=topicStats(tid);if(st.n<5)return 1.3;return Math.max(.25,1.7-st.acc*1.5)}
function pick(pool,n,seed){
  const r=rng(seed),tw={};TOPIC_ORDER.forEach(t=>tw[t]=topicWeight(t));
  return pool.map(id=>({id,k:Math.pow(r(),1/Math.max(1e-3,weightFor(id,tw[QI[id].t])))})).sort((a,b)=>b.k-a.k).slice(0,n).map(o=>o.id);
}
function smartList(n){
  const seed=Date.now()%1e9,all=QS.map(q=>q.id);
  // one from each topic first so the exam still spans the book, then fill by weakness
  const first=TOPIC_ORDER.map((t,i)=>pick(BYTOPIC[t]||[],1,seed+i)[0]).filter(Boolean);
  const rest=pick(all.filter(id=>!first.includes(id)),n-first.length,seed+99);
  return bookSort(first.concat(rest).slice(0,n));
}
function weakTopics(){return TOPICS.map(t=>({t,st:topicStats(t.id)})).filter(o=>o.st.n>=5&&o.st.acc<.6).sort((a,b)=>a.st.acc-b.st.acc)}
function weakList(n){
  const w=weakTopics().slice(0,4).map(o=>o.t.id);if(!w.length)return smartList(n);
  const pool=[].concat(...w.map(t=>BYTOPIC[t]));return bookSort(pick(pool,Math.min(n,pool.length),Date.now()%1e9));
}
function topicList(tid,n){return bookSort(pick(BYTOPIC[tid],Math.min(n,BYTOPIC[tid].length),Date.now()%1e9))}

function why(Q){
  let h="";if(Q.x)h+=`<div class="work">${Q.x}</div>`;

  if(Q.n)h+=`<div class="ref">Note: ${esc(Q.n)}</div>`;return h;
}
function coach(Q,chosen){
  // shown when the answer was wrong (or skipped)
  const m=methodFor(Q);let h="";
  if(chosen!=null&&Q.w&&Q.w[chosen])h+=`<div class="tip wrong"><b>Where it went wrong</b><span>You picked ${LETTERS[chosen]}: ${esc(Q.w[chosen])}</span></div>`;
  else if(chosen==null)h+=`<div class="tip wrong"><b>Not answered</b><span>A blank scores nothing. Always put your best guess down.</span></div>`;
  if(Q.f)h+=`<div class="tip find"><b>How to find it in the book</b><span>${esc(Q.f)}</span></div>`;
  if(NOTQ.test(Q.q)&&chosen!=null)h+=`<div class="tip"><b>Watch the wording</b><span>This is a NOT-type question. Find the three options that ARE in the regulation; the one left over is the answer.</span></div>`;
  if(m)h+=methodCard(m,true);
  return h;
}
function methodCard(m,collapsed){
  const body=`<ol>${m.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><div class="ex"><b>Worked example</b><div>${m.ex}</div></div><div class="ref">Find it: ${esc(m.find)}</div><div class="ref">Common trap: ${esc(m.trap)}</div>`;
  return collapsed?`<details class="tip method"><summary><b>Method: ${esc(m.name)}</b></summary>${body}</details>`:`<div class="panel method"><h3>${esc(m.name)}</h3>${body}</div>`;
}
function methodStats(){
  const out={};METHODS.forEach(m=>out[m.id]={m,r:0,n:0});
  QS.forEach(q=>{const s=PR.q[q.id];if(!s)return;const m=methodFor(q);if(!m)return;for(const c of s[2]){out[m.id].n++;if(c==="1")out[m.id].r++}});
  Object.entries(PR.cs||{}).forEach(([k,v])=>{if(!out[k])return;for(const c of v){out[k].n++;if(c==="1")out[k].r++}});
  return Object.values(out);
}

      <div class="nav">
        <button class="btn" id="prev" ${i===0?"disabled":""}>Back</button>
        <button class="btn ${S.flag[i]?"flagged":""}" id="flag" aria-pressed="${S.flag[i]}">${S.flag[i]?"Flagged":"Flag"}</button>
        <span class="grow"></span>
        ${practice&&!locked?`<button class="btn primary" id="check" ${answered(i)?"":"disabled"}>Check</button>`:""}
        <button class="btn ${practice&&!locked?"":"primary"}" id="next">${i===n-1?"Finish":"Next"}</button>
      </div>
      <details class="map"><summary>Question map</summary><div class="grid">${cells}</div>
        <div class="legend"><span><i style="background:var(--sunk)"></i>Answered</span><span><i style="background:var(--flag);border-color:var(--flag)"></i>Flagged</span>${practice?`<span><i style="background:var(--good-soft);border-color:var(--good)"></i>Right</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>Wrong</span>`:""}</div></details>
      <p class="note" style="margin-top:16px">Keys: A–D to answer, arrow keys to move.</p>
    </div>${confirmOpen?confirmHTML():""}`;
  app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{S.ans[i]=+b.dataset.o;save();render()});
  app.querySelector("#prev").onclick=()=>go(i-1);
  app.querySelector("#next").onclick=()=>{if(i===n-1){confirmOpen=true;render()}else go(i+1)};
  app.querySelector("#flag").onclick=()=>{S.flag[i]=!S.flag[i];save();render()};
  const ck=app.querySelector("#check");if(ck)ck.onclick=()=>{S.checked[i]=true;if(!S.rec[i]){S.rec[i]=true;record(S.qids[i],isRight(i))}save();render()};
  app.querySelector("#home").onclick=()=>{save();view="home";render()};
  app.querySelector("#finish").onclick=()=>{confirmOpen=true;render()};
  app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>go(+b.dataset.j));
  if(confirmOpen)wireConfirm();
  if(!practice&&!S.done){let last=Date.now();
    tick=setInterval(()=>{const now=Date.now();S.left-=(now-last)/1000;last=now;
      const t=document.getElementById("timer");if(t){t.textContent=fmt(S.left);t.classList.toggle("low",S.left<600)}
      if(Math.round(S.left)%10===0)save();
      if(S.left<=0){S.left=0;submit(true)}},1000)}
}
function go(j){if(j<0||j>=N())return;S.cur=j;save();render();window.scrollTo(0,0)}
function confirmHTML(){
  const un=S.qids.filter((_,k)=>!answered(k)).length,fl=S.flag.filter(Boolean).length;
  return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">Finish and mark?</h2>
    <p class="muted" style="margin:0">${un?`<b style="color:var(--bad)">${un} unanswered.</b> A blank scores nothing; a guess has a 1 in 4 chance.`:"All questions answered."} ${fl?`${fl} still flagged.`:""}</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="back">Back</button><button class="btn primary" id="submit">Mark it</button></div></div></div>`}
function wireConfirm(){app.querySelector("#back").onclick=()=>{confirmOpen=false;render()};app.querySelector("#submit").onclick=()=>submit(false);app.querySelector("#back").focus()}
function submit(timeUp){
  clearInterval(tick);confirmOpen=false;S.done=true;S.timeUp=timeUp;
  S.qids.forEach((id,k)=>{if(!S.rec[k]&&(answered(k)||S.mode==="exam")){S.rec[k]=true;record(id,isRight(k))}});
  S.score=S.qids.filter((_,k)=>isRight(k)).length;
  if(S.pid==="daily")markDaily();
  PR.hist.push({pid:S.pid,name:S.name,score:S.score,n:N(),pct:pct(S.score,N()),mode:S.mode,ts:Date.now()});
  if(PR.hist.length>200)PR.hist=PR.hist.slice(-200);
  delete PR.cur[S.pid];persist();view="results";reviewFilter="wrong";render();window.scrollTo(0,0);
}
function marksWent(by){
  const items=[];
  const blanks=S.qids.filter((_,k)=>!answered(k)).length;
  if(blanks)items.push(`<li><b>${blanks} left blank.</b> That's ${blanks} marks given away. Always guess and flag it.</li>`);
  if(S.mode==="exam"&&(S.timeUp||S.left<N()*SECS_PER_Q*.03))items.push(`<li><b>Time was tight.</b> Two minutes a question: if you can't find it in two minutes, guess, flag and move on.</li>`);
  const notW=S.qids.map((_,k)=>k).filter(k=>NOTQ.test(q(k).q)&&answered(k)&&!isRight(k)).length, notN=S.qids.filter((_,k)=>NOTQ.test(q(k).q)).length;
  if(notW>=2)items.push(`<li><b>${notW} of ${notN} NOT-type questions wrong.</b> Read the stem twice and rule out the three that ARE true.</li>`);
  const amW=S.qids.map((_,k)=>k).filter(k=>q(k).m&&!isRight(k)).length;
  if(amW>=2)items.push(`<li><b>${amW} questions on amended rules wrong.</b> These changed in A2 to A4. Try the Amendment changes exam.</li>`);
  // calc methods missed in this attempt
  const mm={};S.qids.forEach((_,k)=>{if(isRight(k))return;const m=methodFor(q(k));if(m)mm[m.id]=(mm[m.id]||0)+1});
  const ms=Object.entries(mm).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([id,n])=>METHODS.find(m=>m.id===id));
  // weakest topics in this attempt
  const wt=by.filter(o=>o.n>=2&&o.r/o.n<.6).sort((a,b)=>a.r/a.n-b.r/b.n).slice(0,3);
  if(!items.length&&!ms.length&&!wt.length)return "";
  const tt=wt.map(o=>{const T=TOPIC_TIPS[o.t.id];return `<div class="tblock"><b>${o.t.name}: ${o.r}/${o.n}</b><div class="ref">Where to look: ${esc(T.find)}</div><ul>${T.tips.slice(0,2).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}).join("");
  return `<div class="panel" style="margin-top:12px"><h3 style="font-size:17px">Where the marks went</h3>
    ${items.length?`<ul class="tl">${items.join("")}</ul>`:""}${tt}
    ${ms.map(m=>methodCard(m,true)).join("")}
    <p class="note" style="margin-top:8px">Each wrong answer below shows where it went wrong and how to find the right answer in the book.</p></div>`;
}
function renderResults(){
  const n=N(),score=S.score,p=pct(score,n),pass=score>=PASSN();
  const by=TOPICS.map(t=>{const idx=S.qids.map((_,k)=>k).filter(k=>q(k).t===t.id);return {t,r:idx.filter(isRight).length,n:idx.length}}).filter(o=>o.n);
  const rows=by.map(o=>{const f=o.r/o.n,col=f>=.6?"var(--good)":"var(--bad)";return `<div class="lorow"><div class="t">${o.t.name}</div><div class="n">${o.r}/${o.n}</div><div class="meter"><i style="width:${f*100}%;background:${col}"></i><span class="pl" style="left:60%"></span></div></div>`}).join("");
  const list=S.qids.map((_,k)=>k).filter(k=>reviewFilter==="all"||(reviewFilter==="wrong"&&!isRight(k))||(reviewFilter==="flag"&&S.flag[k]));
  const items=list.map(k=>{const Q=q(k),r=isRight(k),sk=!answered(k);
    const opts=Q.o.map((t,d)=>{let cls="opt";if(d===Q.a)cls+=" right";else if(S.ans[k]===d)cls+=" wrong";return `<div class="${cls}"><span class="key">${LETTERS[d]}</span><span>${esc(t)}</span></div>`}).join("");
    const w=why(Q);
    return `<div class="card"><div class="row" style="justify-content:space-between"><b>Question ${k+1}</b><span class="tag ${sk?"s":r?"r":"w"}">${sk?"Not answered":r?"Correct":"Wrong"}</span></div><div class="lo">${TP[Q.t].name}${Q.m?` <span class="amd">${Q.m}</span>`:""}</div>
      <div class="stem" style="font-size:16px">${esc(Q.q)}</div><div class="opts">${opts}</div>${w?`<div class="explain ${r?"ok":"no"}">${w}</div>`:""}${r?"":coach(Q,S.ans[k])}</div>`}).join("")||`<p class="muted">Nothing to show for this filter.</p>`;
  const lost=marksWent(by);
  const nWrong=S.qids.filter((_,k)=>!isRight(k)).length,nFlag=S.flag.filter(Boolean).length;
  app.innerHTML=`<div class="wrap">
    <div class="eyebrow">${esc(S.name)} · ${S.mode==="exam"?"exam mode":"practice mode"}${S.timeUp?" · time ran out":""}</div>
    <h1>Your result</h1>
    <div class="score"><div class="big">${score}<span class="muted" style="font-size:.5em">/${n}</span></div>
      <div><div class="verdict ${pass?"pass":"fail"}">${pass?"PASS":"NOT YET"} · ${p}%</div>
      <div class="muted" style="font-size:14px;margin-top:6px">${pass?`${score-PASSN()} above`:`${PASSN()-score} short of`} the 60% line.${S.mode==="exam"?` Time used ${fmt(n*SECS_PER_Q-S.left)}.`:""}</div></div></div>
    ${lost}
    <div class="panel" style="margin-top:12px"><h3 style="font-size:17px">By topic</h3><p class="note" style="margin:4px 0 6px">The mark on each bar is 60%. Every answer has gone into your progress.</p>${rows}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="prog">See my progress</button>${weakTopics().length?`<button class="btn" data-go="weak">Practise weak areas</button>`:""}</div>
    <div class="row" style="justify-content:space-between;margin-top:22px"><h2>Review</h2>
      <div class="filters"><button class="chip" data-f="wrong" aria-pressed="${reviewFilter==="wrong"}">Wrong (${nWrong})</button><button class="chip" data-f="flag" aria-pressed="${reviewFilter==="flag"}">Flagged (${nFlag})</button><button class="chip" data-f="all" aria-pressed="${reviewFilter==="all"}">All ${n}</button></div></div>
    <div class="review">${items}</div>
    <div class="row" style="margin-top:22px"><button class="btn" id="home">All exams</button></div></div>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{reviewFilter=b.dataset.f;render()});
  app.querySelector("#home").onclick=()=>{view="home";tab="exams";render();window.scrollTo(0,0)};
  app.querySelector("#prog").onclick=()=>{view="home";tab="progress";render();window.scrollTo(0,0)};
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{delete PR.cur[b.dataset.go];start(defFor(b.dataset.go),false)});
}
document.addEventListener("keydown",e=>{
  if(view!=="exam"||confirmOpen)return;const k=e.key.toUpperCase();
  if(k.length===1&&"ABCD".includes(k)){const b=app.querySelector(`[data-o="${"ABCD".indexOf(k)}"]`);if(b&&!b.disabled)b.click()}
  else if(e.key==="ArrowRight"){const n=app.querySelector("#next");n&&n.click()}
  else if(e.key==="ArrowLeft")go(S.cur-1);
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&S&&!S.done&&view==="exam")save()});
render();

</script>

</body>
</html>
