<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="18th Edition (BS 7671:2018+A4:2026) exam trainer: 859 questions, book-order exams, progress tracking and tips.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="18th Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b5cad">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0;padding:0}</style>
<title>18th Edition Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --sunk:#e8ecf0; --line:#d3d9e0;
  --ink:#16202b; --muted:#566373; --faint:#8894a2;
  --accent:#0b5cad; --accent-ink:#ffffff; --accent-soft:#dcebfa;
  --flag:#b86a00; --flag-soft:#fbead0;
  --good:#1d7a45; --good-soft:#dcf1e3; --bad:#b3261e; --bad-soft:#f8dedb;
  --display:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#172029; --sunk:#1e2833; --line:#2c3845;
  --ink:#e6ecf2; --muted:#a3b0bd; --faint:#6f7d8b;
  --accent:#5aa7f2; --accent-ink:#0b1622; --accent-soft:#1b3550;
  --flag:#f0a640; --flag-soft:#3a2a12;
  --good:#5cc98a; --good-soft:#16321f; --bad:#f07d74; --bad-soft:#3a1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#172029; --sunk:#1e2833; --line:#2c3845;
  --ink:#e6ecf2; --muted:#a3b0bd; --faint:#6f7d8b;
  --accent:#5aa7f2; --accent-ink:#0b1622; --accent-soft:#1b3550;
  --flag:#f0a640; --flag-soft:#3a2a12;
  --good:#5cc98a; --good-soft:#16321f; --bad:#f07d74; --bad-soft:#3a1a18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(28px,5vw,40px);line-height:1.1}
h2{font-size:22px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.flagged{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Home */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-block:20px}
.fact{background:var(--surface);padding:12px 14px}
.fact b{display:block;font:600 22px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted)}
.papers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.paper h3{font-size:20px}
.paper .stat{font-size:13px;color:var(--muted);min-height:2.6em}
.paper .row .btn{flex:1;min-width:0}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.mode button{border:0;background:none;padding:9px 14px;color:var(--muted);font-weight:600}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.note{font-size:14px;color:var(--muted);max-width:65ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}

/* Exam */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .title{font:700 16px var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font:600 18px var(--mono);font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px;background:var(--sunk)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.progress{height:4px;background:var(--sunk)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-block:18px 10px}
.qnum{font:700 24px var(--display)}
.lo{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.scenario{background:var(--sunk);border-radius:6px;padding:10px 12px;font-size:14px}
.stem{font-size:17px;font-weight:500;max-width:70ch}
.instr{font:600 13px var(--body);color:var(--accent);letter-spacing:.02em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:12px 14px}
.opt:hover{border-color:var(--accent)}
.opt .key{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font:600 13px var(--mono);color:var(--muted)}
.opt.multi .key{border-radius:5px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .key{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .key{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt span:last-child{min-width:0}
.explain{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:14px}
.explain.ok{border-color:var(--good)} .explain.no{border-color:var(--bad)}
.explain b{display:block;margin-bottom:2px}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.nav .grow{flex:1}
.map{margin-top:22px}
.map summary{cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:10px}
.cell{height:36px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--mono);position:relative}
.cell.done{background:var(--sunk);color:var(--ink)}
.cell.cur{border:2px solid var(--accent);color:var(--accent)}
.cell.fl::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--flag)}
.cell.r{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.cell.w{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.5);display:grid;place-items:center;padding:16px;z-index:20}
.dialog{background:var(--surface);border-radius:12px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}

/* Results */
.score{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-block:18px}
.big{font:600 56px/1 var(--mono);font-variant-numeric:tabular-nums}
.verdict{font:700 18px var(--display);padding:6px 12px;border-radius:6px;letter-spacing:.04em}
.verdict.pass{background:var(--good-soft);color:var(--good)}
.verdict.fail{background:var(--bad-soft);color:var(--bad)}
.meter{position:relative;height:12px;background:var(--sunk);border-radius:6px;margin-top:6px}
.meter i{display:block;height:100%;border-radius:6px}
.meter .pl{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.lorow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;padding-block:6px}
.lorow .t{font-size:14px}
.lorow .n{font:600 14px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.lorow .meter{grid-column:1/-1;margin:0;height:8px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.review{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.tag{font:600 12px var(--body);padding:2px 8px;border-radius:999px}
.tag.r{background:var(--good-soft);color:var(--good)} .tag.w{background:var(--bad-soft);color:var(--bad)} .tag.s{background:var(--sunk);color:var(--muted)}
@media (max-width:520px){.stem{font-size:16px}.big{font-size:44px}.bar .title{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.top{position:sticky;top:0;z-index:6;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:880px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 17px var(--display);flex:1;min-width:0}
.tabs{display:inline-flex;background:var(--sunk);border-radius:var(--r);padding:3px}
.tabs button{border:0;background:none;color:var(--muted);font-weight:600;padding:7px 16px;border-radius:6px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hero{margin-block:8px 6px}.hero .note{margin-top:8px}
.modebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-block:16px 4px}
.sec{margin:28px 0 12px}
.paper.hi{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.fact b small{font-size:14px;color:var(--muted)}
.pill{font:600 12px var(--body);padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.strong{background:var(--good-soft);color:var(--good)}.pill.ok{background:var(--flag-soft);color:var(--flag)}.pill.weak{background:var(--bad-soft);color:var(--bad)}
.tracker{padding:4px 16px}
.trk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.trk:last-child{border-bottom:0}
.trk .tn b{display:block;font-weight:600}.trk .tn small,.trow small,.hrow small{display:block;color:var(--muted);font-size:12px}
.trk .meter{grid-column:1/2;margin:0;height:8px}
.trk .btn{grid-column:2;grid-row:2}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.sw h3{font-size:17px;margin-bottom:4px}
.panel h3{font-size:17px}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.kind b{display:block;font:600 24px var(--mono)}.kind span{font-size:13px;color:var(--muted)}
.hist{position:relative;display:flex;align-items:flex-end;gap:6px;height:120px;margin:12px 0 8px;border-bottom:1px solid var(--line)}
.hb{flex:1;max-width:40px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.hb i{display:block;width:100%;border-radius:4px 4px 0 0}.hb span{font:600 11px var(--mono);color:var(--muted);margin-top:2px}
.pl60{position:absolute;left:0;right:0;bottom:60%;border-top:1px dashed var(--faint)}
.hrow{display:flex;justify-content:space-between;gap:12px;padding-block:8px;border-top:1px solid var(--line);font-size:14px}
.hrow b{font:600 14px var(--mono);white-space:nowrap}.hrow b.g{color:var(--good)}.hrow b.b{color:var(--bad)}
.dialog.wide{max-width:560px;max-height:88vh;overflow:auto}
.tlist{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:10px 12px}
.trow:hover{border-color:var(--accent)}
.work{margin-top:4px;font-variant-numeric:tabular-nums}.ref{margin-top:6px;color:var(--muted);font-size:13px}
@media (max-width:520px){.papers{grid-template-columns:1fr}.bar .title{flex-basis:100%}.top .in{gap:6px}.brand{flex-basis:100%;font-size:15px}.tabs{flex:1}.tabs button{flex:1;padding:7px 8px}}
.amd{display:inline-block;font:600 11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-left:4px;vertical-align:1px}
.tip{display:block;border-radius:var(--r);padding:10px 12px;background:var(--sunk);font-size:14px;margin-top:8px}
.tip b{display:block;margin-bottom:2px}.tip.wrong{background:var(--bad-soft)}.tip.wrong b{color:var(--bad)}
.tip.find{background:var(--accent-soft)}.tip.find b{color:var(--accent)}
.tip.method summary{cursor:pointer;list-style:none}.tip.method summary::-webkit-details-marker{display:none}
.tip.method summary b::after{content:" ▸";color:var(--muted)}.tip.method[open] summary b::after{content:" ▾"}
.tip ol,.panel.method ol,.tblock ul,.tip ul,.panel ul{margin:8px 0 4px;padding-left:20px}.tip li,.panel li{margin-bottom:4px}
.ex{margin-top:8px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--surface);border-radius:4px;font-variant-numeric:tabular-nums}
.panel.method{margin-top:8px}.tblock{margin-top:12px}.tl{margin:8px 0;padding-left:20px}
.daily{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.daily>div:first-child{flex:1;min-width:160px}.daily b{display:block;font:700 18px var(--display)}.daily span{font-size:13px;color:var(--muted)}
.daily.done{border-color:var(--line)}.streak{text-align:center}.streak b{font:600 26px var(--mono)}
.cd{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-top:14px}.cd input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.cdn{text-align:center;min-width:90px}.cdn b{display:block;font:600 44px/1 var(--mono);color:var(--accent)}.cdn span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fcard{display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;text-align:center;width:100%;min-height:300px;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.fcard.back{background:var(--accent-soft);border-color:var(--accent)}.fc-t{font:600 22px/1.35 var(--display)}
.foot{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.btn.big{padding:14px 22px;font-size:16px;width:100%;max-width:360px}
.upd{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:12px 14px;width:100%;text-align:left}
.upd b{flex-basis:100%}.upd span{flex:1;font-size:14px;color:var(--muted)}.upd.top{margin-bottom:14px}
</style>

</head>

<script>
const QS=[{"id":"mp1.1","t":"1","c":0,"q":"Which is included in the scope of BS 7671:18?","o":["Electric vehicle charging","Equipment of motor vehicles","Equipment of fixed offshore installations","Systems for the distribution of electricity to the public"],"a":0,"x":"","r":"110.1.1 (xxiii) P. 20","n":"","k":1000000.0,"m":"","f":"Part 1, Chapter 11. Index: 'scope'. Reg 110.1.1 lists what is included; 110.2 lists exclusions.","w":{"1":"Equipment of motor vehicles is listed as an exclusion in 110.2, not in the scope.","2":"Fixed offshore installations are excluded by 110.2.","3":"The public distribution network is the DNO's side, excluded by 110.2."}},{"id":"mp1.2","t":"1","c":0,"q":"Which is excluded from the scope of BS 7671:18?","o":["Prefabricated buildings","Maintenance gangways","Highway street furniture","Lightning protection systems"],"a":3,"x":"","r":"110.2 (ix) P. 21","n":"","k":1000001.0,"m":"","f":"Part 1, Reg 110.2 (exclusions from scope). Index: 'scope' or 'exclusions from scope'; lightning protection is covered by BS EN 62305 instead.","w":{"0":"Prefabricated buildings are included in the scope list at 110.1.1.","1":"Operating and maintenance gangways are a Part 7 special location (Section 729), so they're in scope.","2":"Highway power supplies and street furniture are in scope (Section 714)."}},{"id":"mp1.3","t":"1","c":0,"q":"BS 7671:18 sets out the technical requirements to enable electrical installations to conform with the?","o":["Fundamental principles of chapter 1","Fundamental principles of chapter 13","Electricity Safety, Quality and Continuity Regulations","Requirements of Health and Safety at Work Regulations"],"a":1,"x":"","r":"chapter 13  131 P.22","n":"","k":1000002.0,"m":"","f":"Part 1, Chapter 13 'Fundamental principles'. Reg 131 sets the safety principles; read the opening of Chapter 13 and Reg 120 (object).","w":{"0":"Chapter 1 is not the source of the principles; they are in Chapter 13.","2":"ESQCR are statutory rules mainly for distributors; BS 7671 is written to meet Chapter 13's principles.","3":"BS 7671 is a non-statutory standard; its technical rules serve Chapter 13, not H&S legislation directly."}},{"id":"mp1.4","t":"1","c":0,"q":"Which is not a method of providing fault protection?","o":["Preventing current from passing through a body","Limiting the current which can pass through a body","Preventing the reduction in resistance of a body","Limiting the duration of current flow through a body"],"a":2,"x":"","r":"131.2.2 P. 23","n":"","k":1000003.0,"m":"","f":"Chapter 13, Reg 131.2.2 'Fault protection'. It lists three methods: prevent current through the body, limit the current, limit the duration.","w":{"0":"Preventing current passing through a body is method (i) in 131.2.2.","1":"Limiting the current to a non-hazardous value is a listed method.","3":"Limiting the duration of current flow is a listed method (that's what ADS does)."}},{"id":"mp1.5","t":"2","c":0,"q":"Which describes a neutral conductor?","o":["A line conductor","A PEN conductor","A phase conductor","A live conductor connected to the neutral  point of a system"],"a":3,"x":"","r":"","n":"","k":1000004.0,"m":"","f":"Part 2 Definitions, under 'Neutral conductor'. Compare with 'Line conductor' and 'PEN conductor' nearby.","w":{"0":"A line conductor is energised in normal use but is not connected to the neutral point.","1":"A PEN conductor combines protective and neutral functions; it's not the definition of a neutral.","2":"'Phase' is the old term for a line conductor, not the neutral."}},{"id":"mp1.6","t":"2","c":0,"q":"A non-stationary unit containing equipment for demonstration purposes is defined as:","o":["A stand","A show","A booth","A caravan"],"a":2,"x":"","r":"","n":"","k":1000005.0,"m":"","f":"Part 2 Definitions, under 'Booth'. Compare with 'Stand' and 'Show' just below in the S section.","w":{"0":"A stand is an area or temporary structure for display, marketing or sales, not a non-stationary unit.","1":"A show is a display or presentation in a room, building or temporary structure.","3":"A caravan is a leisure accommodation vehicle (Section 721), not a demonstration unit."}},{"id":"mp1.7","t":"3","c":0,"q":"Which is a requirement where an installation contains a number of final circuits?","o":["Each circuit is connected to a separate protective device","Each protective device must be of the same type and rating","Every protective device must have a different rated current","Every protective device must have a different prospective fault current rating"],"a":0,"x":"","r":"314 P.56","n":"","k":1000006.0,"m":"","f":"Part 3, Section 314 'Division of installation'. Reg 314.4: each final circuit connected to a separate way in a distribution board.","w":{"1":"Nothing requires devices to be of the same type and rating; each is selected for its circuit.","2":"There's no requirement for every device to have a different rated current.","3":"No such rule exists; each device must simply be rated for the fault current at its point."}},{"id":"mp1.8","t":"3","c":0,"q":"What is indicated by the external influence general category code B?","o":["Environment","Evacuation","Utilisation","Construction"],"a":2,"x":"","r":"App 5 P.493","n":"","k":1000007.0,"m":"","f":"Appendix 5 (external influences). The first letter gives the category: A = environment, B = utilisation, C = construction of buildings.","w":{"0":"Environment is category A, not B.","1":"Evacuation (BD) is a sub-code within the B category, not the category itself.","3":"Construction of buildings is category C."}},{"id":"mp1.9","t":"3","c":0,"q":"Which would not be considered when determining the compatibility of equipment characteristics?","o":["Unbalanced loads","Starting currents","Power factor","AC feedback"],"a":3,"x":"","r":"331.1 P.57","n":"","k":1000008.0,"m":"","f":"Chapter 33, Reg 331.1 'Compatibility of characteristics' gives the list. Index: 'compatibility'.","w":{"0":"Unbalanced loads are listed in 331.1.","1":"Starting currents are listed in 331.1.","2":"Power factor is listed in 331.1."}},{"id":"mp1.10","t":"3","c":0,"q":"Who needs to be consulted when assessing the maintainability requirements of an electrical installation?","o":["The person responsible for the installation operation","The persons regularly using the installation","The local authority","The fire officer"],"a":0,"x":"","r":"341.1 P. 57","n":"","k":1000009.0,"m":"","f":"Chapter 34 'Maintainability', Reg 341.1. Index: 'maintainability'.","w":{"1":"341.1 names the person or body responsible for operation and/or maintenance, not general users.","2":"The local authority isn't named in 341.1.","3":"The fire officer isn't named in 341.1."}},{"id":"mp1.11","t":"3","c":0,"q":"What is listed in BS 7671:18 as a recognised electrical source for safety services?","o":["A PME supply","Storage batteries","A capacitor bank","A private supply"],"a":1,"x":"","r":"351.1 (i)  P. 58","n":"","k":1000010.0,"m":"","f":"Chapter 35 'Safety services', Reg 351.1 lists recognised sources. Index: 'safety services, sources'.","w":{"0":"A PME supply is an earthing arrangement, not a listed safety source.","2":"A capacitor bank isn't one of the four sources in 351.1.","3":"351.1 only accepts a separate feeder effectively independent of the normal one, not just 'a private supply'."}},{"id":"mp1.12","t":"3","c":0,"q":"An assessment shall be made of any need for continuity of service considered necessary during the intended life of the installation.  Which describes how this assessment is to be applied?","o":["To the complete installation","To each distribution board","To every circuit installed","To each item of equipment"],"a":2,"x":"","r":"361.1 P. 58","n":"","k":1000011.0,"m":"","f":"Chapter 36 'Continuity of service', Reg 361.1. Index: 'continuity of service'.","w":{"0":"361.1 says the assessment is made for each circuit, not the whole installation.","1":"361.1 applies it per circuit, not per distribution board.","3":"361.1 applies it per circuit, not per item of equipment."}},{"id":"mp1.13","t":"4","c":1,"q":"Which is the maximum disconnection time for a 20A, 230V, AC radial lighting circuit, within a commercial premises which forms part of a TT system?","o":["1.0s","0.4s","0.2s","0.1s"],"a":2,"x":"","r":"Table 41.1  P. 65","n":"","k":1000012.0,"m":"","f":"Chapter 41, Table 41.1. TT row, 120 V < Uo ≤ 230 V, AC column. Final circuit up to 32 A so Reg 411.3.2.2 applies.","w":{"0":"1 s is for TT distribution circuits and circuits over 32 A (411.3.2.4).","1":"0.4 s is the TN figure for 230 V; this is a TT system.","3":"0.1 s is for higher voltages (Uo over 400 V TN), not 230 V TT."}},{"id":"mp1.14","t":"4","c":0,"q":"Which formula shows the relationship between the characteristics of a protective device and the circuit impedance required to provide fault protection?","o":["Zs x Ia ≤ Uo x Cmin","Zs x Ia = Uo x Cmin","Zs x Ia ≥ Uo x Cmin","Zs x Ia x Uo x Cmin"],"a":0,"x":"","r":"411.4.4  P. 66","n":"","k":1000013.0,"m":"","f":"Chapter 41, Reg 411.4.4 (TN systems). Index: 'earth fault loop impedance, formula'.","w":{"1":"It's an inequality: Zs × Ia must not exceed Uo × Cmin, not simply equal it.","2":"The sign is reversed; Zs × Ia must be less than or equal to Uo × Cmin.","3":"That isn't a relationship at all; there's no comparison sign."}},{"id":"mp1.15","t":"4","c":1,"q":"What is the maximum tabulated earth fault loop impedance for a 63A BS 88-2 (gG) fuse supplying a distribution circuit?","o":["0.36Ω","0.44Ω","0.78Ω","0.69Ω"],"a":2,"x":"","r":"Table 41.4 for 5 secs disconnection time  P. 69","n":"","k":1000014.0,"m":"","f":"Distribution circuit, so 5 s applies (Reg 411.3.2.3). Table 41.4(a) BS 88-2, 63 A column.","w":{"0":"0.36 Ω is the 63 A BS 88-3 value from Table 41.2 (0.4 s).","1":"0.44 Ω is the 63 A BS 88-2 value for 0.4 s (Table 41.2); distribution circuits get 5 s.","3":"0.69 Ω is the 63 A Type B circuit-breaker value from Table 41.3."}},{"id":"mp1.16","t":"4","c":1,"q":"A 32A, BS EN 60898, Type C circuit breaker is installed to provide fault protection for a circuit.  What is the maximum acceptable measured Zs for the circuit?","o":["0.85Ω","0.82Ω","0.68Ω","0.54Ω"],"a":3,"x":"Table 41.3 gives 0.68 Ω for a 32 A Type C at 0.4 s. A measured value is compared against 0.8 of that:<br>0.68 × 0.8 = 0.54 Ω","r":"Calculation of 0.68x0.8","n":"","k":1000015.0,"m":"","f":"Table 41.3(b) Type C, 32 A gives the tabulated Zs; multiply by 0.8 for a measured (ambient temperature) value, per the Appendix 3 rule of thumb.","w":{"0":"0.85 Ω is 0.68 ÷ 0.8; you divided instead of multiplying by 0.8.","1":"0.82 Ω is roughly 0.68 increased by 20%; the measured limit must be lower than tabulated.","2":"0.68 Ω is the tabulated value; a measured Zs is compared against 0.8 of it."}},{"id":"mp1.17","t":"4","c":0,"q":"Basic protection by insulation of live parts requires live parts to be completely covered with insulation which can only be removed by:","o":["Heating","Destruction","A skilled person","An ordinary person"],"a":1,"x":"","r":"","n":"","k":1000016.0,"m":"","f":"Chapter 41, Section 416 (basic protection), Reg 416.1 'Basic insulation of live parts'. Index: 'insulation, basic protection'.","w":{"0":"416.1 says removal only by destruction; heating isn't mentioned.","2":"Who removes it doesn't matter; the insulation must only be removable by destroying it.","3":"Who removes it doesn't matter; it must only be removable by destruction."}},{"id":"mp1.18","t":"5","c":0,"q":"BS 7671:18 specifies particular requirements for location with a fire risk due to the nature of stored materials.  Which is the BS 7671:18 Section that contains these requirements?","o":["421","422","432","424"],"a":1,"x":"","r":"422  P. 86","n":"","k":1000017.0,"m":"","f":"Chapter 42 'Protection against thermal effects'. Section 422 covers locations with particular fire risks; 422.3 is BE2 (processed or stored materials).","w":{"0":"421 is general protection against fire caused by equipment, not specific locations.","2":"432 is about the nature of overcurrent protective devices (Chapter 43).","3":"424 covers protection against overheating, not fire-risk locations."}},{"id":"mp1.19","t":"5","c":0,"q":"In a location with a risk of fire due to the nature of materials being processed measures must be taken to limit the temperature of electrical equipment enclosures such as a heater.  Which is the maximum temperature for such enclosures under normal conditions?","o":["115°C","100°C","90°C","80°C"],"a":2,"x":"","r":"422.3.2 P. 88","n":"","k":1000018.0,"m":"","f":"Section 422, Reg 422.3.2 (BE2 locations). Index: 'enclosures, temperature' or 'heater'. It gives normal and fault condition limits.","w":{"0":"115°C is the limit under fault conditions, not normal conditions.","1":"100°C isn't a limit in 422.3.2; normal is 90°C.","3":"80°C isn't a limit in 422.3.2; normal is 90°C."}},{"id":"mp1.20","t":"5","c":0,"q":"What is the minimum distance between a 60 Watt small spot light and a combustible material?","o":["1.2m","1.0m","0.8m","0.5m"],"a":3,"x":"","r":"422.3.1 (i)  P. 87","n":"","k":1000019.0,"m":"","f":"Section 422, Reg 422.3.1 (spotlights and projectors). Find the row for ratings up to 100 W.","w":{"0":"1.2 m isn't in 422.3.1; the largest distance listed is 1.0 m.","1":"1.0 m is for lamps over 300 W up to 500 W.","2":"0.8 m is for lamps over 100 W up to 300 W."}},{"id":"mp1.21","t":"5","c":0,"q":"Which is the condition required to provide overload protection for a conductor?","o":["Iz ≥ In ≥ Ib","Ib ≥ In ≥ Iz","Iz ≥ In ≤ Ib","Iz ≤ In ≥ Ib"],"a":0,"x":"","r":"433.1.1 P. 95","n":"","k":1000020.0,"m":"","f":"Chapter 43, Reg 433.1.1. Index: 'overload protection'. Ib ≤ In ≤ Iz, written either way round.","w":{"1":"That's reversed; design current must be the smallest and Iz the largest.","2":"The second sign is wrong; In must be at least Ib, not less than it.","3":"The first sign is wrong; Iz must be at least In."}},{"id":"mp1.22","t":"5","c":0,"q":"Which formula is used to determine the time for a fault current to raise the temperature of a conductor from maximum normal operating temperature to its limiting temperature?","o":["t = k²S² ÷ I²","t = I² ÷ (S²k²)","t = k²I² ÷ S²","t = I²S² ÷ k²"],"a":0,"x":"","r":"","n":"The source paper printed two identical options here; the fourth option has been rewritten so all four differ. The answer is unchanged.","k":1000021.0,"m":"","f":"Chapter 43, Reg 434.5.2 (adiabatic equation). Index: 'fault current, time'.","w":{"1":"Inverted; t = k²S² ÷ I², so I² goes on the bottom.","2":"k and S go on top together; I² is the divisor, not S².","3":"Inverted; k and S belong on top with I² below."}},{"id":"mp1.23","t":"5","c":1,"q":"Which value of ‘k’ is used to determine the time for a 185 mm², 70°C, thermoplastic cable with copper conductors to reach its limiting temperature?","o":["68","76","103","115"],"a":3,"x":"","r":"115   Table 43.1 P. 99","n":"","k":1000022.0,"m":"","f":"Table 43.1 (with Reg 434.5.2). Column: 70°C thermoplastic, ≤ 300 mm²; row: copper conductor.","w":{"0":"68 is for aluminium, 70°C thermoplastic, over 300 mm².","1":"76 is for aluminium, 70°C thermoplastic, up to 300 mm².","2":"103 is for copper over 300 mm²; 185 mm² is under 300."}},{"id":"mp1.24","t":"5","c":0,"q":"What is not listed in BS 7671 as a typical source of electromagnetic disturbance?","o":["Electric motors","Welding machines","Ring final circuits","Fluorescent lighting"],"a":2,"x":"","r":"444.4.1 P. 110","n":"","k":1000023.0,"m":"","f":"Chapter 44, Reg 444.4.1 lists potential sources of electromagnetic disturbance. Index: 'electromagnetic disturbances'.","w":{"0":"Electric motors are in the 444.4.1 list.","1":"Welding machines are in the 444.4.1 list.","3":"Fluorescent lighting is in the 444.4.1 list."}},{"id":"mp1.25","t":"5","c":0,"q":"What is the minimum nominal diameter for a bonding ring network conductor?","o":["10mm","8mm","6mm","4mm"],"a":1,"x":"","r":"444.5.3  P. 116","n":"","k":1000024.0,"m":"","f":"Section 444, Reg 444.5.3 'Sizing of copper bonding ring network conductors'. Index: 'bonding ring conductor'.","w":{"0":"10 mm isn't in 444.5.3; the round diameter is 8 mm.","2":"6 mm is too small; 444.5.3 requires 8 mm round.","3":"4 mm is too small; 444.5.3 requires 8 mm round."}},{"id":"mp1.26","t":"6","c":0,"q":"What is required for all single-phase equipment which requires separate control by the user?","o":["A functional switch","A double pole switch","A contactor","An isolator"],"a":0,"x":"","r":"463 P. 125, Part 2 P. 35","n":"","k":1000025.0,"m":"","f":"Chapter 46, Section 463 'Functional switching' (Reg 463.1). Index: 'functional switching'.","w":{"1":"463.1.2 says functional switches need not switch all live conductors.","2":"A contactor is one possible device, but the requirement is for functional switching.","3":"Isolation is for safety when working, not user control of equipment."}},{"id":"mp1.27","t":"6","c":0,"q":"Which are the requirements for a main switch in a dwelling connected to a single – phase supply and operated by ordinary persons?","o":["Switch the supply off load and double pole","Switch the supply on load and single pole","Switch the supply on load and double pole","Switch the supply off load and single pole"],"a":2,"x":"","r":"462 P.124","n":"","k":1000026.0,"m":"","f":"Chapter 46, Reg 462.1.201. Index: 'main switch'. It must switch on load and break both live conductors for ordinary persons.","w":{"0":"A main switch must be capable of switching on load, not off load.","1":"Single pole isn't enough; 462.1.201 requires both live conductors interrupted.","3":"Wrong on both counts; it must be on load and double pole."}},{"id":"mp1.28","t":"7","c":0,"q":"The Bi-colour green and yellow is used for the identification of protective conductors only.  Which is the maximum ratio to be used for these colours?","o":["20% to 80%","25% to 75%","30% to 70%","50% to 50%"],"a":2,"x":"","r":"514.4.2  P.  132","n":"","k":1000027.0,"m":"","f":"Chapter 51, Reg 514.4.2 'Protective conductor'. Index: 'colour identification, protective conductor'.","w":{"0":"Not the ratio given; each colour must cover at least 30% and at most 70%.","1":"Not the ratio given; the limits are 30% and 70%.","3":"50/50 is allowed but isn't the maximum ratio; the limits are 30/70."}},{"id":"mp1.29","t":"7","c":0,"q":"Where an enclosure contains equipment with a nominal voltage exceeding 230V to Earth a label warning of the maximum voltage to Earth shall be fitted.  This label should be located so that:","o":["It is visible only once the supply is isolated","It is visible before accessing the live parts","It is adjacent to the live terminals","It is visible at all times"],"a":1,"x":"","r":"514.10.1  P. 135","n":"","k":1000028.0,"m":"","f":"Chapter 51, Reg 514.10.1. Index: 'warning notices, voltage'.","w":{"0":"The point is to warn before anyone reaches live parts, not after isolation.","2":"Being next to the terminals means you're already at live parts; it must be seen before access.","3":"514.10.1 asks for visibility before access to live parts, not at all times."}},{"id":"mp1.30","t":"7","c":0,"q":"A durable label must be permanently fixed at the point of connection of every bonding conductor to an extraneous conductive part where voltage is not expected.  What is the wording to be contained on the label?","o":["Safety Electrical Earth – Do Not Remove","Safety Electrical Bonding – Do Not Remove","Safety Electrical Terminal – Do Not Remove","Safety Electrical Connection – Do Not Remove"],"a":3,"x":"","r":"514.13.1  P.136","n":"","k":1000029.0,"m":"","f":"Chapter 51, Reg 514.13.1. Index: 'warning notices, earthing and bonding connections'. The label is to BS 951.","w":{"0":"Wrong wording; 514.13.1 says 'Safety Electrical Connection – Do Not Remove'.","1":"Wrong wording; the label says 'Connection', not 'Bonding'.","2":"Wrong wording; the label says 'Connection', not 'Terminal'."}},{"id":"mp1.31","t":"7","c":0,"q":"Which is not a suitable method of fixing a wiring system so they are not liable to premature collapse in the event of a fire?","o":["Plastic clips","Copper clips","Steel conduit","Metallic cable ties"],"a":0,"x":"","r":"521.10.202  P. 141","n":"","k":1000030.0,"m":"","f":"Chapter 52, Reg 521.10.202 (support against premature collapse in fire). Index: 'wiring systems, premature collapse'.","w":{"1":"Copper clips are metallic and are acceptable fixings.","2":"Steel conduit is a suitable support method.","3":"Metallic cable ties are an accepted fixing; plastic ties and clips alone are not."}},{"id":"mp1.32","t":"3","c":0,"q":"What does the external influence category AK relate to?","o":["Fauna","Flora","Solar radiation","Seismic effects"],"a":1,"x":"","r":"522.9 P.144 App 5  P. 493","n":"","k":1000031.0,"m":"","f":"Appendix 5, codes AK to AN. Also Reg 522.9 (flora and mould growth).","w":{"0":"Fauna is AL.","2":"Solar radiation is AN.","3":"Seismic effects are AP."}},{"id":"mp1.33","t":"7","c":1,"q":"A cable is installed with 200mm of the run where it is totally surrounded by thermal insulation.  Which is the derating factor to be applied to the current carrying capacity of the cable?","o":["0.88","0.78","0.63","0.51"],"a":2,"x":"","r":"appendix 4","n":"","k":1000032.0,"m":"","f":"Chapter 52, Table 52.2 'Cable surrounded by thermal insulation' (Reg 523.9). Read the 200 mm row.","w":{"0":"0.88 is for 50 mm in insulation.","1":"0.78 is for 100 mm in insulation.","3":"0.51 is for 400 mm in insulation."}},{"id":"mp1.34","t":"7","c":1,"q":"What is the minimum csa of a sheathed cable having aluminium conductors and supplying a power circuit?","o":["25mm²","16mm²","10mm²","6mm²"],"a":1,"x":"","r":"148","n":"","k":1000033.0,"m":"","f":"Chapter 52, Table 52.3 'Minimum cross-sectional area'. Row: sheathed cables, power circuits, aluminium.","w":{"0":"25 mm² isn't the Table 52.3 minimum; aluminium is 16 mm².","2":"10 mm² is the copper bare conductor power figure, not aluminium sheathed.","3":"6 mm² isn't listed for aluminium; the minimum is 16 mm²."}},{"id":"mp1.35","t":"4","c":1,"q":"An installation forming part of a TT system has fault protection provided by an RCD with an IΔn of 300mA.  Which is the maximum acceptable earth electrode resistance for this installation?","o":["50Ω","100Ω","167Ω","500Ω"],"a":2,"x":"Ra × IΔn ≤ 50 V, so Ra ≤ 50 ÷ IΔn<br>50 ÷ 0.3 = 167 Ω","r":"158","n":"","k":1000034.0,"m":"","f":"Chapter 41, Reg 411.5.3 (TT): Ra × IΔn ≤ 50 V. Rearrange to Ra = 50 ÷ IΔn.","w":{"0":"You've used the 50 V figure itself as the resistance; divide it by IΔn.","1":"100 Ω is 50 ÷ 0.5, i.e. a 500 mA RCD, not 300 mA.","3":"500 Ω is 50 ÷ 0.1, i.e. a 100 mA RCD, not 300 mA."}},{"id":"mp1.36","t":"8","c":1,"q":"An RCD with IΔn of 30mA is installed upstream of a Residual Current Monitor (RCM). What is the recommended setting for the RCM?","o":["30mA","20mA","15mA","10mA"],"a":2,"x":"Reg 538.4.1 recommends the RCM is set at half the RCD’s IΔn:<br>30 ÷ 2 = 15 mA","r":"538.4.1 P.190","n":"","k":1000035.0,"m":"","f":"Chapter 53, Reg 538.4.1 (RCMs). It recommends the RCM is set at no more than half the upstream RCD's IΔn.","w":{"0":"Same as the RCD; the RCM would give no warning before the RCD trips.","1":"20 mA is more than half of 30 mA.","3":"10 mA is lower than the recommended half; it's not the recommended setting."}},{"id":"mp1.37","t":"9","c":0,"q":"Which is the earthing arrangement which requires provision for the main earthing terminal of the installation to be connected to the earthed point of the source of energy?","o":["TN-C-S","TN-S","TT","IT"],"a":1,"x":"","r":"542.1.2 P.197","n":"","k":1000036.0,"m":"","f":"Chapter 54, Reg 542.1.2 (earthing arrangements by system type). Index: 'main earthing terminal'.","w":{"0":"In TN-C-S the MET is connected by the distributor to the supply neutral (PEN), not separately to the source earth.","2":"TT uses an installation earth electrode, not a connection to the source.","3":"IT has the source isolated from earth or earthed via impedance; the MET goes to an electrode."}},{"id":"mp1.38","t":"9","c":0,"q":"Which is the maximum required csa for a copper bonding conductor in an installation forming part of a TN-S system?","o":["16mm²","25mm ²","35mm²","50mm²"],"a":1,"x":"","r":"544.1 P.205","n":"","k":1000037.0,"m":"","f":"Chapter 54, Reg 544.1.1 (main protective bonding). Non-PME: half the earthing conductor, min 6 mm², need not exceed 25 mm² copper.","w":{"0":"16 mm² isn't the cap; 544.1.1 says need not exceed 25 mm².","2":"35 mm² is a PME (Table 54.8) size; TN-S caps at 25 mm².","3":"50 mm² is from Table 54.8 for PME; TN-S caps at 25 mm²."}},{"id":"mp1.39","t":"10","c":0,"q":"An electric motor must be provided with control equipment incorporating means of protection against overload if the rating exceeds:","o":["370w","350w","300w","270w"],"a":0,"x":"","r":"552.1 P. 212","n":"","k":1000038.0,"m":"","f":"Chapter 55, Reg 552.1.2 (rotating machines). Index: 'motors, overload protection'. Rating exceeding 0.37 kW.","w":{"1":"350 W is below the 0.37 kW threshold in 552.1.2.","2":"300 W is below the 0.37 kW threshold.","3":"270 W is below the 0.37 kW threshold."}},{"id":"mp1.40","t":"10","c":0,"q":"A standby generator is installed to provide a switched alternative to public supply system.  Which is not a precaution to be taken to prevent the generator operating in parallel with the public supply?","o":["A system of locks with a single transferable key","A three position break before make changeover switch","An automatic changeover switch with interlock","An arrangement with separate switches for each supply"],"a":3,"x":"","r":"551.6.1 P.211","n":"","k":1000039.0,"m":"","f":"Chapter 55, Reg 551.6.1 (generators as a switched alternative). Index: 'generating sets, switched alternative'.","w":{"0":"Locks with a single transferable key are a listed precaution.","1":"A three-position break-before-make changeover switch is a listed precaution.","2":"An automatic changeover with interlock is a listed precaution."}},{"id":"mp1.41","t":"10","c":0,"q":"An electrical safety service with an automatic supply is classified according to the maximum changeover time.  Which is the maximum changeover time for system classified as short break?","o":["15s","5s","0.5s","0.15s"],"a":2,"x":"","r":"560.4.1 P.226","n":"","k":1000040.0,"m":"","f":"Chapter 56, Reg 560.4.1. Index: 'safety services, changeover time'. Lists no-break, very short, short, normal, medium, long break.","w":{"0":"15 s is medium break.","1":"5 s is normal break.","3":"0.15 s is very short break."}},{"id":"mp1.42","t":"11","c":0,"q":"Which is the most appropriate document to complete and issue to the client on completion of an addition to an existing circuit?","o":["Minor Electrical installation Works Certificate","Electrical Installation Condition Report","Electrical installation Certificate","Schedule of Test Results"],"a":0,"x":"","r":"644.4.201 P.238","n":"","k":1000041.0,"m":"","f":"Part 6, Chapter 64, Reg 644.4.201. Index: 'Minor Electrical Installation Works Certificate'.","w":{"1":"An EICR is for periodic inspection of an existing installation, not new work.","2":"An EIC is for new installations or new circuits; an addition to a circuit uses a Minor Works.","3":"A Schedule of Test Results accompanies an EIC or EICR; it isn't issued on its own."}},{"id":"mp1.43","t":"11","c":0,"q":"What action must be taken with regard to any defect or omission revealed during the inspection of a new installation?","o":["Recorded on the EIC","Notified to the client","Recorded on an EICR","Corrected before certifying"],"a":3,"x":"","r":"644.1.2 P.238","n":"","k":1000042.0,"m":"","f":"Part 6, Chapter 64, Reg 644.1.2. Index: 'certification, defects'.","w":{"0":"An EIC can't be issued with defects outstanding; they must be put right first.","1":"Telling the client isn't enough for new work; defects must be corrected before certifying.","2":"An EICR is for existing installations, not new work."}},{"id":"mp1.44","t":"11","c":0,"q":"Which is the purpose of a periodic inspection and test of an electrical installation?","o":["To ensure that it does comply with the current requirements of BS 7671:18","To confirm it complies with the regulations in force at the time of its construction","To determine if it is in a satisfactory condition for continued service","To identify if there is any need for improvement in the clients maintenance regime"],"a":2,"x":"","r":"651.1 P.239","n":"","k":1000043.0,"m":"","f":"Part 6, Chapter 65, Reg 651.1. Index: 'periodic inspection and testing'.","w":{"0":"Periodic inspection doesn't require compliance with the current edition; departures are assessed for safety.","1":"Original compliance isn't the aim; it's whether it's safe for continued service.","3":"Maintenance regime is considered when setting intervals, but it isn't the purpose."}},{"id":"mp1.45","t":"11","c":0,"q":"Which is not a consideration when determining the interval to the next periodic inspection?","o":["The type of installation","The condition of appliances","The external influences","The use of the installation"],"a":1,"x":"","r":"652 P.239","n":"","k":1000044.0,"m":"","f":"Part 6, Reg 652.1 'Frequency of inspection'. Index: 'periodic inspection, frequency'.","w":{"0":"Type of installation is listed in 652.1.","2":"External influences are listed in 652.1.","3":"Use of the installation is listed in 652.1."}},{"id":"mp1.46","t":"12","c":0,"q":"In a location containing a fixed bath or shower additional protection by the use of RCDs is required.  Which low voltage circuits require RCD protection?","o":["Only circuits supplying the location","Only circuits passing through the location","Circuits passing through any part of the location","Circuits supplying the location and/or passing through Zones 1 & 2 and not serving the location."],"a":3,"x":"","r":"701.411.3.3","n":"","k":1000045.0,"m":"","f":"Part 7, Section 701, Reg 701.411.3.3 (additional protection by RCD). Index: 'bathrooms, RCDs'.","w":{"0":"Incomplete; circuits passing through zones 1 and 2 not serving the location also need RCDs.","1":"Incomplete; circuits supplying the location need RCDs too.","2":"Only circuits passing through zones 1 and 2 are caught, not any part of the location."}},{"id":"mp1.47","t":"12","c":0,"q":"What is the maximum AC voltage for SELV equipment located in Zone 1 of a swimming pool?","o":["12v","25v","30v","50v"],"a":1,"x":"","r":"702.410.3.4.1 P.248","n":"","k":1000046.0,"m":"","f":"Part 7, Section 702, Reg 702.410.3.4.1 'Zones 0 and 1'. Index: 'swimming pools, SELV'.","w":{"0":"12 V AC is the zone 0 limit, not zone 1.","2":"30 V is the zone 0 DC figure, not the zone 1 AC limit.","3":"50 V AC is the general ELV limit; zone 1 is limited to 25 V AC."}},{"id":"mp1.48","t":"12","c":0,"q":"Which exterior lighting location requires additional protection by use of an RCD?","o":["Traffic signals","Telephone kiosks","Street lights","Directional signs"],"a":1,"x":"","r":"714.411.3.4","n":"","k":1000047.0,"m":"","f":"Part 7, Section 714 (outdoor lighting), Reg 714.411.3.3 'Additional protection'. Index: 'outdoor lighting'.","w":{"0":"Traffic signals aren't in the list; 714.411.3.3 names kiosks, bus shelters, ads and town plans.","2":"Street lights aren't in the RCD list in 714.411.3.3.","3":"Directional signs aren't in the RCD list in 714.411.3.3."}},{"id":"mp1.49","t":"12","c":0,"q":"What is the minimum IP rating of EV equipment installed outdoors?","o":["IP2X","IP4X","IP44","IPX4"],"a":2,"x":"","r":"722.512.2 P.327","n":"","k":1000048.0,"m":"","f":"Part 7, Section 722, Reg 722.512.2.201 (AD) gives IPX4 and 722.512.2.202 (AE) gives IP4X. Combine them.","w":{"0":"IP2X is below the IP4X needed against very small objects.","1":"IP4X covers solid objects only; water protection (IPX4) is also required.","3":"IPX4 covers water only; IP4X for solid objects is also required."}},{"id":"mp1.50","t":"12","c":0,"q":"What is the minimum temperature withstand of cables installed in Zone 3 of a sauna?","o":["90°C","120°C","170°C","190°C"],"a":2,"x":"","r":"170°C 703.512.2 P.257","n":"","k":1000049.0,"m":"","f":"Part 7, Section 703, Reg 703.512.2 (zone 3). Index: 'saunas'. Cable insulation and sheaths figure.","w":{"0":"90°C isn't the zone 3 cable figure; it's 170°C.","1":"120°C is too low; zone 3 cables must withstand 170°C.","3":"190°C is higher than required; the minimum is 170°C."}},{"id":"mp1.51","t":"12","c":0,"q":"Which can definitely be supplied from a PME supply on a construction site?","o":["Portable hand lamps","Site Cranes","Festoon lighting","Canteens"],"a":3,"x":"","r":"704.1.1","n":"Site canteens and offices are outside the scope of Section 704, so the restrictions on PME for construction sites don’t apply to them.","k":1000050.0,"m":"","f":"Part 7, Section 704, Reg 704.1.1 (scope). Site offices, canteens and toilets are excluded from Section 704.","w":{"0":"Portable hand lamps are construction site equipment under 704 PME restrictions.","1":"Cranes are site equipment subject to 704 restrictions.","2":"Festoon lighting on site is subject to 704 restrictions."}},{"id":"mp1.52","t":"12","c":0,"q":"What is the minimum degree of impact protection to be provided by conduit in an area where mobile agricultural machines are used on a farm?","o":["2 J","5 J","10 J","20 J"],"a":1,"x":"","r":"705.522.16 P.262","n":"","k":1000051.0,"m":"","f":"Part 7, Section 705, Reg 705.522.16 (conduit and trunking where vehicles and machines are used). AG3 and impact figure.","w":{"0":"2 J is below the 5 J required by 705.522.16.","2":"10 J is more than the 5 J specified.","3":"20 J is more than the 5 J specified."}},{"id":"mp1.53","t":"14","c":0,"q":"A PEI is a set of electrical equipment that does not have the following functions?","o":["Supply","Distribution","Consumption","Special Locations"],"a":3,"x":"","r":"823 P.353","n":"","k":1000052.0,"m":"","f":"Part 8, Chapter 82 (prosumer installations), definitions in 823. Index: 'prosumer's electrical installation'.","w":{"0":"Supply is one of the PEI functions.","1":"Distribution is one of the PEI functions.","2":"Consumption is one of the PEI functions."}},{"id":"mp1.54","t":"14","c":0,"q":"Which of the following is not considered a main operating mode of a PEI?","o":["Upstream mode","Island mode","Direct feeding mode","Reverse feeding mode"],"a":0,"x":"","r":"824.2 P.354","n":"","k":1000053.0,"m":"","f":"Part 8, Reg 824.2 (operating modes of a PEI). Index: 'PEI, operating modes'.","w":{"1":"Island mode is a listed PEI operating mode.","2":"Direct feeding mode is a listed PEI operating mode.","3":"Reverse feeding mode is a listed PEI operating mode."}},{"id":"mp1.55","t":"14","c":0,"q":"To protect against electric shock, the PEI shall?","o":["Incorporate electrical separation","Be able to operate in any intended operating mode","Make use of supplementary bonding in all wet locations","Not be installed in areas of increased risk of fire"],"a":1,"x":"","r":"826.1.1.1 P361","n":"","k":1000054.0,"m":"","f":"Part 8, Reg 826.1.1.1 (protection against electric shock in a PEI).","w":{"0":"Electrical separation isn't mandatory; protection must work in every operating mode.","2":"Supplementary bonding in all wet locations isn't the 826.1.1.1 requirement.","3":"Fire-risk locations aren't what 826.1.1.1 addresses."}},{"id":"mp1.56","t":"1","c":0,"q":"What is the maximum voltage deviation on the public supply system with a nominal voltage of 230V?","o":["+ 6% to – 6%","+ 6% to – 10%","+ 10% to – 6%","+ 10% to – 10%"],"a":2,"x":"","r":"Appendix 2 P.408","n":"","k":1000055.0,"m":"","f":"Appendix 2 (statutory regulations), ESQCR voltage tolerance for 230 V supplies.","w":{"0":"The upper limit is +10%, not +6%.","1":"Swapped; it's +10% and −6%.","3":"The lower limit is −6%, not −10%."}},{"id":"mp1.57","t":"13","c":1,"q":"What is the minimum current (Ia) required to ensure operation of an 80 A BS 88-2 system E fuse within 0.4 seconds?","o":["900 A","750 A","580 A","400A"],"a":1,"x":"","r":"750 A Fig 3A3 P.414","n":"","k":1000056.0,"m":"","f":"Appendix 3, Fig 3A3 (BS 88-2 system E fuses). Go up from 0.4 s on the time axis to the 80 A curve, read current below.","w":{"0":"That doesn't match where the 80 A curve crosses 0.4 s; read the curve again.","2":"That doesn't match the 80 A curve at 0.4 s; check you're on the right curve.","3":"Far too low for an 80 A fuse at 0.4 s; you may have used another rating's curve."}},{"id":"mp1.58","t":"13","c":1,"q":"Which is the rating factor to be applied for 70° C thermoplastic cables installed in an ambient temperature of 40° C?","o":["0.91","0.87","0.85","0.82"],"a":1,"x":"","r":"Table 4B1 P.441","n":"","k":1000057.0,"m":"","f":"Appendix 4, Table 4B1 (ambient temperature factors Ca). Column 70°C thermoplastic, row 40°C.","w":{"0":"0.91 is the 90°C thermosetting column at 40°C.","2":"0.85 is the mineral, thermoplastic-covered 70°C column at 40°C.","3":"0.82 is the 60°C thermosetting column at 40°C."}},{"id":"mp1.59","t":"3","c":0,"q":"Normal household equipment is usually expected to protect against which level of impact?","o":["AG4","AG3","AG2","AG1"],"a":3,"x":"","r":"Appendix 5 P.499","n":"","k":1000058.0,"m":"","f":"Appendix 5, AG codes (impact). AG1 is low severity, household and similar conditions.","w":{"0":"AG4 is very high severity, for severe industrial conditions.","1":"AG3 is high severity, for severe industrial conditions.","2":"AG2 is medium severity, for usual industrial conditions."}},{"id":"mp1.60","t":"14","c":0,"q":"Appendix 17 sets a minimum efficiency level for electric motors within which power range?","o":["0.75 kW to 3.75 kW","0.75 kW to 375 kW","7.5 kW to 37.5 kW","75 kW to 375 kW"],"a":1,"x":"","r":"375 kW Appendix 17 P.566","n":"Reworded: the original stem quoted the IE2/IE3 motor rules, which have since changed in law.","k":1000059.0,"m":"","f":"Appendix 17 (energy efficiency), motors section. Index: 'energy efficiency, motors'.","w":{"0":"Upper limit is wrong by a factor of 100; it goes up to 375 kW.","2":"Both limits are off; the range is 0.75 kW to 375 kW.","3":"Lower limit is too high; it starts at 0.75 kW."}},{"id":"mp2.1","t":"12","c":0,"q":"Which of the following types of installation is not included in the special installations recognised by BS 7671?","o":["swimming pools","petrol Stations","agricultural","saunas"],"a":1,"x":"","r":"","n":"","k":1000060.0,"m":"","f":"Part 7 contents: list of special installations or locations (Sections 701 onwards).","w":{"0":"Swimming pools are Section 702.","2":"Agricultural premises are Section 705.","3":"Saunas are Section 703."}},{"id":"mp2.2","t":"1","c":0,"q":"BS 7671 does not apply to","o":["railway traction equipment","photovoltaic systems","marinas","fairgrounds"],"a":0,"x":"","r":"","n":"","k":1000061.0,"m":"","f":"Part 1, Reg 110.2 (exclusions). Railway traction, rolling stock and signalling are excluded.","w":{"1":"PV systems are in scope (Section 712).","2":"Marinas are in scope (Section 709).","3":"Fairgrounds are in scope (Section 740)."}},{"id":"mp2.3","t":"3","c":0,"q":"Which one of the following parts of BS 7671 contains greater detail of the Assessment of General Characteristics?","o":["Part 1","Part 2","Part 3","Part 4"],"a":2,"x":"","r":"Part 3","n":"","k":1000062.0,"m":"","f":"Book contents: Part 3 is 'Assessment of general characteristics' (Chapters 31 to 36).","w":{"0":"Part 1 covers scope, object and fundamental principles.","1":"Part 2 is definitions.","3":"Part 4 is protection for safety."}},{"id":"mp2.4","t":"1","c":0,"q":"BS 7671 states that installation design must take into account","o":["current copper prices","the effects of climate change","a comparison of renewable energy","anticipated electromagnetic emissions"],"a":3,"x":"","r":"","n":"","k":1000063.0,"m":"","f":"Chapter 13, Reg 131.6.4 (electromagnetic disturbances). Index: 'electromagnetic'.","w":{"0":"Copper prices aren't a BS 7671 design requirement.","1":"Climate change isn't a design requirement in Chapter 13.","2":"Comparing renewables isn't a BS 7671 design requirement."}},{"id":"mp2.5","t":"2","c":0,"q":"Simple separation is separation between circuits by means of","o":["basic insulation","reinforced insulation","double insulation","no insulation"],"a":0,"x":"","r":"","n":"","k":1000064.0,"m":"","f":"Part 2 Definitions, 'Simple separation'. Compare with 'Protective separation' nearby.","w":{"1":"Reinforced insulation gives protective separation, not simple separation.","2":"Double insulation gives protective separation, not simple separation.","3":"Separation needs insulation; simple separation uses basic insulation."}},{"id":"mp2.6","t":"2","c":0,"q":"An overcurrent occurring in an electrical circuit which is electrically sound is known as?","o":["earth fault current","fault current","nuisance current","overload current"],"a":3,"x":"","r":"","n":"","k":1000065.0,"m":"","f":"Part 2 Definitions, 'Overload current'. Compare with 'Fault current' and 'Earth fault current'.","w":{"0":"Earth fault current flows to earth because of a fault; the circuit isn't sound.","1":"Fault current results from a fault, so the circuit isn't electrically sound.","2":"'Nuisance current' isn't a BS 7671 defined term."}},{"id":"mp2.7","t":"3","c":0,"q":"Which one of the following systems has the supply arrangement as TN-C and the installation arrangement as TN-S?","o":["TT","TN-S-C","TN-C-S","IT"],"a":2,"x":"","r":"","n":"","k":1000066.0,"m":"","f":"Part 2, system types and the earthing diagrams (Figures 3.8 onwards). Index: 'TN-C-S system'.","w":{"0":"TT has no PEN; the installation earth is a local electrode.","1":"TN-S-C isn't a recognised system; the order is TN-C-S.","3":"IT has the source isolated or earthed via impedance; no PEN conductor."}},{"id":"mp2.8","t":"3","c":0,"q":"Which one of the following needs to be considered in order to identify the characteristics of equipment likely to have harmful effects on other electrical equipment?","o":["Classification of external influences","Compatibility of characteristics","Maintainability","Continuity of services"],"a":1,"x":"","r":"","n":"","k":1000067.0,"m":"","f":"Chapter 33, Reg 331.1 'Compatibility of characteristics'. Index: 'compatibility'.","w":{"0":"External influences (Chapter 32) cover the environment's effect on the installation, not equipment harming equipment.","2":"Maintainability (Chapter 34) is about maintenance frequency and quality.","3":"Continuity of service (Chapter 36) is about avoiding loss of supply."}},{"id":"mp2.9","t":"3","c":0,"q":"The compatibility of harmful effects upon electrical equipment would not need to be assessed for","o":["DC feedback","fault currents","power factor","under voltages"],"a":1,"x":"","r":"","n":"","k":1000068.0,"m":"","f":"Chapter 33, Reg 331.1. Check each option against the list of characteristics.","w":{"0":"DC feedback is listed in 331.1.","2":"Power factor is listed in 331.1.","3":"Undervoltage is listed in 331.1."}},{"id":"mp2.10","t":"3","c":0,"q":"Which one of the following is a consideration of maintainability?","o":["the EMC regulation","The supplies for safety services and standby systems","The division of the installation","The effectiveness of the protective measures for safety"],"a":3,"x":"","r":"","n":"","k":1000069.0,"m":"","f":"Chapter 34, Reg 341.1 items (i) to (iii). Index: 'maintainability'.","w":{"0":"EMC is Section 332 (Chapter 33), not maintainability.","1":"Safety and standby supplies are Section 313 and Chapter 35.","2":"Division of installation is Section 314."}},{"id":"mp2.11","t":"3","c":0,"q":"Every installation should be divided into circuits, as necessary, to","o":["take account of danger that may arise from the failure of a single circuit","avoid discrimination problems","prevent unauthorised interference with safety supplies fuse","reduce wiring impracticability"],"a":0,"x":"","r":"","n":"","k":1000070.0,"m":"","f":"Part 3, Reg 314.1 (division of installation), item (iii).","w":{"1":"Discrimination (selectivity) isn't one of the 314.1 reasons.","2":"Unauthorised interference isn't a 314.1 reason.","3":"Wiring practicality isn't a 314.1 reason."}},{"id":"mp2.12","t":"3","c":0,"q":"The prevention of indirect energising of a final circuit intended to be isolated must be achieved by","o":["separation of all final circuits from each other","installing a 100mA RCD protected consumer unit","ensuring all devices are suitably labelled","displaying a suitable DANGER notice"],"a":0,"x":"","r":"","n":"","k":1000071.0,"m":"","f":"Part 3, Reg 314.4. Each final circuit wired electrically separate from every other final circuit.","w":{"1":"A shared RCD doesn't prevent indirect energising; separation of circuits does.","2":"Labelling helps identification but doesn't prevent indirect energising.","3":"A DANGER notice doesn't prevent indirect energising."}},{"id":"mp2.13","t":"4","c":0,"q":"Which of the following is not a method of fault protection?","o":["placing out of reach","use of Class II equipment","earthing and bonding","electrical separation"],"a":0,"x":"","r":"","n":"","k":1000072.0,"m":"","f":"Chapter 41, Section 417 (obstacles and placing out of reach) gives basic protection only. Index: 'placing out of reach'.","w":{"1":"Class II (Section 412) provides basic and fault protection.","2":"Earthing and bonding are part of ADS fault protection (Section 411).","3":"Electrical separation (Section 413) provides fault protection."}},{"id":"mp2.14","t":"4","c":0,"q":"Socket-outlets must be protected by an RCD when the socket-outlet rating does not exceed","o":["20A","32A","45A","50A"],"a":1,"x":"","r":"","n":"","k":1000073.0,"m":"","f":"Chapter 41, Reg 411.3.3 (additional protection for socket-outlets). Index: 'socket-outlets, RCD'.","w":{"0":"20 A was the old limit; the 2018 edition revised it to 32 A.","2":"45 A exceeds the 32 A limit in 411.3.3.","3":"50 A exceeds the 32 A limit in 411.3.3."}},{"id":"mp2.15","t":"5","c":0,"q":"When considering overvoltage protection, direct lightning strikes on the low voltage lines of the supply network are","o":["not taken into account","direct to earth","taken into account","directed through a discharge device"],"a":2,"x":"","r":"","n":"","k":1000074.0,"m":"","f":"Chapter 44, Reg 443.1.1 (scope of overvoltage protection). Index: 'overvoltage'.","w":{"0":"443.1.1 includes direct strikes to the supply system.","1":"That isn't the wording of 443.1.1; strikes on the supply are taken into account.","3":"That describes an SPD's action, not whether strikes are considered."}},{"id":"mp2.16","t":"5","c":0,"q":"In a location of an increased risk of fire due to stored materials, which of the following ensure the regulation shall be followed","o":["Building has only one escape route","Building is a BE2 location","Building contains powerful jets of water","Building is used by BA1 people"],"a":1,"x":"","r":"","n":"","k":1000075.0,"m":"","f":"Section 422, Reg 422.3 (risk of fire due to processed or stored materials) applies to BE2 locations.","w":{"0":"Escape conditions (BD codes) are Reg 422.2, not stored materials.","2":"Water jets are an AD code, not a fire risk condition.","3":"BA1 is ordinary persons; it doesn't trigger 422.3."}},{"id":"mp2.17","t":"4","c":0,"q":"which of the following methods will not provide basic protection?","o":["bonding","insulation","obstacles","Barriers/enclosure"],"a":0,"x":"","r":"","n":"","k":1000076.0,"m":"","f":"Chapter 41, Section 416 and 417: basic protection is by insulation, barriers or enclosures, obstacles, placing out of reach.","w":{"1":"Insulation of live parts is basic protection (416.1).","2":"Obstacles provide basic protection (Section 417).","3":"Barriers and enclosures are basic protection (416.2)."}},{"id":"mp2.18","t":"4","c":1,"q":"A radial final circuit supplying fixed equipment is protected by a 20A type B circuit-breaker to BS EN 60898.  The maximum permitted value of earth fault loop impedance for this circuit is","o":["1.09 Ω","1.71 Ω","2.19 Ω","3.00 Ω"],"a":2,"x":"Table 41.3, 20 A Type B, 0.4 s: 2.19 Ω (tabulated). Check by formula: Ia = 5 × 20 = 100 A; 230 × 0.95 ÷ 100 = 2.19 Ω.","r":"","n":"","k":1000077.0,"m":"","f":"Table 41.3(a) Type B, 20 A, 0.4 s. Or 411.4.4: Ia = 5 × In, Zs = 230 × 0.95 ÷ Ia.","w":{"0":"1.09 Ω is the 20 A Type C value; this is Type B.","1":"Not the Table 41.3 Type B 20 A value; check the column.","3":"Not a Table 41.3 value for 20 A Type B; check the row and column."}},{"id":"mp2.19","t":"4","c":1,"q":"A distribution circuit is supplying a sub board elsewhere in a property.  The circuit is protected by a 50A BS 88-2 system G fuse.  What is the maximum Zs value an inspector can obtain when measuring the Zs of the circuit?","o":["0.99 Ω","1.3 Ω","0.57 Ω","0.79Ω"],"a":3,"x":"Distribution circuit, so use the 5 s table (Table 41.4): 50 A BS 88-2 = 0.99 Ω. Measured value limit:<br>0.99 × 0.8 = 0.79 Ω","r":"","n":"","k":1000078.0,"m":"","f":"Distribution circuit, so 5 s: Table 41.4(a), 50 A BS 88-2. Multiply by 0.8 for a measured value.","w":{"0":"0.99 Ω is the tabulated value; a measured Zs is compared with 0.8 of it.","1":"1.3 Ω is the 40 A value in Table 41.4.","2":"0.57 Ω is 50 A at 0.4 s (Table 41.2); distribution circuits get 5 s."}},{"id":"mp2.20","t":"4","c":1,"q":"A 6A BS EN 60898 circuit-breaker used to protect a final circuit with a maximum permitted value of earth fault loop impedance (Zs) of 1.82 Ω would be type","o":["A","B","C","D"],"a":3,"x":"Find 1.82 Ω in Table 41.3 under 6 A: it sits in the Type D column (Ia = 20 × 6 = 120 A; 230 × 0.95 ÷ 120 = 1.82 Ω).","r":"","n":"","k":1000079.0,"m":"","f":"Table 41.3, 6 A column: look across Types B, C and D for 1.82 Ω. Type D Ia = 20 × In.","w":{"0":"There's no Type A in Table 41.3 (BS EN 60898 Types are B, C, D).","1":"6 A Type B is 7.28 Ω.","2":"6 A Type C is 3.64 Ω."}},{"id":"mp2.21","t":"5","c":0,"q":"An AFDD shall be provided for which of the following circuits?","o":["A lighting circuit in a flat on the 9th floor of a HRRB","A circuit supplying heating equipment in a care home","A 63A 3-phase socket outlet on a factory floor","A 20A radial socket circuit in a HMO"],"a":3,"x":"","r":"","n":"","k":1000080.0,"m":"","f":"Chapter 42, Reg 421.1.7 (AFDDs). The requirement covers single-phase AC final circuits supplying socket-outlets up to 32 A in HRRBs, HMOs, student accommodation and care homes.","w":{"0":"The requirement is for socket-outlet circuits, not lighting circuits.","1":"The requirement is for socket-outlet circuits; a heating circuit isn't covered.","2":"Only single-phase socket circuits up to 32 A are covered; 63 A three-phase isn't."}},{"id":"mp2.22","t":"5","c":0,"q":"Installed electrical equipment which contains a significant quantity of flammable liquid require measures to prevent the spread of the liquid.  Which one of the following is considered to be the minimum quantity to be classed as significant?","o":["10 litres","15 litres","20 litres","25 litres"],"a":3,"x":"","r":"","n":"","k":1000081.0,"m":"","f":"Chapter 42, Reg 421.1.5 Note 2 (equipment containing flammable liquid). Index: 'flammable liquid'.","w":{"0":"10 litres is below the 25 litre 'significant' figure.","1":"15 litres is below the 25 litre figure.","2":"20 litres is below the 25 litre figure."}},{"id":"mp2.23","t":"5","c":1,"q":"What is the k factor for tinned soldered joints in copper conductors with 60° C thermosetting insulation?","o":["86","100","115","122"],"a":3,"x":"","r":"122","n":"","k":1000082.0,"m":"","f":"Table 43.1, bottom row 'Tin soldered joints in copper conductors', 60°C thermosetting column.","w":{"0":"86 is the soldered joint figure for 90°C thermoplastic over 300 mm².","1":"100 is the soldered joint figure for 90°C thermoplastic or 90°C thermosetting.","2":"115 is the soldered joint figure for 70°C thermoplastic up to 300 mm²."}},{"id":"mp2.24","t":"5","c":0,"q":"Which one of the following is not a situation where overload protection devices may be omitted for safety reasons?","o":["a circuit supplying a fire extinguishing device","the supply to computers in an office environment","the supply circuit of a lifting magnet","the secondary circuit of a current transformer"],"a":1,"x":"","r":"","n":"","k":1000083.0,"m":"","f":"Chapter 43, Reg 433.3.3 'Omission of overload protection for safety reasons'.","w":{"0":"Fire extinguishing devices are listed in 433.3.3.","2":"Lifting magnets are listed in 433.3.3.","3":"Current transformer secondaries are listed in 433.3.3."}},{"id":"mp2.25","t":"5","c":1,"q":"The required minimum impulse withstand voltage for Category II equipment within a 230V domestic installation for overvoltage protection is","o":["1.5kV","2.5kV","4.0kV","6.0kV"],"a":1,"x":"","r":"","n":"","k":1000084.0,"m":"","f":"Chapter 44, Table 443.2 (rated impulse voltage). Row 230/400 V, overvoltage category II.","w":{"0":"1.5 kV is Category I (sensitive electronics).","2":"4.0 kV is Category III (distribution boards, switches).","3":"6.0 kV is Category IV (origin, e.g. energy meters)."}},{"id":"mp2.26","t":"5","c":0,"q":"What is the minimum size of a copper earthing busbar for an insulation which has a supply capacity of 250A per phase, when considering measures against electromagnetic disturbances?","o":["20 mm2","30 mm2","40 mm2","50 mm2"],"a":3,"x":"","r":"","n":"","k":1000085.0,"m":"","f":"Section 444, Reg 444.5.7.2 'Cross-sectional area of earthing busbar'. 200 A per phase or more needs at least 50 mm² copper.","w":{"0":"20 mm² isn't the 444.5.7.2 figure; at 200 A or more it's 50 mm².","1":"30 mm² isn't the figure; it's 50 mm² for 200 A or more.","2":"40 mm² isn't the figure; it's 50 mm² for 200 A or more."}},{"id":"mp2.27","t":"5","c":0,"q":"Protection against overvoltages of an atmospheric origin shall be provided where the consequence caused by an overvoltage could?","o":["cause the main supply fuse to blow","change environmental conditions","result in significant financial or data loss","result in inconvenience for users of the installation"],"a":2,"x":"","r":"","n":"","k":1000086.0,"m":"","f":"Index: 'overvoltage, transient'. Go to Section 443 and the overvoltage control regulation (443.4), which lists the consequences that make SPD protection mandatory.","w":{"0":"A blown supply fuse isn't one of the listed consequences; the list is about life, safety services and significant financial or data loss.","1":"Changing environmental conditions isn't a listed consequence; that wording relates to external influences, not overvoltage control.","3":"Mere inconvenience doesn't trigger mandatory protection; for lesser consequences you carry out the 443.5 risk assessment instead."}},{"id":"mp2.28","t":"9","c":0,"q":"A diagram shows the incoming supply, meter, MET and consumer unit, with conductors labelled A to D. Conductor A runs from the supply earthing point to the MET. Conductor A is the","o":["main protective bonding conductor","earthing conductor","supplementary bonding conductor","circuit protective conductor"],"a":1,"x":"","r":"","n":"The original question uses a drawing; it is described in words here.","k":1000087.0,"m":"","f":"Index: 'earthing conductor' in Part 2 Definitions; it is the conductor connecting the MET to the means of earthing. See also Chapter 54 (542.3).","w":{"0":"A main protective bonding conductor runs from the MET to extraneous-conductive-parts such as gas and water pipes, not to the supply earth.","2":"Supplementary bonding links parts locally (e.g. in a special location); it doesn't connect the MET to the supply earth.","3":"A cpc runs from the MET or distribution board out to exposed-conductive-parts of a circuit, not back to the supply."}},{"id":"mp2.29","t":"9","c":0,"q":"A diagram shows the gas installation pipework connected back to the MET by a conductor labelled Y. The conductor marked Y is the","o":["circuit protective conductor","main protective bonding conductor","supplementary bonding conductor","earthing conductor"],"a":1,"x":"","r":"","n":"The original question uses a drawing; it is described in words here.","k":1000088.0,"m":"","f":"Index: 'main protective bonding conductor' in Part 2 Definitions, then 411.3.1.2 and Section 544, which list gas pipes as extraneous parts to bond to the MET.","w":{"0":"A cpc connects exposed-conductive-parts of a circuit's equipment, not an incoming gas service pipe.","2":"Supplementary bonding is local, between parts in the same location; a pipe run back to the MET is main bonding.","3":"The earthing conductor connects the MET to the means of earthing (supply earth or electrode), not to a gas pipe."}},{"id":"mp2.30","t":"7","c":0,"q":"Which one of the following is not an acceptable method of identifying a bare conductor?","o":["Application of tape","application of sleeving","application of a warning notice","painting with a particular colour"],"a":2,"x":"","r":"","n":"","k":1000089.0,"m":"","f":"Index: 'identification of conductors' or 'bare conductors'. Go to Section 514 (514.4), which says bare conductors may be identified by tape, sleeve, disc or paint.","w":{"0":"Tape is one of the permitted methods for identifying a bare conductor.","1":"Sleeving is one of the permitted methods for identifying a bare conductor.","3":"Painting is one of the permitted methods for identifying a bare conductor."}},{"id":"mp2.31","t":"7","c":0,"q":"A warning notice of maximum voltage present must be fixed to all","o":["equipment operating in excess of a nominal voltage of 230V to earth and where such voltage would not normally be expected","current using equipment operating without a carrying handle, having a mass exceeding 18kg","switchgear whose operation cannot be observed by the operator","single-phase motors above 10 kW"],"a":0,"x":"","r":"","n":"","k":1000090.0,"m":"","f":"Index: 'warning notices, voltage'. Go to Section 514, Regulation 514.10.1: voltage exceeding 230 V to earth where it would not normally be expected.","w":{"1":"The 18 kg mass relates to the definition of hand-held/portable equipment, not to voltage warning notices.","2":"Switchgear not visible to the operator is about indicating switch position, not a maximum-voltage warning notice.","3":"There's no 10 kW motor rule for warning notices; 514.10.1 is about unexpected voltages above 230 V to earth."}},{"id":"mp2.32","t":"7","c":0,"q":"Which one of the following conductors of an AC circuit may individually enter a ferromagnetic enclosure?","o":["an additional parallel neutral conductor identified with brown sleeving","an additional protective conductor in parallel with the steel wire armour of a cable","an earthing conductor with a cross sectional area of 25mm2","the line conductor of a three-phase 4-wire circuit"],"a":1,"x":"","r":"","n":"","k":1000091.0,"m":"","f":"Index: 'ferromagnetic enclosures'. Go to Regulation 521.5.1 (Chapter 52), which allows an additional protective conductor in parallel with SWA to enter individually.","w":{"0":"A neutral must enter with its line conductors; only the parallel protective conductor is exempt, and brown sleeving doesn't change that.","2":"Size doesn't matter here; 521.5.1 only exempts an additional protective conductor in parallel with steel wire armour.","3":"Line conductors must always enter collectively with the neutral and cpc, otherwise eddy currents heat the enclosure."}},{"id":"mp2.33","t":"13","c":1,"q":"A single-phase circuit using 2.5mm2 single-core thermoplastic cables in conduit supplies a design current of 20A.  If the cables are 15 metres long and have a rated voltage drop of 18 mV/A/m, the total actual voltage drop will be","o":["2.5V","5.4V","6V","16.6V"],"a":1,"x":"Vd = mV/A/m × Ib × L ÷ 1000<br>18 × 20 × 15 = 5400<br>5400 ÷ 1000 = 5.4 V","r":"","n":"","k":1000092.0,"m":"","f":"Appendix 4: voltage drop = (mV/A/m × Ib × L) ÷ 1000, using the mV/A/m given (from the voltage drop column of Table 4D1B for 2.5 mm²).","w":{"0":"That doesn't match 18 × 20 × 15 ÷ 1000; check you used all three values and divided by 1000 once.","2":"That doesn't come from 18 × 20 × 15 ÷ 1000; recheck the multiplication.","3":"Too high; multiply mV/A/m by Ib and length, then divide by 1000 to convert millivolts to volts."}},{"id":"mp2.34","t":"7","c":0,"q":"Thermoplastic insulated and sheathed flat cables with protective conductor, when installed in prescribed zones in a dwelling at a depth of less that 50mm, must have additional protection by","o":["an mcb","a cpc the same size as the live conductors","a 30 mA RCD","a disconnection time of 0.4s"],"a":2,"x":"","r":"","n":"","k":1000093.0,"m":"","f":"Index: 'cables concealed in walls'. Go to Section 522 (522.6.202), which requires 30 mA RCD additional protection for cables under 50 mm in prescribed zones.","w":{"0":"An mcb gives overcurrent protection; it won't detect a nail through the cable at low fault current like an RCD will.","1":"A full-size cpc isn't one of the options in 522.6.202; the requirement is RCD additional protection or mechanical/earthed protection.","3":"A 0.4 s disconnection time is the Chapter 41 ADS requirement, not the additional protection for concealed cables."}},{"id":"mp2.35","t":"7","c":1,"q":"The derating factor to be applied to a cable passing directly through a 50mm thermally filled cavity wall is","o":["0.55","0.68","0.81","0.88"],"a":3,"x":"","r":"","n":"","k":1000094.0,"m":"","f":"Index: 'thermal insulation, cables in'. Go to Table 52.2 (Regulation 523.9) and read the factor for 50 mm length in insulation.","w":{"0":"0.55 isn't in Table 52.2; for 50 mm length in insulation the factor is 0.88.","1":"0.68 isn't in Table 52.2; you may have read a different table. Use the 50 mm row.","2":"0.81 isn't in Table 52.2; the 50 mm row gives 0.88 and 100 mm gives 0.78."}},{"id":"mp2.36","t":"8","c":0,"q":"Where a person other than a skilled or instructed person may operate a circuit-breaker, it should be designed or installed so that it is not possible to modify the setting or calibration of its overcurrent release without","o":["involving the use of a key or a tool","permission from a skilled person","consulting manufacturer’
