t least:","o":["16 mm² copper","10 mm² copper","25 mm² copper","half the csa of the line conductors"],"a":0,"x":"Regulation 524.2.3(iii): the reduced neutral shall be at least 16 mm² for copper or 25 mm² for aluminium, with the neutral current and overcurrent conditions also met.","r":"524.2.3 (page 144 of the 2018 book)","n":"","k":6664,"m":"","f":"Index: 'neutral conductor, cross-sectional area'. Go to Regulation 524.2.3, item (iii).","w":{"1":"10 mm² is below the 16 mm² copper minimum.","2":"25 mm² is the aluminium figure; copper is 16 mm².","3":"No half-size rule here; 524.2.3 sets a fixed 16 mm² copper minimum."}},{"id":"b4.04.23","t":"7","c":0,"q":"According to Table 52.3, the minimum cross-sectional area of a bare copper conductor used in a power circuit is:","o":["1.5 mm²","10 mm²","4 mm²","16 mm²"],"a":1,"x":"Table 52.3: bare conductors, power circuits, copper 10 mm² (aluminium 16 mm²; copper signalling and control 4 mm²).","r":"Table 52.3 (page 145 of the 2018 book)","n":"","k":6681,"m":"","f":"Index: 'cross-sectional area, minimum'. Go to Section 524, Table 52.3, bare conductors, power circuits, copper.","w":{"0":"1.5 mm² is for insulated copper power cables.","2":"4 mm² is for bare copper signalling and control circuits.","3":"16 mm² is the bare aluminium figure."}},{"id":"b5.04.24","t":"7","c":0,"q":"Which of the following connections is NOT required by Regulation 526.3 to be accessible for inspection, testing and maintenance?","o":["A screw-terminal connector in a junction box under floorboards","A joint made with an appropriate compression tool","A terminal in a ceiling rose","A connection in a fused connection unit"],"a":1,"x":"Regulation 526.3(iv) exempts joints made by welding, soldering, brazing or appropriate compression tool. Screw-terminal connections must be accessible unless BS 5733 maintenance-free and marked accordingly.","r":"526.3 (page 146 of the 2018 book)","n":"","k":6734,"m":"","f":"Index: 'connections, accessibility'. Go to Section 526, Regulation 526.3, and read the listed exemptions.","w":{"0":"Screw terminals must be accessible unless BS 5733 maintenance-free and marked.","2":"Ceiling-rose terminals are screw connections and must be accessible.","3":"Accessory terminals like an FCU's must be accessible."}},{"id":"b1.04.25","t":"7","c":0,"q":"A non-flame-propagating conduit or trunking system passing through a fire-resisting wall need not be internally sealed provided its maximum internal cross-sectional area is 710 mm² and it satisfies the BS EN 60529 test for:","o":["IP33","IP2X","IP44","IP4X"],"a":0,"x":"Regulation 527.2.3: systems with internal csa up to 710 mm² need not be internally sealed if the system, and any termination in the compartment, satisfies IP33.","r":"527.2.3 (page 147 of the 2018 book)","n":"","k":6808,"m":"","f":"Index: 'fire barriers' or 'sealing of wiring system penetrations'. Go to Section 527, Regulation 527.2.3.","w":{"1":"IP2X isn't the test named; 527.2.3 requires IP33.","2":"IP44 isn't the test named; 527.2.3 requires IP33.","3":"IP4X isn't the test named; 527.2.3 requires IP33."}},{"id":"b2.04.26","t":"7","c":0,"q":"Where underground telecommunication cables cross or run near underground power cables, without a fire-retardant partition or mechanical protection, the minimum clearance to be maintained is:","o":["50 mm","150 mm","300 mm","100 mm"],"a":3,"x":"Regulation 528.2: a minimum clearance of 100 mm shall be maintained, or a fire-retardant partition or (for crossings) mechanical protection provided.","r":"528.2 (page 148 of the 2018 book)","n":"","k":6853,"m":"","f":"Index: 'proximity to other services' or 'telecommunication cables'. Go to Section 528, Regulation 528.2.","w":{"0":"50 mm is too small; 528.2 requires 100 mm.","1":"150 mm isn't the 528.2 figure; it's 100 mm.","2":"300 mm isn't the 528.2 figure; it's 100 mm."}},{"id":"b3.04.27","t":"8","c":0,"q":"Regulation 530.3.3 states that a switching device:","o":["shall always switch the neutral conductor","shall be inserted in the protective conductor of TT systems","shall not be inserted in the neutral conductor alone","may be inserted in the neutral alone if marked 'N'"],"a":2,"x":"Regulation 530.3.3: a switching device shall not be inserted in the neutral conductor alone.","r":"530.3.3 (page 152 of the 2018 book)","n":"","k":7002,"m":"","f":"Index: 'switching devices' or 'neutral, switching'. Go to Chapter 53, Regulation 530.3.3.","w":{"0":"The neutral needn't always be switched; it must not be switched alone.","1":"Nothing may be inserted in a protective conductor.","3":"Marking 'N' doesn't permit single-pole neutral switching."}},{"id":"b4.04.28","t":"7","c":0,"q":"Where no manufacturer's instructions exist, a 30 A semi-enclosed (BS 3036) fuse shall be fitted with a single element of tinned copper wire of nominal diameter:","o":["0.75 mm","1.25 mm","0.6 mm","0.85 mm"],"a":3,"x":"Table 533.1: 30 A, 0.85 mm (20 A 0.6 mm, 25 A 0.75 mm, 45 A 1.25 mm).","r":"Table 533.1 (page 159 of the 2018 book)","n":"","k":7330,"m":"","f":"Index: 'semi-enclosed fuses'. Go to Table 533.1 and read the 30 A row.","w":{"0":"0.75 mm is the 25 A element.","1":"1.25 mm is the 45 A element.","2":"0.6 mm is the 20 A element."}},{"id":"b5.04.29","t":"8","c":0,"q":"For selectivity between RCDs in case of residual current, the upstream RCD shall be of selective (S) or time-delayed type and the ratio of its rated residual operating current to that of the downstream RCD shall be at least:","o":["2:1","3:1","5:1","10:1"],"a":1,"x":"Regulation 536.4.1.4(ii): the upstream RCD is type S or time-delayed and the ratio of the upstream to downstream rated residual operating current is at least 3:1.","r":"536.4.1.4 (page 173 of the 2018 book)","n":"","k":7921,"m":"","f":"Index: 'RCDs, selectivity' or 'discrimination'. Go to Regulation 536.4.1.4, item (ii).","w":{"0":"2:1 is too low; 536.4.1.4 needs at least 3:1.","2":"5:1 exceeds the minimum; the rule is at least 3:1.","3":"10:1 exceeds the minimum; the rule is at least 3:1."}},{"id":"b1.05.00","t":"9","c":0,"q":"An earthing conductor buried in the ground is protected against corrosion by a sheath but is NOT protected against mechanical damage. What is the minimum cross-sectional area if it is copper?","o":["2.5 mm²","16 mm²","10 mm²","25 mm²"],"a":1,"x":"Table 54.1: protected against corrosion by a sheath but not protected against mechanical damage, copper: 16 mm² (16 mm² coated steel).","r":"542.3.1 (page 195 of the 2018 book)","n":"","k":8946,"m":"","f":"Index: 'earthing conductors, buried'. Go to Chapter 54, Table 54.1, row 'protected against corrosion', column 'not protected against mechanical damage'.","w":{"0":"2.5 mm² is for conductors protected against both corrosion and mechanical damage.","2":"10 mm² is the steel figure for the mechanically protected column.","3":"25 mm² is for conductors not protected against corrosion."}},{"id":"b1.05.01","t":"9","c":1,"q":"A circuit wired in 70 °C thermoplastic flat twin and cpc cable (copper) has a prospective earth fault current of 1200 A and the protective device disconnects in 0.4 s. Using the adiabatic equation and Table 54.3, what is the minimum standard size of cpc?","o":["4 mm²","2.5 mm²","6 mm²","10 mm²"],"a":3,"x":"S = I × √t ÷ k (Reg 543.1.3); k = 115 from Table 54.3 (copper, 70 °C thermoplastic, cpc in a cable).<br>√0.4 = 0.632<br>1200 × 0.632 = 759<br>759 ÷ 115 = 6.6 mm²<br>Non-standard size, so use the next larger standard size: 10 mm².","r":"543.1.3 (page 196 of the 2018 book)","n":"","k":8992,"m":"","f":"Index: 'protective conductors, cross-sectional area'. Take k from Table 54.3 (copper, 70 °C thermoplastic), then S = I√t ÷ k (543.1.3) and round up.","w":{"0":"4 mm² is below the 6.6 mm² calculated.","1":"2.5 mm² is far below the 6.6 mm² calculated.","2":"6 mm² is just under 6.6 mm²; always round up to the next size, 10 mm²."}},{"id":"b1.05.02","t":"9","c":0,"q":"Which of the following shall NOT be selected as a protective conductor?","o":["Steel conduit with mechanically and electrically continuous joints","Flexible or pliable conduit","The armouring of a cable","A single-core cable"],"a":1,"x":"Regulation 543.2.3: a gas pipe, oil pipe, flexible or pliable conduit, support wires or other flexible metallic parts shall not be selected as a protective conductor. The others are listed in 543.2.1.","r":"543.2.3 (page 199 of the 2018 book)","n":"","k":9130,"m":"","f":"Index: 'protective conductors, types'. Go to Regulation 543.2.3 for what shall not be used; compare 543.2.1.","w":{"0":"Continuous steel conduit is permitted under 543.2.1.","2":"Cable armour is permitted under 543.2.1.","3":"A single-core cable is permitted under 543.2.1."}},{"id":"b1.05.03","t":"9","c":0,"q":"Where practicable, the main protective bonding connection to a gas installation pipe should be made within what distance of the meter outlet union?","o":["150 mm","600 mm","300 mm","1 m"],"a":1,"x":"Regulation 544.1.2: the connection shall be made to the consumer's hard metal pipework before any branch, and where practicable within 600 mm of the meter outlet union (or at the point of entry if the meter is external).","r":"544.1.2 (page 203 of the 2018 book)","n":"","k":9323,"m":"","f":"Index: 'bonding, main protective' or 'gas pipes'. Go to Section 544, Regulation 544.1.2.","w":{"0":"150 mm isn't the 544.1.2 figure; it's 600 mm.","2":"300 mm isn't the 544.1.2 figure; it's 600 mm.","3":"1 m is too far; 544.1.2 says within 600 mm."}},{"id":"b1.05.04","t":"10","c":0,"q":"A plug and socket-outlet not complying with BS 1363, BS 546 or BS EN 60309-2 is installed specifically for an electric clock. The plug must incorporate a fuse with a rating not exceeding:","o":["13 A","5 A","1 A","3 A"],"a":3,"x":"Regulation 553.1.5(i): a clock connector plug must incorporate a fuse not exceeding 3 A complying with BS 646 or BS 1362.","r":"553.1.5 (page 211 of the 2018 book)","n":"","k":9694,"m":"","f":"Index: 'clock connectors' or 'plugs and socket-outlets'. Go to Regulation 553.1.5, item (i).","w":{"0":"13 A is a BS 1363 maximum; clock connector fuses must not exceed 3 A.","1":"5 A exceeds the 3 A limit in 553.1.5.","2":"1 A isn't the stated maximum; the limit is 3 A."}},{"id":"b1.05.05","t":"10","c":0,"q":"An automatic supply for safety services classified as 'short break' must be available within:","o":["0.15 s","5 s","0.5 s","15 s"],"a":2,"x":"Regulation 560.4.1(c): short break is an automatic supply available within 0.5 s. Very short break is 0.15 s, normal break 5 s and medium break 15 s.","r":"560.4.1 (page 224 of the 2018 book)","n":"","k":10282,"m":"","f":"Index: 'safety services'. Go to Chapter 56, Regulation 560.4.1, and read the break classifications.","w":{"0":"0.15 s is 'very short break'.","1":"5 s is 'normal break'.","3":"15 s is 'medium break'."}},{"id":"b2.05.06","t":"9","c":0,"q":"To allow measurement of the resistance of the earthing arrangements, a means of disconnecting the earthing conductor must be provided. Any such joint must be:","o":["capable of disconnection only by means of a tool","located outside the building","sealed by the distributor","fitted with a fuse link"],"a":0,"x":"Regulation 542.4.2: the means of disconnecting the earthing conductor shall be in an accessible position and any joint shall be capable of disconnection only by means of a tool.","r":"542.4.2 (page 196 of the 2018 book)","n":"","k":8967,"m":"","f":"Index: 'earthing conductor, disconnection' or 'main earthing terminal'. Go to Regulation 542.4.2.","w":{"1":"542.4.2 requires an accessible position, not one outside the building.","2":"Distributor sealing isn't required; the joint must need a tool to open.","3":"No fuse is allowed; a fuse in the earthing conductor would be dangerous."}},{"id":"b2.05.07","t":"9","c":0,"q":"Steel conduit is used as the protective conductor for a circuit wired in 70 °C thermoplastic insulated cables. What value of k should be used in the adiabatic equation?","o":["58","44","47","51"],"a":2,"x":"Table 54.5: steel conduit, ducting and trunking with 70 °C thermoplastic insulation, k = 47 (44 for 90 °C thermoplastic, 58 for 90 °C thermosetting).","r":"543.1.3 (page 197 of the 2018 book)","n":"","k":9052,"m":"","f":"Index: 'protective conductors, k values'. Go to Table 54.5 (steel conduit, ducting and trunking), 70 °C thermoplastic column.","w":{"0":"58 is the 90 °C thermosetting value.","1":"44 is the 90 °C thermoplastic value.","3":"51 is from Table 54.4 (steel armour), not Table 54.5."}},{"id":"b2.05.08","t":"9","c":0,"q":"A circuit has 25 mm² copper line conductors. If the cpc is not calculated, what is the minimum size of copper cpc according to Table 54.7?","o":["25 mm²","10 mm²","12.5 mm²","16 mm²"],"a":3,"x":"Table 54.7: for line conductors over 16 mm² up to 35 mm², a protective conductor of the same material must be at least 16 mm².","r":"543.1.4 (page 198 of the 2018 book)","n":"","k":9086,"m":"","f":"Index: 'protective conductors, cross-sectional area'. Go to Table 54.7, row for line conductors over 16 up to 35 mm².","w":{"0":"Same-as-line applies only up to 16 mm².","1":"10 mm² isn't a Table 54.7 value for this band.","2":"You halved it; S/2 applies only above 35 mm²."}},{"id":"b2.05.09","t":"9","c":0,"q":"PME conditions apply and the PEN conductor of the supply is 70 mm² copper. What is the minimum copper main protective bonding conductor size?","o":["16 mm²","10 mm²","25 mm²","35 mm²"],"a":2,"x":"Table 54.8: PEN conductor over 50 mm² up to 95 mm² requires a main protective bonding conductor of at least 25 mm² copper equivalent.","r":"544.1.1 (page 203 of the 2018 book)","n":"","k":9309,"m":"","f":"Index: 'bonding, main protective' or 'PME'. Go to Table 54.8 and find the PEN band over 50 up to 95 mm².","w":{"0":"16 mm² is for PEN over 35 up to 50 mm².","1":"10 mm² is for PEN 35 mm² or less.","3":"35 mm² is for PEN over 95 up to 150 mm²."}},{"id":"b2.05.10","t":"10","c":0,"q":"An electrode boiler is connected directly to a supply exceeding low voltage. The RCD must disconnect the electrodes on a sustained earth leakage current exceeding what percentage of the boiler's rated current (unless a higher value is essential for stability)?","o":["10 %","5 %","15 %","30 %"],"a":0,"x":"Regulation 554.1.4: disconnection on a sustained earth leakage current in excess of 10 % of rated current, which may be increased to a maximum of 15 % if essential for stable operation.","r":"554.1.4 (page 212 of the 2018 book)","n":"","k":9728,"m":"","f":"Index: 'electrode boilers'. Go to Section 554, Regulation 554.1.4.","w":{"1":"5 % isn't the 554.1.4 figure; it's 10 %.","2":"15 % is the maximum only where essential for stability, not the standard figure.","3":"30 % isn't given in 554.1.4."}},{"id":"b2.05.11","t":"10","c":0,"q":"Where a fixing means is intended to support a luminaire, it must be capable of carrying a mass of not less than:","o":["2 kg","3 kg","5 kg","10 kg"],"a":2,"x":"Regulation 559.5.2: the fixing means shall carry not less than 5 kg; if the luminaire is heavier than 5 kg, the fixing must support its actual mass.","r":"559.5.2 (page 220 of the 2018 book)","n":"","k":10109,"m":"","f":"Index: 'luminaires, fixing'. Go to Section 559, Regulation 559.5.2.","w":{"0":"2 kg is below the 5 kg minimum.","1":"3 kg is below the 5 kg minimum.","3":"10 kg isn't the minimum; it's 5 kg, or the luminaire's actual mass if heavier."}},{"id":"b3.05.12","t":"9","c":0,"q":"Which of the following is one of the conditions for using the lead sheath of a cable as an earth electrode?","o":["The sheath must be bonded to the gas pipe","The cable must be at least 25 mm²","The cable must be buried at least 1 m deep","The consent of the owner of the cable must be obtained"],"a":3,"x":"Regulation 542.2.5(iii): the consent of the owner of the cable shall be obtained. Other conditions cover corrosion, effective contact with Earth, and warning of changes to the cable.","r":"542.2.5 (page 195 of the 2018 book)","n":"","k":8926,"m":"","f":"Index: 'earth electrodes, lead sheath'. Go to Regulation 542.2.5.","w":{"0":"Bonding to the gas pipe isn't a condition, and gas pipes can't be electrodes.","1":"No minimum cable size is a condition in 542.2.5.","2":"No burial depth is a condition in 542.2.5."}},{"id":"b3.05.13","t":"9","c":1,"q":"A separate single-core 70 °C thermoplastic insulated copper protective conductor, not bunched with cables, must carry an earth fault current of 2000 A for 0.1 s. Using Table 54.2 and the adiabatic equation, what is the minimum standard size?","o":["4 mm²","6 mm²","10 mm²","2.5 mm²"],"a":1,"x":"S = I × √t ÷ k; k = 143 from Table 54.2 (copper, 70 °C thermoplastic, initial 30 °C).<br>√0.1 = 0.316<br>2000 × 0.316 = 632.5<br>632.5 ÷ 143 = 4.42 mm²<br>Next larger standard size: 6 mm².","r":"543.1.3 (page 197 of the 2018 book)","n":"","k":9011,"m":"","f":"Index: 'protective conductors, k values'. Take k from Table 54.2 (separate copper, 70 °C thermoplastic), then S = I√t ÷ k (543.1.3) and round up.","w":{"0":"4 mm² is below the 4.42 mm² calculated; round up.","2":"10 mm² is too big; you probably used k = 115 (Table 54.3) instead of 143.","3":"2.5 mm² is well below the 4.42 mm² calculated."}},{"id":"b3.05.14","t":"9","c":0,"q":"A protective conductor that is a single-core cable, a conductor in a cable, or a fixed bare or insulated conductor must be of copper if its cross-sectional area is:","o":["10 mm² or less","16 mm² or less","6 mm² or less","25 mm² or less"],"a":0,"x":"Regulation 543.2.4: protective conductors of types (i) to (iv) of 543.2.1 with a cross-sectional area of 10 mm² or less shall be of copper.","r":"543.2.4 (page 199 of the 2018 book)","n":"","k":9132,"m":"","f":"Index: 'protective conductors, material'. Go to Regulation 543.2.4.","w":{"1":"16 mm² isn't the 543.2.4 threshold; it's 10 mm².","2":"6 mm² is too low; the copper requirement applies up to 10 mm².","3":"25 mm² isn't the 543.2.4 threshold; it's 10 mm²."}},{"id":"b3.05.15","t":"9","c":0,"q":"Where PME conditions apply and the supply PEN conductor is 120 mm² copper, the minimum copper main protective bonding conductor is:","o":["25 mm²","50 mm²","35 mm²","16 mm²"],"a":2,"x":"Table 54.8: PEN conductor over 95 mm² up to 150 mm² requires a main protective bonding conductor of at least 35 mm² copper equivalent.","r":"544.1.1 (page 203 of the 2018 book)","n":"","k":9317,"m":"","f":"Index: 'bonding, main protective' or 'PME'. Go to Table 54.8 and find the PEN band over 95 up to 150 mm².","w":{"0":"25 mm² is for PEN over 50 up to 95 mm².","1":"50 mm² is for PEN over 150 mm².","3":"16 mm² is for PEN over 35 up to 50 mm²."}},{"id":"b3.05.16","t":"10","c":0,"q":"Lighting circuits incorporating B15, B22, E14, E27 or E40 lampholders must be protected by an overcurrent device with a maximum rating of:","o":["6 A","10 A","20 A","16 A"],"a":3,"x":"Regulation 559.5.1.204: lighting circuits with B15, B22, E14, E27 or E40 lampholders shall be protected by an overcurrent protective device of maximum rating 16 A.","r":"559.5.1.204 (page 220 of the 2018 book)","n":"","k":10098,"m":"","f":"Index: 'lampholders' or 'lighting circuits'. Go to Section 559, Regulation 559.5.1.204.","w":{"0":"6 A is a common choice, but the maximum allowed is 16 A.","1":"10 A is allowed, but it isn't the maximum; that's 16 A.","2":"20 A exceeds the 16 A maximum."}},{"id":"b3.05.17","t":"10","c":0,"q":"For safety services, the power output of a low power supply system is limited to:","o":["500 W for a 3-hour duration and 1500 W for a 1-hour duration","1500 W for a 3-hour duration and 500 W for a 1-hour duration","500 W for a 1-hour duration only","1000 W for a 3-hour duration"],"a":0,"x":"Regulation 560.6.11: a low power supply system is limited to 500 W for 3 hours and 1500 W for 1 hour.","r":"560.6.11 (page 225 of the 2018 book)","n":"","k":10347,"m":"","f":"Index: 'safety services, low power supply'. Go to Chapter 56, Regulation 560.6.11.","w":{"1":"You swapped them: 500 W for 3 hours, 1500 W for 1 hour.","2":"Incomplete: it's 500 W for 3 hours and 1500 W for 1 hour.","3":"1000 W isn't a figure in 560.6.11."}},{"id":"b4.05.18","t":"9","c":0,"q":"A final circuit supplies equipment with a total protective conductor current likely to exceed 10 mA. If a single protective conductor is used, with no additional mechanical protection, its minimum cross-sectional area is:","o":["4 mm²","10 mm²","6 mm²","2.5 mm²"],"a":1,"x":"Regulation 543.7.1.203(i): a single protective conductor of not less than 10 mm². Item (ii) allows 4 mm² copper only if it is enclosed for extra mechanical protection.","r":"543.7.1.203 (page 201 of the 2018 book)","n":"","k":9245,"m":"","f":"Index: 'protective conductor current, high'. Go to Regulation 543.7.1.203, item (i).","w":{"0":"4 mm² is allowed only with extra mechanical protection (item ii).","2":"6 mm² isn't the single-conductor figure; it's 10 mm².","3":"2.5 mm² doesn't meet 543.7.1.203."}},{"id":"b4.05.19","t":"9","c":0,"q":"Where PME conditions do NOT apply, a copper main protective bonding conductor need not exceed:","o":["16 mm²","10 mm²","25 mm²","35 mm²"],"a":2,"x":"Regulation 544.1.1: not less than half the earthing conductor size and not less than 6 mm², but it need not exceed 25 mm² copper (or equivalent conductance in other metals).","r":"544.1.1 (page 202 of the 2018 book)","n":"","k":9298,"m":"","f":"Index: 'bonding, main protective'. Go to Regulation 544.1.1 (non-PME paragraph).","w":{"0":"16 mm² isn't the cap; it need not exceed 25 mm².","1":"10 mm² is the PME minimum in Table 54.8, not the non-PME cap.","3":"35 mm² is a Table 54.8 PME value; non-PME caps at 25 mm²."}},{"id":"b4.05.20","t":"9","c":1,"q":"A sheathed supplementary bonding conductor connects two exposed-conductive-parts. The circuit protective conductors connected to them are 2.5 mm² and 1.5 mm². What is the minimum size of the bonding conductor?","o":["2.5 mm²","4 mm²","1.5 mm²","0.75 mm²"],"a":2,"x":"Regulation 544.2.1: if sheathed, its conductance must be not less than that of the smaller protective conductor connected to the exposed-conductive-parts.<br>Smaller cpc = 1.5 mm²<br>Minimum = 1.5 mm² (4 mm² would apply only without mechanical protection).","r":"544.2.1 (page 203 of the 2018 book)","n":"","k":9329,"m":"","f":"Index: 'bonding, supplementary'. Go to Regulation 544.2.1 for two exposed-conductive-parts.","w":{"0":"You used the larger cpc; 544.2.1 uses the smaller.","1":"4 mm² applies only without mechanical protection; this is sheathed.","3":"0.75 mm² is below the smaller cpc of 1.5 mm²."}},{"id":"b4.05.21","t":"10","c":1,"q":"Supplementary bonding is required on the load side of a static convertor. The maximum earth fault current the convertor can supply with the bypass switch closed is 400 A. What is the maximum resistance of the supplementary bonding conductor?","o":["0.5 Ω","0.2 Ω","8 Ω","0.125 Ω"],"a":3,"x":"Regulation 551.4.3.3.1: R ≤ 50 ÷ Ia.<br>R = 50 ÷ 400<br>R = 0.125 Ω","r":"551.4.3.3.1 (page 208 of the 2018 book)","n":"","k":9529,"m":"","f":"Index: 'static convertors' or 'bonding, supplementary'. Go to Regulation 551.4.3.3.1: R ≤ 50 ÷ Ia.","w":{"0":"Not 50 ÷ Ia; 50 ÷ 400 = 0.125 Ω.","1":"Not 50 ÷ Ia; 50 ÷ 400 = 0.125 Ω.","2":"You divided 400 by 50; it's 50 ÷ 400."}},{"id":"b4.05.22","t":"10","c":0,"q":"Every electric motor (not part of equipment complying as a whole with a standard) must have control equipment providing overload protection where its rating exceeds:","o":["0.37 kW","0.5 kW","1 kW","0.25 kW"],"a":0,"x":"Regulation 552.1.2: every motor having a rating exceeding 0.37 kW shall be provided with control equipment incorporating overload protection.","r":"552.1.2 (page 210 of the 2018 book)","n":"","k":9661,"m":"","f":"Index: 'motors, overload protection'. Go to Section 552, Regulation 552.1.2.","w":{"1":"0.5 kW isn't the 552.1.2 threshold; it's 0.37 kW.","2":"1 kW isn't the 552.1.2 threshold; it's 0.37 kW.","3":"0.25 kW isn't the 552.1.2 threshold; it's 0.37 kW."}},{"id":"b4.05.23","t":"10","c":0,"q":"Except for fire and rescue service lift supply cables and wiring for lifts with special requirements, circuits for safety services shall NOT be installed in:","o":["metal trunking","lift wells or other flue-like openings","cable trays","separate fire compartments"],"a":1,"x":"Regulation 560.7.8: safety service circuits shall not be installed in lift wells or other flue-like openings, because the upward draught in a fire can raise temperatures beyond the capabilities of the cable.","r":"560.7.8 (page 226 of the 2018 book)","n":"","k":10387,"m":"","f":"Index: 'safety services, wiring' or 'lift wells'. Go to Chapter 56, Regulation 560.7.8.","w":{"0":"Metal trunking isn't prohibited by 560.7.8.","2":"Cable trays aren't prohibited by 560.7.8.","3":"Separate fire compartments help safety services; they aren't banned."}},{"id":"b5.05.24","t":"9","c":0,"q":"A protective conductor is not part of a cable, not formed by a wiring enclosure and not contained in one, and has no mechanical protection. Its minimum size is:","o":["4 mm² copper equivalent","2.5 mm² copper equivalent","1.5 mm² copper equivalent","6 mm² copper equivalent"],"a":0,"x":"Regulation 543.1.1: such a protective conductor must be at least 2.5 mm² copper equivalent if mechanically protected and 4 mm² copper equivalent if not.","r":"543.1.1 (page 196 of the 2018 book)","n":"","k":8979,"m":"","f":"Index: 'protective conductors, cross-sectional area'. Go to Regulation 543.1.1 and its paragraph on separate conductors.","w":{"1":"2.5 mm² is for a separate conductor that is mechanically protected.","2":"1.5 mm² isn't a separate-conductor minimum.","3":"6 mm² isn't the 543.1.1 figure; it's 4 mm²."}},{"id":"b5.05.25","t":"9","c":1,"q":"A multicore cable with 90 °C thermosetting insulation has a copper cpc. The earth fault current is 3000 A and the disconnection time is 0.1 s. Using Table 54.3 and the adiabatic equation, what is the minimum standard cpc size?","o":["4 mm²","6 mm²","16 mm²","10 mm²"],"a":3,"x":"S = I × √t ÷ k; k = 143 from Table 54.3 (copper, 90 °C thermosetting).<br>√0.1 = 0.316<br>3000 × 0.316 = 948.7<br>948.7 ÷ 143 = 6.63 mm²<br>Next larger standard size: 10 mm².","r":"543.1.3 (page 197 of the 2018 book)","n":"","k":9027,"m":"","f":"Index: 'protective conductors, k values'. Take k from Table 54.3 (copper, 90 °C thermosetting), then S = I√t ÷ k (543.1.3) and round up.","w":{"0":"4 mm² is well below the 6.63 mm² calculated.","1":"6 mm² is below 6.63 mm²; round up to 10 mm².","2":"16 mm² is larger than needed; check k = 143."}},{"id":"b5.05.26","t":"9","c":1,"q":"A distribution circuit has 50 mm² copper line conductors and a copper cpc. If Table 54.7 is used instead of calculation, the minimum cpc size is:","o":["16 mm²","25 mm²","35 mm²","50 mm²"],"a":1,"x":"Table 54.7: for line conductors over 35 mm² with the same material, the protective conductor is S ÷ 2.<br>50 ÷ 2 = 25 mm²","r":"543.1.4 (page 198 of the 2018 book)","n":"","k":9104,"m":"","f":"Index: 'protective conductors, cross-sectional area'. Go to Table 54.7, row for line conductors over 35 mm² (S/2).","w":{"0":"16 mm² is for line conductors over 16 up to 35 mm².","2":"35 mm² isn't S/2; 50 ÷ 2 = 25 mm².","3":"Same-as-line applies only up to 16 mm²."}},{"id":"b5.05.27","t":"9","c":0,"q":"Equipment has a protective conductor current of 6 mA. Which connection method is permitted by Regulation 543.7.1.201?","o":["A BS 1363 plug and socket-outlet","A BS 546 plug and socket-outlet","A plug and socket-outlet to BS EN 60309-2","A cable coupler to BS EN 60320-1"],"a":2,"x":"Regulation 543.7.1.201: equipment with a protective conductor current over 3.5 mA but not over 10 mA must be permanently connected or connected by a plug and socket-outlet complying with BS EN 60309-2.","r":"543.7.1.201 (page 201 of the 2018 book)","n":"","k":9230,"m":"","f":"Index: 'protective conductor current, high'. Go to Regulation 543.7.1.201 for 3.5–10 mA.","w":{"0":"BS 1363 isn't permitted for over 3.5 mA under 543.7.1.201.","1":"BS 546 isn't listed in 543.7.1.201.","3":"BS EN 60320-1 couplers aren't permitted by 543.7.1.201."}},{"id":"b5.05.28","t":"10","c":0,"q":"A single-phase water heater with an uninsulated heating element immersed in the water must be connected to the supply through:","o":["a BS 1363 plug and socket-outlet","a single-pole switch in the line conductor","a fused connection unit with a flex outlet and plug","a double-pole linked switch, with no plug and socket-outlet"],"a":3,"x":"Regulation 554.3.3: the heater shall be permanently connected through a double-pole linked switch, and the wiring connected directly to that switch without a plug and socket-outlet.","r":"554.3.3 (page 212 of the 2018 book)","n":"","k":9759,"m":"","f":"Index: 'water heaters'. Go to Section 554, Regulation 554.3.3.","w":{"0":"A plug and socket is forbidden; it must be permanently connected.","1":"A single-pole switch isn't enough; it must be double-pole linked.","2":"A plug is forbidden; wire directly to a double-pole switch."}},{"id":"b5.05.29","t":"10","c":0,"q":"Protection against electric shock for circuits supplying display stands for luminaires must be by SELV or PELV, or by an RCD with a rated residual operating current not exceeding:","o":["30 mA","100 mA","10 mA","300 mA"],"a":0,"x":"Regulation 559.8: SELV or PELV, or an RCD of not more than 30 mA providing both automatic disconnection (Section 411) and additional protection (Regulation 415.1).","r":"559.8 (page 221 of the 2018 book)","n":"","k":10163,"m":"","f":"Index: 'display stands for luminaires'. Section 559 (Chapter 55), Regulation 559.8.","w":{"1":"100 mA is not used here; display stands need 30 mA because the RCD also provides additional protection to 415.1.","2":"10 mA is not the figure in 559.8; the limit is 30 mA, the same as additional protection to 415.1.1.","3":"300 mA is a fire-protection type figure; for shock protection of display stands 559.8 requires 30 mA."}},{"id":"b1.06.00","t":"11","c":0,"q":"According to BS 7671, when shall every installation be inspected and tested to verify that the requirements of the Regulations have been met?","o":["Only on completion, after it has been put into service","Within 28 days of being put into service","During erection and on completion before being put into service","Only at the first periodic inspection"],"a":2,"x":"Regulation 641.1 requires every installation to be inspected and tested during erection and on completion before being put into service.","r":"641.1 (page 230 of the 2018 book)","n":"","k":10482,"m":"","f":"Index: 'initial verification'. Part 6, Chapter 64, Regulation 641.1, first sentence.","w":{"0":"Testing must also happen during erection, and completion testing comes before, not after, it is put into service.","1":"There is no 28-day period in 641.1; verification is done during erection and on completion before energising for use.","3":"Periodic inspection (Chapter 65) is later; initial verification under 641.1 is done before the installation is put into service."}},{"id":"b1.06.01","t":"11","c":0,"q":"Inspection during initial verification shall precede testing and shall normally be done with the part of the installation under inspection","o":["disconnected from the supply","energized at reduced voltage","energized at full load","connected to a temporary supply"],"a":0,"x":"Regulation 642.1: inspection shall precede testing and shall normally be done with that part of the installation disconnected from the supply.","r":"642.1 (page 230 of the 2018 book)","n":"","k":10498,"m":"","f":"Index: 'inspection'. Chapter 64, Regulation 642.1 (inspection precedes testing).","w":{"1":"642.1 says inspection is normally done with that part disconnected from the supply, not energised at any voltage.","2":"Inspection is a visual check done dead; energising at full load is never the normal condition in 642.1.","3":"No temporary supply is mentioned; 642.1 requires that part of the installation to be disconnected from the supply."}},{"id":"b1.06.02","t":"11","c":0,"q":"What is the minimum insulation resistance required by Table 64 for a SELV circuit?","o":["0.25 MΩ","1.0 MΩ","2.0 MΩ","0.5 MΩ"],"a":3,"x":"Table 64: SELV and PELV circuits are tested at 250 V DC and the minimum insulation resistance is 0.5 MΩ.","r":"643.3.2 (page 232 of the 2018 book)","n":"","k":10595,"m":"","f":"Index: 'insulation resistance'. Regulation 643.3, Table 64, SELV and PELV row.","w":{"0":"0.25 MΩ was the old 16th Edition SELV value; Table 64 now gives 0.5 MΩ at 250 V DC.","1":"1.0 MΩ is the Table 64 minimum for circuits up to 500 V and above 500 V, not SELV/PELV.","2":"2.0 MΩ is not a Table 64 value; the SELV/PELV row gives 0.5 MΩ."}},{"id":"b1.06.03","t":"11","c":0,"q":"When verifying the resistance of insulating floors and walls to comply with Regulation 418.1, at least how many measurements shall be made in the same location?","o":["Two","Three","Four","Five"],"a":1,"x":"Regulation 643.5.1: at least three measurements in the same location, one approximately 1 m from any accessible extraneous-conductive-part and the other two at greater distances.","r":"643.5.1 (page 233 of the 2018 book)","n":"","k":10639,"m":"","f":"Index: 'insulating floors and walls'. Chapter 64, Regulation 643.5.1.","w":{"0":"Two is too few; 643.5.1 requires at least three, one about 1 m from an extraneous-conductive-part.","2":"643.5.1 asks for at least three measurements, not four.","3":"643.5.1 asks for at least three measurements, not five."}},{"id":"b1.06.04","t":"11","c":1,"q":"An IT installation is supplied from a local transformer. The maximum allowed earth fault loop impedance for a circuit is 1.2 Ω. For verification to be achieved, the measured loop impedance must not exceed","o":["1.2 Ω","0.96 Ω","0.6 Ω","0.3 Ω"],"a":2,"x":"Regulation 643.7.1(c)(i): verification is achieved if the measured value is no more than 50 % of the maximum allowed loop impedance.<br>1.2 × 0.5 = 0.6 Ω","r":"643.7.1 (page 234 of the 2018 book)","n":"","k":10715,"m":"","f":"Index: 'IT system, verification'. Regulation 643.7.1(c): measured value no more than 50 % of the maximum allowed; multiply by 0.5.","w":{"0":"That is the maximum allowed value itself; 643.7.1(c) only accepts a measured value up to 50 % of it.","1":"0.96 Ω is 80 % of 1.2 Ω (the Appendix 3 rule of thumb); for this IT case 643.7.1(c) uses 50 %.","3":"0.3 Ω is 25 %; the requirement is 50 % of the maximum, giving 0.6 Ω."}},{"id":"b1.06.05","t":"11","c":0,"q":"An Electrical Installation Condition Report shall indicate a recommended interval until the next inspection, supported by","o":["the signature of the person ordering the work","an explanation for the recommendation","a copy of the original Electrical Installation Certificate","the results of a thermographic survey"],"a":1,"x":"Regulation 653.4: the Report shall indicate a recommended interval until the next inspection, supported by an explanation for the recommendation.","r":"653.4 (page 238 of the 2018 book)","n":"","k":10863,"m":"","f":"Index: 'Electrical Installation Condition Report'. Chapter 65, Regulation 653.4.","w":{"0":"653.4 does not require the client's signature; the interval must be backed by an explanation for the recommendation.","2":"A copy of the original EIC is not required to support the interval; an explanation is.","3":"Thermographic surveys are not mentioned in 653.4; the interval is supported by an explanation."}},{"id":"b2.06.06","t":"11","c":0,"q":"Initial verification of an electrical installation shall be made by","o":["the person ordering the work","an instructed person under supervision","any person holding a test instrument calibration certificate","one or more skilled persons competent in such work"],"a":3,"x":"Regulation 641.6: the verification shall be made by one or more skilled persons competent in such work.","r":"641.6 (page 230 of the 2018 book)","n":"","k":10494,"m":"","f":"Index: 'initial verification'. Chapter 64, Regulation 641.6.","w":{"0":"The person ordering the work is not required to verify; 641.6 says skilled persons competent in such work.","1":"An instructed person is not enough; 641.6 requires one or more skilled persons competent in such work.","2":"Holding a calibrated instrument does not make someone competent; 641.6 requires skilled, competent persons."}},{"id":"b2.06.07","t":"11","c":0,"q":"Measuring instruments and monitoring equipment used for testing shall be chosen in accordance with the relevant parts of","o":["BS EN 61557","BS EN 60079-17","BS 5839-1","BS EN 60238"],"a":0,"x":"Regulation 643.1: instruments and methods shall be chosen in accordance with the relevant parts of BS EN 61557, or provide no lesser degree of performance and safety.","r":"643.1 (page 231 of the 2018 book)","n":"","k":10563,"m":"","f":"Index: 'measuring instruments' or 'testing, instruments'. Chapter 64, Regulation 643.1.","w":{"1":"BS EN 60079-17 covers inspection of explosive atmosphere installations, not test instruments generally.","2":"BS 5839-1 is the fire detection and alarm standard, not test instruments.","3":"BS EN 60238 is for Edison screw lampholders (it appears in 643.6 polarity), not test instruments."}},{"id":"b2.06.08","t":"11","c":1,"q":"An insulation resistance test on a 230 V final circuit at 500 V DC gives a reading of 0.75 MΩ. Compared with Table 64, the result is","o":["satisfactory, as it exceeds the 0.5 MΩ minimum","satisfactory, as it exceeds the 0.25 MΩ minimum","unsatisfactory, as the minimum is 1.0 MΩ","unsatisfactory, as the minimum is 2.0 MΩ"],"a":2,"x":"Table 64: circuits up to and including 500 V (other than SELV/PELV) are tested at 500 V DC with a minimum of 1.0 MΩ.<br>0.75 MΩ is less than 1.0 MΩ, so the circuit fails.","r":"643.3.2 (page 232 of the 2018 book)","n":"","k":10596,"m":"","f":"Index: 'insulation resistance'. Regulation 643.3.2, Table 64, 'up to and including 500 V' row; compare the reading to the minimum.","w":{"0":"0.5 MΩ is the SELV/PELV minimum; a 230 V circuit falls in the up-to-500 V row needing 1.0 MΩ.","1":"0.25 MΩ is an old 16th Edition SELV figure; a 230 V circuit needs 1.0 MΩ.","3":"The reading does fail, but the Table 64 minimum is 1.0 MΩ, not 2.0 MΩ."}},{"id":"b2.06.09","t":"11","c":0,"q":"During the polarity test, centre contact bayonet and Edison screw lampholders shall have their outer or screwed contacts connected to the neutral conductor, except for","o":["B15 and B22 lampholders","E14 and E27 lampholders to BS EN 60238","all lampholders on SELV circuits","lampholders in luminaires of Class II construction"],"a":1,"x":"Regulation 643.6(ii) exempts E14 and E27 lampholders to BS EN 60238 from this polarity requirement.","r":"643.6 (page 233 of the 2018 book)","n":"","k":10658,"m":"","f":"Index: 'polarity'. Chapter 64, Regulation 643.6(ii), the exception for lampholders.","w":{"0":"B15 and B22 bayonet lampholders are not the exception in 643.6; the exemption is E14 and E27 to BS EN 60238.","2":"643.6 gives no blanket exemption for SELV circuits; the exception is E14 and E27 lampholders.","3":"Class II construction is not the exception in 643.6; it names E14 and E27 lampholders to BS EN 60238."}},{"id":"b2.06.10","t":"11","c":0,"q":"Before an earth fault loop impedance measurement is carried out, which test shall be carried out according to Regulation 643.7.3?","o":["Phase sequence","Functional testing","Voltage drop","Continuity of protective conductors"],"a":3,"x":"Regulation 643.7.3: an electrical continuity test according to Regulation 643.2 shall be carried out before the earth fault loop impedance measurement.","r":"643.7.3 (page 235 of the 2018 book)","n":"","k":10731,"m":"","f":"Index: 'earth fault loop impedance, testing'. Chapter 64, Regulation 643.7.3, which refers back to 643.2.","w":{"0":"Phase sequence (643.9) is not the prerequisite; 643.7.3 requires a continuity test to 643.2 first.","1":"Functional testing (643.10) comes later; 643.7.3 needs continuity of protective conductors first.","2":"Voltage drop (643.11) is not a prerequisite; continuity to 643.2 must be done before loop testing."}},{"id":"b2.06.11","t":"11","c":0,"q":"During periodic inspection and testing, measurement of insulation resistance of a circuit is not necessary where","o":["the circuit is permanently monitored by an RCM or IMD that is functioning correctly","the circuit is protected by a 30 mA RCD","the circuit was tested within the previous five years","the circuit supplies only fixed equipment"],"a":0,"x":"Regulation 651.2: where a circuit is permanently monitored by an RCM or IMD it is not necessary to measure insulation resistance if the RCM or IMD functions correctly; that functioning shall be verified.","r":"651.2 (page 237 of the 2018 book)","n":"","k":10831,"m":"","f":"Index: 'periodic inspection and testing'. Chapter 65, Regulation 651.2, paragraph on RCM or IMD.","w":{"1":"A 30 mA RCD does not remove the need; only a correctly functioning RCM or IMD does under 651.2.","2":"651.2 has no five-year exemption; the exemption depends on permanent monitoring by an RCM or IMD.","3":"Supplying only fixed equipment is not an exemption; 651.2 relies on RCM or IMD monitoring."}},{"id":"b3.06.12","t":"11","c":0,"q":"Regulation 641.2 requires the assessment of general characteristics to be made available to the person carrying out inspection and testing. Which Sections of the Regulations set out these general characteristics?","o":["Sections 411 to 413","Sections 311 to 313","Sections 511 to 514","Sections 641 to 643"],"a":1,"x":"Regulation 641.2: the fundamental principles (Section 131), the general characteristics required by Sections 311 to 313 and the information required by Regulation 514.9.1 shall be made available.","r":"641.2 (page 230 of the 2018 book)","n":"","k":10485,"m":"","f":"Index: 'assessment of general characteristics'. Regulation 641.2, which points to Part 3 (Chapter 31, Sections 311 to 313).","w":{"0":"Sections 411 to 413 are protective measures in Chapter 41, not the general characteristics.","2":"Sections 511 to 514 are common rules in Chapter 51; 641.2 mentions 514.9.1 separately for diagrams.","3":"Sections 641 to 643 are the verification requirements themselves, not the general characteristics."}},{"id":"b3.06.13","t":"11","c":0,"q":"Where an installation incorporates an earth electrode, the earth electrode resistance test (Regulation 643.7.2) shall be carried out","o":["only after all RCDs have been tested","at the first periodic inspection","after the earth fault loop impedance test","before the installation is energized"],"a":3,"x":"Regulation 643.1: the tests of 643.2 to 643.6 are carried out in order before energizing, and where there is an earth electrode the test of 643.7.2 shall also be done before the installation is energized.","r":"643.1 (page 231 of the 2018 book)","n":"","k":10569,"m":"","f":"Index: 'earth electrode, testing'. Chapter 64, Regulation 643.1 (order of tests) and 643.7.2.","w":{"0":"643.1 does not tie the electrode test to RCD testing; it must be done before energising.","1":"The electrode test is part of initial verification, not delayed to periodic inspection.","2":"Loop impedance is a live test; 643.1 requires the electrode test before the installation is energised."}},{"id":"b3.06.14","t":"11","c":0,"q":"It is not reasonably practicable to disconnect a fixed socket-outlet incorporating an SPD before an insulation resistance test on a 230 V circuit. The test voltage may be reduced to 250 V DC, but the insulation resistance shall be at least","o":["1 MΩ","0.5 MΩ","0.25 MΩ","2 MΩ"],"a":0,"x":"Regulation 643.3.2: where SPDs cannot reasonably be disconnected, the test voltage for that circuit may be reduced to 250 V DC, but the insulation resistance shall be at least 1 MΩ.","r":"643.3.2 (page 232 of the 2018 book)","n":"","k":10605,"m":"","f":"Index: 'surge protective devices, insulation resistance'. Regulation 643.3.2, paragraph after Table 64.","w":{"1":"0.5 MΩ is the SELV/PELV minimum; with an SPD left connected at 250 V the minimum is 1 MΩ.","2":"0.25 MΩ is not the figure; 643.3.2 keeps the 1 MΩ minimum at the reduced 250 V.","3":"2 MΩ is not stated; reducing the test voltage to 250 V still requires at least 1 MΩ."}},{"id":"b3.06.15","t":"11","c":0,"q":"Insulation of extraneous-conductive-parts intended to satisfy Regulation 418.1.4(iii) shall be able to withstand a test voltage of at least","o":["500 V DC","1 kV AC rms","2 kV AC rms","4 kV AC rms"],"a":2,"x":"Regulation 643.5.201(ii): the insulation shall withstand at least 2 kV AC rms (and be not less than 1 MΩ at 500 V DC, with leakage current not exceeding 1 mA).","r":"643.5.201 (page 233 of the 2018 book)","n":"","k":10650,"m":"","f":"Index: 'non-conducting location' or 'insulating floors and walls'. Regulation 643.5.201(ii).","w":{"0":"500 V DC is the insulation resistance test voltage in the same regulation, not the withstand voltage.","1":"1 kV is too low; 643.5.201(ii) requires at least 2 kV AC rms.","3":"4 kV is not the figure for this; 643.5.201(ii) requires 2 kV AC rms."}},{"id":"b3.06.16","t":"11","c":0,"q":"According to Regulation 643.7.3.201, the prospective short-circuit current and prospective earth fault current shall be","o":["measured, calculated or determined by another method, at the origin and at other relevant points","measured only, at the origin only","obtained from the distributor only","calculated only, at the furthest point of each final circuit"],"a":0,"x":"Regulation 643.7.3.201: prospective short-circuit and earth fault currents shall be measured, calculated or determined by another method at the origin and at other relevant points.","r":"643.7.3.201 (page 235 of the 2018 book)","n":"","k":10738,"m":"","f":"Index: 'prospective fault current, verification'. Chapter 64, Regulation 643.7.3.201.","w":{"1":"It is not measurement only nor origin only; calculation or another method is allowed, at other relevant points too.","2":"Distributor data is one source, but 643.7.3.201 allows measuring, calculating or another method.","3":"Calculation is only one option, and it applies at the origin and other relevant points."}},{"id":"b3.06.17","t":"11","c":0,"q":"For an installation under an effective management system for preventative maintenance in normal use, periodic inspection and testing may be replaced by","o":["a visual inspection by the occupier every twelve months","annual RCD test button operation only","a new Electrical Installation Certificate every five years","an adequate regime of continuous monitoring and maintenance by skilled persons"],"a":3,"x":"Regulation 652.2: periodic inspection and testing may be replaced by an adequate regime of continuous monitoring and maintenance by one or more skilled persons, with appropriate records kept.","r":"652.2 (page 237 of the 2018 book)","n":"","k":10846,"m":"","f":"Index: 'periodic inspection and testing'. Chapter 65, Regulation 652.2 (maintenance management systems).","w":{"0":"A visual check by the occupier is not mentioned; 652.2 requires continuous monitoring and maintenance by skilled persons.","1":"Pressing RCD test buttons is a user check, not a replacement for periodic inspection under 652.2.","2":"A new EIC is for new work; 652.2 allows continuous monitoring and maintenance by skilled persons instead."}},{"id":"b4.06.18","t":"11","c":0,"q":"During inspection, compliance of installed equipment with Section 511 (compliance with standards) may be ascertained by","o":["an insulation resistance test","mark or certification furnished by the installer or manufacturer","an earth fault loop impedance test","the age of the equipment"],"a":1,"x":"Regulation 642.2(i): compliance with Section 511 may be ascertained by mark or by certification furnished by the installer or the manufacturer.","r":"642.2 (page 230 of the 2018 book)","n":"","k":10501,"m":"","f":"Index: 'inspection'. Chapter 64, Regulation 642.2(i).","w":{"0":"Insulation resistance is a test (643.3), not how compliance with standards in Section 511 is shown.","2":"Loop impedance testing (643.7) does not show compliance with product standards; marking or certification does.","3":"Age says nothing about compliance; 642.2(i) uses mark or certification by installer or manufacturer."}},{"id":"b4.06.19","t":"11","c":0,"q":"Regulation 643.2.1 requires continuity of live conductors to be verified by measurement of resistance in the case of","o":["all lighting circuits","radial circuits over 20 A","ring final circuits","circuits supplying fixed equipment"],"a":2,"x":"Regulation 643.2.1: continuity is verified for protective conductors (including bonding conductors) and, in the case of ring final circuits, live conductors.","r":"643.2.1 (page 232 of the 2018 book)","n":"","k":10579,"m":"","f":"Index: 'continuity of conductors'. Chapter 64, Regulation 643.2.1.","w":{"0":"643.2.1 does not single out lighting circuits; live conductor continuity is measured for ring final circuits.","1":"There is no 20 A threshold in 643.2.1; it is ring final circuits.","3":"Fixed equipment circuits are not named; 643.2.1 names ring final circuits for live conductors."}},{"id":"b4.06.20","t":"11","c":0,"q":"What DC test voltage does Table 64 specify for an insulation resistance test on a circuit with a nominal voltage above 500 V?","o":["250 V","500 V","750 V","1000 V"],"a":3,"x":"Table 64: circuits above 500 V are tested at 1000 V DC, with a minimum insulation resistance of 1.0 MΩ.","r":"643.3.2 (page 232 of the 2018 book)","n":"","k":10598,"m":"","f":"Index: 'insulation resistance'. Regulation 643.3, Table 64, 'above 500 V' row.","w":{"0":"250 V DC is the SELV/PELV test voltage.","1":"500 V DC is for circuits up to and including 500 V; above 500 V uses 1000 V.","2":"750 V is not a Table 64 test voltage."}},{"id":"b4.06.21","t":"11","c":1,"q":"A SELV circuit is installed in the same enclosure as a 400 V three-phase circuit. The separation between them is verified by insulation resistance measurement. The minimum acceptable value is","o":["1.0 MΩ","0.5 MΩ","0.25 MΩ","2.0 MΩ"],"a":0,"x":"Regulation 643.4: the resistance values shall be at least those for the circuit with the highest voltage present, per Table 64.<br>Highest voltage = 400 V (up to and including 500 V)<br>Table 64: test at 500 V DC, minimum 1.0 MΩ","r":"643.4 (page 232 of the 2018 book)","n":"","k":10619,"m":"","f":"Index: 'separation of circuits'. Regulation 643.4 says use the highest voltage present, then read Table 64 for 400 V.","w":{"1":"0.5 MΩ is the SELV row; 643.4 says to use the highest voltage present, here 400 V.","2":"0.25 MΩ is not a current Table 64 value; the 400 V circuit sets the minimum at 1.0 MΩ.","3":"2.0 MΩ is not a Table 64 value; up to 500 V needs 1.0 MΩ."}},{"id":"b4.06.22","t":"11","c":0,"q":"For polyphase circuits, Regulation 643.9 requires verification that","o":["each phase carries an equal load","the phase sequence is maintained at all relevant points throughout the installation","the neutral current does not exceed 10 % of line current","the line-to-line voltage is within 3 % of nominal"],"a":1,"x":"Regulation 643.9: for polyphase circuits, it shall be verified that the phase sequence is maintained at all relevant points throughout the installation.","r":"643.9 (page 235 of the 2018 book)","n":"","k":10751,"m":"","f":"Index: 'phase sequence'. Chapter 64, Regulation 643.9.","w":{"0":"Balancing load is a design matter, not what 643.9 verifies.","2":"643.9 says nothing about neutral current; it requires the phase sequence to be maintained.","3":"Voltage tolerance is not in 643.9; it is about phase sequence."}},{"id":"b4.06.23","t":"11","c":0,"q":"For a new installation, any defect or omission revealed during inspection and testing shall be","o":["recorded as a C3 observation on the certificate","reported to the distributor within 28 days","corrected before the Certificate is issued","noted for correction at the first periodic inspection"],"a":2,"x":"Regulation 644.1.1: for a new installation, any defect or omission revealed during inspection and testing shall be corrected before the Certificate is issued.","r":"644.1.1 (page 236 of the 2018 book)","n":"","k":10779,"m":"","f":"Index: 'defects or omissions'. Chapter 64, Regulation 644.1.1.","w":{"0":"C3 codes belong to a periodic EICR; on a new installation defects must be corrected first.","1":"No distributor reporting is required; 644.1.1 requires correction before the Certificate is issued.","3":"Leaving defects for a later periodic inspection is not allowed; correct them before certifying."}},{"id":"b5.06.24","t":"11","c":0,"q":"If any test during initial verification indicates a failure to comply, after the fault has been rectified","o":["that test and any preceding test whose results may have been influenced by the fault shall be repeated","only the failed test needs to be repeated","all tests on the whole installation shall be repeated","no further testing is needed provided the fault is recorded"],"a":0,"x":"Regulation 643.1: that test and any preceding test, the results of which may have been influenced by the fault, shall be repeated after the fault has been rectified.","r":"643.1 (page 232 of the 2018 book)","n":"","k":10573,"m":"","f":"Index: 'testing, sequence' or 'initial verification'. Chapter 64, Regulation 643.1, last paragraph.","w":{"1":"Earlier results may have been influenced by the fault, so those preceding tests must be repeated too.","2":"643.1 does not require retesting the whole installation, only the affected tests.","3":"Recording is not enough; the failed test and any influenced earlier tests must be repeated."}},{"id":"b5.06.25","t":"11","c":0,"q":"Where a circuit includes electronic devices likely to influence the insulation resistance results or be damaged, Regulation 643.3.3 requires","o":["the test voltage to be increased to 1000 V","no insulation resistance test to be carried out","the test to be made between line and neutral only","only a measurement between the live conductors connected together and the earthing arrangement"],"a":3,"x":"Regulation 643.3.3: only a measurement between the live conductors connected together and the earthing arrangement shall be made.","r":"643.3.3 (page 232 of the 2018 book)","n":"","k":10614,"m":"","f":"Index: 'insulation resistance'. Chapter 64, Regulation 643.3.3.","w":{"0":"Raising the voltage would risk damaging electronics; 643.3.3 changes the test connections instead.","1":"The test is still required, made with live conductors connected together to earth.","2":"Line to neutral is exactly the measurement to avoid with electronics connected; test live conductors together to earth."}},{"id":"b5.06.26","t":"11","c":0,"q":"For electrical separation supplying more than one item of current-using equipment, the disconnection time following two coincidental faults on different line conductors shall be in accordance with that for automatic disconnection of supply in","o":["a TT system","a TN system","an IT system","a SELV system"],"a":1,"x":"Regulation 643.4.3: at least one faulty circuit shall be disconnected, with the disconnection time in accordance with that for ADS in a TN system.","r":"643.4.3 (page 233 of the 2018 book)","n":"","k":10637,"m":"","f":"Index: 'electrical separation, verification'. Chapter 64, Regulation 643.4.3.","w":{"0":"643.4.3 refers to ADS in a TN system, not TT.","2":"The two-fault condition is compared with a TN system, not IT.","3":"SELV is a separate protective measure, not ADS, so it has no disconnection time to refer to."}},{"id":"b5.06.27","t":"11","c":0,"q":"In a TT system, where measurement of the earth electrode resistance RA is not practicable, Regulation 643.7.1 permits the use of","o":["the R1 + R2 value of the longest circuit","the insulation resistance of the earthing conductor","the measured value of external earth fault loop impedance","the prospective earth fault current at the origin"],"a":2,"x":"Regulation 643.7.1(b) Note (and 643.7.2 Note): where a measurement of RA is not practicable, the measured value of external earth fault loop impedance may be used.","r":"643.7.1 (page 234 of the 2018 book)","n":"","k":10689,"m":"","f":"Index: 'earth electrode resistance'. Regulation 643.7.1(b) Note, also the Note to 643.7.2.","w":{"0":"R1 + R2 is the circuit's protective conductor path, not a substitute for RA.","1":"Insulation resistance of the earthing conductor tells you nothing about electrode resistance.","3":"Prospective fault current is not used; the Note allows measured external loop impedance (Ze)."}},{"id":"b5.06.28","t":"11","c":0,"q":"Regarding verification of voltage drop at initial verification, which statement is correct?","o":["It must always be measured at the furthest point of every circuit","It may only be calculated, never measured","It is required only for circuits over 32 A","Where required it is evaluated by measurement or calculation, but it is not normally required"],"a":3,"x":"Regulation 643.11: voltage drop shall be evaluated by measurement or by calculation where required to verify compliance with Chapter 52; the Note says it is not normally required during initial verification.","r":"643.11 (page 236 of the 2018 book)","n":"","k":10772,"m":"","f":"Index: 'voltage drop, verification'. Chapter 64, Regulation 643.11 and its Note.","w":{"0":"643.11 does not require measuring every circuit; the Note says it is not normally required.","1":"643.11 allows measurement or calculation.","2":"There is no 32 A threshold; it is evaluated only where required to show compliance with Chapter 52."}},{"id":"b5.06.29","t":"11","c":0,"q":"Where no previous documentation is available for an existing installation, Regulation 651.1 requires","o":["investigation of the installation prior to carrying out periodic inspection and testing","a new Electrical Installation Certificate to be issued","the installation to be isolated until rewired","the periodic inspection to be limited to visual inspection only"],"a":0,"x":"Regulation 651.1: where no previous documentation is available, investigation of the electrical installation shall be undertaken prior to carrying out the periodic inspection and testing.","r":"651.1 (page 237 of the 2018 book)","n":"","k":10817,"m":"","f":"Index: 'periodic inspection and testing'. Chapter 65, Regulation 651.1.","w":{"1":"An EIC is for new work; 651.1 requires investigation before periodic inspection, not a new certificate.","2":"Missing paperwork is no reason to isolate; 651.1 requires investigation first.","3":"651.1 does not restrict the scope to visual inspection; it requires investigation first."}},{"id":"b1.07.00","t":"12","c":0,"q":"In a location containing a shower with a fixed shower head mounted 2.4 m above the finished floor level, the upper limit of zone 1 is:","o":["2.25 m above the finished floor level","2.4 m above the finished floor level","2.5 m above the finished floor level","3.0 m above the finished floor level"],"a":1,"x":"Zone 1 is limited by the horizontal plane of the highest fixed shower head or water outlet or 2.25 m above finished floor level, whichever is higher. Here 2.4 m is higher than 2.25 m. Regulation 701.32.3(i), page 240.","r":"701.32.3 (page 240 of the 2018 book)","n":"","k":10931,"m":"","f":"Index: 'bath or shower, zones'. Section 701, Regulation 701.32.3(i): take the higher of the shower head height or 2.25 m.","w":{"0":"2.25 m only applies when the shower head is lower; take whichever is higher, here 2.4 m.","2":"2.5 m is the swimming pool zone 1 height (702.32), not bathrooms.","3":"3.0 m is not a zone 1 limit; it is the socket-outlet distance from zone 1 in 701.512.3."}},{"id":"b1.07.01","t":"12","c":0,"q":"The minimum degree of protection for electrical equipment installed in zone 0 of a location containing a bath or shower is:","o":["IPX4","IPX5","IPX8","IPX7"],"a":3,"x":"Regulation 701.512.2 requires at least IPX7 in zone 0 and IPX4 in zones 1 and 2 (IPX5 where water jets are used for cleaning). Page 242.","r":"701.512.2 (page 242 of the 2018 book)","n":"","k":11000,"m":"","f":"Index: 'bath or shower, external influences'. Section 701, Regulation 701.512.2.","w":{"0":"IPX4 is the zones 1 and 2 minimum, not zone 0.","1":"IPX5 applies in zones 1 and 2 where water jets are used for cleaning.","2":"IPX8 is the swimming pool zone 0 requirement (702.512.2), not bathrooms."}},{"id":"b1.07.02","t":"12","c":0,"q":"For a swimming pool without diving boards or other occupied components, zone 1 extends horizontally from the rim of the basin for a distance of:","o":["2.0 m","1.5 m","2.5 m","1.2 m"],"a":0,"x":"Regulation 702.32(ii): zone 1 is limited by a vertical plane 2 m from the rim of the basin and a horizontal plane 2.5 m above the floor. Page 245.","r":"702.32 (page 245 of the 2018 book)","n":"","k":11149,"m":"","f":"Index: 'swimming pools, zones'. Section 702, Regulation 702.32(ii).","w":{"1":"1.5 m is how far zone 2 extends beyond zone 1 (702.32(iii)), not zone 1 itself.","2":"2.5 m is the height of zone 1 above the floor, not its horizontal distance.","3":"1.2 m is the shower zone 1 radius (701.32.3), not swimming pools."}},{"id":"b1.07.03","t":"12","c":0,"q":"On a construction site, a circuit supplying a socket-outlet rated above 32 A shall be provided with an RCD having a rated residual operating current not exceeding:","o":["30 mA","100 mA","500 mA","300 mA"],"a":2,"x":"Regulation 704.411.3.2.1: for socket-outlets rated above 32 A, an RCD not exceeding 500 mA shall be provided to give automatic disconnection. Page 257.","r":"704.411.3.2.1 (page 257 of the 2018 book)","n":"","k":11651,"m":"","f":"Index: 'construction sites'. Section 704, Regulation 704.411.3.2.1.","w":{"0":"30 mA is for socket-outlets up to 32 A (411.3.3/415.1.1); above 32 A the limit is 500 mA.","1":"100 mA is the agricultural figure for sockets over 32 A (705.411.1), not construction sites.","3":"300 mA is not the construction site figure; 704.411.3.2.1 gives 500 mA."}},{"id":"b1.07.04","t":"12","c":0,"q":"In a caravan park, each socket-outlet supplying a caravan pitch shall be protected by:","o":["its own individual RCD, not exceeding 30 mA, disconnecting all live conductors","a single 30 mA RCD shared by up to four socket-outlets","a 100 mA time-delayed RCD at the origin of the distribution circuit","a 300 mA RCD disconnecting the line conductor only"],"a":0,"x":"Regulation 708.415.1: every socket-outlet shall be individually protected by an RCD not exceeding 30 mA, and the device shall disconnect all live conductors. Page 266.","r":"708.415.1 (page 266 of the 2018 book)","n":"","k":12038,"m":"","f":"Index: 'caravan parks'. Section 708, Regulation 708.415.1.","w":{"1":"Sharing is not allowed; every pitch socket-outlet needs its own RCD.","2":"An upstream time-delayed RCD does not meet 708.415.1; each socket needs its own 30 mA RCD.","3":"300 mA is too high and the RCD must disconnect all live conductors, including neutral."}},{"id":"b1.07.05","t":"12","c":0,"q":"In Group 1 and Group 2 medical locations, the measured resistance between the earth terminal of any socket-outlet and any extraneous-conductive-part shall not exceed:","o":["0.05 Ω","0.5 Ω","1.0 Ω","0.2 Ω"],"a":3,"x":"Regulation 710.415.2.2 limits the resistance between the earth terminal of any socket-outlet (or fixed equipment) and any extraneous-conductive-part to 0.2 Ω. Page 277.","r":"710.415.2.2 (page 277 of the 2018 book)","n":"","k":12507,"m":"","f":"Index: 'medical locations'. Section 710, Regulation 710.415.2.2.","w":{"0":"0.05 Ω is not the 710.415.2.2 limit; it is 0.2 Ω.","1":"0.5 Ω is too high; 710.415.2.2 limits it to 0.2 Ω.","2":"1.0 Ω is far above the 0.2 Ω limit in 710.415.2.2."}},{"id":"b2.07.06","t":"12","c":0,"q":"In a room containing a bath tub, zone 2 extends horizontally beyond the boundary of zone 1 for a distance of:","o":["0.30 m","1.20 m","0.60 m","2.25 m"],"a":2,"x":"Regulation 701.32.4(ii): zone 2 is bounded by the zone 1 boundary and a parallel vertical surface 0.60 m from it. Page 240.","r":"701.32.4 (page 240 of the 2018 book)","n":"","k":10944,"m":"","f":"Index: 'bath or shower, zones'. Section 701, Regulation 701.32.4(ii), and Figure 701.1.","w":{"0":"0.30 m is not the zone 2 width; it is 0.60 m beyond zone 1.","1":"1.20 m is the zone 1 radius for a shower without a basin.","3":"2.25 m is a height (zone 1 upper limit), not the zone 2 horizontal distance."}},{"id":"b2.07.07","t":"12","c":0,"q":"In a location containing a bath or shower, protection by electrical separation is permitted only for circuits supplying:","o":["one item of current-using equipment or one single socket-outlet","no more than two items of current-using equipment","any number of socket-outlets supplied from one isolating transformer","electric floor heating systems only"],"a":0,"x":"Regulation 701.413 limits electrical separation to circuits supplying one item of current-using equipment or one single socket-outlet. It shall not be used for electric floor heating (701.753). Page 241.","r":"701.413 (page 241 of the 2018 book)","n":"","k":10963,"m":"","f":"Index: 'bath or shower, electrical separation'. Section 701, Regulation 701.413.","w":{"1":"Two items is not allowed; 701.413 limits it to one item or one single socket-outlet.","2":"Electrical separation in a bathroom is limited to one item or one single socket-outlet.","3":"Floor heating is the one use excluded (701.753); it is not the only permitted one."}},{"id":"b2.07.08","t":"12","c":0,"q":"Equipment in zone 1 of a bathroom protected by SELV or PELV must have a nominal voltage not exceeding:","o":["12 V AC rms or 30 V ripple-free DC","50 V AC rms or 120 V ripple-free DC","110 V AC rms centre-tapped to earth","25 V AC rms or 60 V ripple-free DC"],"a":3,"x":"Regulation 701.55(vii): in zone 1, SELV or PELV equipment must not exceed 25 V AC rms or 60 V ripple-free DC, and the safety source must be outside zones 0, 1 and 2. (12 V AC / 30 V DC is the zone 0 limit.) Page 242.","r":"701.55 (page 242 of the 2018 book)","n":"","k":11034,"m":"","f":"Index: 'bath or shower'. Section 701, Regulation 701.55 (current-using equipment in zone 1).","w":{"0":"12 V AC / 30 V DC is the zone 0 limit; zone 1 allows up to 25 V AC / 60 V DC.","1":"50 V AC / 120 V DC is the general ELV limit, too high for zone 1.","2":"Reduced low voltage at 110 V is not SELV or PELV and is not permitted here."}},{"id":"b2.07.09","t":"12","c":0,"q":"In a room containing a sauna heater, zone 1 is the volume containing the heater, bounded by a vertical surface around the heater at a distance from its surface of:","o":["0.3 m","0.5 m","1.0 m","0.6 m"],"a":1,"x":"Regulation 703.32.1: zone 1 is limited by a vertical surface circumscribing the sauna heater 0.5 m from its surface (or the cold side of the wall insulation if the heater is closer than 0.5 m to the wall). Page 254.","r":"703.32.1 (page 254 of the 2018 book)","n":"","k":11514,"m":"","f":"Index: 'sauna'. Section 703, Regulation 703.32.1 and Figure 703.","w":{"0":"0.3 m is not the sauna zone 1 distance; it is 0.5 m from the heater.","2":"1.0 m is too far; zone 1 is 0.5 m from the heater surface.","3":"0.6 m is the bathroom zone 2 width, not sauna zone 1."}},{"id":"b2.07.10","t":"12","c":0,"q":"In agricultural premises, a final circuit supplying socket-outlets rated at more than 32 A shall be protected by an RCD with a rated residual operating current not exceeding:","o":["30 mA","300 mA","100 mA","500 mA"],"a":2,"x":"Regulation 705.411.1(ii): socket-outlets above 32 A need an RCD not exceeding 100 mA. Sockets up to 32 A need 30 mA (415.1.1), and all other circuits need not more than 300 mA. Page 258.","r":"705.411.1 (page 258 of the 2018 book)","n":"","k":11714,"m":"","f":"Index: 'agricultural premises'. Section 705, Regulation 705.411.1(ii).","w":{"0":"30 mA is for socket-outlets up to 32 A (705.411.1(i)).","1":"300 mA is for all other circuits (705.411.1(iii)), not sockets over 32 A.","3":"500 mA is the construction site figure (704.411.3.2.1)."}},{"id":"b2.07.11","t":"12","c":0,"q":"In a marina, socket-outlets on a fixed jetty shall be placed at a height above the highest water level of not less than:","o":["1 m","300 mm","600 mm","1.5 m"],"a":0,"x":"Regulation 709.553.1.13: not less than 1 m above the highest water level. Only on floating pontoons or walkways may this be reduced to 300 mm, with extra splash protection. Page 272.","r":"709.553.1.13 (page 272 of the 2018 book)","n":"","k":12273,"m":"","f":"Index: 'marinas'. Section 709, Regulation 709.553.1.13.","w":{"1":"300 mm is allowed only on floating pontoons or walkways, not fixed jetties.","2":"600 mm is not a figure in 709.553.1.13; fixed jetties need 1 m.","3":"1.5 m is not stated; the minimum above highest water level is 1 m."}},{"id":"b3.07.12","t":"12","c":0,"q":"For a shower without a basin, zone 1 extends horizontally from the centre point of the fixed water outlet on the wall or ceiling for a distance of:","o":["0.60 m","0.90 m","2.25 m","1.20 m"],"a":3,"x":"Regulation 701.32.3(ii)(b): zone 1 extends 1.20 m from the centre of the fixed water outlet. There is no zone 2 for a shower without a basin (701.32.4). Page 240.","r":"701.32.3 (page 240 of the 2018 book)","n":"","k":10935,"m":"","f":"Index: 'bath or shower, zones'. Section 701, Regulation 701.32.3(ii)(b) and Figure 701.1.","w":{"0":"0.60 m is the bath zone 2 width, not the shower zone 1 radius.","1":"0.90 m is not a zone dimension in 701.32.3.","2":"2.25 m is the zone 1 height, not the horizontal distance."}},{"id":"b3.07.13","t":"12","c":0,"q":"In a building with main protective bonding to Regulation 411.3.1.2, supplementary bonding in a bathroom may be omitted if, among other conditions, all final circuits of the location:","o":["are wired in steel conduit or trunking","have additional protection by an RCD to Regulation 415.1.1","are protected by BS 88-3 fuses","have a protective conductor of at least 4 mm²"],"a":1,"x":"Regulation 701.415.2(iv) to (vi): all final circuits must meet ADS to 411.3.2, all final circuits must have additional RCD protection to 415.1.1, and all extraneous-conductive-parts must be connected to the main protective bonding. Page 241.","r":"701.415.2 (page 241 of the 2018 book)","n":"","k":10987,"m":"","f":"Index: 'supplementary bonding, bath or shower'. Section 701, Regulation 701.415.2, conditions (iv) to (vi).","w":{"0":"Steel conduit or trunking is not one of the 701.415.2 conditions.","2":"The fuse type is not a condition; final circuits need ADS and 30 mA RCD additional protection.","3":"There is no 4 mm² protective conductor condition in 701.415.2 (4 mm² is a supplementary bonding size)."}},{"id":"b3.07.14","t":"12","c":0,"q":"The minimum degree of protection for electrical equipment in zone 2 of an indoor swimming pool, where water jets are not used for cleaning, is:","o":["IPX2","IPX4","IPX5","IPX8"],"a":0,"x":"Regulation 702.512.2(iii): zone 2 needs IPX2 indoors, IPX4 outdoors, and IPX5 where water jets are likely to be used for cleaning. Page 247.","r":"702.512.2 (page 247 of the 2018 book)","n":"","k":11232,"m":"","f":"Index: 'swimming pools, external influences'. Section 702, Regulation 702.512.2(iii).","w":{"1":"IPX4 is zone 2 for outdoor pools (and zone 1).","2":"IPX5 applies only where water jets are likely to be used for cleaning.","3":"IPX8 is the zone 0 requirement."}},{"id":"b3.07.15","t":"12","c":0,"q":"In zone 3 of a sauna, electrical equipment shall withstand a minimum temperature of:","o":["70 °C","90 °C","125 °C","170 °C"],"a":2,"x":"Regulation 703.512.2(iii): equipment in zone 3 must withstand at least 125 °C, and cable insulation and sheaths at least 170 °C. Page 255.","r":"703.512.2 (page 255 of the 2018 book)","n":"","k":11547,"m":"","f":"Index: 'sauna, external influences'. Section 703, Regulation 703.512.2(iii).","w":{"0":"70 °C is not the 703.512.2 figure; zone 3 equipment must withstand 125 °C.","1":"90 °C is a cable conductor rating, not the sauna zone 3 equipment temperature.","3":"170 °C is for cable insulation and sheaths in zone 3, not equipment."}},{"id":"b3.07.16","t":"12","c":0,"q":"In agricultural premises, a cable buried in arable or cultivated ground shall be at a depth of at least:","o":["0.5 m","0.6 m","0.8 m","1 m"],"a":3,"x":"Regulation 705.522(ii): at least 1 m in arable or cultivated ground. Where vehicles operate, the minimum is 0.6 m with added mechanical protection, and suspension cables must be at least 6 m high. Page 260.","r":"705.522 (page 260 of the 2018 book)","n":"","k":11788,"m":"","f":"Index: 'agricultural premises, wiring systems'. Section 705, Regulation 705.522.","w":{"0":"0.5 m is not a figure in 705.522.","1":"0.6 m is the depth where vehicles operate, with added mechanical protection, not arable ground.","2":"0.8 m is not stated; arable or cultivated ground needs at least 1 m."}},{"id":"b3.07.17","t":"12","c":0,"q":"At an exhibition, a cable intended to supply temporary structures shall be protected at its origin by an RCD with a rated residual operating current not exceeding:","o":["30 mA, instantaneous","300 mA, time-delayed or Type S","100 mA, instantaneous","500 mA, Type AC"],"a":1,"x":"Regulation 711.410.3.4: an RCD not exceeding 300 mA, with a delay (BS EN 60947-2) or of Type S, to give selectivity with the RCDs protecting final circuits. Page 285.","r":"711.410.3.4 (page 285 of the 2018 book)","n":"","k":12911,"m":"","f":"Index: 'exhibitions, shows and stands'. Section 711, Regulation 711.410.3.4.","w":{"0":"30 mA instantaneous protects final circuits; the supply cable needs a delayed 300 mA RCD for selectivity.","2":"100 mA instantaneous would not give selectivity with the final-circuit RCDs.","3":"500 mA Type AC is the wrong rating; 711.410.3.4 requires 300 mA, delayed or Type S."}},{"id":"b4.07.18","t":"12","c":0,"q":"For a shower without a basin, zone 0 has a height above the floor of:","o":["0.10 m","0.05 m","0.15 m","0.25 m"],"a":0,"x":"Regulation 701.32.2: for showers without a basin, zone 0 is 0.10 m high and has the same horizontal extent as zone 1. Page 240.","r":"701.32.2 (page 240 of the 2018 book)","n":"","k":10927,"m":"","f":"Index: 'bath or shower, zones'. Section 701, Regulation 701.32.2.","w":{"1":"0.05 m is not the zone 0 height; it is 0.10 m.","2":"0.15 m is too high; zone 0 for a shower without a basin is 0.10 m.","3":"0.25 m is not a zone 0 dimension."}},{"id":"b4.07.19","t":"12","c":0,"q":"Apart from switches built into suitable fixed equipment and insulating pull cords, the only switches permitted in zone 1 of a bathroom are switches of:","o":["SELV circuits at not more than 25 V AC rms or 60 V ripple-free DC, with the source in zone 2","SELV circuits at not more than 12 V AC rms or 30 V ripple-free DC, with the source outside zones 0, 1 and 2","circuits protected by a 30 mA RCD","circuits protected by electrical separation supplying one item of equipment"],"a":1,"x":"Regulation 701.512.3: in zone 1, only switches of SELV circuits at a nominal voltage not exceeding 12 V AC rms or 30 V ripple-free DC are allowed, with the safety source outside zones 0, 1 and 2. Page 242.","r":"701.512.3 (page 242 of the 2018 book)","n":"","k":11013,"m":"","f":"Index: 'bath or shower, switchgear'. Section 701, Regulation 701.512.3.","w":{"0":"25 V AC / 60 V DC is the zone 1 equipment limit, not switches, and the source must be outside zones 0, 1 and 2.","2":"A 30 mA RCD alone does not permit switches in zone 1.","3":"Electrical separation does not permit switches in zone 1; only 12 V AC / 30 V DC SELV switches."}},{"id":"b4.07.20","t":"12","c":1,"q":"For a swimming pool without diving boards, what is the horizontal distance from the rim of the basin to the outer edge of zone 2?","o":["1.5 m","2.0 m","3.5 m","4.0 m"],"a":2,"x":"Zone 1 extends 2 m from the rim. Zone 2 extends a further 1.5 m beyond zone 1 (702.32(ii) and (iii)).<br>2.0 m + 1.5 m = 3.5 m from the rim. Page 245.","r":"702.32 (page 245 of the 2018 book)","n":"","k":11159,"m":"","f":"Index: 'swimming pools, zones'. Section 702, Regulation 702.32(ii) and (iii); add zone 1 and zone 2 widths.","w":{"0":"1.5 m is zone 2's width on its own; add it to zone 1's 2 m.","1":"2.0 m is only the outer edge of zone 1.","3":"4.0 m is not a 702.32 figure; 2.0 m + 1.5 m = 3.5 m."}},{"id":"b4.07.21","t":"12","c":0,"q":"On a construction site, flexible cable for applications above reduced low voltage shall be of type:","o":["H05VV-F light PVC flexible cable","3182 low temperature thermoplastic flexible cable","H03VV-F light PVC flexible cable","H07RN-F or equivalent heavy duty flexible cable"],"a":3,"x":"Regulation 704.522.8.11: for reduced low voltage, low temperature thermoplastic cable (BS 6004) or equivalent is used. Above reduced low voltage, flexible cable must be H07RN-F (BS EN 50525-2-21) or equivalent heavy duty cable. Page 257.","r":"704.522.8.11 (page 257 of the 2018 book)","n":"","k":11677,"m":"","f":"Index: 'construction sites, wiring systems'. Section 704, Regulation 704.522.8.11.","w":{"0":"Light PVC flex is not heavy duty enough for construction sites.","1":"3182 low temperature cable is for reduced low voltage, not above it.","2":"H03VV-F is very light flex, unsuitable for construction sites."}},{"id":"b4.07.22","t":"12","c":0,"q":"In a conducting location with restricted movement, such as inside a metal tank, the supply to a handlamp shall be protected by:","o":["SELV","automatic disconnection with a 30 mA RCD","PELV","reduced low voltage at 110 V"],"a":0,"x":"Regulation 706.410.3.10(ii): handlamps must be supplied by SELV. A SELV circuit may supply a fluorescent luminaire with a built-in step-up transformer that has electrically separated windings. Page 263.","r":"706.410.3.10 (page 263 of the 2018 book)","n":"","k":11957,"m":"","f":"Index: 'conducting locations with restricted movement'. Section 706, Regulation 706.410.3.10(ii).","w":{"1":"An RCD is not permitted for handlamps here; 706.410.3.10 requires SELV.","2":"PELV is allowed for some fixed equipment, but handlamps must be SELV.","3":"110 V reduced low voltage is not SELV and is not permitted for handlamps here."}},{"id":"b4.07.23","t":"12","c":0,"q":"The rated output of a single-phase transformer forming a medical IT system shall be:","o":["not less than 1 kVA and not more than 5 kVA","not less than 0.5 kVA and not more than 10 kVA","not less than 0.5 kVA and not more than 5 kVA","not less than 2 kVA and not more than 20 kVA"],"a":1,"x":"Regulation 710.512.1.1(ii): rated output not less than 0.5 kVA and not more than 10 kVA. Where several transformers supply one room, they must not be connected in parallel. Page 278.","r":"710.512.1.1 (page 278 of the 2018 book)","n":"","k":12544,"m":"","f":"Index: 'medical locations, IT system'. Section 710, Regulation 710.512.1.1(ii).","w":{"0":"Both limits are wrong; the range is 0.5 kVA to 10 kVA.","2":"The lower limit is right but the upper limit is 10 kVA, not 5 kVA.","3":"Both limits are wrong; 710.512.1.1 gives 0.5 to 10 kVA."}},{"id":"b5.07.24","t":"12","c":0,"q":"The space under a bath tub that can only be reached by removing a bath panel with a tool is:","o":["zone 0","zone 1","outside the zones","zone 2"],"a":2,"x":"Regulation 701.32.3: the space under a bath tub or shower basin is zone 1. If it is only accessible with a tool, it is outside the zones. Page 240.","r":"701.32.3 (page 240 of the 2018 book)","n":"","k":10938,"m":"","f":"Index: 'bath or shower, zones'. Section 701, Regulation 701.32.3 (the paragraph on space under the bath).","w":{"0":"Zone 0 is the inside of the bath or shower basin, not the space underneath.","1":"Under the bath is zone 1 only if it can be reached without a tool.","3":"Zone 2 is the 0.6 m strip beyond zone 1, not under the bath."}},{"id":"b5.07.25","t":"12","c":0,"q":"In a large bathroom, a BS 1363 socket-outlet (not SELV and not a shaver supply unit) shall be installed at a minimum horizontal distance from the boundary of zone 1 of:","o":["0.6 m","2.25 m","3.6 m","3 m"],"a":3,"x":"Regulation 701.512.3: except for SELV socket-outlets and BS EN 61558-2-5 shaver su
