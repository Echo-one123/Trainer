,"q":"Overcurrent protection may be provided by a:","o":["linked switch","residual current device","disconnector","circuit breaker"],"a":3,"x":"","r":"432.1 to 432.3 P94","n":"","k":1000211.0,"m":"","f":"Index: 'overcurrent protective devices'. Go to Section 432 (432.1 to 432.3), which describes devices providing overload and fault current protection.","w":{"0":"A linked switch can isolate but doesn't give overcurrent protection.","1":"An RCD detects residual current, not overcurrent.","2":"A disconnector is for isolation only, not overcurrent protection."}},{"id":"mp4.33","t":"4","c":1,"q":"Where ADS is the means of providing fault protection and a 20 A type B circuit breaker to BS EN 60898 is used, the maximum measured earth fault loop impedance is:","o":["0.37Ω","1.75Ω","2.19Ω","2.87Ω"],"a":1,"x":"Table 41.3: 2.19 Ω tabulated. Measured limit:<br>2.19 × 0.8 = 1.75 Ω","r":"Table 41.3 P68","n":"","k":1000212.0,"m":"","f":"Go to Table 41.3 (Chapter 41), Type B column, 20 A row, then multiply by 0.8 to get the maximum measured value.","w":{"0":"0.37 Ω is far too low for a 20 A Type B; check you're on the right row and column.","2":"2.19 Ω is the tabulated value; the measured limit is 0.8 × 2.19 = 1.75 Ω.","3":"2.87 Ω is the 16 A Type B figure, not 20 A."}},{"id":"mp4.34","t":"9","c":0,"q":"Which one of the following is excluded as a protective earth electrode?","o":["underground structural metalwork embedded in foundations","welded metal reinforcement of concrete embedded in the earth","earth plates","metalwork of public water services"],"a":3,"x":"","r":"542.2.2 P198","n":"","k":1000213.0,"m":"","f":"Index: 'earth electrodes'. Read Regulation 542.2.2 (recognised electrodes), then 542.2.6, which excludes water utility pipes.","w":{"0":"Foundation metalwork is a recognised earth electrode in 542.2.2(iv).","1":"Welded reinforcement in concrete is a recognised earth electrode in 542.2.2(v).","2":"Earth plates are a recognised earth electrode in 542.2.2(iii)."}},{"id":"mp4.35","t":"9","c":1,"q":"A copper earthing conductor not mechanically protected and not protected against corrosion is buried in soil. The minimum size of the earthing conductor is:","o":["4mm2","16mm2","25mm2","50mm2"],"a":2,"x":"","r":"Table 54.1 P198","n":"","k":1000214.0,"m":"","f":"Index: 'earthing conductors'. Go to Table 54.1, buried in soil, row 'not protected against corrosion', copper column.","w":{"0":"4 mm² isn't a buried earthing conductor size in Table 54.1.","1":"16 mm² copper is for conductors protected against corrosion but not mechanically.","3":"50 mm² is the steel figure for not protected against corrosion; copper is 25 mm²."}},{"id":"mp4.36","t":"4","c":0,"q":"By employing an RCD for additional protection to protect socket-outlets to supply a Class II portable tool, the user is:","o":["protected against an earth fault in the windings of the tool","protected against breakage of the protective conductor of the flexible cable","provided with additional fault protection against contact with a live conductor exposed by carelessness of the user","unable to operate the tool until the earthing circuit is complete and monitored"],"a":2,"x":"","r":"415.1.1 P79","n":"","k":1000215.0,"m":"","f":"Index: 'additional protection'. Go to Regulation 415.1.1 and its note on RCDs protecting against carelessness of users.","w":{"0":"A Class II tool has no earth connection to its windings, so 'earth fault in the windings' doesn't apply.","1":"Class II tools don't have a protective conductor in the flex.","3":"An RCD doesn't monitor earth continuity; that describes an earth monitoring system."}},{"id":"mp4.37","t":"4","c":0,"q":"A 13A socket-outlet supplies mobile equipment for use outdoors. Additional protection should be provided by means of a:","o":["general purpose fuse","circuit breaker","residual current device","class II equipment enclosure"],"a":2,"x":"","r":"411.3.3 (ii) P65","n":"","k":1000216.0,"m":"","f":"Go to Regulation 411.3.3, which requires additional protection by a 30 mA RCD for mobile equipment used outdoors.","w":{"0":"A fuse gives overcurrent protection, not additional protection against shock.","1":"A circuit breaker gives overcurrent protection; the regulation needs an RCD.","3":"Class II equipment is a protective measure, not the additional protection called for in 411.3.3."}},{"id":"mp4.38","t":"7","c":0,"q":"In order to prevent the spread of fire where a wiring system passes through elements of building structures, any holes must be sealed around the cables. Which of the following is NOT a requirement for such sealing materials?","o":["it shall be compatible with the material of the wiring system","it shall prevent thermal movement of the wiring system","it shall be of adequate mechanical stability to withstand the stresses which may arise","it shall resist relevant external influences to the same degree as the wiring system"],"a":1,"x":"","r":"527.2.7 P147","n":"","k":1000217.0,"m":"","f":"Index: 'sealing of wiring system penetrations'. Go to Section 527.2, which lists requirements for sealing arrangements.","w":{"0":"Compatibility with the wiring system is a listed requirement for sealing.","2":"Adequate mechanical stability is a listed requirement for sealing.","3":"Resisting external influences to the same degree is a listed requirement for sealing."}},{"id":"mp4.39","t":"10","c":0,"q":"Where an autotransformer is used for step-up purposes:","o":["a single-pole switch can be used","a linked switch breaking all live conductors must be used","no controlling switch is required","only a fuse is required"],"a":1,"x":"","r":"555.1.3 P215","n":"","k":1000218.0,"m":"","f":"Index: 'step-up transformer'. Go to Regulation 555.1.3, which requires a linked switch disconnecting all live conductors.","w":{"0":"A single-pole switch won't disconnect all live conductors; 555.1.3 needs a linked switch.","2":"A switch is required by 555.1.3.","3":"A fuse isn't a switch; 555.1.3 needs a linked switch for disconnection."}},{"id":"mp4.40","t":"10","c":0,"q":"When installing socket outlets which will be mounted vertically on a wall or working surface, they should be:","o":["shuttered and suitable for a.c. and complying with BS 1363","mounted 50mm from the floor level or working surface","mounted so the flexible cord and plug top can be withdrawn or inserted without mechanical damage","mounted so that the flexible cord and plug are 50mm from floor or working surface level"],"a":2,"x":"","r":"553.1.6 P213","n":"","k":1000219.0,"m":"","f":"Index: 'socket-outlets'. Go to Regulation 553.1.6, which deals with mounting height to avoid mechanical damage to the plug and flex.","w":{"0":"553.1.6 is about mounting height, not shutters or BS 1363.","1":"553.1.6 doesn't give a set 50 mm height; it's about avoiding damage.","3":"No fixed 50 mm distance is given; the aim is to avoid damage during insertion or withdrawal."}},{"id":"mp4.41","t":"7","c":0,"q":"Any circuit or equipment vulnerable to a particular test should be identified by:","o":["the provision of a legible diagram, chart or table prior to testing","a visual inspection prior to testing","the manufacturer’s warning notice on the equipment","the inventory for the building being tested"],"a":0,"x":"","r":"514.9.1 P135","n":"","k":1000220.0,"m":"","f":"Index: 'diagrams'. Go to Regulation 514.9.1, which requires a diagram, chart or table identifying circuits vulnerable to tests.","w":{"1":"Visual inspection isn't the identification method required; it's a diagram, chart or table.","2":"Manufacturer's notices aren't the stated method; 514.9.1 requires a diagram, chart or table.","3":"A building inventory isn't what 514.9.1 requires."}},{"id":"mp4.42","t":"11","c":0,"q":"Which one of the following tests is carried out after the supply is connected?","o":["insulation resistance","continuity of protective conductors","continuity of ring final circuit conductors","effectiveness of an RCD"],"a":3,"x":"","r":"643.1 Paragraph 4 P233","n":"","k":1000221.0,"m":"","f":"Go to Regulation 643.1, which lists the tests carried out before and after the supply is connected; RCD tests need the supply on.","w":{"0":"Insulation resistance is a dead test, done before the supply is connected.","1":"Continuity of protective conductors is a dead test, done before connection.","2":"Ring final circuit continuity is a dead test, done before connection."}},{"id":"mp4.43","t":"11","c":0,"q":"The purpose of the inspection conducted prior to testing an installation is to verify that:","o":["all ring final circuit connections are correct","equipment is not damaged or defective","only British Standard equipment is installed","all electrical cables and conduits are painted orange for identification"],"a":1,"x":"","r":"642.2 (iii) P232","n":"","k":1000222.0,"m":"","f":"Go to Regulation 642.2, which says inspection verifies equipment is correctly selected, erected and not visibly damaged or defective.","w":{"0":"Ring final circuit connections are verified by testing, not inspection.","2":"Equipment must comply with appropriate standards, not only British Standards.","3":"There's no requirement to paint cables or conduits orange."}},{"id":"mp4.44","t":"11","c":1,"q":"When testing a 230V installation, the minimum value of insulation resistance is:","o":["0.5Ω","1Ω","0.5MΩ","1MΩ"],"a":3,"x":"","r":"Table 64 P234","n":"","k":1000223.0,"m":"","f":"Index: 'insulation resistance'. Go to Table 64 (Chapter 64), row for up to 500 V, minimum insulation resistance column.","w":{"0":"Insulation resistance is in megohms, not ohms.","1":"Insulation resistance is in megohms, not ohms.","2":"0.5 MΩ is the SELV/PELV figure; 230 V circuits need 1 MΩ."}},{"id":"mp4.45","t":"1","c":0,"q":"No alteration shall be made to an existing installation unless the:","o":["electricity supplier has been informed","local authority has been informed","it is established that the alteration will not impair the safety of the existing installation","existing equipment meets BS and BS EN standards"],"a":2,"x":"","r":"132.16 P26","n":"","k":1000224.0,"m":"","f":"Go to Regulation 132.16 (additions and alterations), which requires checking the existing installation won't be impaired.","w":{"0":"Informing the supplier isn't the condition in 132.16.","1":"Informing the local authority may be a Building Regulations matter, but it isn't what 132.16 requires.","3":"132.16 doesn't require existing equipment to meet current standards."}},{"id":"mp4.46","t":"11","c":0,"q":"The inspecting and testing required during a periodic inspection should be recorded on a Periodic Inspection Report and carried out by:","o":["the person ordering the inspection","a design engineer","a site engineer","a competent inspector"],"a":3,"x":"","r":"651.5 P239","n":"","k":1000225.0,"m":"","f":"Go to Regulation 651.5 (Chapter 65), which states periodic inspection must be done by a skilled person competent in the work.","w":{"0":"The person ordering the work isn't necessarily competent; a competent inspector is required.","1":"Being a design engineer isn't the requirement; competence is.","2":"Being a site engineer isn't the requirement; competence is."}},{"id":"mp4.47","t":"11","c":0,"q":"Which one of the following factors does not affect the frequency of periodic inspection?","o":["type of installation","installation use and operation","frequency of maintenance","supplies for safety services"],"a":3,"x":"","r":"652.1 P239","n":"","k":1000226.0,"m":"","f":"Go to Regulation 652.1, which lists factors affecting how often periodic inspection is done.","w":{"0":"Type of installation is listed in 652.1.","1":"Use and operation are listed in 652.1.","2":"Frequency and quality of maintenance are listed in 652.1."}},{"id":"mp4.48","t":"13","c":1,"q":"Which one of the following numbers is the correct grouping factor for six circuits installed as method E?","o":["0.45","0.55","0.73","0.69"],"a":2,"x":"","r":"Appendix 4 Table 4C1 P443","n":"","k":1000227.0,"m":"","f":"Index: 'grouping'. Go to Appendix 4, Table 4C1, row 3 (single layer multicore on perforated tray, method E), 6 column.","w":{"0":"0.45 is the row 1 figure for 12 circuits bunched, not method E.","1":"0.55 isn't in Table 4C1; method E with 6 circuits is 0.73.","3":"0.69 isn't in the method E row; 6 circuits there is 0.73."}},{"id":"mp4.49","t":"13","c":1,"q":"The reference for the installation method that has multi-core cables having a non metallic sheath, in surface mounted conduit is:","o":["E","B","F","G"],"a":1,"x":"","r":"Appendix 4 Table 4A2 P433","n":"","k":1000228.0,"m":"","f":"Index: 'installation methods'. Go to Appendix 4, Table 4A2, find multicore cable in conduit on a wall, then the reference method column.","w":{"0":"Method E is multicore cable in free air (e.g. on perforated tray).","2":"Method F is single-core cables in free air.","3":"Method G is spaced single-core cables in free air."}},{"id":"mp4.50","t":"3","c":0,"q":"Which one of the following classifications of external influences would be appropriate for an item of electrical equipment installed where it would be subject to ‘splashes of water’?","o":["AB","BC1","AD4","AG1"],"a":2,"x":"","r":"Appendix 5 P497","n":"","k":1000229.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5, code AD (water): AD4 is splashes.","w":{"0":"AB is atmospheric humidity, not splashes, and it's incomplete without a number.","1":"BC1 is about contact with earth potential, not water.","3":"AG1 is low-severity impact, not water."}},{"id":"mp4.51","t":"12","c":0,"q":"In rooms containing a bath or shower, the measures of protection by obstacles and placing out of reach are:","o":["permitted in zones 1 and 2 only","not permitted in any circumstance","permitted for SELV circuits only","not permitted except for luminaries"],"a":1,"x":"","r":"701.410.3.5 P243","n":"","k":1000230.0,"m":"","f":"Go to Section 701, Regulation 701.410.3.5, which states protection by obstacles and placing out of reach isn't permitted.","w":{"0":"They're not permitted in any zone, not just zones 1 and 2.","2":"There's no SELV exception; the measures aren't permitted at all.","3":"There's no exception for luminaires."}},{"id":"mp4.52","t":"12","c":0,"q":"The nominal supply voltage on temporary installations in shows and stands shall not exceed 230/400 V ac, or","o":["110 V dc","230 V dc","240 V dc","500 V dc"],"a":3,"x":"","r":"711.313 P288","n":"","k":1000231.0,"m":"","f":"Go to Section 711, Regulation 711.313 (supplies), which gives the maximum a.c. and d.c. voltages.","w":{"0":"110 V d.c. is well below the 500 V d.c. limit in 711.313.","1":"230 V d.c. is below the 500 V d.c. limit in 711.313.","2":"240 V d.c. is below the 500 V d.c. limit in 711.313."}},{"id":"mp4.53","t":"12","c":0,"q":"In a conduit system on an agricultural installation where livestock are kept, the external influence shall be classified as:","o":["AF4","AG3","AF3","AG1"],"a":0,"x":"","r":"705.522.16 P262","n":"","k":1000232.0,"m":"","f":"Go to Section 705, Regulation 705.522.16 (conduit systems), which classifies locations where livestock is kept.","w":{"1":"AG3 is high-severity impact, not the classification in 705.522.16.","2":"AF3 is intermittent corrosive substances; livestock locations are continuous (AF4).","3":"AG1 is low-severity impact, not the 705.522.16 classification."}},{"id":"mp4.54","t":"12","c":0,"q":"On agricultural premises, heating appliances shall be fixed so as to maintain an appropriate distance from livestock. In the absence of manufacturer’s guidance, a radiant heater used in the vicinity of livestock should be placed at a distance of not less than:","o":["0.5m","1.5m","2.0m","2.5m"],"a":0,"x":"","r":"705.422.6 P261","n":"","k":1000233.0,"m":"","f":"Go to Section 705, Regulation 705.422.6, which gives the minimum clearance for radiant heaters from livestock.","w":{"1":"1.5 m isn't the figure in 705.422.6; it's 0.5 m.","2":"2.0 m isn't the figure in 705.422.6; it's 0.5 m.","3":"2.5 m is the arm's reach distance, not the heater clearance."}},{"id":"mp4.55","t":"12","c":0,"q":"In a caravan park, the maximum number of socket outlets which can be protected by a 30mA RCD is:","o":["2","3","6","1"],"a":3,"x":"","r":"708.415.1 P267","n":"","k":1000234.0,"m":"","f":"Go to Section 708, Regulation 708.415.1, which requires each socket-outlet to be individually protected by an RCD.","w":{"0":"Every socket-outlet must have its own RCD, so 2 is too many.","1":"Every socket-outlet must have its own RCD, so 3 is too many.","2":"Every socket-outlet must have its own RCD, so 6 is too many."}},{"id":"mp4.56","t":"12","c":0,"q":"In exhibitions, protection against thermal effects must be provided for luminaries mounted below a height of:","o":["1m","2.5m","3m","5m"],"a":1,"x":"","r":"711.559.3.101 P290","n":"","k":1000235.0,"m":"","f":"Go to Section 711, Regulation 711.559 (luminaires), and look for the mounting height below which protection against thermal effects is needed.","w":{"0":"1 m isn't the figure in 711.559; it's 2.5 m.","2":"3 m isn't the figure in 711.559; it's 2.5 m.","3":"5 m isn't the figure in 711.559; it's 2.5 m."}},{"id":"mp4.57","t":"13","c":1,"q":"For household installations, as a rule of thumb, the floor area served by a single 20A radial circuit using socket outlets to BS 1363 may be:","o":["up to 20m2","up to 50m2","up to 100m2","unlimited"],"a":1,"x":"","r":"Appendix 15 Fig 15B P556","n":"","k":1000236.0,"m":"","f":"Index: 'radial final circuits'. Go to Appendix 15, Fig 15B: a 20 A radial in 2.5 mm² serves up to 50 m².","w":{"0":"20 m² is too small; a 20 A radial can serve up to 50 m².","2":"100 m² is the ring final circuit rule of thumb, not a 20 A radial.","3":"Radials have a floor area limit; 50 m² for 20 A."}},{"id":"mp4.58","t":"11","c":0,"q":"Prior to an inspection in accordance with BS 7671, the competent person carrying out the work shall normally:","o":["ensure that all switches are off","disconnect the installation from the supply","disconnect all fixed appliances","ensure that the supply is connected"],"a":1,"x":"","r":"642.1 P232","n":"","k":1000237.0,"m":"","f":"Go to Regulation 642.1, which says inspection normally precedes testing and is done with the installation disconnected from the supply.","w":{"0":"Switching everything off isn't enough; 642.1 says disconnect from the supply.","2":"Disconnecting fixed appliances isn't the requirement; disconnect the installation.","3":"Inspection is done with the supply disconnected, not connected."}},{"id":"fm4.1","t":"1","c":0,"q":"To which of the following electrical installations does the IEE Regulations NOT apply?","o":["agricultural and horticultural premises","construction sites","systems for transmission of energy to the public","caravans and their sites"],"a":2,"x":"","r":"110.1.1 P15","n":"","k":1000238.0,"m":"","f":"Go to Part 1, Regulation 110.2 (exclusions from scope), and compare with the list of included installations in 110.1.","w":{"0":"Agricultural premises are covered (Section 705).","1":"Construction sites are covered (Section 704).","3":"Caravans and caravan parks are covered (Sections 708 and 721)."}},{"id":"fm4.2","t":"1","c":0,"q":"The BS 7671 relates to permanent and temporary installations for:","o":["equipment on board ships","aircraft equipment","construction sites","electric traction equipment"],"a":2,"x":"","r":"110.1 (xi) P15","n":"","k":1000239.0,"m":"","f":"Go to Part 1, Regulation 110.1 (scope), and check the included list, then 110.2 for exclusions.","w":{"0":"Equipment on board ships is excluded by 110.2.","1":"Aircraft equipment is excluded by 110.2.","3":"Electric traction equipment is excluded by 110.2."}},{"id":"fm4.3","t":"2","c":0,"q":"An a.c. voltage of 90 V between conductors is classified as:","o":["extra-low voltage","low voltage","safety extra-low voltage","reduced low voltage"],"a":1,"x":"","r":"Definitions P38","n":"","k":1000240.0,"m":"","f":"Index: 'voltage, nominal'. Read the voltage band definitions in Part 2: ELV is up to 50 V a.c.; LV is above that up to 1000 V a.c.","w":{"0":"ELV is up to 50 V a.c.; 90 V is above that.","2":"SELV is an ELV system, so it can't be 90 V.","3":"Reduced low voltage is a specific 110 V system with 55/63.5 V to earth, not just any 90 V supply."}},{"id":"fm4.4","t":"12","c":0,"q":"Which one of the following types of installation is NOT included in the special installations recognised by the IEE Wiring Regulations?","o":["swimming pools","petrol filling stations","agricultural","saunas"],"a":1,"x":"","r":"Part 7 Contents P239","n":"","k":1000241.0,"m":"","f":"Look at the Part 7 Contents and check which option has no Section 7xx of its own.","w":{"0":"Swimming pools are covered by Section 702.","2":"Agricultural premises are covered by Section 705.","3":"Saunas are covered by Section 703."}},{"id":"fm4.5","t":"4","c":0,"q":"The MAXIMUM accessible distance that it should be assumed a person can reach when standing on a surface is:","o":["0.75 m","1.25 m","2.50 m","3.00 m"],"a":2,"x":"","r":"417.3.2 P75","n":"","k":1000242.0,"m":"","f":"Index: 'arm's reach'. Go to Section 417 and Fig 417, which shows the 2.5 m reach from a standing surface.","w":{"0":"0.75 m is a smaller dimension shown in Fig 417, not the 2.5 m maximum reach.","1":"1.25 m is the sideways reach in Fig 417, not the 2.5 m maximum upward reach.","3":"3.00 m exceeds the 2.5 m arm's reach in Fig 417."}},{"id":"fm4.6","t":"1","c":0,"q":"BS 7671 requires that the designer of a new installation shall:","o":["have at least three years experience","recommend future inspection and testing","complete a periodic test report","have a copy of BSD 7671"],"a":1,"x":"","r":"134.2.2 P23","n":"","k":1000243.0,"m":"","f":"Go to Chapter 13, Regulation 134.2.2, which requires the designer to recommend the interval to the first periodic inspection.","w":{"0":"BS 7671 doesn't specify years of experience for designers.","2":"A periodic report is for existing installations, not new designs.","3":"Owning a copy isn't a regulation requirement."}},{"id":"fm4.7","t":"7","c":0,"q":"Non-sheathed cables for fixed wiring, other than protective conductors, should always be installed in:","o":["dry conditions","trenches","conduit or trunking","sub-zero temperatures"],"a":2,"x":"","r":"521.10.1 P137","n":"","k":1000244.0,"m":"","f":"Go to Regulation 521.10.1, which requires non-sheathed cables to be enclosed in conduit, ducting or trunking.","w":{"0":"Dry conditions aren't what 521.10.1 requires; enclosure is.","1":"Trenches aren't the requirement; the cables need enclosing in conduit, ducting or trunking.","3":"Sub-zero temperatures have nothing to do with 521.10.1."}},{"id":"fm4.8","t":"2","c":0,"q":"A final circuit is the wiring between the:","o":["main cut-out and the energy meter","main switch and the distribution board","distribution board and current-using equipment","consumer’s main earth terminal and circuit protective device"],"a":2,"x":"","r":"Definitions P30","n":"","k":1000245.0,"m":"","f":"Index: 'final circuit'. Read the definition in Part 2: a circuit connected directly to current-using equipment or socket-outlets.","w":{"0":"That's the supplier's side, before the consumer's installation.","1":"That's a distribution circuit, not a final circuit.","3":"That isn't a circuit; it's part of the earthing arrangements."}},{"id":"fm4.9","t":"5","c":0,"q":"The prospective short circuit current at the origin of the consumer’s installation must be taken into account when:","o":["estimating the external earth loop impedance","supplying diversity factor for the installation","selecting the system of earthing for the supply","selecting the type of overcurrent protective device to be installed"],"a":3,"x":"","r":"434.5.1 P92","n":"","k":1000246.0,"m":"","f":"Index: 'breaking capacity' or 'prospective fault current'. Go to Regulation 434.5.1 in Chapter 43.","w":{"0":"Ze is measured or obtained from the DNO; it isn't what PFC is used for here.","1":"Diversity relates to load, not fault current.","2":"The earthing system is a supply characteristic, not determined by PFC."}},{"id":"fm4.10","t":"2","c":0,"q":"A system is defined as:","o":["the kWh meter and an installation","the distribution cables to an installation","the consumer’s terminals of an installation","a single source of energy and an installation"],"a":3,"x":"","r":"Definitions P38","n":"","k":1000247.0,"m":"","f":"Index: 'system'. Read the definition in Part 2: an electrical system with a single source and an installation.","w":{"0":"The meter isn't part of the definition of a system.","1":"Distribution cables alone don't make a system.","2":"Consumer's terminals are a point in the installation, not a system."}},{"id":"fm4.11","t":"13","c":0,"q":"The total number of socket-outlets that may be connected to a fused spur is:","o":["one twin or one single socket – outlet","equal to the total number of socket – outlets on the ring","equal to half the number of socket – outlets on the ring","unlimited depending upon the load"],"a":3,"x":"","r":"Appendix 15 Fig 15B P506","n":"","k":1000248.0,"m":"","f":"Index: 'ring final circuits' or 'spurs'. Go to Appendix 15, Fig 15A, and read the notes on fused spurs.","w":{"0":"One single or twin is the limit for an unfused spur, not a fused spur.","1":"There's no rule tying a fused spur to the number on the ring.","2":"There's no rule tying a fused spur to half the ring's socket count."}},{"id":"fm4.12","t":"4","c":0,"q":"Residual current circuit breakers shall NOT be used on a TN system where a circuit incorporates:","o":["protective conductors","exposed conductive parts","earthing conductors","PEN conductors"],"a":3,"x":"","r":"411.4.5 P.60","n":"","k":1000249.0,"m":"","f":"Index: 'PEN conductor'. Go to Section 411, TN systems (411.4): an RCD shall not be used in TN-C, and no PEN conductor on the load side of an RCD.","w":{"0":"Protective conductors are normal in RCD-protected circuits.","1":"Exposed-conductive-parts are normal in RCD-protected circuits.","2":"Earthing conductors are normal and don't stop RCD use."}},{"id":"fm4.13","t":"4","c":0,"q":"Which one of the following is a method of providing fault protection?","o":["placing out of reach","double insulation","protection by obstacles","insulation of live parts"],"a":1,"x":"","r":"412.1.1 P. 69","n":"","k":1000250.0,"m":"","f":"Index: 'fault protection'. Go to Section 412, Regulation 412.1.1: double or reinforced insulation provides both basic and fault protection.","w":{"0":"Placing out of reach is a basic protection measure only.","2":"Obstacles are a basic protection measure only.","3":"Insulation of live parts is basic protection, not fault protection."}},{"id":"fm4.14","t":"3","c":0,"q":"In addition to regular maintenance of an installation, which one of the following is NOT an essential requirement?","o":["periodic inspection and testing may be readily and safely carried out","the name and address of the contractor is permanently displayed adjacent to the main intake position","the reliability of the equipment is sustained","protective measures for safety remain effective"],"a":1,"x":"","r":"341.1 (i) (ii) (iii) P51","n":"","k":1000251.0,"m":"","f":"Go to Chapter 34, Regulation 341.1 (maintainability), which lists what must be ensured for maintenance.","w":{"0":"Allowing safe periodic inspection is listed in 341.1.","2":"Reliability of equipment is listed in 341.1.","3":"Effectiveness of protective measures is listed in 341.1."}},{"id":"fm4.15","t":"4","c":0,"q":"Where separated extra-low voltage is used to provide basic protection and fault protection, the nominal voltage shall NOT exceed:","o":["12 V a.c.","25 V a.c","50 V a.c.","110 V a.c."],"a":2,"x":"","r":"414.1.2 then 414.1.1 (i) P72","n":"","k":1000252.0,"m":"","f":"Go to Section 414: 414.1.1(iii) gives the Band I limit of 50 V a.c. (120 V ripple-free d.c.).","w":{"0":"12 V a.c. is a limit in some special locations, not the general SELV limit.","1":"25 V a.c. is a limit in some special locations, not the general SELV limit.","3":"110 V a.c. is reduced low voltage, not SELV."}},{"id":"fm4.16","t":"2","c":0,"q":"Overload current is defined as the overcurrent:","o":["that causes protective devices to operate of correctly","occurring in a circuit which is electrically sound","resulting from a fault of negligible impedance between live conductors of different phases","flowing in a line conductor when in contact with exposed conductive parts"],"a":1,"x":"","r":"Definitions P34","n":"","k":1000253.0,"m":"","f":"Index: 'overload current'. Read the definition in Part 2: overcurrent occurring in a circuit which is electrically sound.","w":{"0":"That doesn't define overload; it's about the cause of the current.","2":"That describes a short-circuit current, not overload.","3":"That describes an earth fault current, not overload."}},{"id":"fm4.17","t":"1","c":0,"q":"The IEE Regulations are designed to provide:","o":["instructions for untrained persons","safety especially from fire, shock and burns","a detailed specification","instructions for every circumstance in an installation"],"a":1,"x":"","r":"131.1 P17","n":"","k":1000254.0,"m":"","f":"Go to Chapter 13, Regulation 131.1, which states the purpose: safety of persons, livestock and property against shock, fire, burns and other hazards.","w":{"0":"The Regulations aren't for untrained persons; they need skilled interpretation.","2":"BS 7671 isn't a detailed specification; it sets safety requirements.","3":"It can't cover every circumstance; it sets principles."}},{"id":"fm4.18","t":"6","c":0,"q":"Which one of the following is not permitted as a means of isolation in a circuit?","o":["double-pole switch fuse","13 A plug and socket","semi-conductor device","linked switch"],"a":2,"x":"","r":"537.2.2 P182","n":"","k":1000255.0,"m":"","f":"Index: 'isolation'. Go to Regulation 537.2.2, which states semiconductor devices shall not be used as isolating devices.","w":{"0":"A double-pole switch fuse can be used for isolation.","1":"A plug and socket can be used for isolation.","3":"A linked switch can be used for isolation."}},{"id":"fm4.19","t":"2","c":0,"q":"When a line conductor comes in contact with the neutral conductor, the type of fault is called:","o":["a short circuit fault","an earth fault","an overload fault","an open circuit fault"],"a":0,"x":"","r":"Definitions P36","n":"","k":1000256.0,"m":"","f":"Index: 'short-circuit current'. Read the definition in Part 2: a fault of negligible impedance between live conductors.","w":{"1":"An earth fault is between a line conductor and earth, not neutral.","2":"An overload is in a sound circuit, not a fault between conductors.","3":"An open circuit is a break, not contact between conductors."}},{"id":"fm4.20","t":"6","c":0,"q":"A means of isolation must be provided in an electrical installation. This is required to be:","o":["clearly identified","always placed next to the equipment it isolates","automatic in operation","available for emergency switching"],"a":0,"x":"","r":"537.2.7 P183","n":"","k":1000257.0,"m":"","f":"Index: 'isolation'. Go to Regulation 537.2.7, which requires every isolating device to be clearly identified.","w":{"1":"It doesn't have to be next to the equipment in every case.","2":"Isolation is manual, not automatic.","3":"Emergency switching is a separate function, not a requirement of isolation."}},{"id":"fm4.21","t":"6","c":0,"q":"A fire fighter’s emergency switch should be provided for:","o":["emergency lighting systems operating at low voltage","interior low-voltage discharge lighting installation","exterior discharge lighting installations exceeding low voltage","multi-storey office block fire alarm circuits operating above low voltage"],"a":2,"x":"","r":"537.4.2 P185","n":"","k":1000258.0,"m":"","f":"Index: 'firefighter's switch'. Go to Regulation 537.4.2 (Chapter 53, Section 537) which lists the installations that need one.","w":{"0":"Emergency lighting at low voltage isn't listed; the requirement is for discharge lighting exceeding low voltage.","1":"Firefighter's switches are for discharge lighting operating above low voltage, not low-voltage installations.","3":"Fire alarm circuits aren't covered by 537.4.2; it applies to high-voltage discharge lighting and signs."}},{"id":"fm4.22","t":"3","c":0,"q":"The three general categories of external influence are environment, utilisation and:","o":["the number and type of live conductors","construction of building","method of installation","the installation earthing arrangements"],"a":1,"x":"","r":"Appendix 5 P445","n":"","k":1000259.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5, the introduction explaining the three categories (letters A, B and C).","w":{"0":"Number and type of live conductors is a supply characteristic (Chapter 31), not an external influence category.","2":"Method of installation is covered by Appendix 4 cable tables, not one of the three Appendix 5 categories.","3":"Earthing arrangements are a supply characteristic (Chapter 31), not an external influence category."}},{"id":"fm4.23","t":"6","c":0,"q":"BS 7671 details the requirements of devices for emergency switching. Which of the following devices would NOT satisfy these requirements?","o":["an emergency stop button which breaks the control circuit of a contactor","a switch which breaks the control circuit of a contactor","a 32 A plug and socket outlet","a switch which breaks all live conductors"],"a":2,"x":"","r":"537.3.3.3 P184","n":"","k":1000260.0,"m":"","f":"Index: 'emergency switching'. Go to Section 537 (537.3.3) on devices for emergency switching, which rules out plug and socket-outlets.","w":{"0":"An emergency stop button breaking a contactor control circuit is an accepted emergency switching arrangement.","1":"A switch breaking the control circuit of a contactor is acceptable for emergency switching.","3":"A switch breaking all live conductors is the classic emergency switching device and does comply."}},{"id":"fm4.24","t":"3","c":0,"q":"Which one of the following is required to be considered by BS 7671 when assessing the general characteristics of an electrical installation?","o":["the standard of electricians working on site","diversity","switchgear rating","maintainability"],"a":3,"x":"","r":"301.1 (iv) P45","n":"","k":1000261.0,"m":"","f":"Index: 'general characteristics' or 'maintainability'. Go to Part 3, Regulation 301.1, which lists the items to be assessed.","w":{"0":"The standard of site electricians isn't one of the 301.1 assessment items.","1":"Diversity is considered within maximum demand (311.1), but it isn't one of the headline 301.1 items listed.","2":"Switchgear rating is a design choice that follows the assessment, not one of the 301.1 general characteristics."}},{"id":"fm4.25","t":"13","c":0,"q":"When calculating the voltage drop in an installation which one of the following should be taken into account?","o":["the cable current carrying capacity","the operating current of the fuse","the current rating of the fuse","the circuit design current"],"a":3,"x":"","r":"Appendix 4, Sec 6 Page 381, last paragraph","n":"","k":1000262.0,"m":"","f":"Index: 'voltage drop'. Go to Appendix 4, Section 6 (voltage drop), which says the calculation uses the design current Ib.","w":{"0":"Volt drop is calculated using the current actually carried (Ib), not the cable's current-carrying capacity.","1":"The fuse operating current relates to overload protection, not volt drop.","2":"The fuse rating In is used for cable sizing; volt drop uses the design current Ib."}},{"id":"fm4.26","t":"13","c":0,"q":"Which one of the following is not considered when calculating the minimum current carrying capacity of live conductors of a cable?","o":["ambient temperature","grouping","type of protective device","the maximum permitted volt drop"],"a":3,"x":"","r":"Appendix 4 Sec 3 P376","n":"","k":1000263.0,"m":"","f":"Index: 'current-carrying capacity'. Go to Appendix 4, Section 3/5, which lists the correction factors (Ca, Cg, Ci, Cf) applied to In.","w":{"0":"Ambient temperature (Ca) is a correction factor used to find the minimum current-carrying capacity.","1":"Grouping (Cg) is a correction factor used to find the minimum current-carrying capacity.","2":"The type of protective device matters: BS 3036 fuses need the 0.725 factor (Cf)."}},{"id":"fm4.27","t":"13","c":0,"q":"For single circuit cable selection purposes the correction factors must be applied to the:","o":["prospective short circuit current","current carrying capacity of the cable","current rating of the protective device","the earth fault current of the circuit"],"a":2,"x":"","r":"Appendix 4 Sec 5.1.1 last para P378","n":"","k":1000264.0,"m":"","f":"Index: 'correction factors'. Go to Appendix 4, Section 5.1.1: It is found by dividing In of the protective device by the factors.","w":{"0":"Prospective short-circuit current isn't corrected by rating factors; it's used for breaking capacity checks.","1":"For selection, In is divided by the factors to give the tabulated It needed; you don't scale the cable's rating.","3":"Earth fault current is used for disconnection and adiabatic checks, not with rating factors."}},{"id":"fm4.28","t":"3","c":0,"q":"The classification code for high wind is:","o":["AS3","AR3","AP3","AN3"],"a":0,"x":"","r":"Appendix 5 P 446","n":"","k":1000265.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5 and find the 'AS' (wind) codes; AS3 is high.","w":{"1":"AR is air movement, not wind.","2":"AP is seismic effects, not wind.","3":"AN is solar radiation, not wind."}},{"id":"fm4.29","t":"13","c":1,"q":"Rating factors are applied to the fuse rating of a circuit to determine the minimum current-carrying capacity of cables. A rating factor of 1 is used when a circuit is wired in 70° C thermoplastic insulated cable and operating in an ambient temperature of:","o":["25° C","20° C","30° C","35° C"],"a":2,"x":"","r":"Appendix 4 Table 4B1 P394","n":"","k":1000266.0,"m":"","f":"Index: 'ambient temperature'. Go to Appendix 4, Table 4B1 and find where the 70 °C thermoplastic column factor is 1.00.","w":{"0":"At 25 °C the factor is above 1; the tables are based on 30 °C.","1":"At 20 °C the factor is above 1; the tabulated ratings assume 30 °C.","3":"At 35 °C the factor is below 1; 1.00 is at 30 °C."}},{"id":"fm4.30","t":"9","c":0,"q":"Which one of the following is not recognised by BS 7671:2008 as the sole means of earthing an installation?","o":["metallic sheath of cables","metal bars embedded in the building foundations","metallic rod driven into the ground","gas and water supply pipes"],"a":3,"x":"","r":"542.2.2 P195","n":"","k":1000267.0,"m":"","f":"Index: 'earth electrode'. Go to Regulation 542.2 (Chapter 54), which lists acceptable electrodes and bans gas/water pipes as electrodes.","w":{"0":"Metallic cable sheaths can be used as an earth electrode, subject to conditions such as the owner's consent.","1":"Foundation (concrete-encased) metalwork is a recognised type of earth electrode.","2":"Driven rods are a recognised type of earth electrode."}},{"id":"fm4.31","t":"7","c":0,"q":"The wording of a permanent warning notice fixed at the point of connection of an earthing conductor to an earth electrode is:","o":["Earth Connection – Do Not Remove","Do Not Remove This Connection","Electrical Earth Connection – Danger","Safety Electrical Connection – Do Not Remove"],"a":3,"x":"","r":"514.13.1 P133","n":"","k":1000268.0,"m":"","f":"Index: 'warning notices' or 'earthing conductor'. Go to Regulation 514.13.1 (Chapter 51) for the exact wording.","w":{"0":"Not the specified wording; it must read 'Safety Electrical Connection – Do Not Remove'.","1":"Not the specified wording; the notice must start 'Safety Electrical Connection'.","2":"Not the specified wording; the notice is 'Safety Electrical Connection – Do Not Remove'."}},{"id":"fm4.32","t":"4","c":0,"q":"Which one of the following sources does not comply with BS 7671 as a SELV system?","o":["a safety isolating transformer to BS EN 61558","a motor generator with windings providing equivalent isolation to that of a safety isolating transformer","a centre tapped transformer giving 55 V to earth","a battery system operating at extra low voltage"],"a":2,"x":"","r":"414.3 P72","n":"","k":1000269.0,"m":"","f":"Index: 'SELV, sources'. Go to Regulation 414.3, which lists the sources permitted for SELV and PELV.","w":{"0":"A safety isolating transformer to BS EN 61558 is the standard SELV source in 414.3.","1":"A motor-generator with equivalent isolation is listed in 414.3 as a SELV source.","3":"A battery at extra-low voltage is listed in 414.3 as an independent SELV source."}},{"id":"fm4.33","t":"9","c":1,"q":"The minimum size of a copper earthing conductor buried in the ground, NOT mechanically protected and NOT protected against corrosion is:","o":["10 mm2","16 mm2","25 mm2","50 mm2"],"a":2,"x":"","r":"Table 54.1 P195","n":"","k":1000270.0,"m":"","f":"Index: 'earthing conductor, buried'. Go to Table 54.1 (Chapter 54) and read the 'not protected against corrosion' row for copper.","w":{"0":"Too small; buried earthing conductors without corrosion protection need 25 mm² copper.","1":"16 mm² copper is for buried conductors protected against corrosion but not mechanically protected.","3":"50 mm² is the steel figure for no corrosion protection; copper needs 25 mm²."}},{"id":"fm4.34","t":"9","c":1,"q":"When calculating the minimum cross-sectional area of a protective conductor, the following information is available: Fault current = 650 A Operating time of protective device = 0.35 sec Constant, k, for protective conductor material = 115 The selected size of the protective conductor should be:","o":["2.5 mm2","4.0 mm2","6.0 mm2","10 mm2"],"a":1,"x":"S = I × √t ÷ k<br>√0.35 = 0.592<br>650 × 0.592 = 384.6<br>384.6 ÷ 115 = 3.34 mm² → next size up: 4.0 mm²","r":"543.1.3 P196","n":"","k":1000271.0,"m":"","f":"Index: 'protective conductors, cross-sectional area'. Go to Regulation 543.1.3 and use the adiabatic equation S = √(I²t) ÷ k, then pick the next standard size up.","w":{"0":"2.5 mm² is below the calculated 3.34 mm² minimum.","2":"6.0 mm² would work but isn't the minimum; round up to the next standard size, 4.0 mm².","3":"10 mm² is oversized; the next size above 3.34 mm² is 4.0 mm²."}},{"id":"fm4.35","t":"4","c":0,"q":"When a residual current device protects a socket outlet in a domestic garage it must operate when:","o":["an earth fault on the garage lighting circuit occurs","the protective conductor in a flexible cord to a lawn mower breaks","someone comes in direct contact with an exposed line conductor and earth","someone comes in contact with exposed earth metalwork"],"a":2,"x":"","r":"415.1.1 P73","n":"","k":1000272.0,"m":"","f":"Index: 'additional protection' or 'RCD'. Go to Regulation 415.1.1 (Chapter 41), which explains RCDs as additional protection against direct contact.","w":{"0":"A lighting circuit fault isn't what an RCD on the socket circuit is there to detect.","1":"A broken protective conductor creates no residual current, so an RCD won't trip on it.","3":"Touching earthed metalwork alone causes no line-to-earth current through the body, so nothing for an RCD to detect."}},{"id":"fm4.36","t":"10","c":0,"q":"Where an auto-transformer is connected to a single-phase supply (phase and neutral) the common terminal of the winding should be connected to the:","o":["neutral conductor","phase conductor","circuit protective conductor","main earthing terminal"],"a":0,"x":"","r":"555.1.1 P213","n":"","k":1000273.0,"m":"","f":"Index: 'auto-transformers'. Go to Regulation 555.1.1 (Chapter 55).","w":{"1":"555.1.1 requires the common terminal to the neutral, not the line conductor.","2":"The common terminal goes to the neutral, not the circuit protective conductor.","3":"The common terminal goes to the neutral, not the main earthing terminal."}},{"id":"fm4.37","t":"10","c":0,"q":"Circuit cables required to carry the starting, accelerating and load currents of motors shall have a current rating not less than:","o":["full-load","1.5 x full-load","6 x full-load","10 x full load"],"a":0,"x":"","r":"552.1.1 P210","n":"","k":1000274.0,"m":"","f":"Index: 'motors'. Go to Regulation 552.1.1 (Chapter 55, rotating machines).","w":{"1":"No 1.5 multiplier is required by 552.1.1; the rating is based on full-load current.","2":"6 × full load is a typical starting current, not the cable rating required.","3":"10 × full load is not a requirement in 552.1.1."}},{"id":"fm4.38","t":"11","c":0,"q":"As part of a detailed inspection which of the following must be checked?","o":["the presence of fire barriers and protection against thermal effects","the prospective short circuit current at the origin of the installation","the maximum permissible voltage drop","the manufacturer’s name of any RCD fitted"],"a":0,"x":"","r":"642.3 P230","n":"","k":1000275.0,"m":"","f":"Index: 'inspection, checklist'. Go to Regulation 642.3 (Chapter 64), which lists items to be inspected.","w":{"1":"Prospective fault current is measured or determined during testing, not checked by inspection.","2":"Volt drop is a design check, not an item in the 642.3 inspection list.","3":"The RCD manufacturer's name isn't an inspection requirement."}},{"id":"fm4.39","t":"7","c":0,"q":"One item that should be included on charts and diagrams made available to the person carrying out an inspection and test is:","o":["all isolation and switching arrangements","the location details of portable equipment","the total number of outlets in the installation","the details of the original contract arrangements"],"a":0,"x":"","r":"514.9.1 (iii) P132","n":"","k":1000276.0,"m":"","f":"Index: 'diagrams'. Go to Regulation 514.9.1 (Chapter 51), which lists what the charts and diagrams must show.","w":{"1":"Portable equipment locations aren't required on the charts in 514.9.1.","2":"The total number of outlets isn't required; 514.9.1 asks for points served and circuit details.","3":"Contract arrangements aren't technical information required by 514.9.1."}},{"id":"fm4.40","t":"11","c":1,"q":"Which on of the following insulation resistance test results, meets the minimum acceptable value for an installation with a 400 V supply?","o":["5.0 MΩ","0.25 MΩ","0.5 MΩ","1.0 MΩ"],"a":3,"x":"","r":"Table 64 P232","n":"","k":1000277.0,"m":"","f":"Index: 'insulation resistance'. Go to Table 64 (Chapter 64), 'up to and including 500 V' row, minimum value column.","w":{"0":"5.0 MΩ passes but isn't the minimum value the question asks for.","1":"0.25 MΩ is below the table minimum for any circuit in the 2018 table.","2":"0.5 MΩ is the SELV/PELV minimum; circuits up to 500 V need 1.0 MΩ."}},{"id":"fm4.41","t":"11","c":1,"q":"The test voltage required to carry out an insulation resistance test on an installation with a nominal supply voltage of 400 V is:","o":["250 V dc","400 V dc","500 V dc","1000 V dc"],"a":2,"x":"","r":"Table 64 P232","n":"","k":1000278.0,"m":"","f":"Index: 'insulation resistance'. Go to Table 64 (Chapter 64): 400 V falls in the 'up to and including 500 V' row, test voltage column.","w":{"0":"250 V d.c. is for SELV and PELV circuits.","1":"400 V d.c. isn't a Table 64 test voltage; you don't test at the supply voltage.","3":"1000 V d.c. is for circuits above 500 V."}},{"id":"fm4.42","t":"11","c":0,"q":"An earth fault loop impedance test determines the actual value of:","o":["Zs","Ze","R1","R2"],"a":0,"x":"","r":"Definitions P28","n":"","k":1000279.0,"m":"","f":"Index: 'earth fault loop impedance'. Go to Part 2 Definitions and Regulation 643.7.3 on measuring Zs.","w":{"1":"Ze is the external part only; a loop test at the circuit end measures the whole loop Zs.","2":"R1 is found by a continuity test, not a loop impedance test.","3":"R2 is found by a continuity test, not a loop impedance test."}},{"id":"fm4.43","t":"11","c":0,"q":"Electrical installation certificates should be signed by those responsible for the:","o":["inspection and testing only","installation work only","main contract","design, construction and inspection testing"],"a":3,"x":"","r":"Appendix 6 Intro (i) P461","n":"","k":1000280.0,"m":"","f":"Index: 'Electrical Installation Certificate'. Go to Appendix 6 introductory notes, which say who signs.","w":{"0":"The EIC covers design and construction too, not just inspection and testing.","1":"Installation alone isn't enough; design and inspection/testing must also be signed for.","2":"The main contractor isn't the signatory; the people responsible for design, construction and inspection sign."}},{"id":"fm4.44","t":"11","c":0,"q":"The result and extent of a Periodic Inspection and Test shall be recorded and given to the:","o":["original installer","person ordering the inspection","representative of the supplier","installation designer"],"a":1,"x":"","r":"653.6 P238","n":"","k":1000281.0,"m":"","f":"Index: 'periodic inspection, report'. Go to Chapter 65, Regulation 653 on reporting.","w":{"0":"The report goes to the person ordering it, not the original installer.","2":"The supplier's representative isn't the recipient; it's the person ordering the inspection.","3":"The designer isn't the recipient; it's the person ordering the inspection."}},{"id":"fm4.45","t":"11","c":0,"q":"The following tests are to be carried out on a new installation 1 insulation resistance 2 continuity of ring final circuit 3 continuity of protective conductors 4 earth loop impedance 5 polarity The correct order of carrying out the tests is:","o":["1, 2, 3, 4, 5","3, 2, 1, 5, 4","2, 3, 5, 1, 4","5, 4, 1, 2, 3"],"a":1,"x":"","r":"643.2 – 643.7.3 P232 - 235","n":"","k":1000282.0,"m":"","f":"Index: 'testing, sequence'. Work through Chapter 64 Regulations 643.2 (continuity) to 643.7 (EFLI); the dead tests come first in that order.","w":{"0":"Insulation resistance must follow the continuity tests, and polarity comes before loop impedance.","2":"Ring continuity comes after protective conductor continuity, and polarity before insulation is out of sequence.","3":"Live tests (polarity confirmed live, loop impedance) can't come before the dead tests."}},{"id":"fm4.46","t":"11","c":0,"q":"One reason for carrying out a polarity test is:","o":["lighting switches work","the outer screwed contact is connected to the phase conductor","sockets are switched","fuses are fitted in the phase conductor"],"a":3,"x":"","r":"643.6 P233","n":"","k":1000283.0,"m":"","f":"Index: 'polarity'. Go to Regulation 643.6 (Chapter 64), which lists what the polarity test verifies.","w":{"0":"Switches 'working' is a functional check; polarity confirms they are in the line conductor.","1":"The reverse: the outer screwed contact of an ES lampholder must be connected to the neutral.","2":"Polarity checks that switches are in the line conductor, not merely that sockets are switched."}},{"id":"fm4.47","t":"11","c":0,"q":"One of the purposes of an inspection prior to initial testing of an installation, is to verify that the installed equipment is:","o":["connected to the supply and energised","not visibly damaged","functioning safely when energised","exceeds the minimum insulation resistance value"],"a":1,"x":"","r":"642.2 (iii) P230","n":"","k":1000284.0,"m":"","f":"Index: 'inspection'. Go to Regulation 642.2 (Chapter 64), which lists the purposes of inspection.","w":{"0":"Inspection is carried out with the installation dead, before energising.","2":"Inspection is done before energising; functional checks come later.","3":"Insulation resistance is a test result, not something verified by inspection."}},{"id":"fm4.48","t":"12","c":0,"q":"Electrical equipment installed above a swimming pool diving board should not be fixed at a height less than:","o":["1.5 m","2.0 m","2.5 m","3.0 m"],"a":2,"x":"","r":"Fig 702.1 P250","n":"","k":1000285.0,"m":"","f":"Index: 'swimming pools'. Go to Section 702, Figure 702.1 (zone dimensions), and check the height above diving boards.","w":{"0":"Too low; the zone extends 2.5 m above diving boards.","1":"2.0 m isn't the zone height in Fig 702.1; it's 2.5 m.","3":"3.0 m is more than the 2.5 m figure shown in Fig 702.1."}},{"id":"fm4.49","t":"12","c":0,"q":"Which of the following may be installed inside a hot air sauna?","o":["a socket outlet fed from an SELV supply source","a ceiling mounted cord operated light switch","a thermostat mounted on the sauna","any equipment and accessories to IP24"],"a":2,"x":"","r":"703.537.5 P255","n":"","k":1000286.0,"m":"","f":"Index: 'saunas'. Go to Section 703 and Regulation 703.537.5 on switchgear and controlgear in the hot air sauna.","w":{"0":"Socket-outlets are not permitted inside the sauna, whatever the supply.","1":"Switchgear not built into the sauna heater must be outside the sauna room.","3":"IP24 is the minimum rating, but that doesn't make any equipment permitted inside."}},{"id":"fm4.50","t":"12","c":0,"q":"Construction site special regulations apply to:","o":["all site offices","earthworks","site canteens","site toilets"],"a":1,"x":"","r":"704.1.1 (iv) P256","n":"","k":1000287.0,"m":"","f":"Index: 'construction sites'. Go to Section 704, Regulation 704.1.1, which lists what is covered and what is excluded.","w":{"0":"Site offices are excluded from Section 704; general rules apply to them.","2":"Site canteens are excluded from Section 704.","3":"Site toilets are excluded from Section 704."}},{"id":"fm4.51","t":"12","c":0,"q":"In agricultural premises, an RCD may be used for protection against fire providing the operating current does not exceed:","o":["30 mA","150 mA","300 mA","500 mA"],"a":2,"x":"","r":"705.422.7 P259","n":"","k":1000288.0,"m":"","f":"Index: 'agricultural premises'. Go to Section 705, Regulation 705.422.7 (protection against fire).","w":{"0":"30 mA is for additional protection; the fire protection limit is 300 mA.","1":"150 mA isn't the figure in 705.422.7; it's 300 mA.","3":"500 mA exceeds the 300 mA maximum for fire protection."}},{"id":"fm4.52","t":"12","c":0,"q":"The minimum cross-sectional area of any conductor in a caravan is:","o":["1.5 mm2","2.5 mm2","4.0 mm2","6.0 mm2"],"a":0,"x":"","r":"721.524.1 P309","n":"","k":1000289.0,"m":"","f":"Index: 'caravans'. Go to Section 721, Regulation 721.524.1 (cross-sectional area of conductors).","w":{"1":"2.5 mm² is common but not the minimum; 721.524.1 says 1.5 mm².","2":"Too large to be the minimum; 721.524.1 gives 1.5 mm².","3":"Too large to be the minimum; 721.524.1 gives 1.5 mm²."}},{"id":"fm4.53","t":"12","c":0,"q":"The maximum permissible height for a caravan inlet is:","o":["0.5 m","1 m","1.5 m","1.8 m"],"a":3,"x":"","r":"721.55.1.2","n":"","k":1000290.0,"m":"","f":"Index: 'caravans, inlet'. Go to Section 721, Regulation 721.55.1.2, which sets the inlet height above ground.","w":{"0":"0.5 m isn't a maximum in 721.55.1.2; the limit is 1.8 m.","1":"1 m isn't the limit; the inlet may be up to 1.8 m above ground.","2":"1.5 m isn't the limit; the inlet may be up to 1.8 m above ground."}},{"id":"fm4.54","t":"12","c":0,"q":"One method acceptable to the IEE Regulations for providing fault protection on circuits feeding street furniture is by:","o":["a non-conducting location","earth free equipotential bonding","automatic disconnection of supply","electrical separation"],"a":2,"x":"","r":"714.411.3.3 P293","n":"Electrical separation isn’t ruled out for street furniture either, but automatic disconnection is the usual method and the intended answer.","k":1000291.0,"m":"","f":"Index: 'street furniture' or 'highway power supplies'. Go to Section 714, Regulations 714.410 and 714.411 (automatic disconnection).","w":{"0":"714.410.3.6 doesn't allow a non-conducting location for street furniture.","1":"714.410.3.6 doesn't allow earth-free local equipotential bonding for street furniture.","3":"Not ruled out, but automatic disconnection is the usual method and the intended answer."}},{"id":"fm5.1","t":"1","c":0,"q":"BS7671 relates to electrical installations in and around buildings but excludes:","o":["agricultural and horticultural premises","construction sites","electrical equipment on board ships","caravans"],"a":2,"x":"","r":"110.1.1 P15","n":"","k":1000292.0,"m":"","f":"Index: 'scope' or 'exclusions'. Go to Chapter 11, Regulation 110.2, which lists installations BS 7671 doesn't cover.","w":{"0":"Agricultural premises are covered, with special requirements in Section 705.","1":"Construction sites are covered, with special requirements in Section 704.","3":"Caravans are covered, with special requirements in Section 721."}},{"id":"fm5.2","t":"1","c":0,"q":"Parts 3 to 7 of BS 7671 covers in detail methods and practices which meets the requirements of:","o":["Chapter 11","Chapter 12","Chapter 13","Part 2"],"a":2,"x":"","r":"120.3 P17","n":"","k":1000293.0,"m":"","f":"Index: 'fundamental principles'. Go to Chapter 12, Regulation 120.3.","w":{"0":"Chapter 11 is the scope, not the fundamental principles.","1":"Chapter 12 is the object and effects; Parts 3 to 7 meet Chapter 13.","3":"Part 2 is the definitions, not the safety principles."}},{"id":"fm5.3","t":"1","c":0,"q":"The IEE Regulations recognises that in electrical installations there is a risk of injury from:","o":["dangerous chemicals","shock currents","high winds","asbestos"],"a":1,"x":"","r":"131.1 (i) P17","n":"","k":1000294.0,"m":"","f":"Index: 'fundamental principles'. Go to Chapter 13, Regulation 131.1, which lists the risks of injury.","w":{"0":"Chemical hazards aren't among the electrical risks listed in 131.1.","2":"High wind is an external influence (AS), not a 131.1 risk of injury.","3":"Asbestos isn't an electrical risk listed in 131.1."}},{"id":"fm5.4","t":"1","c":0,"q":"Which one of the following types of installations is NOT within the statutory control of an authoritative body?","o":["petrol stations","caravan site","theatre","domestic"],"a":3,"x":"","r":"Appendix 2 (iii) non-domestic P357","n":"","k":1000295.0,"m":"","f":"Index: 'statutory regulations'. Go to Appendix 2, which lists installations under licensing or other statutory control.","w":{"0":"Petrol stations are subject to petroleum licensing controls.","1":"Caravan sites are subject to site licensing controls.","2":"Theatres are subject to licensing controls for public entertainment."}},{"id":"fm5.5","t":"3","c":0,"q":"The type of building construction in which an installation is to be carried out may affect the design and safe operation of the installation. This effect is called:","o":["the nature of the supply","compatibility","installation arrangements","an external influence"],"a":3,"x":"","r":"Appendix 5 P445 or Definitions P30","n":"","k":1000296.0,"m":"","f":"Index: 'external influences'. Look up the definition in Part 2 and the category CB (building structure) in Appendix 5.","w":{"0":"Nature of the supply is a Chapter 31 characteristic, not the effect of building construction.","1":"Compatibility is about equipment affecting other equipment, not building construction.","2":"Installation arrangements isn't the term BS 7671 uses for this."}},{"id":"fm5.6","t":"2","c":0,"q":"Which one of the following is not classed as a Band 1 voltage circuit?","o":["a bell circuit","a 230 V lighting circuit","a SELV circuit","a 25 V signalling circuit"],"a":1,"x":"","r":"Definitions P39","n":"","k":1000297.0,"m":"","f":"Index: 'voltage, nominal' or 'Band'. Go to Part 2 Definitions (voltage bands): Band I covers ELV and signalling-type circuits.","w":{"0":"Bell circuits are listed in Band I.","2":"SELV is extra-low voltage, which falls in Band I.","3":"A 25 V signalling circuit is extra-low voltage, so Band I."}},{"id":"fm5.7","t":"13","c":0,"q":"Which one of the following external influences requires an increase in the current ratings of cables above those normally required?","o":["the presence of light dust","low ambient temperature","high wind","high ambient temperature"],"a":3,"x":"","r":"Appendix 4 Table 4B1 P394","n":"","k":1000298.0,"m":"","f":"Index: 'ambient temperature'. Go to Appendix 4, Table 4B1: factors below 1 above 30 °C mean a bigger cable is needed.","w":{"0":"Light dust (AE4) affects IP rating, not current rating.","1":"Low ambient gives factors above 1, so it doesn't increase the cable rating needed.","2":"High wind (AS3) is a mechanical concern, not a current-rating factor."}},{"id":"fm5.8","t":"3","c":0,"q":"One of the general categories of external influences is:","o":["earthing arrangements","environment","method of installation","nature of supply"],"a":1,"x":"","r":"Appendix 5 P445","n":"","k":1000299.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5: the categories are A environment, B utilisation, C construction of buildings.","w":{"0":"Earthing arrangements are a supply characteristic (Chapter 31).","2":"Method of installation is an Appendix 4 matter, not an Appendix 5 category.","3":"Nature of supply is a Chapter 31 characteristic, not an external influence category."}},{"id":"fm5.9","t":"9","c":0,"q":"Where the circuit protective conductor is not a metal cable covering or metal trunking and conduit, the c.p.c for a ring final circuit must:","o":["be run in the form of a ring having both ends connected to the earthing terminal","have a cross-sectional area not less than that of the live conductors of the ring","be made of aluminium","be wired in single-core cable"],"a":0,"x":"","r":"543.2.9 P199","n":"","k":1000300.0,"m":"","f":"Index: 'ring final circuit, protective conductor'. Go to Regulation 543.2.9 (Chapter 54).","w":{"1":"543.2.9 doesn't require full-size cpc; twin-and-earth with reduced cpc is fine.","2":"Nothing in 543.2.9 requires aluminium; copper is normal.","3":"543.2.9 doesn't require single-core cable."}},{"id":"fm5.10","t":"3","c":0,"q":"A TN-C-S system has:","o":["the neutral and earth functions combined in a single conductor in part of the system","the exposed conductive parts of an installation connected to an earth electrode which is independent to the source","a separate protective conductor connecting the source earth to the consumers main earth terminal","the neutral and protective conductors are combined throughout the system"],"a":0,"x":"","r":"","n":"","k":1000301.0,"m":"","f":"Index: 'system, TN-C-S'. Go to Part 2 (system types) and the TN-C-S figure in Part 2 earthing diagrams.","w":{"1":"That describes a TT system, with its own installation earth electrode.","2":"That describes TN-S, with separate protective conductor throughout.","3":"Combined throughout the whole system is TN-C, not TN-C-S."}},{"id":"fm5.11","t":"3","c":0,"q":"Installations should be arranged so as to avoid danger and minimise inconvenience in the event of a fault and facilitate safe operation, inspection, testing and maintenance. One method of complying with this is to:","o":["connect all circuits on the radial principle","fit an RCD at the main intake position","divide the installation into separate circuits","divide the installation into lighting and power"],"a":2,"x":"","r":"314.1  P50","n":"","k":1000302.0,"m":"","f":"Index: 'division of installation'. Go to Chapter 31, Regulation 314.1.","w":{"0":"314.1 asks for division into circuits, not specifically radial circuits.","1":"A single main RCD would make the whole installation trip, which 314.1 aims to avoid.","3":"Splitting into lighting and power alone isn't what 314.1 asks; it's separate circuits."}},{"id":"fm5.12","t":"5","c":0,"q":"The prospective short circuit current at the origin of the consumer’s installation must be taken into account when:","o":["assessing the value of the external earth loop impedance","selecting the number of ways required for the main distribution board","assessing the methods to be used to provide basic protection","selecting the type of overcurrent protective device to be installed"],"a":3,"x":"","r":"434.5.1 P92","n":"","k":1000303.0,"m":"","f":"Index: 'prospective fault current'. Go to Regulation 434.5.1 (Chapter 43), on breaking capacity of protective devices.","w":{"0":"Ze is measured or obtained separately; PSCC isn't used to assess it.","1":"The number of ways is a layout matter, not related to PSCC.","2":"Basic protection is insulation and barriers, unrelated to PSCC."}},{"id":"fm5.13","t":"3","c":0,"q":"A two-storey domestic dwelling should have a minimum of two lighting circuits in order to:","o":["use 10 A circuit breakers for the lighting circuits","reduce the load on the consumer unit","avoid danger in the event of a fault","enable a greater variety of luminaires to be used"],"a":2,"x":"","r":"314.1 (i) P50","n":"","k":1000304.0,"m":"","f":"Index: 'division of installation'. Go to Regulation 314.1(i) (Chapter 31).","w":{"0":"Device ratings aren't the reason; 314.1 is about avoiding danger in a fault.","1":"Load reduction isn't the 314.1 reason.","3":"Luminaire choice isn't the 314.1 reason; it's avoiding danger and inconvenience."}},{"id":"fm5.14","t":"3","c":0,"q":"With reference to the general characteristics of an electrical installation, the maximum demand should be:","o":["determined by the supply company","calculated from the installation drawings","obtained from the architect","assessed, taking diversity into account"],"a":3,"x":"","r":"311.1 P45","n":"","k":1000305.0,"m":"","f":"Index: 'maximum demand'. Go to Chapter 31, Regulation 311.1.","w":{"0":"311.1 places the duty on the designer to assess it, not the supply company.","1":"Drawings help, but 311.1 says assess it with diversity taken into account.","2":"The architect doesn't determine maximum demand."}},{"id":"fm5.15","t":"4","c":0,"q":"The requirements for both basic and fault protection can be provided by SELV. One suitable source of SELV would be a:","o":["50 V storage battery","230 V diesel generator","230/110 V single phase generator","230/50 V auto-transformer"],"a":0,"x":"","r":"414.3 (iii) P72","n":"","k":1000306.0,"m":"","f":"Index: 'SELV, sources'. Go to Regulation 414.3, which lists permitted sources including batteries.","w":{"1":"230 V is low voltage, far above the SELV limit.","2":"The 230 V winding and 110 V output exceed ELV; that's not a SELV source.","3":"An auto-transformer gives no isolation between windings, so can't supply SELV."}},{"id":"fm5.16","t":"4","c":0,"q":"Residual current circuit breakers shall NOT be used on a TN system where a circuit incorporates:","o":["fuses","exposed conductive parts","socket outlets","PEN conductors"],"a":3,"x":"","r":"411.4.3 P60","n":"","k":1000307.0,"m":"","f":"Index: 'RCD, TN system' or 'PEN conductor'. Go to Regulation 411.4 (Chapter 41).","w":{"0":"Fuses don't prevent the use of an RCD.","1":"RCDs are used to protect exposed-conductive-parts; that's their purpose.","2":"Socket-outlets usually need RCD protection, not the opposite."}},{"id":"fm5.17","t":"2","c":0,"q":"A component of a support system consisting of regularly spaced elements which mechanically retains a cable is defined as a cable:","o":["bracket","ladder","cleat","tray"],"a":2,"x":"","r":"Definitions P25","n":"","k":1000308.0,"m":"","f":"Index: 'cable cleat'. Go to Part 2 Definitions and compare cleat, ladder and tray.","w":{"0":"'Bracket' isn't the defined term for this description.","1":"Cable ladder is defined as supporting rungs fixed to longitudinal members, not a retaining component.","3":"Cable tray is a continuous base, not regularly spaced retaining elements."}},{"id":"fm5.18","t":"4","c":0,"q":"SELV can be used as a means to meet the requirements of both basic and fault protection. In such cases the nominal voltage must not exceed:","o":["12 V ac","25 V ac","50 V ac","110 V ac"],"a":2,"x":"","r":"414.1.1 P72","n":"","k":1000309.0,"m":"","f":"Index: 'SELV'. Go to Regulation 414.1.1: the limit is the upper limit of voltage Band I.","w":{"0":"12 V a.c. is a limit used in some special locations, not the general SELV limit.","1":"25 V a.c. is a limit used in some special locations, not the general 414.1.1 limit.","3":"110 V is reduced low voltage, well above ELV."}},{"id":"fm5.19","t":"3","c":0,"q":"Which one of the following classifications of external influences would be appropriate for an item of electrical equipment installed where it would be subject to an atmosphere where heavy dust is present?","o":["AE1","BC1","AE6","AG1"],"a":2,"x":"","r":"Appendix 5 P446","n":"","k":1000310.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5 and the AE (foreign solids/dust) codes; AE6 is heavy dust.","w":{"0":"AE1 is negligible foreign solid bodies, not heavy dust.","1":"BC is contact of persons with earth potential, not dust.","3":"AG is impact, not dust."}},{"id":"fm5.20","t":"6","c":0,"q":"A section of a factory requires urgent repairs to a machine. The type of switching provided to allow this work to proceed would be switching for:","o":["mechanical movement","mechanical maintenance","emergency","safe operation"],"a":1,"x":"","r":"537.3.2 P183","n":"","k":1000311.0,"m":"","f":"Index: 'switching off for mechanical maintenance'. Go to Section 537 (537.3.2).","w":{"0":"There's no 'mechanical movement' switching category in BS 7671.","2":"Emergency switching is for removing unexpected danger quickly, not planned repair.","3":"'Safe operation' isn't a switching category in Section 537."}},{"id":"fm5.21","t":"3","c":0,"q":"The correct classifications of an external influence consisting of light dust is:","o":["AC2","BA2","AE4","AH3"],"a":2,"x":"","r":"Appendix 5 P446","n":"","k":1000312.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5, AE codes: AE4 light, AE5 moderate, AE6 heavy dust.","w":{"0":"AC is altitude, not dust.","1":"BA is capability of persons (BA2 children), not dust.","3":"AH is vibration, not dust."}},{"id":"fm5.22","t":"5","c":1,"q":"lz is the current rating of a circuit conductor. The requirements for overload current protection are fulfilled when:","o":["lb = 22A, ln = 25A, lz = 18A","lb = 18A, ln – 15A, lz = 15A","lb = 9A, ln = 15A, lz = 17A","lb = 8A, ln = 10A, lz = 8A"],"a":2,"x":"","r":"433.1.1 P98","n":"","k":1000313.0,"m":"","f":"Index: 'overload protection'. Go to Regulation 433.1.1 and check each option against Ib ≤ In ≤ Iz.","w":{"0":"In (25 A) exceeds Iz (18 A), and Ib (22 A) exceeds Iz, so the cable isn't protected.","1":"Ib (18 A) exceeds In (15 A), so the device would trip under normal load.","3":"In (10 A) exceeds Iz (8 A), so the cable isn't protected."}},{"id":"fm5.23","t":"5","c":0,"q":"Where the overcurrent device is intended to afford protection against overload, l2 must NOT exceed lz times:","o":["0.725","1.45","1.8","5"],"a":1,"x":"","r":"433.1.1 P89","n":"","k":1000314.0,"m":"","f":"Index: 'overload protection'. Go to Regulation 433.1.1 (iii): I2 ≤ 1.45 × Iz.","w":{"0":"0.725 is the BS 3036 rewireable fuse factor (433.1.202), not the I2 limit.","2":"1.8 isn't the factor in 433.1.1.","3":"5 is the Type B instantaneous trip multiple, not the overload factor."}},{"id":"fm5.24","t":"2","c":0,"q":"A fault current caused by the line and neutral conductors to come in contact with each other is referred to as:","o":["an earth fault","an overload fault","a short circuit fault","an open circuit fault"],"a":2,"x":"","r":"Definitions P36","n":"","k":1000315.0,"m":"","f":"Index: 'short-circuit current'. Go to Part 2 Definitions.","w":{"0":"An earth fault is line to earth or a protective conductor, not line to neutral.","1":"Overload is excess current in a healthy circuit, with no fault between conductors.","3":"An open circuit is a break, not contact between conductors."}},{"id":"fm5.25","t":"13","c":1,"q":"A 230 V single-phase circuit supplying a pump motor is protected by a 20 A circuit breaker to BS EN 60898 type B. The minimum value of fault current to ensure compliance with thermal and shock constraints is:","o":["20 A","100 A","150 A","200 A"],"a":1,"x":"Type B trips instantly at 5 × In:<br>5 × 20 = 100 A","r":"Appendix 3 Fig 3A4 P370","n":"","k":1000316.0,"m":"","f":"Index: 'circuit-breakers, time/current characteristics'. Go to Appendix 3, the Type B curves (Fig 3A4), and use 5 × In.","w":{"0":"20 A is just In; it won't cause instantaneous tripping.","2":"150 A isn't the Type B multiple; Type B trips instantly at 5 × In = 100 A.","3":"200 A is 10 × In, the Type C upper figure, not Type B."}},{"id":"fm5.26","t":"6","c":0,"q":"Where a means of isolation is provided in an electrical installation, the means must be:","o":["clearly labelled","always adjacent to equipment","available for emergency switching","automatic in operation"],"a":0,"x":"","r":"537.2.7 P183","n":"","k":1000317.0,"m":"","f":"Index: 'isolation'. Go to Section 537 (537.2.7) on identification of isolating devices.","w":{"1":"537.2 doesn't require isolators to always be adjacent to equipment.","2":"Isolation and emergency switching are separate functions.","3":"Isolators are manually operated, not automatic."}},{"id":"fm5.27","t":"2","c":0,"q":"Overload current is an overcurrent occurring in a circuit:","o":["due to an earth fault","due to a short-circuit fault","that is electrically sound","that is not fully loaded"],"a":2,"x":"","r":"Definitions P34","n":"","k":1000318.0,"m":"","f":"Index: 'overload current'. Go to Part 2 Definitions.","w":{"0":"Earth fault current is a fault current, not overload.","1":"Short-circuit current is a fault current, not overload.","3":"Overload happens in a circuit carrying too much current, not one lightly loaded."}},{"id":"fm5.28","t":"12","c":0,"q":"The designer/installer of a ceiling heating system must provide a plan for the installation. Information NOT required on the plan would be the:","o":["number of rooms within the installation","number of heating units installed","position of the junction boxes","surface power density"],"a":0,"x":"","r":"753.514.1 P336","n":"","k":1000319.0,"m":"","f":"Index: 'heating, floor and ceiling'. Go to Section 753, Regulation 753.514 on the plan that must be provided.","w":{"1":"The number of heating units is required on the plan.","2":"Junction box positions are required on the plan.","3":"Surface power density is required on the plan."}},{"id":"fm5.29","t":"13","c":1,"q":"When 13 A socket outlets are wired from a fused spur using 70°C thermoplastic insulated cable with copper conductors, the minimum conductor size permissible is:","o":["1.0 mm2","1.5 mm2","2.5 mm2","4.0 mm2"],"a":1,"x":"","r":"Appendix 15 P505","n":"","k":1000320.0,"m":"","f":"Index: 'ring final circuit' or 'socket-outlets'. Go to Appendix 15 (ring and radial circuits) on spurs from a fused connection unit.","w":{"0":"1.0 mm² is too small for a 13 A fused spur in Appendix 15.","2":"2.5 mm² is used for an unfused spur; a fused spur may be 1.5 mm².","3":"4.0 mm² is a radial circuit size, not a fused spur minimum."}},{"id":"fm5.30","t":"7","c":1,"q":"The correction factor for a cable surrounded by thermal insulation for a length of 200 mm is:","o":["0.5","0.63","0.75","1.0"],"a":1,"x":"","r":"Table 52.2 P144","n":"","k":1000321.0,"m":"","f":"Index: 'thermal insulation'. Go to Table 52.2 (Chapter 52) and read the 200 mm row.","w":{"0":"0.5 is for 500 mm or more in insulation.","2":"0.75 isn't in Table 52.2; for 200 mm the factor is 0.63.","3":"1.0 means no derating; 200 mm in insulation does need derating."}},{"id":"fm5.31","t":"13","c":0,"q":"When selecting a cable for a single circuit installation, correction factors are to be used and applied to the:","o":["total current taken by the installation","current-carrying capacity of the cable","design current of the circuit","nominal current of the protective device"],"a":3,"x":"","r":"Appendix 4 5.1.1 P377","n":"","k":1000322.0,"m":"","f":"Index: 'correction factors'. Go to Appendix 4 Section 5.1.1: It ≥ In ÷ (Ca × Cg × Ci...).","w":{"0":"Total installation load is maximum demand, not used here.","1":"The factors are applied to In to find the tabulated value; you don't scale the cable's rating directly.","2":"For a single circuit the factors apply to In, not Ib."}},{"id":"fm5.32","t":"5","c":0,"q":"Where protection against overload is provided by a semi-enclosed fuse to BS 3036, the current rating of the cable must be at least:","o":["0.725 times the current rating of the fuse","the nominal current rating of the fuse divided by 0.725","the same rating as the design current of the circuit","0.725 times the design current of the circuit"],"a":1,"x":"","r":"433.1.202 P89","n":"","k":1000323.0,"m":"","f":"Index: 'semi-enclosed fuses' or 'overload protection'. Go to Regulation 433.1.202 (Chapter 43): Iz ≥ In ÷ 0.725.","w":{"0":"Multiplying by 0.725 gives a smaller cable rating, the wrong way round.","2":"Design current alone ignores the BS 3036 fuse's poor fusing factor.","3":"The factor is applied to the fuse rating In, not to Ib, and by division."}},{"id":"fm5.33","t":"5","c":0,"q":"Correct co-ordination between conductors and overcurrent protection device is achieved when:","o":["In is not less than the design current Ib","In exceeds the lowest current carrying capacity Iz","the current causing effective operation (I2) exceeds 1.45 Iz","Ib is greater than Iz"],"a":0,"x":"","r":"433.1.1 P89","n":"","k":1000324.0,"m":"","f":"Index: 'overload protection, coordination'. Go to Regulation 433.1.1: Ib ≤ In ≤ Iz and I2 ≤ 1.45 Iz.","w":{"1":"In must not exceed Iz.","2":"I2 must not exceed 1.45 Iz.","3":"Ib must not exceed Iz."}},{"id":"fm5.34","t":"9","c":1,"q":"In order to calculate the minimum value of the cross-sectional area of a protective conductor the following information is available Fault current = 300 A Operating time of the protective device = 0.6 s Constant k, for protective conductor material = 115 The minimum, cross-sectional area of the protective conductor should be:","o":["2.5 mm2","1.5 mm2","6.0 mm2","4.0 mm2"],"a":0,"x":"S = I × √t ÷ k<br>√0.6 = 0.775<br>300 × 0.775 = 232.4<br>232.4 ÷ 115 = 2.02 mm² → next size up: 2.5 mm²","r":"543.1.3 P196","n":"","k":1000325.0,"m":"","f":"Index: 'protective conductors, cross-sectional area'. Go to Regulation 543.1.3 and use S = √(I²t) ÷ k, then the next standard size up.","w":{"1":"1.5 mm² is below the calculated 2.02 mm² minimum.","2":"6.0 mm² would work but isn't the minimum; the next size up is 2.5 mm².","3":"4.0 mm² would work but isn't the minimum; the next size up is 2.5 mm²."}},{"id":"fm5.35","t":"13","c":1,"q":"The rating factor to be applied for eight equally loaded circuits grouped together in conduit is:","o":["0.54","0.52","0.50","0.71"],"a":1,"x":"","r":"Appendix 4, Table 4C1 P396","n":"","k":1000326.0,"m":"","f":"Index: 'grouping'. Go to Appendix 4, Table 4C1, 'enclosed (conduit)' row, 8 circuits column.","w":{"0":"0.54 is for 7 circuits.","2":"0.50 is for 9 circuits.","3":"0.71 isn't the eight-circuit enclosed figure; you've read the wrong column or row."}},{"id":"fm5.36","t":"5","c":1,"q":"A circuit is protected by a 10 A BS 3036 semi-enclosed (rewireable) fuse. The minimum permissible current rating (lz) of a conductor protected by this fuse would be:","o":["7.25 A","10 A","13.8 A","20 A"],"a":2,"x":"BS 3036 fuses need Iz ≥ In ÷ 0.725 (Reg 433.1.202)<br>10 ÷ 0.725 = 13.8 A","r":"Appendix 4 5.1.1,  433.1.1 & 433.1.202 P89","n":"","k":1000327.0,"m":"","f":"Index: 'semi-enclosed fuses'. Go to Regulation 433.1.202: Iz ≥ In ÷ 0.725.","w":{"0":"You multiplied by 0.725 instead of dividing.","1":"10 A is the fuse rating; a BS 3036 fuse needs Iz ≥ In ÷ 0.725.","3":"20 A is oversized; the minimum is 10 ÷ 0.725 = 13.8 A."}},{"id":"fm5.37","t":"4","c":0,"q":"An office installation is connected to a TT system and earth fault protection is provided by a residual current device. The product of the rated residual operating current of the device and the earth electrode resistance plus the protective conductor’s resistance connecting it to the exposed conductive parts shall not exceed:","o":["0.5 V","230 V","50 V","500 V"],"a":2,"x":"","r":"411.5.3 P64","n":"","k":1000328.0,"m":"","f":"Index: 'TT system'. Go to Regulation 411.5.3 (Chapter 41): RA × IΔn ≤ 50 V.","w":{"0":"0.5 V isn't the limit in 411.5.3.","1":"230 V is the supply voltage, not the touch voltage limit.","3":"500 V is
