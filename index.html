s instructions","isolating the main supply circuit"],"a":0,"x":"","r":"","n":"","k":1000095.0,"m":"","f":"Index: 'circuit-breakers, setting'. Go to Chapter 53 (533.1 area), which requires a key or tool to alter settings where ordinary persons can reach them.","w":{"1":"Permission isn't a physical safeguard; the regulation requires a deliberate act using a key or a tool.","2":"Reading instructions doesn't stop someone altering the setting; a key or tool must be needed.","3":"Isolation isn't the safeguard required; it's that the setting can't be changed without a key or tool."}},{"id":"mp2.37","t":"6","c":0,"q":"As a means of isolation in a circuit, it is not permissible to use a","o":["double-pole switch fuse","firefighter’s switch","linked switch","semi-conductor device"],"a":3,"x":"","r":"","n":"","k":1000096.0,"m":"","f":"Index: 'isolation, devices for'. Go to Section 537, Regulation 537.2.2: semiconductor devices shall not be used as isolating devices.","w":{"0":"A double-pole switch fuse can be a suitable isolating device.","1":"A firefighter's switch is used to isolate signs and lighting; it is an acceptable isolating device.","2":"A linked switch can provide isolation if it meets the isolator requirements of Section 537."}},{"id":"mp2.38","t":"9","c":0,"q":"The minimum csa of a supplementary bonding conductor protected against mechanical damage and run as a separate cable, connecting between two extraneous conductive parts should be","o":["1.5 mm2","2.5 mm2","4.0 mm2","6.0 mm2"],"a":1,"x":"","r":"","n":"","k":1000097.0,"m":"","f":"Index: 'supplementary bonding conductors'. Go to Section 544 (544.2): between two extraneous parts, 2.5 mm² if mechanically protected, 4 mm² if not.","w":{"0":"1.5 mm² is below the minimum for any separate supplementary bonding conductor.","2":"4 mm² is the minimum where the conductor is not protected against mechanical damage.","3":"6 mm² isn't the supplementary bonding minimum; that figure relates to main bonding, not this case."}},{"id":"mp2.39","t":"10","c":0,"q":"Where groups of luminaires are divided between the three line conductors of a three-phase system, with only one common neutral, at least one device must be provided that will disconnect","o":["the neutral conductor only","each line conductor individually","all line conductors simultaneously","a single line conductor and the common neutral"],"a":2,"x":"","r":"","n":"","k":1000098.0,"m":"","f":"Index: 'luminaires, groups of'. Go to Section 559 (559.5.5): at least one device disconnecting all line conductors simultaneously.","w":{"0":"Switching the neutral alone would leave the luminaires live; never disconnect the neutral on its own.","1":"Individual disconnection could leave a shared neutral with other lines live; they must be disconnected together.","3":"One line plus the neutral leaves the other two lines live on luminaires sharing that neutral."}},{"id":"mp2.40","t":"10","c":0,"q":"Circuits supplied by a generator set which is not permanently fixed and used for temporary supplies, must have additional protection by a","o":["double pole circuit-breaker only","30 mA RCD","BS88 device only","100mA RCD"],"a":1,"x":"","r":"","n":"","k":1000099.0,"m":"","f":"Index: 'generating sets'. Go to Section 551, Regulation 551.4.4 (sets not permanently fixed), which requires 30 mA RCD additional protection.","w":{"0":"A circuit-breaker alone gives overcurrent protection, not the 30 mA RCD additional protection required.","2":"A BS 88 fuse alone gives overcurrent protection only; an RCD is required.","3":"100 mA isn't additional protection; additional protection means a 30 mA RCD per Regulation 415.1.1."}},{"id":"mp2.41","t":"10","c":0,"q":"A suitably supply or source for safety services is a","o":["primary cells or cells","standard mains supply","non-earthed transformer","mains operated generator"],"a":0,"x":"","r":"","n":"","k":1000100.0,"m":"","f":"Index: 'safety services, sources'. Go to Chapter 56, Regulation 560.6.1, which lists storage batteries, primary cells, independent generator sets and a separate feeder.","w":{"1":"The normal mains supply is what safety services must survive the loss of, so it can't be the safety source.","2":"A transformer isn't an independent source; it fails when the supply to it fails.","3":"A mains-operated generator depends on the normal supply; the list requires generator sets independent of it."}},{"id":"mp2.42","t":"11","c":0,"q":"Which order should the following four tests identified in BS 7671 be put in? 1 insulation resistance 2 polarity 3 protection by SELV 4 continuity of conductors","o":["1,2,3,4","2.3.1.4","4,1,3,2","4.2.3.1"],"a":2,"x":"","r":"","n":"","k":1000101.0,"m":"","f":"Index: 'testing, sequence'. Go to Chapter 64, Regulation 643.1 and follow the order 643.2 (continuity), 643.3 (insulation), 643.4 (SELV) and later polarity.","w":{"0":"Continuity must come first; insulation resistance can't safely or meaningfully be done before conductors are proved continuous.","1":"Polarity isn't first; the dead tests start with continuity, then insulation resistance, then SELV.","3":"Polarity comes after the insulation and SELV tests in the 643 sequence, not second."}},{"id":"mp2.43","t":"11","c":0,"q":"Before an Electrical Installation Certificate is issued for any installation, any defects or omissions in the installation work covered by the certificate, must be","o":["recorded","reported to the person ordering the work","made good, re-inspected and tested","noted for any future testing of the installation"],"a":2,"x":"","r":"","n":"","k":1000102.0,"m":"","f":"Index: 'Electrical Installation Certificate'. Go to Section 644 (644.1.1): defects or omissions must be corrected before the Certificate is issued.","w":{"0":"Recording defects is for an EICR; an EIC can't be issued over known defects.","1":"Reporting isn't enough for new work; the defects must be put right first.","3":"Noting for the future applies to periodic reports, not to new work being certified."}},{"id":"mp2.44","t":"11","c":0,"q":"The result and extent of a Periodic Inspection and Test should be recorded and given to the","o":["original installer","person ordering the inspection","representative of the distributor","installation designer"],"a":1,"x":"","r":"","n":"","k":1000103.0,"m":"","f":"Index: 'Electrical Installation Condition Report'. Go to Chapter 65, Regulation 653.6: the Report is issued to the person ordering the inspection.","w":{"0":"The original installer may have no involvement; the report goes to whoever ordered the inspection.","2":"The distributor doesn't receive the report; it goes to the person ordering the inspection.","3":"The designer isn't the recipient; the report is issued to the person who ordered it."}},{"id":"mp2.45","t":"7","c":0,"q":"A legible diagram, chart or table relating to an installation must be provided to indicate the","o":["route followed by each circuit","name of the Distributor","capacity of each distribution board","type and composition of each circuit"],"a":3,"x":"","r":"","n":"","k":1000104.0,"m":"","f":"Index: 'diagrams'. Go to Section 514, Regulation 514.9.1, item (i): type and composition of each circuit.","w":{"0":"Cable routes aren't required on the chart; 514.9.1 asks for type and composition of circuits.","1":"The Distributor's name isn't part of the 514.9.1 diagram or chart requirements.","2":"Board capacity isn't listed in 514.9.1; the chart identifies circuits and protective devices."}},{"id":"mp2.46","t":"12","c":0,"q":"Which one of the following is not included in the scope of Section 704 of BS 7671?","o":["Construction work on a new building","Construction site canteens","Earthwork","Engineering works"],"a":1,"x":"","r":"","n":"","k":1000105.0,"m":"","f":"Index: 'construction sites'. Go to Section 704, Regulation 704.1.1, which excludes site offices, cloakrooms, canteens, restaurants, dormitories and toilets.","w":{"0":"Construction of new buildings is specifically within the scope of Section 704.","2":"Earthworks are specifically included in Section 704.","3":"Engineering works are covered as construction-site work under Section 704."}},{"id":"mp2.47","t":"12","c":0,"q":"In Zone 2 of an indoor swimming pool where water jets are not likely to be used for cleaning purposes, the minimum degree of protection is","o":["IPX2","IPX4","IPX5","IPX8"],"a":0,"x":"","r":"","n":"","k":1000106.0,"m":"","f":"Index: 'swimming pools'. Go to Section 702, Regulation 702.512.2, zone 2 row: IPX2 indoors, IPX4 outdoors, IPX5 with water jets.","w":{"1":"IPX4 is the zone 2 figure for outdoor pools, not indoor.","2":"IPX5 is only required where water jets are likely to be used for cleaning.","3":"IPX8 is for zone 0 (submersion), not zone 2."}},{"id":"mp2.48","t":"12","c":0,"q":"In a bathroom the protective measure of placing out of reach is","o":["not allowed","allowed in zones 1 and 2","allowed in zone 2 only","allowed in all zones"],"a":0,"x":"","r":"","n":"","k":1000107.0,"m":"","f":"Index: 'bathrooms'. Go to Section 701, Regulation 701.410.3.5: obstacles and placing out of reach are not permitted.","w":{"1":"Placing out of reach isn't allowed in any zone of a bathroom.","2":"There's no zone 2 exception; placing out of reach is excluded in Section 701.","3":"Placing out of reach is excluded from bathrooms altogether, not allowed everywhere."}},{"id":"mp2.49","t":"12","c":0,"q":"In a bathroom, where the space below the bathtub or shower basin is accessible without the use of a tool, this space is classified as","o":["Zone 0","Zone 1","Zone 2","outside the zones"],"a":1,"x":"","r":"","n":"","k":1000108.0,"m":"","f":"Index: 'bathrooms, zones'. Go to Section 701 and the zone figures (Fig 701.1): space under the bath accessible without a tool is zone 1.","w":{"0":"Zone 0 is the interior of the bath or shower basin, not the space beneath it.","2":"Zone 2 is the area beyond zone 1, not the space under the bath.","3":"It's only outside the zones if a tool is needed to get under the bath."}},{"id":"mp2.50","t":"12","c":0,"q":"A PME earthing facility cannot be connected to the following locations in a caravan park?","o":["Permanent buildings","Outside lights fixed to a permanent building","Light up signage","Caravans"],"a":3,"x":"","r":"","n":"","k":1000109.0,"m":"","f":"Index: 'caravan parks'. Go to Section 708, Regulation 708.411.4: ESQCR prohibits connecting PME to a caravan's metalwork.","w":{"0":"PME may still be used for permanent buildings on the park; 708.411.4 says so.","1":"Lights on a permanent building are part of that building's installation, where PME can be used.","2":"Signage isn't the prohibited item; the ban is on connecting PME to caravans (leisure vehicles)."}},{"id":"mp2.51","t":"12","c":0,"q":"In Zone 1 of a bathroom, switches protected by SELV are permitted at a nominal ac voltage not exceeding","o":["12V","25V","50V","110V"],"a":0,"x":"","r":"","n":"","k":1000110.0,"m":"","f":"Index: 'bathrooms'. Go to Section 701, Regulation 701.512.3, zone 1: only switches of SELV circuits not exceeding 12 V AC or 30 V ripple-free DC.","w":{"1":"25 V AC is the SELV limit relating to basic protection in dry conditions, not zone 1 switches.","2":"50 V AC is the top of ELV generally, far too high for switches in zone 1.","3":"110 V is reduced low voltage, not SELV; it isn't allowed for switches in zone 1."}},{"id":"mp2.52","t":"12","c":0,"q":"When underfloor heating is provided in a swimming pool, the electric heating unit embedded in the floor should incorporate an earthed metallic sheath connected to","o":["the local supplementary equipotential bonding","the main protective equipotential bonding","the main earthing terminal of the installation","an independent earth electrode"],"a":0,"x":"","r":"","n":"","k":1000111.0,"m":"","f":"Index: 'swimming pools, heating units embedded in floor'. Go to Section 702 (702.55 / 702.753): metallic sheath connected to the supplementary bonding.","w":{"1":"Main bonding is for services entering the building; the pool rule is local supplementary bonding.","2":"Not connected straight to the MET; it goes to the supplementary bonding specified in 702.415.2.","3":"An independent electrode isn't used; the sheath joins the local supplementary bonding."}},{"id":"mp2.53","t":"14","c":0,"q":"Which of the following are examples of functions that may not be handled by the EEMS?","o":["Monitor the voltage quality","Multi source connection management","Provide an interface for the end user","Functional switching of final circuits"],"a":3,"x":"","r":"","n":"","k":1000112.0,"m":"","f":"Index: 'prosumer's installations' or 'EEMS'. Go to Chapter 82 (A2) and the regulations listing what the electrical energy management system can do.","w":{"0":"Monitoring voltage quality is something an EEMS can do.","1":"Managing connection of multiple sources is a core EEMS function in a PEI.","2":"Providing a user interface is one of the EEMS functions described."}},{"id":"mp2.54","t":"14","c":0,"q":"On a PEI supplied from more than one source, which must be provided?","o":["Suitable voltage warning notice explaining which voltage is present","An isolation switch for each source of supply","Nothing, PEI’s are not to be supplied from more than one source","Emergency switching provision local to each supply source."],"a":1,"x":"","r":"","n":"","k":1000113.0,"m":"","f":"Index: 'prosumer's installations'. Go to Chapter 82 (A2), isolation and switching requirements for PEIs with more than one source.","w":{"0":"A voltage notice may be useful but the key requirement is a means of isolating each source.","2":"PEIs are specifically designed to have multiple sources (grid, PV, storage); that's the point of Chapter 82.","3":"Emergency switching isn't the requirement here; isolation of each source is."}},{"id":"mp2.55","t":"14","c":0,"q":"When in island mode, which of the following regarding the neutral conductor is true?","o":["Neutral must remain connected to the DNO supply at all times","Only TNS installations can be used for PEI’s","Only TNCS installations can be used for PEI’s","All live conductors shall be disconnected from the supply"],"a":3,"x":"","r":"","n":"","k":1000114.0,"m":"","f":"Index: 'island mode'. Go to Chapter 82 (A2), the regulations on operating modes; in island mode all live conductors, including neutral, are disconnected from the supply.","w":{"0":"In island mode the PEI is separated from the DNO, so the neutral can't stay connected.","1":"Chapter 82 doesn't limit PEIs to TN-S; the island earthing arrangement is a separate issue.","2":"Chapter 82 doesn't limit PEIs to TN-C-S."}},{"id":"mp2.56","t":"3","c":0,"q":"An external influence has a general category code of A.  This code indicates","o":["temperature","capability","materials","environment"],"a":3,"x":"","r":"","n":"","k":1000115.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5: first letter A = environment, B = utilisation, C = construction of buildings.","w":{"0":"Temperature is AA, a second-letter subdivision of A, not what A itself means.","1":"Capability (of persons) is BA, under B = utilisation.","2":"Construction materials is CA, under C = construction of buildings."}},{"id":"mp2.57","t":"13","c":1,"q":"What is the rating factor for a 60°C thermosetting cable installed in an ambient air temperature of 40°C?","o":["0.82","0.85","0.87","0.91"],"a":0,"x":"","r":"","n":"","k":1000116.0,"m":"","f":"Appendix 4, Table 4B1 (ambient air temperature factors). Read the 40°C row in the 60°C thermosetting column.","w":{"1":"0.85 is the 40°C factor for mineral insulated cable exposed to touch, not 60°C thermosetting.","2":"0.87 is the 40°C factor for 70°C thermoplastic, not 60°C thermosetting.","3":"0.91 is the 40°C factor for 90°C thermosetting; you read the wrong column."}},{"id":"mp2.58","t":"13","c":1,"q":"The rating factor for 70°C thermoplastic cables buried direct in the ground where the ambient ground temperature is 15°C is","o":["0.77","1","1.04","1.05"],"a":3,"x":"","r":"","n":"","k":1000117.0,"m":"","f":"Appendix 4, Table 4B2 (ambient ground temperature, base 20°C). Read the 15°C row, 70°C thermoplastic column.","w":{"0":"0.77 is the 40°C ground temperature factor; you read the wrong row.","1":"1.00 is the 20°C reference; at 15°C the ground is cooler so the factor is above 1.","2":"1.04 is the 15°C factor for 90°C thermosetting; you read the wrong column."}},{"id":"mp2.59","t":"3","c":0,"q":"The external influence having a classification of AD7 indicates","o":["humidity","immersion in water","dust in the atmosphere","high levels of vibration"],"a":1,"x":"","r":"","n":"","k":1000118.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5, AD (presence of water) codes: AD7 immersion, AD8 submersion.","w":{"0":"Humidity is AB, not AD.","2":"Dust is AE (foreign solid bodies), not AD (water).","3":"Vibration is AH, not AD."}},{"id":"mp2.60","t":"11","c":0,"q":"Which is the following should individuals state when making out and signing an Electrical Installation Certificate?","o":["the company they are acting for","the approval body they belong to","their relevant qualifications","the name of their insurance company"],"a":0,"x":"","r":"","n":"","k":1000119.0,"m":"","f":"Go to Appendix 6 (model forms) and the EIC: each signatory section asks for name, signature and the company they are acting for.","w":{"1":"The EIC signatory boxes don't ask which approval body you belong to.","2":"Qualifications aren't requested in the EIC signature sections.","3":"Insurance details aren't part of the EIC."}},{"id":"mp3.1","t":"1","c":0,"q":"BS 7671 does not apply to","o":["Site built switchboards","Railway signalling equipment","Site fabricated enclosures","Mains voltage alarm systems"],"a":1,"x":"","r":"","n":"","k":1000120.0,"m":"","f":"Index: 'scope'. Go to Part 1, Regulation 110.2 (exclusions), which lists railway traction, rolling stock and signalling equipment.","w":{"0":"Site-built switchboards are part of an installation and are covered by BS 7671.","2":"Site-fabricated enclosures are covered by BS 7671 as part of the installation.","3":"Mains-voltage alarm systems are low-voltage installations within scope."}},{"id":"mp3.2","t":"1","c":0,"q":"Which of the following installations is excluded from the scope of BS 7671?","o":["A temporary electrical installation on a construction site","Highway power supplies and street furniture","A permanent electrical installation in a caravan","Equipment of mobile and fixed offshore installations"],"a":3,"x":"","r":"","n":"","k":1000121.0,"m":"","f":"Index: 'scope'. Go to Part 1, Regulation 110.2, the list of exclusions; offshore installations are listed.","w":{"0":"Construction sites are covered, with particular requirements in Section 704.","1":"Highway power supplies and street furniture are covered by Section 714.","2":"Caravan installations are covered by Section 721."}},{"id":"mp3.3","t":"1","c":0,"q":"It should be verified that any addition to an existing installation has","o":["A supply separate from that of the existing installation","A similar wiring system to that used in the existing installation","It has been treated as being entirely separate from the existing installation","Not impaired the safety of the existing installation"],"a":3,"x":"","r":"","n":"","k":1000122.0,"m":"","f":"Index: 'additions and alterations'. Go to Chapter 13, Regulation 132.16: the addition must not impair the safety of the existing installation.","w":{"0":"A separate supply isn't required; the check is that safety of the existing installation isn't impaired.","1":"Matching the wiring system isn't required by 132.16.","2":"Additions aren't treated as entirely separate; you must check the existing installation can support them safely."}},{"id":"mp3.4","t":"1","c":0,"q":"Which of the following voltage bands are not covered by BS 7671","o":["0-50V AC","DC voltages up to and including 1500V","ELV","Voltages >1000V AC"],"a":3,"x":"","r":"","n":"","k":1000123.0,"m":"","f":"Index: 'scope' and 'voltage'. Go to Part 1 (Regulation 110.1) and the Part 2 voltage definitions: BS 7671 covers up to 1000 V AC and 1500 V DC.","w":{"0":"0-50 V AC is ELV, which BS 7671 covers.","1":"DC up to 1500 V is within scope.","2":"ELV is covered (e.g. SELV and PELV in Section 414)."}},{"id":"mp3.5","t":"2","c":0,"q":"An installation having a nominal voltage of 120v AC between conductors is designates as","o":["Extra-low voltage","Low voltage","Reduced voltage","Medium voltage"],"a":1,"x":"","r":"","n":"","k":1000124.0,"m":"","f":"Index: 'voltage, nominal' in Part 2 Definitions: low voltage is above ELV (50 V AC) up to 1000 V AC.","w":{"0":"ELV only goes up to 50 V AC; 120 V exceeds it.","2":"Reduced voltage is a specific 110 V centre-tapped system, not a voltage band.","3":"Medium voltage isn't a band defined in BS 7671."}},{"id":"mp3.6","t":"2","c":0,"q":"The conductor which connects together the MET and all exposed conductive parts is the","o":["Bonding conductor","Circuit protective conductor","Line conductor","Protective bonding conductor"],"a":1,"x":"","r":"","n":"","k":1000125.0,"m":"","f":"Part 2 Definitions: 'circuit protective conductor (cpc)'. It connects exposed-conductive-parts to the MET.","w":{"0":"Bonding conductors connect extraneous-conductive-parts, not exposed-conductive-parts.","2":"A line conductor is live; it isn't a protective conductor.","3":"Protective bonding conductors are for equipotential bonding of extraneous parts, not equipment."}},{"id":"mp3.7","t":"3","c":0,"q":"Which of the following supply characteristics would need to be ascertained for an installation?","o":["Number of points of utilisation","The supply transformer type","The supply cable type","The external earth fault loop impedance"],"a":3,"x":"","r":"","n":"","k":1000126.0,"m":"","f":"Index: 'supply, characteristics'. Go to Chapter 31, Regulation 313.1, which lists Ze among the supply characteristics to ascertain.","w":{"0":"Number of points is a design decision about the installation, not a supply characteristic.","1":"Transformer type isn't one of the 313.1 characteristics.","2":"Supply cable type isn't listed in 313.1."}},{"id":"mp3.8","t":"3","c":0,"q":"Which of the following is not a characteristic of the supply?","o":["Nominal voltage","Frequency","External earth loop impedance (Ze)","Location and type of earth electrode"],"a":3,"x":"","r":"","n":"","k":1000127.0,"m":"","f":"Index: 'supply, characteristics'. Go to Regulation 313.1 and compare with the options; an earth electrode belongs to the installation, not the supply.","w":{"0":"Nominal voltage is the first supply characteristic listed in 313.1.","1":"Frequency (nature of current) is listed in 313.1.","2":"Ze is listed in 313.1."}},{"id":"mp3.9","t":"3","c":0,"q":"The earthing arrangement for the system described is classified as: the supplier's cut-out and metering feed the consumer unit, with separate neutral and earth conductors run back to the source.","o":["TT","TN-S","TN-C-S","TN"],"a":1,"x":"","r":"","n":"The original question uses a drawing; it is described in words here.","k":1000128.0,"m":"","f":"Index: 'system, TN-S'. Go to Part 2 and the earthing arrangement figures (Fig 3.x): separate neutral and protective conductors back to the source is TN-S.","w":{"0":"TT uses the installation's own earth electrode, not an earth from the supplier.","2":"TN-C-S combines neutral and earth (PEN) in the supply, not separate conductors.","3":"TN isn't specific enough; separate N and PE throughout makes it TN-S."}},{"id":"mp3.10","t":"3","c":0,"q":"The electrical system in which all exposed conductive parts of an installation are connected to an earth electrode which is electrically independent of the source earth is","o":["TN-C","TN-S","TN-C-S","TT"],"a":3,"x":"","r":"","n":"","k":1000129.0,"m":"","f":"Index: 'system, TT'. Go to Part 2 Definitions and the earthing arrangement figures: own earth electrode independent of the source earth.","w":{"0":"TN-C uses a combined PEN throughout, not an independent electrode.","1":"TN-S takes its earth from the supplier's separate protective conductor.","2":"TN-C-S takes its earth from the supplier's PEN conductor."}},{"id":"mp3.11","t":"3","c":0,"q":"Which one of the following ensures safe inspection, testing and maintenance for all installations?","o":["Regular calibration of instrumentation","Division of the installation into circuits","Protection of the installation by a 30mA RCD","Regular operational testing of an SPD"],"a":1,"x":"","r":"","n":"","k":1000130.0,"m":"","f":"Index: 'division of installation'. Go to Chapter 31, Regulation 314.1, which gives safe inspection, testing and maintenance as a reason for dividing into circuits.","w":{"0":"Instrument calibration matters for testing but isn't the 314.1 requirement.","2":"A 30 mA RCD is additional protection, not what provides safe maintenance.","3":"SPD testing isn't what 314.1 relies on."}},{"id":"mp3.12","t":"5","c":0,"q":"Which one of the following should consider measures to reduce the effects of EMI in an installation with regard to electromagnetic compatibility?","o":["The designer","The distributer","The client or owner","The BSI"],"a":0,"x":"","r":"","n":"","k":1000131.0,"m":"","f":"Index: 'electromagnetic compatibility'. Go to Section 332 and Section 444 (444.1): the designer and installer must consider EMI measures.","w":{"1":"The distributor doesn't design the installation's EMC measures.","2":"The client isn't responsible for technical EMC measures.","3":"BSI publishes standards; it doesn't design installations."}},{"id":"mp3.13","t":"3","c":0,"q":"Where particular risks of fire exist in an area of high density occupation with difficult condition of evacuation, the external influence code would be","o":["AD4","CA1","BD3","BD4"],"a":3,"x":"","r":"","n":"","k":1000132.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5, BD (conditions of evacuation): BD4 is high density occupation, difficult evacuation.","w":{"0":"AD4 is splashing water, nothing to do with evacuation.","1":"CA1 is non-combustible construction materials.","2":"BD3 is high density with easy evacuation; the question says difficult."}},{"id":"mp3.14","t":"5","c":0,"q":"Which of the following is not considered as a potential source of electromagnetic disturbance?","o":["Electric motors","Rectifiers","Electric fires","Lifts"],"a":2,"x":"","r":"","n":"","k":1000133.0,"m":"","f":"Index: 'electromagnetic disturbances'. Go to Section 444 (444.4), which lists sources such as motors, rectifiers, lifts and switching devices.","w":{"0":"Electric motors are listed as a source of disturbance.","1":"Rectifiers are listed as a source of disturbance.","3":"Lifts are listed as a source of disturbance."}},{"id":"mp3.15","t":"5","c":0,"q":"Where measures are taken against electromagnetic disturbances, what are the minimum nominal dimensions of a flat cross section bonding ring network conductor?","o":["6mm x 4mm","10mm x 5mm","16mm x 8mm","25mm x 3mm"],"a":3,"x":"","r":"","n":"","k":1000134.0,"m":"","f":"Index: 'bonding ring conductor'. Go to Section 444, Regulation 444.5.3: flat 25 mm × 3 mm or round 8 mm diameter.","w":{"0":"Too small; 444.5.3 gives 25 mm × 3 mm for flat section.","1":"Not the 444.5.3 figure; the flat minimum is 25 mm × 3 mm.","2":"Not in 444.5.3; you may be thinking of the 8 mm round diameter."}},{"id":"mp3.16","t":"5","c":0,"q":"Which of the following will provide overload protection?","o":["Linked switch","RCD","Disconnector","Circuit-breaker"],"a":3,"x":"","r":"","n":"","k":1000135.0,"m":"","f":"Index: 'overload protection'. Go to Chapter 43 (433.1) and the list of devices in Chapter 53; a circuit-breaker has an overload release.","w":{"0":"A linked switch just switches; it has no overcurrent sensing.","1":"An RCD detects residual (earth leakage) current, not overload.","2":"A disconnector isolates; it doesn't sense overcurrent."}},{"id":"mp3.17","t":"4","c":0,"q":"Which of the following is a method of fault protection?","o":["Placing out of reach","Protection by double or reinforced insulation","Protection by obstacles","Insulation of live parts"],"a":1,"x":"","r":"","n":"","k":1000136.0,"m":"","f":"Index: 'fault protection'. Go to Chapter 41 (410.3.3 and Section 412): double or reinforced insulation is a protective measure covering fault protection.","w":{"0":"Placing out of reach is a basic protection measure (Section 417).","2":"Obstacles are basic protection (Section 417).","3":"Insulation of live parts is basic protection, not fault protection."}},{"id":"mp3.18","t":"4","c":0,"q":"A BS EN 61558-2-5 shaver socket is an example of protection by","o":["Electrical separation","Barriers and enclosures","Class 1 equipment","Solid earthing"],"a":0,"x":"","r":"","n":"","k":1000137.0,"m":"","f":"Index: 'shaver supply units'. Go to Section 413 (electrical separation) and Section 701; BS EN 61558-2-5 units use an isolating transformer.","w":{"1":"Barriers and enclosures give basic protection, not what makes a shaver unit safe.","2":"Class I relies on earthing; the shaver socket output is separated, not earthed.","3":"Solid earthing isn't a protective measure here; the output is deliberately unearthed."}},{"id":"mp3.19","t":"4","c":1,"q":"If a circuit forming part of a 230v TT system has an earth fault loop impedance value (Zs) of 500Ω the rated residual operating current of an RCD would need to be equal to or less than","o":["300mA","500mA","30mA","100mA"],"a":3,"x":"Ra × IΔn ≤ 50 V, so IΔn ≤ 50 ÷ 500 = 0.1 A = 100 mA","r":"","n":"","k":1000138.0,"m":"","f":"Chapter 41, Regulation 411.5.3 (TT systems): use RA × IΔn ≤ 50 V and rearrange to IΔn ≤ 50 ÷ RA. See also Table 41.5.","w":{"0":"300 mA × 500 Ω = 150 V, well above the 50 V limit.","1":"500 mA × 500 Ω = 250 V; you may have just copied the 500 Ω figure.","2":"30 mA would comply but isn't the maximum; the question asks for the limit, 50 ÷ 500 = 100 mA."}},{"id":"mp3.20","t":"4","c":1,"q":"A 20A semi enclosed fuse (BS 3036) is protecting a final circuit.  The maximum permitted value of earth fault loop impedance (Zs) would be","o":["3.64Ω","0.99Ω","1.68Ω","1.34Ω"],"a":2,"x":"Table 41.2, BS 3036 20 A at 0.4 s: 1.68 Ω (tabulated).","r":"","n":"","k":1000139.0,"m":"","f":"Index: 'earth fault loop impedance'. Go to Table 41.2 (0.4 s, Chapter 41), part (c) BS 3036 fuses, 20 A column.","w":{"0":"3.64 Ω is the 5 s value from Table 41.4; final circuits need 0.4 s.","1":"0.99 Ω is the BS 88-2 32 A figure in Table 41.2, not BS 3036 20 A.","3":"That's not the BS 3036 20 A figure; read part (c) of Table 41.2."}},{"id":"mp3.21","t":"8","c":0,"q":"Which of the following fuse types would be used when a BS 88-2 system E fuse is used to protect a motor circuit?","o":["B","C","gG","gM"],"a":3,"x":"","r":"","n":"","k":1000140.0,"m":"","f":"Index: 'fuses'. Go to Table 41.2 heading (gG and gM fuses to BS 88-2): gM is the motor circuit application type.","w":{"0":"B is a circuit-breaker type, not a fuse category.","1":"C is a circuit-breaker type, not a fuse category.","2":"gG is general purpose; gM is for motor circuits."}},{"id":"mp3.22","t":"5","c":1,"q":"When using a non-metallic hand held piece of equipment, the maximum temperature of any accessible part is","o":["30°C","45°C","55°C","65°C"],"a":3,"x":"","r":"","n":"","k":1000141.0,"m":"","f":"Index: 'temperature limits, accessible parts'. Go to Table 42.1 (Chapter 42), hand-held row, non-metallic column.","w":{"0":"30°C isn't in Table 42.1.","1":"45°C isn't in Table 42.1.","2":"55°C is the metallic hand-held limit; non-metallic is 65°C."}},{"id":"mp3.23","t":"5","c":0,"q":"In a location where a particular risk of fire exists, any temperature cut-out device protecting a motor must","o":["Reset automatically","Be reset manually only","Be at least IP5X","Have no reset facility"],"a":1,"x":"","r":"","n":"","k":1000142.0,"m":"","f":"Index: 'fire, locations with particular risks'. Go to Section 422 (motors with automatic or remote control): temperature cut-outs must be manual reset.","w":{"0":"Automatic reset could restart an overheated motor in a fire-risk location.","2":"IP5X relates to dust protection, not cut-out reset.","3":"It must have a reset; the requirement is manual reset only."}},{"id":"mp3.24","t":"5","c":0,"q":"Which one of the following is a situation where overload protection devices may be omitted for safety reasons?","o":["The supply to a car park barrier","The supply to a burglar alarm panel","The supply circuit of a goods lift","The supply to a fire alarm"],"a":3,"x":"","r":"","n":"","k":1000143.0,"m":"","f":"Index: 'overload, omission of protection'. Go to Regulation 433.3.3, which lists fire alarm and gas alarm circuits among the examples.","w":{"0":"A car park barrier isn't a safety service; unexpected disconnection wouldn't cause danger.","1":"A burglar alarm isn't in the 433.3.3 examples; it gives fire alarm and gas alarm.","2":"The example is a lifting magnet supply, not a goods lift."}},{"id":"mp3.25","t":"5","c":0,"q":"An overload current would result from","o":["Damage to the insulation between live conductors","A disconnected conductor touching an exposed conductive part","A motor running current exceeding the protective device rating","Penetration of a cable by a nail"],"a":2,"x":"","r":"","n":"","k":1000144.0,"m":"","f":"Index: 'overload current' in Part 2 Definitions: overcurrent in an electrically sound circuit.","w":{"0":"Insulation failure between live conductors gives a short-circuit, not an overload.","1":"A conductor touching an exposed-conductive-part gives an earth fault.","3":"A nail through a cable is a fault (short-circuit or earth fault), not an overload."}},{"id":"mp3.26","t":"5","c":0,"q":"Which of the following situations may not be considered when considering transient overvoltage control?","o":["Loss of human life","Interruption of safety services","Significant data loss","Damage to cultural heritage"],"a":3,"x":"","r":"","n":"","k":1000145.0,"m":"","f":"Index: 'overvoltage, transient'. Go to Section 443, the overvoltage control regulation (443.4 as amended by A2), and its list of consequences.","w":{"0":"Loss of human life is the first consequence listed in 443.4.","1":"Interruption of safety services is listed in the A2 version of 443.4.","2":"Significant financial or data loss is listed in the A2 version of 443.4."}},{"id":"mp3.27","t":"5","c":0,"q":"Which one of the following situations is likely to cause severe, temporary overvoltage in a 3-phase installation?","o":["Loss of line conductor in a low-voltage system","Loss of protective conductor in a high voltage system","Loss of neutral in a low voltage system","Loss of line conductor in a high voltage system"],"a":2,"x":"","r":"","n":"","k":1000146.0,"m":"","f":"Index: 'overvoltages, temporary'. Go to Section 442, which covers temporary overvoltages including loss of neutral in an LV system.","w":{"0":"Losing a line causes undervoltage on that phase, not severe overvoltage.","1":"Loss of an HV protective conductor isn't the case Section 442 gives.","3":"Losing an HV line isn't the classic case; loss of LV neutral shifts the star point."}},{"id":"mp3.28","t":"5","c":0,"q":"When installing wiring systems in protected escape routes, which of the following shall not be installed?","o":["Circuits supplying general needs socket outlets","Circuits supplying general needs lighting","Circuits supplying socket outlets used for cleaning and maintenance","Circuits supplying essential fire safety services"],"a":0,"x":"Since A2, wiring in a fire-fighting shaft or protected escape route is limited to essential fire safety or related safety systems, general needs lighting, and socket-outlets for cleaning or maintenance. General needs socket-outlet circuits are not on the list.","r":"422.2 (A2)","n":"","k":1000147.0,"m":"","f":"Index: 'escape routes'. Go to Section 422, Regulation 422.2 (as amended by A2), the list of circuits allowed in protected escape routes.","w":{"1":"General needs lighting is allowed in escape routes under the A2 list.","2":"Sockets for cleaning and maintenance are allowed in the A2 list.","3":"Essential fire safety circuits are allowed; they're the first item on the list."}},{"id":"mp3.29","t":"7","c":0,"q":"To prevent circulating eddy currents in steel conduit, trunking or cable armouring","o":["Only DC must be used","Line and neutral conductors are to be kept separate","The enclosures should be solidly earthed","All live conductors of a circuit must be contained in the same enclosure"],"a":3,"x":"","r":"","n":"","k":1000148.0,"m":"","f":"Index: 'ferromagnetic enclosures'. Go to Regulation 521.5.1: all line and neutral conductors and the cpc in the same enclosure.","w":{"0":"Restricting to DC isn't the answer; 521.5.1 is about arranging AC conductors.","1":"Separating line and neutral is what causes eddy currents.","2":"Earthing the enclosure doesn't stop eddy current heating."}},{"id":"mp3.30","t":"6","c":0,"q":"A device intended to cut off all voltage from an installation provides","o":["Functional switching","Isolation","Discrimination","Emergency switching"],"a":1,"x":"","r":"","n":"","k":1000149.0,"m":"","f":"Part 2 Definitions: 'isolation', cutting off supply from all or part of an installation for safety.","w":{"0":"Functional switching turns equipment on and off in normal use.","2":"Discrimination (selectivity) is about protective devices operating in sequence.","3":"Emergency switching removes danger quickly; it isn't defined as isolation."}},{"id":"mp3.31","t":"7","c":0,"q":"Where the main earth terminal is separate from main switchgear, a permanent label should be fixed in a visible position with the wording","o":["Danger Electrical Connection – Do Not Remove","Safety Electrical Connection – Do Not Remove","Danger Earth Connection – Do Not Remove","Safety Earth Connection – Do Not  Remove"],"a":1,"x":"","r":"","n":"","k":1000150.0,"m":"","f":"Index: 'warning notices, earthing and bonding'. Go to Section 514, Regulation 514.13.1 for the exact wording.","w":{"0":"The label starts 'Safety', not 'Danger'.","2":"Wrong first word and wrong second word; it's 'Safety Electrical Connection'.","3":"It's 'Electrical Connection', not 'Earth Connection'."}},{"id":"mp3.32","t":"7","c":0,"q":"A label marked with the words ‘Safety Electrical Connection – Do Not Remove’ must be fixed at or near the","o":["Final circuit fuse","Control gear for discharge lighting","Connection to each earth electrode","Supply of the fire alarm circuits"],"a":2,"x":"","r":"","n":"","k":1000151.0,"m":"","f":"Index: 'warning notices, earthing and bonding'. Go to Regulation 514.13.1: at the connection of every earthing conductor to an earth electrode, bonding connections, and the MET where separate.","w":{"0":"Final circuit fuses don't carry this label.","1":"Discharge lighting control gear isn't on the 514.13.1 list.","3":"Fire alarm supplies have their own labelling; this label is for earthing and bonding."}},{"id":"mp3.33","t":"7","c":0,"q":"A non-flame propagating wiring system having a  maximum internal cross-sectional area of 710mm²","o":["Need not be internally sealed","Must be internally sealed","Need only be sealed if passing through an insulating partition","Musty be internally sealed if passing through a brick wall"],"a":0,"x":"","r":"","n":"","k":1000152.0,"m":"","f":"Index: 'sealing'. Go to Section 527, Regulation 527.2.3: non-flame propagating systems up to 710 mm² need not be internally sealed (if IP33).","w":{"1":"527.2.3 specifically exempts systems up to 710 mm² from internal sealing.","2":"No partition type is specified; the exemption depends on size and IP33.","3":"Wall type doesn't matter; 710 mm² or less need not be internally sealed."}},{"id":"mp3.34","t":"7","c":0,"q":"Where underground communication cables cross over underground power cables, what shall be the minimum clearance maintained between them?","o":["50mm","75mm","100mm","200mm"],"a":2,"x":"","r":"","n":"","k":1000153.0,"m":"","f":"Index: 'proximity, communications cables'. Go to Section 528, Regulation 528.2: 100 mm minimum clearance or a partition/protection.","w":{"0":"50 mm isn't the 528.2 figure; it's 100 mm.","1":"75 mm isn't the 528.2 figure; it's 100 mm.","3":"200 mm is more than required; 528.2 gives 100 mm."}},{"id":"mp3.35","t":"7","c":0,"q":"Which of the following connections cannot be inaccessible?","o":["Joints designed to be buried in the ground","A welded joint","A joint contained in an accessory marked as maintenance free","Screw terminations"],"a":3,"x":"","r":"","n":"","k":1000154.0,"m":"","f":"Index: 'joints, accessibility'. Go to Section 526, Regulation 526.3, which lists joints exempt from being accessible.","w":{"0":"Joints designed to be buried are on the 526.3 exempt list.","1":"Welded joints are on the 526.3 exempt list.","2":"Maintenance-free accessories marked MF are on the 526.3 exempt list."}},{"id":"mp3.36","t":"8","c":0,"q":"To avoid unwanted tripping of an RCD, what shall the accumulation of currents downstream from the RCD not exceed?","o":["10%","20%","30%","40%"],"a":2,"x":"","r":"","n":"","k":1000155.0,"m":"","f":"Index: 'residual current devices'. Go to Section 531 (531.3.2): accumulated protective conductor currents not more than 30% of IΔn.","w":{"0":"10% isn't the figure in 531.3.2; it's 30%.","1":"20% isn't the figure in 531.3.2; it's 30%.","3":"40% is too high; 531.3.2 limits it to 30%."}},{"id":"mp3.37","t":"8","c":0,"q":"Which of the following types of SPD are most suitable for installation at the origin of the supply to protect against overvoltage?","o":["Type 0","Type 3","Type 1","Type 4"],"a":2,"x":"","r":"","n":"","k":1000156.0,"m":"","f":"Index: 'surge protective devices'. Go to Section 534 (534.4): Type 1 or Type 2 at or near the origin.","w":{"0":"There's no Type 0 SPD.","1":"Type 3 is installed close to the protected equipment, not at the origin.","3":"There's no Type 4 SPD."}},{"id":"mp3.38","t":"9","c":0,"q":"Where practical, the main protective equipotential bonding to gas services in a building should be made within","o":["3m of the meter on the supply side","3m of the meter  on the consumer’s side","600mm of the meter on the supply side","600mm of the meter on the consumer’s side"],"a":3,"x":"","r":"","n":"","k":1000157.0,"m":"","f":"Index: 'bonding, main protective'. Go to Section 544 (544.1.2): within 600 mm of the meter outlet union, consumer's side.","w":{"0":"Never bond on the supply side, and 3 m isn't in the regulation.","1":"3 m isn't in the regulation; it's within 600 mm.","2":"Right distance, wrong side; bonding is made on the consumer's side."}},{"id":"mp3.39","t":"9","c":1,"q":"On a TNCS earthing arrangement, supplied by 75mm cable, which of the following is the minimum CSA of the main protective bonding conductor?","o":["10mm","16mm","25mm","35mm"],"a":2,"x":"","r":"","n":"","k":1000158.0,"m":"","f":"Index: 'bonding conductors, main'. Go to Section 544 (544.1.1) and Table 54.8 (PME): read across from the PEN conductor size.","w":{"0":"10 mm² is for supply conductors of 35 mm² or less.","1":"16 mm² is for supply conductors over 35 mm² up to 50 mm².","3":"35 mm² is for larger supply conductors (over 95 mm²)."}},{"id":"mp3.40","t":"6","c":0,"q":"A firefighter’s switch in an indoor installation should comply with which of the following requirements?","o":["Be located not more than 3.75m from the ground","Be located in a locked location to prevent nuisance operation","Be electrically linked","Be located in the main entrance to the building"],"a":3,"x":"","r":"","n":"","k":1000159.0,"m":"","f":"Index: 'firefighter's switches'. Go to Section 537, Regulation 537.4.2.2: for indoor installations, in the main entrance or a position agreed with the fire authority.","w":{"0":"The limit is 2.75 m from the ground, not 3.75 m.","1":"It must be accessible to firefighters, not locked away.","2":"Being linked isn't the 537.4.2.2 requirement listed."}},{"id":"mp3.41","t":"10","c":0,"q":"The fixing of a luminaire shall be capable of carrying a mass of not less than?","o":["4 Kg","5 Kg","6 Kg","7 Kg"],"a":1,"x":"","r":"","n":"","k":1000160.0,"m":"","f":"Index: 'luminaires, fixing'. Go to Section 559 (559.5.2): fixing must carry not less than 5 kg.","w":{"0":"4 kg is below the 5 kg minimum.","2":"6 kg isn't the figure; 559 says not less than 5 kg.","3":"7 kg isn't the figure; 559 says not less than 5 kg."}},{"id":"mp3.42","t":"11","c":0,"q":"The document which must be issued following the periodic inspection and testing of an electrical installation is","o":["A periodic inspection report","A minor electrical installation works","An electrical installation condition report","An electrical installation certificate"],"a":2,"x":"","r":"","n":"","k":1000161.0,"m":"","f":"Index: 'periodic inspection'. Go to Chapter 65 (653.1 onwards) and Appendix 6: an Electrical Installation Condition Report.","w":{"0":"'Periodic Inspection Report' is the old name; it's now the EICR.","1":"A Minor Works Certificate is for small additions, not periodic inspection.","3":"An EIC is for new work, not periodic inspection."}},{"id":"mp3.43","t":"11","c":1,"q":"The test voltage to be used for an insulation resistance test between the lines of a 400v three-phase circuit is","o":["250v DC","500v DC","750v DC","100v DC"],"a":1,"x":"","r":"","n":"","k":1000162.0,"m":"","f":"Index: 'insulation resistance'. Go to Table 64 (Chapter 64): circuits up to 500 V use a 500 V DC test voltage.","w":{"0":"250 V is for SELV and PELV circuits.","2":"750 V isn't a Table 64 test voltage; circuits above 500 V use 1000 V.","3":"100 V isn't a Table 64 test voltage."}},{"id":"mp3.44","t":"11","c":0,"q":"An electrical installation certificate should be signed by","o":["The person ordering the inspection","The designer of the installation only","Competent persons involved with the design, installation and inspection of the installation","An electrician"],"a":2,"x":"","r":"","n":"","k":1000163.0,"m":"","f":"Index: 'Electrical Installation Certificate'. Go to Section 644 (644.4): issued by the persons responsible for design, construction and verification.","w":{"0":"The client receives the certificate; they don't sign it.","1":"Not the designer only; construction and verification signatures are also needed.","3":"Being an electrician isn't enough; it's the competent persons responsible for each stage."}},{"id":"mp3.45","t":"11","c":0,"q":"Which one of the following tests does not need to be carried out in a specific order, in relation to other tests, during an initial verification?","o":["Insulation resistance","Continuity of conductors","Protection by SELV","Earth fault loop impedance"],"a":3,"x":"","r":"","n":"","k":1000164.0,"m":"","f":"Index: 'testing, sequence'. Go to Chapter 64, Regulation 643.1: only 643.2 to 643.5 must be in order; EFLI (643.7) is outside that sequence.","w":{"0":"Insulation resistance (643.3) is in the required sequence.","1":"Continuity (643.2) must come first in the sequence.","2":"SELV (643.4) is in the required sequence."}},{"id":"mp3.46","t":"12","c":0,"q":"Electrical equipment installed in zones 1 and 2 of a bathroom must have a minimum index of protection (IP rating) of","o":["IP4X","IPX4","IP2X","IPX2"],"a":1,"x":"","r":"","n":"","k":1000165.0,"m":"","f":"Index: 'bathrooms'. Go to Section 701, Regulation 701.512.2: at least IPX4 in zones 1 and 2.","w":{"0":"IP4X is protection against solid objects; bathrooms need water protection (X4).","2":"IP2X is finger protection, not water protection.","3":"IPX2 is too low for zones 1 and 2; it's the swimming pool indoor zone 2 figure."}},{"id":"mp3.47","t":"12","c":0,"q":"All equipment installed in hot air saunas should have a minimum degree of protection of","o":["IPX4","IP3X","IP4X","IP22"],"a":0,"x":"","r":"","n":"","k":1000166.0,"m":"","f":"Index: 'saunas'. Go to Section 703, Regulation 703.512.2: at least IPX4 (IPX5 if water jets used).","w":{"1":"IP3X is solid object protection, not the water protection required.","2":"IP4X is solid object protection; saunas need IPX4 (water).","3":"IP22 isn't high enough water protection for a sauna."}},{"id":"mp3.48","t":"12","c":0,"q":"Within zones 0 and 1 of a swimming pool, a protective provision against electric shock should be by means of","o":["Obstacles","SELV","Non-conducting location","Placing out of reach"],"a":1,"x":"","r":"","n":"","k":1000167.0,"m":"","f":"Index: 'swimming pools'. Go to Section 702 (702.410.3.4): in zones 0 and 1 the protective measure is SELV.","w":{"0":"Obstacles aren't allowed in swimming pool zones.","2":"Non-conducting location isn't permitted in pool zones.","3":"Placing out of reach isn't permitted in pool zones."}},{"id":"mp3.49","t":"12","c":0,"q":"Which one of the following is not classified as an outdoor lighting installation?","o":["An illuminated road sign","The illumination for an outdoor monument","The lighting arrangement for an advertising panel","A luminaire on an outside wall of a building, internally fed"],"a":3,"x":"","r":"","n":"","k":1000168.0,"m":"","f":"Index: 'outdoor lighting'. Go to Section 714, Regulation 714.1 (scope): exclusions include luminaires on an outside wall supplied from inside.","w":{"0":"Road signs are specifically included in Section 714.","1":"Illumination of monuments is specifically included.","2":"Advertising panels are specifically included."}},{"id":"mp3.50","t":"12","c":0,"q":"Which one of the following protective measures must be used for switches, not incorporated in equipment, in Zone 1 of a bathroom?","o":["Non-conducting location","PELV","SELV","Placing out of reach"],"a":2,"x":"","r":"","n":"","k":1000169.0,"m":"","f":"Index: 'bathrooms'. Go to Section 701 (701.512.3), zone 1: only switches of SELV circuits at 12 V AC or 30 V DC.","w":{"0":"Non-conducting location isn't allowed in bathrooms.","1":"PELV isn't accepted for switches in zone 1; it must be SELV.","3":"Placing out of reach isn't allowed in bathrooms."}},{"id":"mp3.51","t":"12","c":0,"q":"Outdoor lighting installations must be protected against the effects of external influences.  Which one of the following is the minimum degree of protection permitted?","o":["IP 22","IP 24","IP 33","IP 44"],"a":2,"x":"","r":"","n":"","k":1000170.0,"m":"","f":"Index: 'outdoor lighting'. Go to Section 714 (714.512.2): minimum IP33.","w":{"0":"IP22 is lower than the IP33 minimum.","1":"IP24 has lower solid-object protection than IP33.","3":"IP44 is higher than required; the minimum is IP33."}},{"id":"mp3.52","t":"12","c":0,"q":"In a bathroom the protective measure of obstacles is","o":["Allowed in all zones","Allowed in zones 1 and 2","Allowed in zone 2 only","Not allowed"],"a":3,"x":"","r":"","n":"","k":1000171.0,"m":"","f":"Index: 'bathrooms'. Go to Section 701, Regulation 701.410.3.5: obstacles and placing out of reach are not permitted.","w":{"0":"Obstacles are excluded from bathrooms altogether.","1":"There's no zone exception; obstacles aren't allowed anywhere in the room.","2":"There's no zone 2 exception; obstacles aren't allowed."}},{"id":"mp3.53","t":"14","c":0,"q":"An individual PEI is classified as?","o":["An installation serving one consumer unit","An installation serving domestic installations only","An installation capable of being switched from one location only","An installation having a management system for its own operation"],"a":3,"x":"","r":"","n":"","k":1000172.0,"m":"","f":"Index: 'prosumer' or 'PEI'. Go to Part 8 (Chapter 82, added by A2) and read the definitions of individual and collective PEI.","w":{"0":"The number of consumer units isn't what defines an individual PEI; it's about the installation having its own energy management system.","1":"An individual PEI isn't limited to domestic premises; the definition is based on how the installation is managed, not its use.","2":"Switching from one location isn't the defining feature; an individual PEI has a management system for its own operation."}},{"id":"mp3.54","t":"14","c":0,"q":"Which of the following could be connected to a PEI which produces and consumes electricity?","o":["Photovoltaic","Lighting","Electric Vehicle","General household electrical equipment"],"a":2,"x":"","r":"","n":"","k":1000173.0,"m":"","f":"Index: 'prosumer' or 'PEI'. Go to Part 8 (Chapter 82) and look at the types of equipment that can both import and export energy, such as storage and EVs.","w":{"0":"PV only generates electricity; the question wants equipment that can both produce and consume, like an EV with bidirectional charging.","1":"Lighting only consumes electricity; it can't feed energy back into the PEI.","3":"General household equipment only consumes; it can't act as a source as well as a load."}},{"id":"mp3.55","t":"14","c":0,"q":"When designing an installation in a PEI, in order to provide for combined short circuit protection, what should the designer not consider?","o":["Location of fault","Various possible combinations of power supplies connected to the PEI","Various operating modes","Special locations"],"a":3,"x":"","r":"","n":"","k":1000174.0,"m":"","f":"Index: 'prosumer' or 'combined short-circuit protection'. Go to Chapter 82 and read the list of things the designer must consider for short-circuit protection in a PEI.","w":{"0":"Fault location is one of the listed considerations, because fault current depends on where the fault occurs relative to the sources.","1":"The combinations of supplies connected must be considered, since each source contributes to the fault current.","2":"Operating modes (e.g. grid-connected or island) must be considered, as they change the available fault current."}},{"id":"mp3.56","t":"13","c":1,"q":"Which one of the following is the correct grouping factor for six circuits bunched on a surface?","o":["0.45","0.55","0.57","0.69"],"a":2,"x":"","r":"","n":"","k":1000175.0,"m":"","f":"Index: 'grouping'. Go to Appendix 4, Table 4C1, row 1 (bunched in air, on a surface, embedded or enclosed), and read across to the 6 column.","w":{"0":"0.45 is the row 1 figure for 12 circuits, not 6.","1":"0.55 doesn't appear in row 1 of Table 4C1; 6 circuits bunched is 0.57 (7 circuits is 0.54).","3":"0.69 isn't the row 1 bunched figure; check you're on row 1 of Table 4C1, not a single-layer row."}},{"id":"mp3.57","t":"3","c":0,"q":"An external influence has a general category code of B.  The code indicates","o":["Temperature","Capability","Utilization","Environment"],"a":2,"x":"","r":"","n":"","k":1000176.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5: the first letter of the code is the category (A environment, B utilisation, C construction of buildings).","w":{"0":"Temperature is AA, a sub-class under category A (environment), not the general category B.","1":"Capability (BA) is a sub-class under B, not the name of the general category itself.","3":"Environment is category A; B is utilisation."}},{"id":"mp3.58","t":"13","c":1,"q":"A circuit is protected by a 20A BS 3036 semi-enclosed fuse.  What is the Ia required to operate the device in 0.2s?","o":["260A","180A","130A","92A"],"a":1,"x":"Read Appendix 3 (BS 3036 time/current curve): go across from 0.2 s to the 20 A curve, then down: about 180 A.","r":"","n":"","k":1000177.0,"m":"","f":"Index: 'time/current characteristics'. Go to Appendix 3, BS 3036 curves: go across from 0.2 s to the 20 A curve, then down to read the current.","w":{"0":"260 A is too high for a 20 A BS 3036 at 0.2 s; check you're on the 20 A curve and not a larger rating.","2":"130 A is roughly the 0.4 s reading for 20 A; at 0.2 s the device needs more current, about 180 A.","3":"92 A corresponds to a longer disconnection time; a faster 0.2 s operation needs a much higher current."}},{"id":"mp3.59","t":"3","c":0,"q":"Equipment to be installed must be capable of being immersed in water and withstanding a temperature range of -5°C to +40°C.  The categories of classification of external influences for this equipment are","o":["AA6 and AD5","AA4 and AF3","AK2 and AD7","AD7 and AA4"],"a":3,"x":"","r":"","n":"","k":1000178.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5: AA is ambient temperature (AA4 = -5 °C to +40 °C) and AD is water (AD7 = immersion).","w":{"0":"AA6 is +5 °C to +60 °C and AD5 is water jets, not immersion.","1":"AA4 is right, but AF3 is corrosive substances, not water immersion (AD7).","2":"AD7 is right, but AK2 is a flora/mould hazard, not ambient temperature (AA4)."}},{"id":"mp3.60","t":"13","c":0,"q":"Details on current-carrying capacity and voltage drop for busbar trunking and powertrack systems can be found in","o":["Appendix 8","Appendix 12","Appendix 14","Appendix 15"],"a":0,"x":"","r":"","n":"","k":1000179.0,"m":"","f":"Look in the Contents list of Appendices: Appendix 8 covers current-carrying capacity and voltage drop for busbar trunking and powertrack systems.","w":{"1":"Appendix 12 isn't the busbar trunking appendix; check the appendix titles in the Contents.","2":"Appendix 14 covers determination of prospective fault current.","3":"Appendix 15 covers ring and radial final circuit arrangements."}},{"id":"mp4.1","t":"1","c":0,"q":"Particular requirements are included in BS 7671 for electrical installations of:","o":["lift installation covered by BS 5655","equipment of fixed offshore installations","distributors equipment","locations containing bath or shower"],"a":3,"x":"","r":"110.1.1 P20","n":"","k":1000180.0,"m":"","f":"Go to Part 1, Regulation 110.1.1 (scope), and check the list of special installations and locations it says are covered; Part 7 contents also lists them.","w":{"0":"Lift installations covered by BS 5655 are listed under exclusions in 110.2, not included.","1":"Equipment of fixed offshore installations is excluded from the scope by 110.2.","2":"Distributor's equipment is excluded; BS 7671 covers the consumer's installation, not the network."}},{"id":"mp4.2","t":"1","c":0,"q":"Which one of the following types of installation is NOT included in the scope recognised by BS 7671","o":["swimming pools","petrol filling stations","agricultural","saunas"],"a":1,"x":"","r":"110.1.1 P20","n":"","k":1000181.0,"m":"","f":"Look at the Contents for Part 7 (special installations or locations); 110.1.1 also lists what's covered. Check which option has no Section 7xx.","w":{"0":"Swimming pools are covered by Section 702.","2":"Agricultural and horticultural premises are covered by Section 705.","3":"Saunas are covered by Section 703."}},{"id":"mp4.3","t":"1","c":0,"q":"Which one of the following sets of regulations is non-statutory?","o":["Electricity Safety, Quality and Continuity Regulations","Electricity at Work Regulations","Building Standards Regulations","BS 7671 Requirements for Electrical Installations"],"a":3,"x":"","r":"114.1 P21","n":"","k":1000182.0,"m":"","f":"Go to Part 1, Regulation 114.1 (relationship with statutory regulations), and Appendix 2 for the statutory regulations listed.","w":{"0":"ESQCR is a statutory instrument, so it's law, not non-statutory.","1":"The Electricity at Work Regulations are statutory; BS 7671 can be used to help comply with them.","2":"Building Standards Regulations (Scotland) are statutory, not non-statutory."}},{"id":"mp4.4","t":"1","c":0,"q":"Cross sectional of conductors for a circuit need not be determined by?","o":["The circuit use","Admissible volt drop","Installation method","Thermal insulation"],"a":0,"x":"","r":"132.6 P 25","n":"","k":1000183.0,"m":"","f":"Go to Chapter 13, Regulation 132.6 (cross-sectional area of conductors), and check the listed factors; the circuit's use isn't one of them.","w":{"1":"Admissible voltage drop is one of the listed factors in 132.6.","2":"Installation method affects heat dissipation and is a factor in 132.6.","3":"Thermal insulation affects current-carrying capacity, so it must be considered."}},{"id":"mp4.5","t":"2","c":0,"q":"The type of system known as PME is also referred to as:","o":["TN-S","TN-C","TN-C-S","IT"],"a":2,"x":"","r":"Definitions P 41","n":"","k":1000184.0,"m":"","f":"Index: 'PME' or 'protective multiple earthing'. Check the definition in Part 2, then the TN-C-S system definition.","w":{"0":"TN-S has separate neutral and earth conductors throughout, so it isn't PME.","1":"TN-C combines neutral and earth throughout the installation too, which isn't PME.","3":"An IT system has no direct connection to earth at the source, so it isn't PME."}},{"id":"mp4.6","t":"2","c":0,"q":"A system in which the voltage does not exceed 110V and between line to earth does not exceed 63.5V is known as?","o":["Extra low voltage","Reduced low voltage","Low voltage","High voltage"],"a":1,"x":"","r":"Definitions P41","n":"","k":1000185.0,"m":"","f":"Index: 'reduced low voltage'. Read the definition in Part 2 (Definitions), which gives 110 V between lines and 63.5 V to earth for three-phase.","w":{"0":"Extra-low voltage is not exceeding 50 V a.c., which is below this system.","2":"Low voltage covers the band from over 50 V up to 1000 V a.c.; this specific 110 V/63.5 V system has its own name.","3":"High voltage is above 1000 V a.c., nowhere near 110 V."}},{"id":"mp4.7","t":"3","c":0,"q":"An external influence categorised as AG1 applies to equipment installed in a:","o":["quarry","factory","house","workshop"],"a":2,"x":"","r":"Appendix 5 P499","n":"","k":1000186.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5, code AG (impact); AG1 is low severity, e.g. household and similar.","w":{"0":"A quarry would be a high-severity impact location (AG3), not AG1.","1":"A factory is typically medium severity (AG2) for impact, not AG1.","3":"A workshop is typically medium severity (AG2), not the low severity of AG1."}},{"id":"mp4.8","t":"3","c":0,"q":"A building constructed mainly of wood would have an external influence category of:","o":["CA1","CA2","CA3","CA4"],"a":1,"x":"","r":"Appendix 5 P507","n":"","k":1000187.0,"m":"","f":"Index: 'external influences'. Go to Appendix 5, category C (construction of buildings), code CA: CA2 is combustible materials such as wood.","w":{"0":"CA1 is non-combustible construction, not wood.","2":"CA3 isn't the code for combustible materials; CA only has CA1 and CA2.","3":"CA4 doesn't exist; CA has only CA1 (non-combustible) and CA2 (combustible)."}},{"id":"mp4.9","t":"6","c":0,"q":"A fire fighter’s switch should be configured in the following way?","o":["The handle off position is down","The handle off position is up","The handle placed out of reach at a height of 3m","The handle placed out of reach at a height of 3.75m"],"a":1,"x":"","r":"537.4.4  P188","n":"","k":1000188.0,"m":"","f":"Index: 'firefighter's switch'. Go to Regulation 537.4.4, which ends by stating the handle off position, and 537.4.2.2 for mounting height.","w":{"0":"It's the other way round: 537.4.4 says the handle off position shall be up.","2":"It must be reachable by firefighters, not placed out of reach; the limit is not more than 2.75 m.","3":"3.75 m is above the 2.75 m maximum, and the switch must be reachable."}},{"id":"mp4.10","t":"9","c":0,"q":"The protective conductor used within a final circuit has high protective conductor currents in excess of 10 mA when supplying more than one item of electrical equipment. The minimal cross-sectional area may be 4 mm2, provided that:","o":["additional protection from the use of a residual current device is present","the protective conductor has additional mechanical protection","individual items of equipment are supplied through an isolating transformer","the protective conductor is in the form of a complete ring"],"a":1,"x":"","r":"543.7.1.203 P204","n":"","k":1000189.0,"m":"","f":"Index: 'protective conductor current'. Go to Regulation 543.7.1.203 for final circuits with high protective conductor current, and read the 4 mm² option.","w":{"0":"An RCD isn't the condition given for a 4 mm² protective conductor; it's mechanical protection.","2":"An isolating transformer is a different method, not the condition for using 4 mm².","3":"A ring protective conductor is an alternative arrangement; the 4 mm² single conductor needs mechanical protection."}},{"id":"mp4.11","t":"3","c":0,"q":"Installations should be arranged so as to avoid hazards in the event of a fault, and to facilitate safe operation, inspection, testing and maintenance. One method of complying with this is to:","o":["connect all circuits on the radial principle","connect all circuits on the ring principle","divide the installation into separate circuits","divide the installation into bands of circuits"],"a":2,"x":"","r":"314.1 (ii) P56","n":"","k":1000190.0,"m":"","f":"Go to Chapter 31, Regulation 314.1 (division of installation), which lists the reasons for dividing an installation into circuits.","w":{"0":"Radial wiring is a circuit arrangement, not the general requirement; 314.1 calls for dividing into separate circuits.","1":"Ring wiring is a circuit arrangement, not what 314.1 requires.","3":"'Bands of circuits' isn't a term used in 314.1; it requires separate circuits."}},{"id":"mp4.12","t":"13","c":1,"q":"A domestic 30A radial final circuit is used to supply BS 1363 socket outlets. If the floor area to be served is 55m2, the rating of the protective device and the live conductor’s csa must not be less than:","o":["20A and 4 mm2","30A and 2.5 mm2","20A and 2.5 mm2","30A and 4 mm2"],"a":3,"x":"","r":"Appendix 15 P556","n":"","k":1000191.0,"m":"","f":"Index: 'radial final circuits'. Go to Appendix 15, Fig 15B, and compare the floor area served by a 20 A and a 30/32 A radial.","w":{"0":"A 20 A radial only covers up to 50 m², so 55 m² needs a 30/32 A device.","1":"2.5 mm² isn't suitable for a 30/32 A radial in Fig 15B; it needs 4 mm².","2":"20 A and 2.5 mm² is the 50 m² radial; 55 m² is beyond it."}},{"id":"mp4.13","t":"3","c":0,"q":"Which one of the following is not a characteristic of the supply?","o":["nominal voltage","frequency","earth loop impedance Ze","emergency switching"],"a":3,"x":"","r":"313.1 P55","n":"","k":1000192.0,"m":"","f":"Go to Chapter 31, Regulation 313.1 (supplies), which lists the characteristics of the supply to be determined.","w":{"0":"Nominal voltage is listed in 313.1 as a characteristic of the supply.","1":"Frequency is listed in 313.1 as a characteristic of the supply.","2":"Ze is listed in 313.1 as a characteristic of the supply."}},{"id":"mp4.14","t":"4","c":0,"q":"Which of the following are measures against electric shock for a domestic lighting circuit?","o":["Fault protection provided by an RCD of 30mA","Additional protection provided by an RCD of 100mA","Additional protection provided by a 30mA RCD","Fault protection provided by a RCD of 100mA"],"a":2,"x":"","r":"411.3.4 P 65","n":"","k":1000193.0,"m":"","f":"Index: 'additional protection'. Go to Regulation 411.3.4 (domestic luminaires) and 415.1.1, which requires an RCD of not more than 30 mA.","w":{"0":"A 30 mA RCD here is classed as additional protection, not fault protection.","1":"Additional protection needs an RCD of 30 mA or less; 100 mA doesn't qualify.","3":"The RCD for domestic lighting is additional protection at 30 mA, not fault protection at 100 mA."}},{"id":"mp4.15","t":"2","c":0,"q":"Basic protection protects persons and/or livestock from contact with:","o":["Class II enclosures","extra-low voltage terminals","exposed conductive parts made live by a fault","live parts"],"a":3,"x":"","r":"Definitions P28","n":"","k":1000194.0,"m":"","f":"Index: 'basic protection'. Read the definition in Part 2: protection against electric shock under fault-free conditions, i.e. contact with live parts.","w":{"0":"Class II enclosures aren't live; basic protection is about contact with live parts.","1":"Contact with ELV terminals isn't what defines basic protection.","2":"Exposed-conductive-parts made live by a fault is fault protection, not basic protection."}},{"id":"mp4.16","t":"2","c":0,"q":"The requirements regarding basic protection have not been applied if livestock comes into contact with:","o":["exposed conductive parts made live by a fault","an exposed terminal within a damaged enclosure","a protective conductor carrying fault current","extraneous conductive parts made live by an earth fault"],"a":1,"x":"","r":"Definitions P29","n":"","k":1000195.0,"m":"","f":"Index: 'basic protection'. Read the definitions of basic protection (live parts) and fault protection (exposed-conductive-parts) in Part 2.","w":{"0":"Contact with exposed-conductive-parts live due to a fault is a fault protection matter, not basic protection.","2":"A protective conductor carrying fault current is a fault condition, so it's about fault protection.","3":"Extraneous-conductive-parts made live by an earth fault relate to fault protection and bonding."}},{"id":"mp4.17","t":"4","c":0,"q":"One method of providing basic protection is by:","o":["earth free local equipotential bonding","electrical separation","automatic disconnection of supply","barriers or enclosures"],"a":3,"x":"","r":"416.2 P80","n":"","k":1000196.0,"m":"","f":"Index: 'basic protection'. Go to Section 416 (provisions for basic protection): 416.1 insulation and 416.2 barriers or enclosures.","w":{"0":"Earth-free local equipotential bonding is a fault protection measure (418.2).","1":"Electrical separation is a full protective measure (Section 413), not a basic protection provision.","2":"ADS provides fault protection; basic protection within ADS comes from insulation or barriers/enclosures."}},{"id":"mp4.18","t":"9","c":0,"q":"A piece of electrical equipment having a protective conductor current of 15 mA is to be connected to the supply by means of a 16A plug and socket outlet complying with BS EN 60309-2. The cross sectional area of the protective conductor of the associated flexible cable shall not be less than:","o":["1.00mm2","1.5mm2","2.5mm2","4mm2"],"a":2,"x":"","r":"543.7.1.202 (ii) (a) P204","n":"","k":1000197.0,"m":"","f":"Index: 'protective conductor current'. Go to Regulation 543.7.1.202(ii)(a): BS EN 60309-2 plug, 16 A gives the minimum cpc size.","w":{"0":"1.0 mm² is too small; 543.7.1.202 requires at least 2.5 mm² for a 16 A plug.","1":"1.5 mm² is too small; the minimum for a 16 A plug is 2.5 mm².","3":"4 mm² is for plugs rated above 16 A; a 16 A plug needs 2.5 mm²."}},{"id":"mp4.19","t":"5","c":1,"q":"The temperature limit for non-metallic equipment which is intended to be touched but not hand-held is:","o":["55oC","65oC","70oC","80oC"],"a":3,"x":"","r":"Table 42.1 P91","n":"","k":1000198.0,"m":"","f":"Index: 'temperature limits'. Go to Table 42.1 (Chapter 42), row 'intended to be touched but not hand-held', non-metallic column.","w":{"0":"55 °C is the metallic hand-held limit in Table 42.1.","1":"65 °C is the non-metallic hand-held limit, not touched but not hand-held.","2":"70 °C is the metallic figure for touched but not hand-held; non-metallic is 80 °C."}},{"id":"mp4.20","t":"5","c":0,"q":"The maximum prospective fault current at the origin of an electrical installation must be taken into account when:","o":["estimating the external earth fault loop impedance","applying diversity to the installation","assessing the earthing arrangement","selecting the rated short circuit breaking capacity of a protective device"],"a":3,"x":"","r":"434.5.1 P98","n":"","k":1000199.0,"m":"","f":"Index: 'breaking capacity' or 'prospective fault current'. Go to Regulation 434.5.1 in Chapter 43.","w":{"0":"Ze is measured or obtained from the DNO; it isn't what PFC is used for here.","1":"Diversity relates to load, not fault current.","2":"The earthing arrangement is a supply characteristic, not determined by PFC."}},{"id":"mp4.21","t":"5","c":0,"q":"Omission of devices for protection against overload is NOT permitted for:","o":["secondary circuits of current transformers","circuits which supply fire extinguishing devices","exciter circuits of rotating machines","circuits which supply emergency lighting"],"a":3,"x":"","r":"433.3.3 P96","n":"","k":1000200.0,"m":"","f":"Go to Regulation 433.3.3 (omission of overload protection for safety reasons) and check its list of examples.","w":{"0":"Current transformer secondary circuits are listed in 433.3.3 as a case where overload protection may be omitted.","1":"Fire extinguishing device circuits are listed in 433.3.3 as a permitted omission.","2":"Exciter circuits of rotating machines are listed in 433.3.3 as a permitted omission."}},{"id":"mp4.22","t":"5","c":0,"q":"The nominal rating of an overcurrent protective device should be:","o":["not less than the design current","greater than the current carrying capacity of the conductors","1.45 times the load current","equal to the prospective short-circuit current"],"a":0,"x":"","r":"433.1.1 P95","n":"","k":1000201.0,"m":"","f":"Go to Regulation 433.1.1: Ib ≤ In ≤ Iz, so the device rating must be at least the design current.","w":{"1":"The rating must not exceed the cable's current-carrying capacity (In ≤ Iz).","2":"1.45 is the factor for I2 (the device operating current) against Iz, not the nominal rating.","3":"PFC relates to breaking capacity, not the nominal rating."}},{"id":"mp4.23","t":"6","c":0,"q":"A firefighter’s switch should be installed at not more than:","o":["2.75m from the ground and the ‘off’ position at the top","2m from the ground and the ‘off’ position at the bottom and coloured red","2.75m from the ground and the ‘off’ position at the bottom","2.75m from the ground and the ‘on’ position at the top and coloured red"],"a":0,"x":"","r":"537.4.2.2(iii) + 537.4.4 P 188","n":"","k":1000202.0,"m":"","f":"Index: 'firefighter's switch'. Read 537.4.2.2(iii) for the 2.75 m height, then 537.4.4 for the handle off position.","w":{"1":"The limit is 2.75 m, not 2 m, and the off position is up, not down.","2":"2.75 m is right but the off position is at the top (handle up).","3":"The top position is off, not on, as stated in 537.4.4."}},{"id":"mp4.24","t":"5","c":1,"q":"Where the nominal voltage of an installation is 230V, the required minimum impulse withstand voltage for Category II equipment for overvoltage protection is:","o":["1.5kV","2.5kV","4.0kV","6.0kV"],"a":1,"x":"","r":"Table 443.2 P108","n":"","k":1000203.0,"m":"","f":"Index: 'impulse withstand voltage'. Go to Table 443.2 (Section 443), 230/400 V row, Category II column.","w":{"0":"1.5 kV is Category I equipment.","2":"4 kV is Category III equipment.","3":"6 kV is Category IV equipment."}},{"id":"mp4.25","t":"5","c":0,"q":"In a location where a risk of danger from fire exists due to manufacture or storage of combustible materials, enclosures of heaters shall not attain a surface temperature under normal working conditions exceeding:","o":["70oC","90oC","100oC","115oC"],"a":1,"x":"","r":"422.3.2 P88","n":"","k":1000204.0,"m":"","f":"Index: 'fire risk' or 'locations with risks of fire'. Go to Regulation 422.3.2, which gives limits for enclosures under normal and fault conditions.","w":{"0":"70 °C isn't the 422.3.2 limit; under normal conditions it's 90 °C.","2":"100 °C isn't a figure in 422.3.2; it's 90 °C normal and 115 °C fault.","3":"115 °C is the fault condition limit; normal conditions is 90 °C."}},{"id":"mp4.26","t":"5","c":0,"q":"AFDD’s shall be installed for which type of circuit?","o":["All domestic circuits","Domestic lighting circuits","Socket circuits up to 32A A.C.","Cooker circuits"],"a":2,"x":"","r":"421.1.7 P 86","n":"Since A2, AFDDs are required on socket-outlet final circuits up to 32 A in HRRBs, HMOs, student accommodation and care homes, and recommended elsewhere. C is the only option that fits.","k":1000205.0,"m":"","f":"Index: 'arc fault detection devices'. Go to Regulation 421.1.7 (Chapter 42), as amended by A2, which covers socket-outlet circuits up to 32 A.","w":{"0":"AFDDs aren't required on all domestic circuits; 421.1.7 focuses on socket-outlet final circuits up to 32 A.","1":"Lighting circuits aren't the circuits targeted by 421.1.7.","3":"Cooker circuits aren't specified in 421.1.7; it covers socket-outlet circuits up to 32 A."}},{"id":"mp4.27","t":"13","c":0,"q":"Which one of the following external influences requires an increase in the current ratings of cables above those normally required?","o":["possible vertically falling drops of water","low ambient temperature","severe mechanical vibration","high ambient temperature"],"a":3,"x":"","r":"Appendix 4 2.1 P421 + 522.1.1 P141","n":"","k":1000206.0,"m":"","f":"Index: 'ambient temperature'. Go to Appendix 4, Table 4B1 (rating factors for ambient temperature) and Regulation 522.1.1.","w":{"0":"Dripping water affects IP rating (AD2), not cable current ratings.","1":"Low ambient temperature gives a factor above 1, so you'd need less, not more.","2":"Vibration affects how cables are supported, not their current rating."}},{"id":"mp4.28","t":"7","c":0,"q":"To prevent circulating eddy currents (an electromagnetic effect) in steel conduit, trunking or cable armouring:","o":["only d.c. must be used","line and neutral conductors are to be kept separate","the enclosures should be solidly earthed","all live conductors of a circuit must be contained in the same enclosure"],"a":3,"x":"","r":"521.5.1 P139","n":"","k":1000207.0,"m":"","f":"Index: 'electromagnetic effects'. Go to Regulation 521.5.1, which requires all line and neutral conductors of a circuit in the same ferromagnetic enclosure.","w":{"0":"Using only d.c. isn't the requirement; the regulation deals with a.c. circuits by keeping conductors together.","1":"Separating line and neutral is what causes the eddy currents in the first place.","2":"Earthing the enclosure doesn't stop eddy currents; they come from unbalanced magnetic fields."}},{"id":"mp4.29","t":"12","c":0,"q":"It is required that all circuits not supplying socket outlets in a barn on an agricultural installation be protected by an RCD. The maximum rating (lΔn) for a circuit protected by a 40A BS 88 protective device should not exceed:","o":["30 mA","100 mA","300 mA","500 mA"],"a":2,"x":"","r":"705.411.1 (iii) P260","n":"","k":1000208.0,"m":"","f":"Go to Section 705, Regulation 705.411.1(iii): all other circuits need an RCD not exceeding 300 mA.","w":{"0":"30 mA is for socket-outlet circuits up to 32 A, not other circuits.","1":"100 mA is for socket-outlet circuits over 32 A.","3":"500 mA exceeds the 300 mA maximum in 705.411.1(iii)."}},{"id":"mp4.30","t":"12","c":0,"q":"In agricultural premises in locations where tractors are used, which one of the following methods of installation shall NOT be applied:","o":["cables shall be buried at a depth of at least 0.6m with additional mechanical protection","cables in arable ground shall be buried at a depth of at least 1m","self supporting suspension cables at a height of at least 6m","self supporting suspension cables at a height in excess of that accessible by rodents"],"a":3,"x":"","r":"705.522 P262","n":"","k":1000209.0,"m":"","f":"Go to Section 705, Regulation 705.522, which lists installation methods for areas where vehicles and machines operate.","w":{"0":"0.6 m with mechanical protection is listed in 705.522(i), so it is permitted.","1":"1 m in arable ground is listed in 705.522(ii), so it is permitted.","2":"Suspension cables at 6 m is listed in 705.522(iii), so it is permitted."}},{"id":"mp4.31","t":"7","c":0,"q":"A permanent warning notice must be fixed at or near the point of connection of every earthing conductor to an earth electrode. This notice must bear the words:","o":["Earth Bonding Connection, Do Not Remove","Safety Bonding Connection, Do Not Remove","Earth Electrical Connection, Do Not Remove","Safety Electrical Connection, Do Not Remove"],"a":3,"x":"","r":"514.13.1 P133","n":"","k":1000210.0,"m":"","f":"Index: 'warning notices'. Go to Regulation 514.13.1, which gives the exact wording for the label at earth electrode connections.","w":{"0":"Not the wording in 514.13.1; it's 'Safety Electrical Connection - Do Not Remove'.","1":"Close, but the wording is 'Safety Electrical Connection', not 'Safety Bonding Connection'.","2":"The label starts 'Safety', not 'Earth'."}},{"id":"mp4.32","t":"5","c":0
