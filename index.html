n't the limit in 411.5.3."}},{"id":"fm5.38","t":"4","c":1,"q":"A circuit is connected to a TN system, the maximum permissible earth fault loop impedance (Zs) for a 32 A socket outlet circuit protected by a BS 88 fuse is:","o":["0.99 Ω","1.09 Ω","1.44 Ω","0.92 Ω"],"a":0,"x":"","r":"Table 41.2 P61","n":"","k":1000329.0,"m":"","f":"Index: 'earth fault loop impedance'. Go to Table 41.2 (Chapter 41), part (a) BS 88-2 fuses, 32 A column.","w":{"1":"1.09 isn't the BS 88-2 32 A figure; check part (a) of Table 41.2.","2":"1.44 isn't the BS 88-2 32 A figure in Table 41.2.","3":"0.92 is close to the BS 88-3 figure (0.91), not BS 88-2."}},{"id":"fm5.39","t":"5","c":1,"q":"Regulation 434.5.2 gives the maximum time which may be permitted for a fault to be maintained without damaging the conductors. Assume a prospective fault current of 1000 A with a copper 25 mm2 cable with 70o C thermoplastic insulation. The clearance time (t) is:","o":["7.2 s","8.2 s","5 s","0.4 s"],"a":1,"x":"Rearrange the adiabatic equation for time: t = k²S² ÷ I²<br>k = 115, S = 25: 115 × 25 = 2875<br>2875 ÷ 1000 = 2.875<br>2.875² = 8.27 s","r":"434.5.2 P92","n":"","k":1000330.0,"m":"","f":"Index: 'adiabatic equation'. Go to Regulation 434.5.2; take k = 115 from Table 43.1 and use t = k²S² ÷ I².","w":{"0":"7.2 s doesn't come from the calculation; check your arithmetic.","2":"5 s is a disconnection time for distribution circuits, not the calculated limit.","3":"0.4 s is a final circuit disconnection time, not the calculated limit."}},{"id":"fm5.40","t":"9","c":0,"q":"The purpose of having equipotential bonding conductors connected to the other services as close as practicable to their entry into the premises is to:","o":["ensure that earth leakage is minimised","ensure that the maximum current will flow to earth under fault conditions","reduce the chance of shock risk within the premises","reduce the chance of electrolytic corrosion between metal sheath of cable and metal pipes"],"a":2,"x":"","r":"544.1.2 P203 Definitions P29","n":"","k":1000331.0,"m":"","f":"Index: 'main protective bonding'. Go to Regulation 544.1.2 (Chapter 54) and the definition of equipotential bonding.","w":{"0":"Bonding doesn't minimise earth leakage.","1":"Fault current flows through the cpc; bonding reduces touch voltages.","3":"Corrosion prevention isn't the purpose of bonding."}},{"id":"fm5.41","t":"9","c":0,"q":"Where practicable main equipotential bonding to the gas services in a building should be made:","o":["within 6 m of the meter on the supply side","outside the building","within 600 mm of the meter on the supply side","within 600 mm of the meter on the consumer's side"],"a":3,"x":"","r":"544.1.2 P203","n":"","k":1000332.0,"m":"","f":"Index: 'main protective bonding'. Go to Regulation 544.1.2: within 600 mm of the meter outlet union, consumer's side.","w":{"0":"6 m is wrong; the figure is 600 mm.","1":"Bonding is made inside where the service enters, not outside.","2":"Bonding goes on the consumer's side, never the supply side."}},{"id":"fm5.42","t":"10","c":0,"q":"Heating cables laid directly in soil, roads or building structures must be installed so that they are:","o":["at least 1 m below the surface","fed only from an extra-low voltage supply","completely embedded in the substance which they are intended to heat","operated at 5° C"],"a":2,"x":"","r":"554.4.3 (i) P213","n":"","k":1000333.0,"m":"","f":"Index: 'heating cables'. Go to Chapter 55, Regulation 554.4.3.","w":{"0":"554.4.3 sets no 1 m depth requirement.","1":"554.4.3 doesn't restrict heating cables to ELV.","3":"5 °C isn't a requirement of 554.4.3."}},{"id":"fm5.43","t":"13","c":1,"q":"The correct grouping factor for 6 circuits of three conductors per circuit, run in the same conduit is:","o":["0.45","0.54","0.57","0.6"],"a":2,"x":"","r":"Appendix 4 Table 4C1 P396","n":"","k":1000334.0,"m":"","f":"Index: 'grouping'. Go to Appendix 4, Table 4C1, 'enclosed (conduit)' row, 6 circuits column.","w":{"0":"0.45 is for 12 circuits.","1":"0.54 is for 7 circuits.","3":"0.6 is for 5 circuits."}},{"id":"fm5.44","t":"11","c":0,"q":"Which one of the following does NOT determine the frequency of periodic inspection and testing of an installation?","o":["formal qualifications of the inspection and test staff","the type of installation","frequency of maintenance","any external influence to which it is subjected"],"a":0,"x":"","r":"652.1 P237","n":"","k":1000335.0,"m":"","f":"Index: 'periodic inspection'. Go to Regulation 652.1 (Chapter 65), which lists what determines the frequency.","w":{"1":"The type of installation is listed in 652.1.","2":"Frequency and quality of maintenance is listed in 652.1.","3":"External influences are listed in 652.1."}},{"id":"fm5.45","t":"11","c":0,"q":"Every new installation on completion and before being energised must FIRST be:","o":["subjected to a detailed inspection","tested for continuity of ring circuit conductors","tested for continuity of protective conductors","given a test for insulation resistance"],"a":0,"x":"","r":"642.1 P230","n":"","k":1000336.0,"m":"","f":"Index: 'inspection'. Go to Regulation 642.1 (Chapter 64).","w":{"1":"Ring continuity is a test; inspection must come first.","2":"Protective conductor continuity is the first test, but inspection comes before any testing.","3":"Insulation resistance is a test; inspection comes first."}},{"id":"fm5.46","t":"11","c":0,"q":"Which one of the following items should be included for checking during the initial verification of an installation?","o":["site works orders and alterations","presence of all diagrams and instructions","electrical contractor’s site diary","all variations of contract"],"a":1,"x":"","r":"641.2 P230 then 514.9.1 P132","n":"","k":1000337.0,"m":"","f":"Index: 'diagrams'. Go to Regulation 641.2 and then 514.9.1.","w":{"0":"Site orders aren't an inspection item.","2":"The contractor's diary isn't an inspection item.","3":"Contract variations aren't technical items for verification."}},{"id":"fm5.47","t":"8","c":0,"q":"Which one of the following British Standards covers residual current devices?","o":["BS EN 61008","BS EN 60898","BS EN 60947","BS EN 60742"],"a":0,"x":"","r":"Appendix 1 P352","n":"","k":1000338.0,"m":"","f":"Index: 'residual current devices'. Go to Appendix 1 (British Standards) and find RCCBs.","w":{"1":"BS EN 60898 covers circuit-breakers (MCBs), not RCDs.","2":"BS EN 60947 covers industrial switchgear and controlgear.","3":"BS EN 60742 covers isolating transformers, not RCDs."}},{"id":"fm5.48","t":"11","c":0,"q":"For an insulation resistance test on a 230 V ac installation containing surge protected socket-outlets, the value of the test voltage may be:","o":["460 dc","500 dc","250 dc","1000 dc"],"a":2,"x":"","r":"643.3.2 P232","n":"","k":1000339.0,"m":"","f":"Index: 'insulation resistance, SPD'. Go to Regulation 643.3.2 (Chapter 64): test voltage may be reduced to 250 V d.c.","w":{"0":"460 V isn't a standard test voltage.","1":"500 V is the normal voltage, but with SPDs connected it may be reduced to 250 V.","3":"1000 V is for circuits above 500 V."}},{"id":"fm5.49","t":"11","c":1,"q":"The minimum value of insulation resistance when measured at the consumer unit of a 230 V domestic installation is:","o":["0.25 MΩ","0.5 MΩ","1.0 MΩ","5.0 MΩ"],"a":2,"x":"","r":"Table 64 P232","n":"","k":1000340.0,"m":"","f":"Index: 'insulation resistance'. Go to Table 64 (Chapter 64), 'up to and including 500 V' row.","w":{"0":"0.25 MΩ is below any Table 64 minimum.","1":"0.5 MΩ is the SELV/PELV minimum.","3":"5.0 MΩ would pass, but it's not the minimum."}},{"id":"fm5.50","t":"11","c":0,"q":"The results of periodic inspection and testing should be recorded on a report and signed by the:","o":["person ordering the inspection","design engineer","site engineer","person competent in such work"],"a":3,"x":"","r":"653.4 P238","n":"","k":1000341.0,"m":"","f":"Index: 'periodic inspection, report'. Go to Chapter 65, Regulation 653.","w":{"0":"The person ordering receives the report but doesn't sign it.","1":"The designer doesn't sign the periodic report.","2":"Signing is by competent persons, not a site engineer."}},{"id":"fm5.51","t":"12","c":0,"q":"Equipment fitted in Zone 1 of a bathroom must:","o":["be rated at a voltage not exceeding 12 V","have a minimum IP rating of IPX5","have a minimum IP rating of IPX4","be fed from a plug and socket outlet"],"a":2,"x":"","r":"701.512.2 (ii) P242","n":"","k":1000342.0,"m":"","f":"Index: 'bathrooms'. Go to Section 701, Regulation 701.512.2.","w":{"0":"12 V isn't a Zone 1 requirement in 701.512.2.","1":"IPX5 is needed only where water jets are used for cleaning.","3":"Plug and socket-outlets aren't required for Zone 1."}},{"id":"fm5.52","t":"12","c":0,"q":"In agricultural premises, an RCD may be used for protection against fire providing the operating current does not exceed:","o":["30 mA","100 mA","300 mA","500 mA"],"a":2,"x":"","r":"705.422.7 P259","n":"","k":1000343.0,"m":"","f":"Index: 'agricultural premises'. Go to Section 705, Regulation 705.422.7.","w":{"0":"30 mA is for additional protection; fire protection allows up to 300 mA.","1":"100 mA isn't the figure in 705.422.7.","3":"500 mA exceeds the 300 mA maximum."}},{"id":"fm5.53","t":"12","c":0,"q":"For all caravans using a mains electricity supply, an instruction notice must be fixed:","o":["at or near the main distribution point","under the cover of the caravan electricity inlet box","near the main electrical isolating switch inside the caravan","on the inside of the main door of the caravan"],"a":2,"x":"","r":"721.537.2.1.1.1 P309","n":"","k":1000344.0,"m":"","f":"Part 7, Section 721 (caravans and motor caravans). Index: 'caravans – instructions for electricity supply'; the regulation says where the notice is fixed and gives its wording.","w":{"0":"There's no 'main distribution point' requirement here; 721 fixes the notice near the main isolating switch inside the caravan.","1":"The inlet box is outside; the notice must be readable inside, near the main isolating switch.","3":"The door isn't specified; the regulation says permanently fixed near the main isolating switch inside the caravan."}},{"id":"fm5.54","t":"12","c":0,"q":"In a swimming pool which of the following protective measures is NOT applicable to equipment installed in Zone 2?","o":["protection by earth free local equipotential bonding","individual protection by electrical separation","SELV","protection by an RCD in accordance with Regulation 415.1.1"],"a":0,"x":"","r":"702.410.3.4.3 P246","n":"","k":1000345.0,"m":"","f":"Part 7, Section 702 (swimming pools). Go to 702.410.3.4.3 'Zone 2' and read the list of protective measures that may be used.","w":{"1":"Electrical separation is listed for Zone 2 in 702.410.3.4.3 (one item of equipment per source).","2":"SELV is allowed in Zone 2, with its source outside Zones 0–2 or RCD-protected in Zone 2.","3":"ADS with an RCD to 415.1.1 is one of the listed Zone 2 measures."}},{"id":"fm5.55","t":"12","c":0,"q":"Which one of the following may be installed inside Zone 1 of a hot air sauna?","o":["a ceiling mounted cord operated light switch","a shaver socket to BS 3535","a thermostat attached to the side of the sauna","any equipment to IP2X"],"a":2,"x":"","r":"703.512.2 (i) P255","n":"","k":1000346.0,"m":"","f":"Part 7, Section 703 (saunas). Go to 703.512.2, which lists what may be installed in each of zones 1, 2 and 3.","w":{"0":"Switches aren't allowed in Zone 1; only the sauna heater and equipment belonging to it.","1":"Socket-outlets and shaver units aren't allowed in Zone 1; only the heater and its own equipment.","3":"An IP rating doesn't make equipment acceptable; Zone 1 is limited to the heater and its own equipment, and needs at least IPX4."}},{"id":"fm5.56","t":"12","c":0,"q":"With regards to a transportable unit, a notice fixed in a prominent position on the unit need not display:","o":["the frequency of the supply","the type of supply","maximum power requirement","voltage rating of the unit"],"a":0,"x":"","r":"717.514 P300","n":"","k":1000347.0,"m":"","f":"Part 7, Section 717 (mobile or transportable units). Index: 'mobile or transportable units – notice'. Go to 717.514 and check the list of what the notice must state.","w":{"1":"The types of supply that may be connected is item (i) of the 717.514 list.","2":"The maximum power requirement is on the 717.514 list.","3":"The voltage rating of the unit is item (ii) of the 717.514 list."}},{"id":"fm7.1","t":"1","c":0,"q":"To which one of the following situations does BS 7671 apply?","o":["the manufacture of electrical equipment","the inspection and testing of the electrical installation on an oil rig","the design of an electrical installation for a caravan site","the public electricity supply system"],"a":2,"x":"","r":"110.1 (xiv) P15","n":"","k":1000348.0,"m":"","f":"Part 1, Chapter 11 (Scope). Read 110.1 for what is covered and 110.2 for exclusions.","w":{"0":"Manufacture of equipment isn't covered; BS 7671 deals with selecting and installing equipment, not making it.","1":"Offshore installations are excluded under 110.2.","3":"Public supply systems (distributors' networks) are excluded under 110.2."}},{"id":"fm7.2","t":"1","c":0,"q":"Which one of the following is listed under exclusions from the scope of BS 7671?","o":["saunas","swimming pools","marinas","lightning protection"],"a":3,"x":"","r":"110.2 (ix) P16","n":"","k":1000349.0,"m":"","f":"Part 1, Regulation 110.2 'Exclusions from scope'. Index: 'scope – exclusions'.","w":{"0":"Saunas are covered as a special location (Section 703).","1":"Swimming pools are covered as a special location (Section 702).","2":"Marinas are covered as a special location (Section 709)."}},{"id":"fm7.3","t":"1","c":0,"q":"Which one of the following sets of regulations is non-statutory?","o":["Electricity Safety, Quality and Continuity Regulations","Electricity at Work Regulations","Building Regulations","BS 7671"],"a":3,"x":"","r":"114.1 P16","n":"","k":1000350.0,"m":"","f":"Part 1, Regulation 114.1 (relationship with statutory regulations). Index: 'statutory regulations'.","w":{"0":"ESQCR are statutory regulations made under law.","1":"The Electricity at Work Regulations 1989 are statutory.","2":"Building Regulations are statutory."}},{"id":"fm7.4","t":"2","c":0,"q":"BS 7671 defines low voltage a.c. between conductors as voltage:","o":["below 250 V a.c","below 1000 V a.c. but above 50 V a.c.","above 50 V a.c. but below 500 V a.c.","above 250 V a.c. but below 1000 V a.c."],"a":1,"x":"","r":"Definitions P38","n":"","k":1000351.0,"m":"","f":"Part 2 Definitions, 'Voltage, nominal' – the voltage bands (ELV and low voltage).","w":{"0":"There's no 250 V band; LV runs from above ELV (50 V a.c.) up to 1000 V a.c.","2":"500 V is a test-voltage figure, not the LV limit; LV goes to 1000 V a.c.","3":"LV starts above ELV (50 V a.c.), not 250 V."}},{"id":"fm7.5","t":"2","c":0,"q":"An ordinary person is a person who:","o":["is skilled at electrical work","works in electrical maintenance","is neither skilled nor instructed","at least 18 years old"],"a":2,"x":"","r":"Definitions P34","n":"","k":1000352.0,"m":"","f":"Part 2 Definitions, 'Ordinary person', next to 'Skilled person' and 'Instructed person'.","w":{"0":"That describes a skilled person, not an ordinary person.","1":"Working in maintenance doesn't define it; an ordinary person is neither skilled nor instructed.","3":"Age has nothing to do with the definition."}},{"id":"fm7.6","t":"2","c":0,"q":"A 12 V fire alarm circuit is classified by BS 7671 as:","o":["a Band I circuit","a Band II circuit","a Band III circuit","an unclassified circuit"],"a":0,"x":"","r":"Definitions P39","n":"","k":1000353.0,"m":"","f":"Part 2 Definitions, 'Band I' and 'Band II'. Band I covers ELV installations such as alarm, bell, control and telecom circuits.","w":{"1":"Band II covers low-voltage installations; 12 V is ELV, so Band I.","2":"There's no Band III in BS 7671's definitions.","3":"ELV alarm and signalling circuits are classified as Band I."}},{"id":"fm7.7","t":"3","c":0,"q":"Which one of the following is NOT a classification of external influence?","o":["current rating","environmental conditions","construction of buildings","utilisation"],"a":0,"x":"","r":"Appendix 5 P445","n":"","k":1000354.0,"m":"","f":"Appendix 5 (classification of external influences): categories A (environment), B (utilisation) and C (construction of buildings).","w":{"1":"Environmental conditions is category A of Appendix 5.","2":"Construction of buildings is category C of Appendix 5.","3":"Utilisation is category B of Appendix 5."}},{"id":"fm7.8","t":"3","c":0,"q":"The type of building construction is an external influence which, in an electrical installation, will affect the choice of:","o":["equipment and wiring","method of earthing","overcurrent protection","supply voltage"],"a":0,"x":"","r":"Appendix 5 P445 + 522.15 P141","n":"","k":1000355.0,"m":"","f":"Appendix 5, category C (construction of buildings), then 522.15 in Chapter 52 on selecting wiring and equipment for building design.","w":{"1":"The earthing arrangement depends on the supply, not the building construction.","2":"Overcurrent protection depends on load and cable, not building construction.","3":"Supply voltage is set by the supply, not by the building."}},{"id":"fm7.9","t":"7","c":0,"q":"Non-sheathed cables for fixed wiring, other than protective conductors, should always be installed in:","o":["dry conditions","trenches","conduit or trunking","sub-zero temperatures"],"a":2,"x":"","r":"521.10.1 P137","n":"","k":1000356.0,"m":"","f":"Chapter 52, Regulation 521.10.1. Index: 'non-sheathed cables'.","w":{"0":"Dry conditions don't remove the need for an enclosure; non-sheathed cables must be in conduit, ducting or trunking.","1":"Burying non-sheathed cable in a trench isn't permitted.","3":"Temperature isn't the rule; 521.10.1 is about enclosing the cable."}},{"id":"fm7.10","t":"13","c":1,"q":"Domestic ring final circuits are used to supply BS 1363 socket outlets. If the floor area to be served is limited to 50 m2, the cable feeding the circuit must be:","o":["4 mm2","2.5 mm2","1.5 mm2","6 mm2"],"a":1,"x":"","r":"Appendix 15 P505","n":"","k":1000357.0,"m":"","f":"Appendix 15 (ring and radial final circuits). Index: 'ring final circuits'. Check the cable size and floor-area guidance for ring circuits.","w":{"0":"4 mm² is the radial (32 A) size; a ring uses 2.5 mm² copper.","2":"1.5 mm² is only for mineral-insulated cable rings; PVC/PVC rings use 2.5 mm².","3":"6 mm² isn't the ring size; Appendix 15 gives 2.5 mm² for a ring."}},{"id":"fm7.11","t":"13","c":0,"q":"A domestic final ring circuit may:","o":["supply any number of socket-outlets over an area of 200 m2","feed an immersion heater","require additional protection by an RCD","supply a cooker rated at 2.5 kW"],"a":2,"x":"","r":"Appendix 15 P505","n":"","k":1000358.0,"m":"","f":"Appendix 15 (ring final circuits), along with 411.3.3 / 415.1 for additional RCD protection of socket-outlets.","w":{"0":"Appendix 15 limits a ring to 100 m² floor area, not 200 m².","1":"Appendix 15 says immersion heaters shouldn't be on the ring; they get their own circuit.","3":"Cookers normally get their own circuit; Appendix 15 doesn't put them on the ring."}},{"id":"fm7.12","t":"7","c":0,"q":"Where thermoplastic insulated and sheathed cables are installed in a plastered wall at a depth of 20 mm and are not protected against mechanical damage, they must be:","o":["run in “safe zones”","protected by a 30 mA RCD","coloured red","protected by a 30 mA RCD and run in the “safe zones”"],"a":3,"x":"","r":"522.6.202 - 522.6.204 P139 - 140","n":"","k":1000359.0,"m":"","f":"Chapter 52, 522.6.202 to 522.6.204. Index: 'cables – concealed in walls'. Unprotected cables within 50 mm of the surface need both conditions.","w":{"0":"Safe zones alone aren't enough; the cable also needs 30 mA RCD protection.","1":"An RCD alone isn't enough; the cable must also run in the safe zones.","2":"Cable colour gives no protection and isn't a requirement."}},{"id":"fm7.13","t":"3","c":0,"q":"A two-storey domestic dwelling should have a minimum of two lighting circuits in order to:","o":["make the installation process easier","reduce the load on the consumer’s control unit","avoid danger in the event of a fault","enable a greater variety of luminaries to be used"],"a":2,"x":"","r":"314.1 (i) P50","n":"","k":1000360.0,"m":"","f":"Chapter 31, Regulation 314.1 'Division of installation'. Index: 'division of installation'.","w":{"0":"Ease of installation isn't the reason; 314.1 is about avoiding danger when a fault occurs.","1":"Load on the consumer unit isn't the reason 314.1 gives.","3":"Luminaire variety has nothing to do with dividing circuits."}},{"id":"fm7.14","t":"2","c":0,"q":"A system is defined as:","o":["the kWh meter and an installation","the distribution cables to an installation","the consumer’s terminals of an installation","a single source of energy and an installation"],"a":3,"x":"","r":"Definitions P38","n":"","k":1000361.0,"m":"","f":"Part 2 Definitions, 'System'.","w":{"0":"The meter isn't part of the definition; a system is a source (or parallel sources) plus an installation.","1":"Distribution cables alone are not a system.","2":"The consumer's terminals are the boundary of the installation, not the system."}},{"id":"fm7.15","t":"2","c":0,"q":"The term “basic protection” refers to:","o":["protection against electric shock under fault free conditions","extra-low voltage terminals","protection against electric shock under a single fault condition","live parts within an appliance"],"a":0,"x":"","r":"Definitions P24","n":"","k":1000362.0,"m":"","f":"Part 2 Definitions, 'Basic protection', next to 'Fault protection'.","w":{"1":"ELV terminals aren't the meaning; basic protection is shock protection under fault-free conditions.","2":"Protection under single-fault conditions is fault protection, not basic protection.","3":"It's about preventing contact with live parts, not the live parts themselves."}},{"id":"fm7.16","t":"4","c":0,"q":"Within a 230 V single-phase, metal clad fuse board, access to the line and neutral busbars are protected by insulation and by secured intermediate barriers. The fuse board may be:","o":["opened without use of a key or tool","left unearthed","used to accommodate SELV circuits","used to accommodate ELV circuit conductors"],"a":0,"x":"","r":"416.2.4 (i) P75","n":"","k":1000363.0,"m":"","f":"Chapter 41, Regulation 416.2.4 (barriers or enclosures). Look at item (iii) about an intermediate barrier that can only be removed with a key or tool.","w":{"1":"A metal-clad board is an exposed-conductive-part and must be earthed.","2":"Intermediate barriers don't make the board suitable for SELV; that needs separation from other circuits.","3":"That's about segregating circuits; the barriers only let you open the board without a tool."}},{"id":"fm7.17","t":"4","c":0,"q":"A socket-outlet used for a SELV system should:","o":["not have a protective conductor contact","be of a two-pin type","be marked SELV","have a protective conductor contact"],"a":0,"x":"","r":"Definitions P36 or 414.4.3 P73","n":"","k":1000364.0,"m":"","f":"Chapter 41, Section 414 (SELV and PELV). Index: 'SELV – socket-outlets'. Go to 414.4.4.","w":{"1":"There's no two-pin rule; it just must not have a protective conductor contact.","2":"Marking 'SELV' isn't the requirement; it must not have a protective conductor contact.","3":"That's backwards; a SELV socket must NOT have a protective conductor contact."}},{"id":"fm7.18","t":"4","c":0,"q":"Which one of the following is recognised as a means of providing fault protection?","o":["protection by insulation of live parts","protection by automatic disconnection","protection by placing out of reach","protection by obstacles"],"a":1,"x":"","r":"411.3.2 P58 or 416.1 – 417.3 P74 -75","n":"","k":1000365.0,"m":"","f":"Chapter 41: 411.3 (fault protection in ADS) against Section 416 and 417 (basic protection: insulation, barriers, obstacles, placing out of reach).","w":{"0":"Insulation of live parts is basic protection (Section 416).","2":"Placing out of reach is basic protection (Section 417).","3":"Obstacles are basic protection (Section 417)."}},{"id":"fm7.19","t":"4","c":0,"q":"Where SELV is used in normally dry conditions, basic protection is unnecessary where the nominal voltage does not exceed:","o":["12 V a.c.","25 V a.c","50 V a.c","60 V a.c."],"a":1,"x":"","r":"414.4.5 (i) P73","n":"","k":1000366.0,"m":"","f":"Chapter 41, 414.4.5. Index: 'SELV – basic protection'.","w":{"0":"12 V a.c. is the limit for other (non-dry) conditions; in normal dry conditions it's 25 V a.c.","2":"50 V a.c. is the ELV upper limit, not the 414.4.5 figure.","3":"60 V is the ripple-free d.c. figure, not the a.c. figure."}},{"id":"fm7.20","t":"4","c":0,"q":"Obstacles may be used to provide basic protection providing:","o":["the circuit voltage does not exceed 250 V","the installation is under the control of a skilled person","the installation is contained within steel conduit","an RCD is fitted"],"a":1,"x":"","r":"417.1 P75","n":"","k":1000367.0,"m":"","f":"Chapter 41, Section 417 (obstacles and placing out of reach). Read 410.3.5 too: these are only for installations controlled or supervised by skilled or instructed persons.","w":{"0":"There's no 250 V condition on obstacles.","2":"Steel conduit is a wiring method and has nothing to do with obstacles.","3":"An RCD isn't the condition; obstacles need skilled/instructed supervision."}},{"id":"fm7.21","t":"2","c":0,"q":"Overload current is defined as the overcurrent:","o":["that causes protective devices to operate correctly","occurring in a circuit which is electrically sound","resulting from a fault of negligible impedance","flowing in a phase conductor when in contact with exposed conductive parts"],"a":1,"x":"","r":"Definitions P34","n":"","k":1000368.0,"m":"","f":"Part 2 Definitions, 'Overload current' (compare 'Short-circuit current' and 'Overcurrent').","w":{"0":"That isn't the definition; overload is overcurrent in an electrically sound circuit.","2":"A fault of negligible impedance gives short-circuit current, not overload.","3":"Line contact with exposed-conductive-parts is an earth fault, not overload."}},{"id":"fm7.22","t":"5","c":0,"q":"An overload current could arise when:","o":["excessive mechanical load is applied to an electric motor","a forward/reverse controller attempts to switch a motor both directions simultaneously","contamination of a motor terminal block results in tracking","an electrician drills into a busbar chamber and touches a live busbar with the drill"],"a":0,"x":"","r":"Definitions  P34 or 432.1 P88","n":"","k":1000369.0,"m":"","f":"Part 2 Definitions, 'Overload current' (an electrically sound circuit), or Chapter 43, 432.1.","w":{"1":"Both directions at once shorts line to line, so that's short-circuit current.","2":"Tracking is an insulation fault, so the circuit is no longer electrically sound.","3":"Touching a live busbar is a fault, not overload."}},{"id":"fm7.23","t":"5","c":0,"q":"Where the overcurrent device is intended to afford protection against overload, l2 must not exceed lz multiplied by:","o":["0.735","1.45","1.8","2.5"],"a":1,"x":"","r":"433.1.1 (iii) P89","n":"","k":1000370.0,"m":"","f":"Chapter 43, Regulation 433.1.1, condition (iii): I2 ≤ 1.45 × Iz.","w":{"0":"That's close to the 0.725 BS 3036 rewireable fuse factor, which isn't the I2 multiplier.","2":"1.8 isn't in 433.1.1; the multiplier is 1.45.","3":"2.5 isn't in 433.1.1; the multiplier is 1.45."}},{"id":"fm7.24","t":"5","c":0,"q":"Omission of devices for protection against overload is not permitted for:","o":["secondary circuits of current transformers","circuits which supply fire extinguishing devices","exciter circuits of rotating machines","circuits which supply emergency lighting"],"a":3,"x":"","r":"433.3.3 P90","n":"","k":1000371.0,"m":"","f":"Chapter 43, 433.3.3 (omission of overload protection for safety reasons). Compare the circuits it lists.","w":{"0":"CT secondaries are listed in 433.3.3, where omitting overload protection is recommended.","1":"Fire-extinguishing circuits are listed in 433.3.3, where omitting overload protection is recommended.","2":"Exciter circuits are listed in 433.3.3, where omitting overload protection is recommended."}},{"id":"fm7.25","t":"6","c":0,"q":"Which one of the following may be used to provide emergency switching for an electric motor?","o":["a key switch latched in the on position","a plug and socket","a switch fuse with a removable handle","a device which latches in the off position"],"a":3,"x":"","r":"537.3.3.7 P184","n":"","k":1000372.0,"m":"","f":"Chapter 53, Section 537.3.3 (emergency switching). Index: 'emergency switching'. Read the requirements for the device latching off.","w":{"0":"Latching ON is the opposite of what's needed; the device must latch OFF.","1":"A plug and socket-outlet must not be selected for emergency switching.","2":"A removable handle isn't the requirement; it must latch or lock in the off position."}},{"id":"fm7.26","t":"6","c":0,"q":"A section of a factory requires urgent non-electrical repairs to a machine. The type of switching provided to allow this work to proceed would be switching for:","o":["mechanical movement","mechanical maintenance","emergency","safe operation"],"a":1,"x":"","r":"537.3.2.1 P183","n":"","k":1000373.0,"m":"","f":"Chapter 53, 537.3.2 'Switching off for mechanical maintenance'. Index: 'mechanical maintenance, switching off for'.","w":{"0":"'Mechanical movement' isn't a switching category in BS 7671.","2":"Emergency switching is for unexpected danger, not planned non-electrical repairs.","3":"There's no 'safe operation' switching category."}},{"id":"fm7.27","t":"6","c":0,"q":"Which one of the following shall not be used as an isolator?","o":["circuit breakers","plugs and socket outlets","semiconductor devices","fuse links"],"a":2,"x":"","r":"537.2.2 P182","n":"","k":1000374.0,"m":"","f":"Chapter 53, 537.2 (isolation). Index: 'isolation – devices for'. Read 537.2.2 on devices that must not be used.","w":{"0":"Circuit-breakers can be used as isolators if they're suitable for isolation.","1":"Plugs and socket-outlets are accepted means of isolation.","3":"Fuse links (removable) can provide isolation."}},{"id":"fm7.28","t":"9","c":1,"q":"Where PME conditions apply, the main protective bonding conductor shall be:","o":["half the csa of the earthing conductor and with reference to Table 54.7","selected in accordance with the supply neutral and Table 54.8","determined after consultation with the consumer","the same csa as the incoming line conductor"],"a":1,"x":"","r":"Table 54.8 P203","n":"","k":1000375.0,"m":"","f":"Chapter 54, 544.1.1 and Table 54.8. Index: 'PME – main protective bonding'. Read across from the supply neutral conductor size.","w":{"0":"Half the earthing conductor is the non-PME rule; with PME, Table 54.8 (supply neutral) applies.","2":"Size comes from Table 54.8, not consultation with the consumer.","3":"Size is based on the supply neutral via Table 54.8, not the line conductor."}},{"id":"fm7.29","t":"9","c":0,"q":"Which one of the following cannot be used as an earth electrode?","o":["copper water supply pipe","earth tape or wire","lead sheath covering of cable","welded reinforcement of concrete embedded in the earth"],"a":0,"x":"","r":"542.2.2 P195","n":"","k":1000376.0,"m":"","f":"Chapter 54, 542.2 (earth electrodes). Index: 'earth electrodes'. 542.2.3 lists acceptable types; 542.2.6 lists pipes that must not be used.","w":{"1":"Earth tape or wire is a recognised electrode type in 542.2.3.","2":"Lead sheaths can be used if the conditions in 542.2.5 are met (e.g. owner's consent).","3":"Welded reinforcement embedded in concrete is a recognised electrode type."}},{"id":"fm7.30","t":"9","c":1,"q":"Using Table 54.7 of BS 7671, the minimum cross-sectional area of a circuit protective conductor with a 10 mm2 line conductor will be:","o":["25 mm2","16 mm2","10 mm2","4 mm2"],"a":2,"x":"","r":"Table 54.7 P198","n":"","k":1000377.0,"m":"","f":"Chapter 54, Table 54.7. Read the first row (line conductor up to 16 mm²), where the cpc equals the line size.","w":{"0":"25 mm² is bigger than the line; Table 54.7 gives S for S ≤ 16 mm².","1":"16 mm² is the upper limit of the first row, not the answer for 10 mm².","3":"4 mm² is too small; for S ≤ 16 mm² the cpc equals the line, 10 mm²."}},{"id":"fm7.31","t":"9","c":1,"q":"In order to calculate the minimum value of the cross-sectional area of a protective conductor, the following information is available: Fault current = 700 A Operating time of protective device = 0.4 s Constant k, for protective conductor material = 115 The selected size of the protective conductor should be:","o":["2.5 mm2","4 mm2","6 mm2","16 mm2"],"a":1,"x":"S = I × √t ÷ k<br>√0.4 = 0.632<br>700 × 0.632 = 442.7<br>442.7 ÷ 115 = 3.85 mm² → next size up: 4 mm²","r":"543.1.3 P196","n":"","k":1000378.0,"m":"","f":"Chapter 54, 543.1.3: adiabatic equation S = √(I²t) ÷ k. Use the given I, t and k, then round up to the next standard size.","w":{"0":"Too small: 3.85 mm² must round UP. 2.5 mm² comes from using t instead of √t.","2":"6 mm² isn't the next size above 3.85 mm²; that's 4 mm².","3":"Far bigger than needed; the adiabatic result is 3.85 mm², so 4 mm²."}},{"id":"fm7.32","t":"9","c":0,"q":"Supplementary bonding conductors having mechanical protection connected between two extraneous conductive parts are subject to a minimum cross-sectional area of:","o":["1.5 mm2","2.5 mm2","4 mm2","6 mm2"],"a":1,"x":"","r":"544.2.3 P203","n":"","k":1000379.0,"m":"","f":"Chapter 54, 544.2.3 (supplementary bonding between extraneous-conductive-parts). Index: 'supplementary bonding conductors'.","w":{"0":"1.5 mm² is below the minimum; 544.2.3 gives 2.5 mm² with mechanical protection.","2":"4 mm² is the figure WITHOUT mechanical protection.","3":"6 mm² isn't the 544.2.3 minimum."}},{"id":"fm7.33","t":"12","c":0,"q":"In a marina, corrosive elements exist, structures can move, mechanical damage can occur, a possible presence of flammable fuel is present and an increase in the risk of electric shock is possible. Which one of the following is NOT taken into consideration when determining any external influence requirements?","o":["presence of water","reduction in body resistance","contact of body with earth potential","the reduced resistance of salt water"],"a":3,"x":"","r":"709.512.2 P270","n":"","k":1000380.0,"m":"","f":"Part 7, Section 709 (marinas). Go to 709.512.2 and read the list of external influences to consider.","w":{"0":"Presence of water is on the 709.512.2 list.","1":"Reduction in body resistance is listed under increased shock risk.","2":"Contact of the body with earth potential is listed under increased shock risk."}},{"id":"fm7.34","t":"4","c":0,"q":"A final circuit supplying 13 A socket-outlets is to be used by ordinary persons. The circuit must be provided with:","o":["protection by an RCD","a BS EN 60898 circuit breaker","additional protection in accordance with Regulation 415.1","switched socket-outlets"],"a":2,"x":"","r":"415.1 P73 or App 15 P505","n":"","k":1000381.0,"m":"","f":"Chapter 41, 411.3.3 (additional protection for socket-outlets) leading to 415.1.","w":{"0":"Too vague; any RCD won't do. It must give additional protection to 415.1 (30 mA).","1":"Any suitable device is allowed; a BS EN 60898 breaker isn't specifically required.","3":"Switched sockets aren't required by BS 7671."}},{"id":"fm7.35","t":"10","c":0,"q":"Ceiling roses are only allowed where the circuit voltage does not exceed:","o":["110 V","250 V","415 V","11 kV"],"a":1,"x":"","r":"559.5.1.201 P219","n":"","k":1000382.0,"m":"","f":"Chapter 55, 559.5.1.201. Index: 'ceiling roses'.","w":{"0":"110 V isn't the limit; 559.5.1.201 says not normally exceeding 250 V.","2":"415 V exceeds the 250 V limit for ceiling roses and lampholders.","3":"11 kV is high voltage, far above the 250 V limit."}},{"id":"fm7.36","t":"9","c":1,"q":"The minimum cross-sectional area for a buried copper earthing conductor that is provided with mechanical protection but no protection against corrosion is:","o":["2.5 mm2","10 mm2","16 mm2","25 mm2"],"a":3,"x":"","r":"Table 54.1 P195","n":"","k":1000383.0,"m":"","f":"Chapter 54, Table 54.1 (buried earthing conductors). Read the 'protected against mechanical damage, not against corrosion' row for copper.","w":{"0":"2.5 mm² isn't in Table 54.1 for buried conductors.","1":"10 mm² isn't the buried copper figure in Table 54.1.","2":"16 mm² is for corrosion-protected but NOT mechanically protected copper."}},{"id":"fm7.37","t":"8","c":0,"q":"When an insulation monitoring device (IMD) is installed:","o":["it must be set to a higher value corresponding to the normal insulation of the system","it must be designed in such a way that it is impossible to modify the setting without the use of a tool, if the location is accessible to ordinary persons","an IT system must not be used","instruction must be available that indicate how to switch the device off if it detects a fault"],"a":1,"x":"","r":"538.1.3 P186","n":"","k":1000384.0,"m":"","f":"Chapter 53, 538.1 (IMDs for IT systems). Go to 538.1.3 'Setting of the insulation monitoring device'.","w":{"0":"The IMD is set below the normal insulation level, not above it.","2":"IMDs are used in IT systems, so it can't forbid IT.","3":"There's no requirement for switch-off instructions; the IMD is there to signal a fault."}},{"id":"fm7.38","t":"13","c":1,"q":"A circuit with a design current of 45 A is installed using a cable with a current rating of 50 A. If the voltage drop for the cable is 8 mV per amp per metre, the circuit voltage drop for a 10 m run will be:","o":["2.5 V","3.6 V","4 V","6 V"],"a":1,"x":"Vd = mV/A/m × Ib × L ÷ 1000 (use the design current, not the cable rating)<br>8 × 45 × 10 = 3600<br>3600 ÷ 1000 = 3.6 V","r":"Calculation – use lb not ln P381","n":"","k":1000385.0,"m":"","f":"Appendix 4, Section 6 (voltage drop). Vd = mV/A/m × Ib × L ÷ 1000, using the design current Ib.","w":{"0":"Not from the formula; 8 × 45 × 10 ÷ 1000 = 3.6 V.","2":"You used the cable rating (50 A) instead of Ib (45 A).","3":"Not from the formula; 8 × 45 × 10 ÷ 1000 = 3.6 V."}},{"id":"fm7.39","t":"13","c":0,"q":"Which one of the following should be taken into consideration when calculating the voltage drop in an installation?","o":["nominal current setting of the protective device","design current of the circuit","current carrying capacity of the conductors","the current that ensures effective operation of the protective device"],"a":1,"x":"","r":"Appendix 4 Section 6 P381","n":"","k":1000386.0,"m":"","f":"Appendix 4, Section 6 (voltage drop): the tabulated mV/A/m is multiplied by the design current Ib.","w":{"0":"In isn't used; voltage drop uses the design current Ib.","2":"Iz (current-carrying capacity) isn't used; voltage drop uses Ib.","3":"Disconnection current (Ia) is for fault protection, not voltage drop."}},{"id":"fm7.40","t":"12","c":0,"q":"On a mobile or transportable unit, plugs used to connect the unit to the supply shall comply with BE EN 60309-2 and:","o":["shall be enclosed in a metal enclosure","the plug part be on the supply distribution board","any plug and socket outlets shall afford a degree of protection of not less than IP44 if located inside","appliance inlets with their enclosures shall provide a degree of protection of at least IP44"],"a":3,"x":"","r":"717.55.1 (ii) P300","n":"","k":1000387.0,"m":"","f":"Part 7, Section 717 (mobile or transportable units). Go to 717.55.1 on plugs, sockets and inlets used to connect the unit.","w":{"0":"Plugs must have an enclosure of insulating material, not metal.","1":"The inlet with male contacts goes on the unit; the plug isn't on the distribution board.","2":"The IP44 requirement is for connecting devices used OUTSIDE the unit, not inside."}},{"id":"fm7.41","t":"4","c":1,"q":"The fault current due to an earth fault of negligible impedance in a 400 V, three phase, four wire circuit having an earth fault loop impedance of 0.3 F is:","o":["1383 A","728.3 A","124.5 A","72 A"],"a":1,"x":"An earth fault uses the line-to-earth voltage, Uo = 230 V, with the minimum voltage factor Cmin = 0.95:<br>I = Uo × Cmin ÷ Zs = 230 × 0.95 ÷ 0.3 = 728.3 A","r":"411.4.5 P60","n":"","k":1000388.0,"m":"","f":"Chapter 41, 411.4.5: I = Uo × Cmin ÷ Zs. Uo is 230 V (line to earth), even on a 400 V system.","w":{"0":"You used the line voltage (~415 V) instead of Uo = 230 V; an earth fault is line to earth.","2":"You multiplied by Zs instead of dividing.","3":"You multiplied voltage by Zs instead of dividing (I = U ÷ Z)."}},{"id":"fm7.42","t":"7","c":0,"q":"A black sleeve or disc is placed on one of the conductors of a three- core MICC cable. This indicates the:","o":["line 1 of a three phase a.c. circuit","earth conductor","line 2 of a three phase a.c. circuit","line 3 of a three phase a.c. circuit"],"a":2,"x":"","r":"Table 51 P131","n":"","k":1000389.0,"m":"","f":"Chapter 51, Table 51 (identification of conductors). Index: 'identification of conductors'. Read the line conductor colours.","w":{"0":"L1 is brown, not black.","1":"Protective conductors are green-and-yellow, never black.","3":"L3 is grey, not black."}},{"id":"fm7.43","t":"13","c":0,"q":"An unfused spur connected to a 30 A ring circuit may supply:","o":["two fixed appliances","two twin socket-outlets or one fixed applianced","one twin socket-outlet or one single socket-outlet","an unlimited number of socket-outlets"],"a":2,"x":"","r":"Appendix 15 P505","n":"","k":1000390.0,"m":"","f":"Appendix 15 (ring final circuits). Index: 'spurs'. Read the guidance on unfused spurs.","w":{"0":"An unfused spur supplies only one item, not two fixed appliances.","1":"Two twin sockets is too many; the limit is one single or one twin socket-outlet.","3":"Unfused spurs are limited to one single or twin socket-outlet."}},{"id":"fm7.44","t":"11","c":0,"q":"Prior to an inspection in accordance with BS 7671, the competent person carrying out the test shall normally:","o":["ensure that all switches are off","disconnect the installation from the supply","disconnect all fixed appliances","ensure that the supply is connected"],"a":1,"x":"","r":"642.1 P230","n":"","k":1000391.0,"m":"","f":"Part 6, Chapter 64, Regulation 642.1 (inspection). Index: 'inspection – initial verification'.","w":{"0":"Switching off isn't enough; inspection is normally done with the installation disconnected from the supply.","2":"Disconnecting appliances isn't the 642.1 requirement; the installation is disconnected from supply.","3":"That's backwards; inspection normally comes before connection, with the supply disconnected."}},{"id":"fm7.45","t":"7","c":0,"q":"A legible diagram, chart or table relating to an installation must be provided to indicate:","o":["the location of all fixed equipment for testing purposes","any circuit of equipment vulnerable to a typical test","location of all portable equipment for testing purposes","that the original installation design has not changed"],"a":1,"x":"","r":"514.9.1 (iv) P132","n":"","k":1000392.0,"m":"","f":"Chapter 51, 514.9.1 (diagrams and documentation). Index: 'diagrams'. Read the list of what the chart must show.","w":{"0":"The diagram shows circuits and points served, not a test plan for every piece of fixed equipment.","2":"Portable equipment isn't part of 514.9.1.","3":"The diagram records the installation; it doesn't confirm the design hasn't changed."}},{"id":"fm7.46","t":"11","c":0,"q":"When carrying out an insulation resistance test on a 230 V socket- outlet circuit incorporating surge protective devices (SPD), the test voltage may be reduced to:","o":["500 V","1000 V","50 V","250 V"],"a":3,"x":"","r":"643.3.2 P232","n":"","k":1000393.0,"m":"","f":"Part 6, 643.3.2 (insulation resistance with SPDs connected). Index: 'surge protective devices – insulation resistance testing'.","w":{"0":"500 V is the normal test voltage; with SPDs it may be reduced to 250 V.","1":"1000 V is for circuits above 500 V; it's higher, not reduced.","2":"50 V isn't a Table 64 test voltage."}},{"id":"fm7.47","t":"11","c":0,"q":"During an initial verification, a test result fails to comply with BS 7671 Part 6. The procedure to be adopted is to:","o":["inform the client","make good and complete the Periodic Inspection Report","make good and complete the Electrical Installation Certificate","record the fault on the Periodic Inspection Report"],"a":2,"x":"","r":"643.1 Paragraph 5 P232","n":"","k":1000394.0,"m":"","f":"Part 6, 643.1 (testing). Read the paragraph on what to do when a test fails: fix it, then repeat that test and any earlier tests affected.","w":{"0":"Informing the client doesn't deal with it; the fault must be rectified and retested.","1":"A periodic report is for existing installations; this is initial verification, so it's an EIC.","3":"Initial verification gives an EIC, not a periodic report, and the fault must be fixed."}},{"id":"fm7.48","t":"11","c":1,"q":"For circuits having a nominal voltage above 500 V, the minimum insulation resistance is:","o":["0.25 MΩ","0.5 MΩ","1 MΩ","5 MΩ"],"a":2,"x":"","r":"Table 64 P232","n":"","k":1000395.0,"m":"","f":"Part 6, Table 64 (minimum insulation resistance). Read the 'above 500 V' row.","w":{"0":"0.25 MΩ isn't in Table 64.","1":"0.5 MΩ is the SELV/PELV figure.","3":"5 MΩ isn't a Table 64 minimum."}},{"id":"fm7.49","t":"11","c":0,"q":"It is a requirement of BS 7671 that a Schedule of Test Results should always be attached to an Electrical Installation Certificate for:","o":["new installations, alterations or additions to existing installations","new installations only","major installations only","modified installations only"],"a":0,"x":"","r":"Appendix 6 P464","n":"","k":1000396.0,"m":"","f":"Part 6, Chapter 64 (certification), and Appendix 6 (model forms). The EIC is for new work, alterations and additions, always with a schedule of test results.","w":{"1":"Not only new work; alterations and additions also get an EIC with test results.","2":"There's no 'major installations only' rule; every EIC needs a schedule of test results.","3":"New installations and additions also need it, not just modified ones."}},{"id":"fm7.50","t":"11","c":0,"q":"BS 7671 requires that the person ordering installation work must be informed of the:","o":["need for periodic testing","name and address of the regional electricity company","anticipated life of the installation","diversity factors applied to circuit"],"a":0,"x":"","r":"Appendix 6 Guidance for P334","n":"","k":1000397.0,"m":"","f":"Chapter 51, 514.12 (periodic inspection notice), and the Appendix 6 guidance for recipients.","w":{"1":"BS 7671 doesn't require details of the electricity company to be given.","2":"BS 7671 doesn't ask for an expected installation life.","3":"Diversity is a design matter, not something the client must be told."}},{"id":"fm7.51","t":"11","c":0,"q":"Which one of the following factors does not affect the frequency of the periodic inspection?","o":["type of installation","installation use and operation","frequency of maintenance","supplies for safety services"],"a":3,"x":"","r":"652.1 P237","n":"","k":1000398.0,"m":"","f":"Part 6, Chapter 65, Regulation 652.1 (frequency of periodic inspection). Read the factors listed.","w":{"0":"Type of installation is one of the 652.1 factors.","1":"Use and operation is one of the 652.1 factors.","2":"Frequency and quality of maintenance is one of the 652.1 factors."}},{"id":"fm7.52","t":"12","c":0,"q":"Electric heating units embedded in the floor of a bathroom and intended for heating the location may be installed below any zone provided they are:","o":["supplied from an electrically separated source","covered with at least 50 mm of screed","surrounded with thermal insulating material","covered by an earthed metallic grid"],"a":3,"x":"","r":"701.753 P243","n":"","k":1000399.0,"m":"","f":"Part 7, Section 701 (bathrooms), 701.753 'Electric floor heating systems'.","w":{"0":"701.753 specifically forbids electrical separation for floor heating.","1":"Screed depth isn't the requirement; it needs an earthed metal sheath, enclosure or fine mesh grid.","2":"Thermal insulation isn't the requirement; it needs an earthed metal sheath, enclosure or fine mesh grid."}},{"id":"fm7.53","t":"12","c":0,"q":"Electrical equipment installed in Zone 1 of a swimming pool must have a minimum degree of protection in accordance with:","o":["IPX8","IP4X","IP2X","IPX4"],"a":3,"x":"","r":"702.512.2 (ii) P247","n":"","k":1000400.0,"m":"","f":"Part 7, Section 702 (swimming pools), 702.512.2 (external influences). Read the IP rating per zone.","w":{"0":"IPX8 is the Zone 0 requirement.","1":"IP4X is about solid objects; Zone 1 is about water (IPX4).","2":"IP2X is finger protection, not water protection."}},{"id":"fm7.54","t":"12","c":0,"q":"Construction site regulations apply to:","o":["all site offices","earthworks","site canteens","site toilets"],"a":1,"x":"","r":"704.1.1 (iv) P256","n":"","k":1000401.0,"m":"","f":"Part 7, Section 704 (construction sites), 704.1.1 (scope). Read what is covered and the note on site buildings that are excluded.","w":{"0":"Site offices are excluded from 704; they come under the general rules.","2":"Canteens are excluded from 704 (fixed site buildings).","3":"Toilets are excluded from 704 (fixed site buildings)."}},{"id":"fm7.55","t":"12","c":0,"q":"In agricultural premises, heating appliances shall be fixed so as to maintain an appropriate distance from livestock. In the absence of manufacturer’s guidance, a radiant heater used in the vicinity of livestock should be placed at a distance of not less than:","o":["0.5m","1.5m","2 m","2.5 m"],"a":0,"x":"","r":"705.422.6 P259","n":"","k":1000402.0,"m":"","f":"Part 7, Section 705 (agricultural premises), 705.422.6. Index: 'agricultural premises – heating appliances'.","w":{"1":"1.5 m isn't the 705.422.6 figure; it's 0.5 m.","2":"2 m isn't the 705.422.6 figure; it's 0.5 m.","3":"2.5 m is the arm's reach height, not the heater clearance."}},{"id":"fm7.56","t":"12","c":0,"q":"The socket outlet and its enclosure, forming part of a pitch supply equipment for a caravan park, must comply with BS EN 60309-2 and have a minimum index of protection of:","o":["IP40","IP55","IP54","IP44"],"a":3,"x":"","r":"708.553.1.8 P267","n":"","k":1000403.0,"m":"","f":"Part 7, Section 708 (caravan parks), 708.553.1.8 (socket-outlets).","w":{"0":"IP40 has no water protection; 708 requires at least IP44.","1":"IP55 is higher than the 708 minimum of IP44.","2":"IP54 isn't the 708 figure; the minimum is IP44."}},{"id":"fm7.57","t":"12","c":0,"q":"Inspection and testing of a fairground installation must take place:","o":["every three months","after each assembly on site","only if it is fed from the public supply system","only if it is fed from an a.c. supply"],"a":1,"x":"","r":"740.6 P335","n":"","k":1000404.0,"m":"","f":"Part 7, Section 740 (fairgrounds, amusement parks). Index: 'fairgrounds – inspection and testing'; see 740.6.","w":{"0":"There's no three-month interval; testing is after each assembly on site.","2":"The supply source doesn't matter; every assembly must be tested.","3":"a.c. or d.c. doesn't matter; every assembly must be tested."}},{"id":"p12.1","t":"1","c":0,"q":"BS 7671 applies to electrical installations for","o":["Outdoor lighting","Electrical equipment on board ships","Lightning protection systems","Railway traction equipment"],"a":0,"x":"","r":"","n":"","k":1000405.0,"m":"","f":"Part 1, Regulation 110.1 (scope) for what's included and 110.2 for exclusions.","w":{"1":"Equipment on ships is excluded under 110.2.","2":"Lightning protection systems are excluded under 110.2.","3":"Railway traction equipment is excluded under 110.2."}},{"id":"p12.2","t":"1","c":0,"q":"To which following electrical installations does BS 7671 not apply?","o":["Agricultural and horticultural premises","Electric fences","Construction sites","Caravans and their sites"],"a":1,"x":"","r":"","n":"","k":1000406.0,"m":"","f":"Part 1, Regulation 110.2 'Exclusions from scope'.","w":{"0":"Agricultural premises are covered (Section 705).","2":"Construction sites are covered (Section 704).","3":"Caravans and their sites are covered (Sections 708 and 721)."}},{"id":"p12.3","t":"1","c":0,"q":"Basic protection can be achieved by","o":["Separation of the supply and load by means of an isolating transformer","Automatic disconnection of supply during earth fault conditions","Ensuring all extraneous parts are at equal potential","Preventing a current from passing through a person or animal"],"a":3,"x":"","r":"","n":"","k":1000407.0,"m":"","f":"Chapter 41, Section 410 (protection against electric shock) and the definitions of 'Basic protection' and 'Fault protection'.","w":{"0":"An isolating transformer is electrical separation (Section 413), a protective measure, not basic protection on its own.","1":"ADS operates under earth fault conditions, so it's fault protection.","2":"Equipotential bonding is part of fault protection, not basic protection."}},{"id":"p12.4","t":"1","c":0,"q":"For AC the preferred frequencies which are taken into account in BS 7671 are","o":["25 Hz, 50 Hz and 60 Hz","50 Hz, 60 Hz and 400 Hz","25 Hz, 50 Hz and 250 Hz","50 Hz, 100 Hz and 400 Hz"],"a":1,"x":"","r":"","n":"","k":1000408.0,"m":"","f":"Part 1, Chapter 11 (scope): the paragraph on nominal voltages and frequencies.","w":{"0":"25 Hz isn't listed; preferred frequencies are 50, 60 and 400 Hz.","2":"25 Hz and 250 Hz aren't listed; it's 50, 60 and 400 Hz.","3":"100 Hz isn't listed; it's 50, 60 and 400 Hz."}},{"id":"p12.5","t":"1","c":0,"q":"No alteration, temporary or permanent should be made unless","o":["The distributor has been informed","The local authority has been informed","Existing equipment is adequate for the altered circumstances","Existing equipment meets BS or BSEN standards"],"a":2,"x":"","r":"","n":"","k":1000409.0,"m":"","f":"Chapter 13, Regulation 132.16 (additions and alterations). Index: 'additions and alterations'.","w":{"0":"132.16 doesn't require telling the distributor; it's about existing equipment being adequate.","1":"The local authority isn't mentioned in 132.16.","3":"A standards number doesn't prove existing equipment can take the altered load; that's what 132.16 requires."}},{"id":"p12.6","t":"1","c":0,"q":"Which of the following need not be considered when determining the cross sectional area of conductors during the design process?","o":["Voltage drop limit","Electromechanical stresses","Maximum impedance","Flooding"],"a":3,"x":"","r":"","n":"","k":1000410.0,"m":"","f":"Chapter 13, Regulation 132.6 (cross-sectional area of conductors). Read the list of factors.","w":{"0":"Voltage drop limits are in the 132.6 list.","1":"Electromechanical stresses from fault current are in the 132.6 list.","2":"Maximum impedance for protective device operation is in the 132.6 list."}},{"id":"p12.7","t":"1","c":0,"q":"The IET Regulations (BS 7671) are","o":["Non-statutory and may not be used in a court of law as evidence to claim compliance with a statutory requirement.","Statutory and may be used in place of the Electricity at Work Regulations","Non-statutory but may be used in a court of law as evidence to claim compliance with a statutory requirement","Statutory and may be used in a court of law to supplement the Electricity at Work Regulations"],"a":2,"x":"","r":"","n":"","k":1000411.0,"m":"","f":"Part 1, Regulation 114.1 (relationship with statutory regulations).","w":{"0":"Wrong: BS 7671 can be used in court as evidence of compliance.","1":"BS 7671 is non-statutory and doesn't replace the EAWR.","3":"BS 7671 is non-statutory, not statutory."}},{"id":"p12.8","t":"1","c":0,"q":"When an item of equipment has been installed and doesn’t have a BS or BSEN number associated with it, this is a non-complinace and:","o":["Need NOT be noted on the electrical installation certificate","Should be reported to the client","Must be noted on the electrical installation certificate","Should be reported to the designer"],"a":2,"x":"","r":"","n":"","k":1000412.0,"m":"","f":"Chapter 13, Regulation 133.1.3 (equipment not complying with a standard). Read what it says about recording this on the certificate.","w":{"0":"133.1.3 says it must be recorded on the certificate.","1":"Telling the client isn't enough; it must be noted on the EIC.","3":"Telling the designer isn't the requirement; it must be noted on the EIC."}},{"id":"p12.9","t":"2","c":0,"q":"Which of the following is an extraneous conductive part?","o":["The metal casing of a gas cooker","The metal casing of an electrical cooker","The steel housing of a transformer","The metal frame of an electrical fire"],"a":0,"x":"","r":"","n":"","k":1000413.0,"m":"","f":"Part 2 Definitions, 'Extraneous-conductive-part' against 'Exposed-conductive-part'.","w":{"1":"An electric cooker casing is part of the installation, so it's an exposed-conductive-part.","2":"A transformer housing is electrical equipment, so it's an exposed-conductive-part.","3":"An electric fire frame is electrical equipment, so it's an exposed-conductive-part."}},{"id":"p12.10","t":"2","c":0,"q":"A DC voltage of 110v between conductors is classified as being","o":["Extralow voltage","Reduced low voltage","Low voltage","SELV"],"a":0,"x":"","r":"","n":"","k":1000414.0,"m":"","f":"Part 2 Definitions, 'Voltage, nominal': ELV is up to 50 V a.c. or 120 V ripple-free d.c.","w":{"1":"Reduced low voltage is the 110 V a.c. system; 110 V d.c. is still ELV.","2":"LV d.c. starts above 120 V; 110 V d.c. is ELV.","3":"SELV is a protective measure, not a voltage band."}},{"id":"p12.11","t":"4","c":0,"q":"The maximum vertical distance accepted as being within arm’s reach is","o":["2.5m","1.75m","1.5m","1.25m"],"a":0,"x":"","r":"","n":"","k":1000415.0,"m":"","f":"Part 2 Definitions, 'Arm's reach', and Figure 417 in Section 417.","w":{"1":"1.75 m isn't an arm's reach dimension.","2":"1.5 m isn't an arm's reach dimension.","3":"1.25 m is the horizontal reach, not vertical."}},{"id":"p12.12","t":"2","c":0,"q":"An extra-low voltage system, which is electrically separated from earth and from other systems is defined as","o":["PELV","SELV","Non-conducting","Earth free"],"a":1,"x":"","r":"","n":"","k":1000416.0,"m":"","f":"Part 2 Definitions, 'SELV' against 'PELV'.","w":{"0":"PELV is earthed; that's what makes it different from SELV.","2":"Non-conducting location is a protective measure (418.1), not an ELV system.","3":"Earth-free bonding is a protective measure (418.2), not an ELV system."}},{"id":"p3.1","t":"1","c":0,"q":"Essential information required at the design stage of an electrical installation is the","o":["Purpose for which the installation is intended","Nomination of the main contractor","Nomination of the electrical contractor","Duration of the contract"],"a":0,"x":"","r":"","n":"","k":1000417.0,"m":"","f":"Chapter 31, Regulation 311.1 (purposes, supplies and structure). Index: 'purpose of installation'.","w":{"1":"The main contractor doesn't affect electrical design.","2":"Who does the work doesn't affect the design.","3":"Contract duration isn't a design input under Chapter 31."}},{"id":"p3.2","t":"3","c":0,"q":"In order to mitigate the effects of electromagnetic interference (EMI) an installation should","o":["Be wired in pvc conduit/trunking","Have all magnetically controlled circuits connected to the same protective device","Be divided into circuits","Have a notice stating EMI present"],"a":2,"x":"","r":"","n":"","k":1000418.0,"m":"","f":"Chapter 31, Regulation 314.1 (division of installation). Read the item on mitigating EMI.","w":{"0":"PVC containment doesn't reduce EMI.","1":"Putting circuits on one device goes against 314.1, which divides the installation.","3":"A notice does nothing to mitigate EMI."}},{"id":"p3.3","t":"3","c":0,"q":"A TN-S system has","o":["Combined Neutral and protective conductor throughout","Separate Neutral and protective conductor throughout","Source isolated from earth","Combined Neutral and protective conductor up to the installation origin"],"a":1,"x":"","r":"","n":"","k":1000419.0,"m":"","f":"Part 2 Definitions and the system diagrams (Figures 3.x) in Chapter 31 / 312.2.","w":{"0":"Combined N and PE throughout is TN-C.","2":"A source isolated from earth is an IT system.","3":"Combined up to the origin is TN-C-S (PME)."}},{"id":"p3.4","t":"3","c":0,"q":"A suitable supply for safety services is a","o":["Standard main supply","Non-earthed transformer","Mains operated generator","Primary cell"],"a":3,"x":"","r":"","n":"","k":1000420.0,"m":"","f":"Chapter 31, 313.2, and Chapter 56 (safety services), 560.6. Read the list of acceptable sources.","w":{"0":"The normal supply isn't independent of the mains, so it doesn't count as a safety source.","1":"A non-earthed transformer isn't a listed safety source.","2":"A safety generator must be independent of the normal supply, not mains-operated."}},{"id":"p3.5","t":"3","c":0,"q":"Which of the following characteristics needs to be assessed for compatibility?","o":["DC feedback","Number of circuit conductors","Rating of the DNO fuse","The service meter"],"a":0,"x":"","r":"","n":"","k":1000421.0,"m":"","f":"Chapter 33, Regulation 331.1 (compatibility of characteristics). Read the list.","w":{"1":"The number of conductors isn't on the 331.1 list.","2":"The DNO fuse rating is a supply characteristic, not a compatibility item.","3":"The meter isn't on the 331.1 list."}},{"id":"p3.6","t":"3","c":0,"q":"With reference to the nature of the supply, which one of the following can be determined by calculation, enquiry or measurement?","o":["The maximum demand of the installation","The rating of the circuit protective device","The prospective short-circuit current at the origin of the installation","The CSA of the tails"],"a":2,"x":"","r":"","n":"","k":1000422.0,"m":"","f":"Chapter 31, Regulation 313.1 (supply characteristics), determined by calculation, measurement, enquiry or inspection.","w":{"0":"Maximum demand is assessed by the designer (311.1), not a supply characteristic.","1":"The circuit protective device rating is a design choice, not supply data.","3":"Tail size is a design choice, not a supply characteristic."}},{"id":"p3.7","t":"3","c":0,"q":"Which one of the following needs to be considered in order to identify the characteristics of equipment likely to have harmful effects on other electrical equipment?","o":["Classification of external influences","Compatibility of characteristics","Maintainability","Continuity of services"],"a":1,"x":"","r":"","n":"","k":1000423.0,"m":"","f":"Chapter 33 'Compatibility', 331.1. The first sentence matches the question wording.","w":{"0":"External influences (Appendix 5) are about the environment, not effects on other equipment.","2":"Maintainability (Chapter 34) is about maintenance, not harmful effects.","3":"Continuity of service (Chapter 36) isn't about harmful effects."}},{"id":"p3.8","t":"3","c":0,"q":"Which one of the following systems uses the metallic covering of the supply cable as ameans of earthing?","o":["TT","TN-C-S","TN-S","TN-S-C"],"a":2,"x":"","r":"","n":"","k":1000424.0,"m":"","f":"Part 2 Definitions and the system figures; TN-S has a separate earth from the supply cable sheath.","w":{"0":"TT uses the consumer's own earth electrode.","1":"TN-C-S uses the combined PEN conductor, not the cable sheath.","3":"There's no 'TN-S-C' system."}},{"id":"p3.9","t":"3","c":0,"q":"The compatibility of harmful effects upon electrical equipment would not need to be assessed for","o":["DC feedback","Power factor","Undervoltages","Fault currents"],"a":3,"x":"","r":"","n":"","k":1000425.0,"m":"","f":"Chapter 33, Regulation 331.1. Check which options are on the list.","w":{"0":"DC feedback is item (ix) of 331.1.","1":"Power factor is item (xii) of 331.1.","2":"Undervoltage is item (ii) of 331.1."}},{"id":"p3.10","t":"3","c":0,"q":"Which one of the following is a consideration of maintainability?","o":["The EMC regualtions","The division of the installation","The effectiveness of the protective measures for safety","The supplies for safety services and standby systems"],"a":2,"x":"","r":"","n":"","k":1000426.0,"m":"","f":"Chapter 34 'Maintainability', Regulation 341.1.","w":{"0":"EMC is Chapter 33 (332), not maintainability.","1":"Division of installation is Chapter 31 (314).","3":"Safety services are Chapter 35, not maintainability."}},{"id":"p3.11","t":"3","c":0,"q":"Every installation should be divided into circuits, as necessary, to","o":["Take account of danger that may arise from the failure of a single circuit","Avoid discrimination problems","Prevent unauthorised interference with safety supplies fuse","Reduce wiring impracticability"],"a":0,"x":"","r":"","n":"","k":1000427.0,"m":"","f":"Chapter 31, Regulation 314.1 (division of installation). Read the list of reasons.","w":{"1":"Discrimination isn't one of the reasons in 314.1.","2":"Interference with safety supplies isn't a 314.1 reason.","3":"Ease of wiring isn't a 314.1 reason."}},{"id":"p3.12","t":"3","c":0,"q":"In assessing an installation for continued service, which of the following characteristics need not be considered?","o":["The system earthing","The number of circuits","The devices used for monitoring","The frequency"],"a":3,"x":"","r":"","n":"","k":1000428.0,"m":"","f":"Chapter 36 'Continuity of service'. Read the list of things to consider.","w":{"0":"System earthing is considered for continuity of service.","1":"The number of circuits is considered for continuity of service.","2":"Monitoring devices (IMDs, RCMs) are considered for continuity of service."}},{"id":"p4.1","t":"4","c":1,"q":"The maximum permitted value of earth electrode and earthing conductor resistance (Ra) for a circuit protected by a 500mA RCD and forming part of a 230v AC TT system is","o":["500Ω","100Ω","167Ω","1667Ω"],"a":1,"x":"Ra × IΔn ≤ 50 V<br>Ra ≤ 50 ÷ 0.5 = 100 Ω","r":"","n":"","k":1000429.0,"m":"","f":"Chapter 41, 411.5.3 (TT systems): RA × IΔn ≤ 50 V, so RA ≤ 50 ÷ IΔn, with IΔn in amps.","w":{"0":"Looks like you used the 500 mA rating as the answer; RA = 50 ÷ 0.5 = 100 Ω.","2":"167 Ω is 50 ÷ 0.3, for a 300 mA RCD.","3":"1667 Ω is 50 ÷ 0.03, for a 30 mA RCD."}},{"id":"p4.2","t":"4","c":0,"q":"In AC systems, additional protection by RCDs rated at 30mA or less must be used","o":["To replace all other protective devices","For outdoor mobile equipment with a current rating of 32A or less","Only if main equipotential bonding is absent","If obstacles are in place"],"a":1,"x":"","r":"","n":"","k":1000430.0,"m":"","f":"Index: 'additional protection' or 'RCD, additional protection'. Go to Regulation 411.3.3 (Chapter 41), which lists socket-outlets and outdoor mobile equipment up to 32 A.","w":{"0":"RCDs give additional protection on top of other measures; they never replace overcurrent devices or other protective measures.","2":"Main bonding is a requirement of ADS in its own right; 411.3.3 doesn't make the RCD conditional on missing bonding.","3":"Obstacles are a basic-protection measure for skilled-person areas (Section 417); they don't trigger the 30 mA RCD rule."}},{"id":"p4.3","t":"4","c":1,"q":"The maximum permissible earth fault loop impedance on a TN system for a socket outlet used for hand held equipment and protected by a 20A fuse to BS 3036 is","o":["1.05Ω","1.40Ω","1.68Ω","2.57Ω"],"a":2,"x":"","r":"","n":"","k":1000431.0,"m":"","f":"Index: 'earth fault loop impedance, maximum'. Socket circuits need 0.4 s, so use Table 41.2 (Chapter 41), part (c) BS 3036 fuses, 20 A column.","w":{"0":"That's roughly the 30 A BS 3036 value in Table 41.2 (1.04 Ω); you read the wrong rating column.","1":"That figure isn't in the BS 3036 part of Table 41.2; check you're in part (c), not the BS 88 parts.","3":"That isn't the 0.4 s figure; a socket circuit needs 0.4 s, so don't use Table 41.4 (5 s), which gives 3.64 Ω for 20 A."}},{"id":"p4.4","t":"5","c":1,"q":"When using a hand held non metallic piece of equipment, the maximum temperature of any accessible part is","o":["65°C","55°C","90°C","80°C"],"a":0,"x":"","r":"","n":"","k":1000432.0,"m":"","f":"Index: 'temperature, accessible parts' or 'thermal effects'. Go to Table 42.1 (Regulation 423.1, Chapter 42), 'hand-held part', non-metallic row.","w":{"1":"55°C is the hand-held metallic limit; non-metallic parts are allowed 65°C.","2":"90°C is for non-metallic parts which need not be touched for normal operation.","3":"80°C is for non-metallic parts touched but not hand-held (or metallic parts not needing to be touched)."}},{"id":"p4.5","t":"5","c":0,"q":"Where there is a danger of fire due to nature of stored materials, a 100w spotlight shall be installed at a minimum distance from combustible materials of","o":["0.5m","0.8m","1m","2m"],"a":0,"x":"","r":"","n":"","k":1000433.0,"m":"","f":"Index: 'spotlight' or 'projector, minimum distance'. Go to Regulation 422.3.1 (Chapter 42, locations with risks of fire), rating up to 100 W.","w":{"1":"0.8 m is for spotlights over 100 W up to 300 W.","2":"1 m is for spotlights over 300 W up to 500 W.","3":"2 m isn't one of the distances in 422.3.1; the largest listed is 1.0 m."}},{"id":"p4.6","t":"4","c":0,"q":"Which of the following methods will not provide basic protection?","o":["Obstacles","Insulation","Barriers/enclosures","Protective Bonding"],"a":3,"x":"","r":"","n":"","k":1000434.0,"m":"","f":"Index: 'basic protection'. Chapter 41: Section 416 (insulation, barriers/enclosures) and Section 417 (obstacles, out of reach) are the basic-protection provisions; bonding sits under ADS fault protection (411.3.1.2).","w":{"0":"Obstacles do give basic protection (Section 417), though only for areas controlled by skilled or instructed persons.","1":"Basic insulation of live parts is the main basic-protection provision (416.1).","2":"Barriers or enclosures are a basic-protection provision (416.2)."}},{"id":"p4.7","t":"4","c":1,"q":"A radial circuit supplying fixed equipment is protected by a 20A Type B circuit breaker to BS EN 60898.  The maximum permitted value of earth fault loop impedance for this circuit is","o":["1.09Ω","0.55Ω","0.87Ω","2.19Ω"],"a":3,"x":"Table 41.3, 20 A Type B, 0.4 s: 2.19 Ω.","r":"","n":"","k":1000435.0,"m":"","f":"Index: 'earth fault loop impedance, maximum'. Go to Table 41.3 (Chapter 41), part (a) Type B circuit-breakers, 20 A column.","w":{"0":"1.09 Ω is the 20 A Type C value (or 40 A Type B); this question is Type B.","1":"0.55 Ω is the 80 A Type B value; you read the wrong rating column.","2":"0.87 Ω is the 50 A Type B (and 25 A Type C) value; you read the wrong column."}},{"id":"p4.8","t":"5","c":0,"q":"Which of the following will provide overcurrent protection?","o":["Linked switch","RCBO","RCD","Disconnector"],"a":1,"x":"","r":"","n":"","k":1000436.0,"m":"","f":"Index: 'RCBO' in Part 2 definitions and Chapter 43 overcurrent protective devices (432/433). An RCBO combines residual current and overcurrent protection in one device.","w":{"0":"A linked switch only switches; it has no overcurrent tripping characteristic.","2":"A plain RCD only detects residual (earth leakage) current, not overload or short-circuit current.","3":"A disconnector is for isolation only; it provides no overcurrent protection."}},{"id":"p4.9","t":"4","c":0,"q":"Which of these is a method of fault protection?","o":["Double or reinforced insulation","Out of reach","Obstacles","Insulation of live parts"],"a":0,"x":"","r":"","n":"","k":1000437.0,"m":"","f":"Index: 'fault protection'. Regulation 410.3.3 lists the protective measures; double or reinforced insulation (Section 412) covers fault protection by supplementary insulation.","w":{"1":"Placing out of reach is a basic-protection measure (Section 417), not fault protection.","2":"Obstacles are a basic-protection measure (Section 417), not fault protection.","3":"Insulation of live parts is basic protection (416.1), not fault protection."}},{"id":"p4.10","t":"4","c":0,"q":"An RCD offers protection against","o":["Overload current","Short circuit current","Overcurrent","Earth fault current"],"a":3,"x":"","r":"","n":"","k":1000438.0,"m":"","f":"Index: 'residual current device'. Part 2 definition: it operates when the residual (earth fault) current reaches a set value. Overcurrent devices are in Chapter 43.","w":{"0":"Overload is a circuit overcurrent with no earth leakage; an RCD can't see it because line and neutral currents still balance.","1":"A line-neutral short circuit is balanced, so a plain RCD won't trip; that needs an overcurrent device.","2":"Overcurrent (overload and short circuit) needs a fuse, circuit-breaker or RCBO, not a plain RCD."}},{"id":"p4.11","t":"5","c":0,"q":"Which of the following is used to determine the rating of an overcurrent protective device?","o":["Grouping factor","Ambient temperature","Design current","Voltage drop"],"a":2,"x":"","r":"","n":"","k":1000439.0,"m":"","f":"Index: 'overload protection, co-ordination'. Go to Regulation 433.1.1 (Chapter 43): Ib ≤ In ≤ Iz, so the device rating In is chosen from the design current Ib.","w":{"0":"Grouping factors reduce the cable's current-carrying capacity (Appendix 4); they size the cable, not the device.","1":"Ambient temperature correction applies to the cable's Iz (Appendix 4), not to choosing In.","3":"Voltage drop is checked after the cable is chosen (Appendix 4, 525); it doesn't set the device rating."}},{"id":"p4.12","t":"4","c":0,"q":"BS 7671 requires protection against electric shock to be provided by basic and fault protection.  One common method to both is:","o":["The use of RCDs","SELV","The use of class H equipment","The use and implementation of equipotential bonding"],"a":1,"x":"","r":"","n":"","k":1000440.0,"m":"","f":"Index: 'SELV' or 'protective measures'. Regulation 410.3.3 lists them; Section 414 (ELV by SELV/PELV) provides both basic and fault protection.","w":{"0":"RCDs give additional protection or are part of ADS fault protection; they aren't a measure giving both basic and fault protection.","2":"There's no 'class H' equipment; Class II is the double-insulation measure (Section 412).","3":"Equipotential bonding is part of fault protection under ADS (411.3.1.2), not basic protection."}},{"id":"p4.13","t":"4","c":0,"q":"In each part of an installation one or more protective measures shall be applied taking account of:","o":["External influences","Safety services","Maintainability","Compatibility"],"a":0,"x":"","r":"","n":"","k":1000441.0,"m":"","f":"Index: 'protective measures'. Go to Regulation 410.3.3 (Chapter 41): measures applied 'taking account of the conditions of external influence'.","w":{"1":"Safety services are covered in Chapter 56; they aren't the condition named in 410.3.3.","2":"Maintainability is a Chapter 34 assessment item, not the factor named in 410.3.3.","3":"Compatibility is Chapter 33 (and 512.1.5); 410.3.3 names external influences."}},{"id":"p4.14","t":"5","c":0,"q":"Correct co-ordination between circuit conductors and an overcurrent protection device is achieved when:","o":["In exceeds the lowest current carrying capacity Iz","In is less than the design current Ib","Ib is less than Iz","Iz is lower than or equal to Ib"],"a":2,"x":"","r":"","n":"","k":1000442.0,"m":"","f":"Index: 'overload protection, co-ordination'. Go to Regulation 433.1.1 (Chapter 43): Ib ≤ In ≤ Iz and I2 ≤ 1.45 Iz.","w":{"0":"In must not exceed Iz, otherwise the cable can be overloaded without the device operating.","1":"In must be at least Ib, or the device would trip under normal load.","3":"Iz must be at least In (and so at least Ib); Iz below Ib means the cable is undersized."}},{"id":"p4.15","t":"5","c":0,"q":"What is the minimum size of a copper earthingbusbar for an installation which has a supply capacity of 150 A per phase and incoming live conductors of 70mm², when considering measures against electromagnetic disturbances?","o":["25mm²","30mm²","45mm²","50mm²"],"a":0,"x":"","r":"","n":"","k":1000443.0,"m":"","f":"Index: 'earthing busbar'. Go to Regulation 444.5.7.2 (Chapter 44): under 200 A per phase use Table 54.8, then read the 70 mm² supply conductor row.","w":{"1":"30 mm² isn't a size in Table 54.8; 70 mm² falls in the over 50 up to 95 mm² row.","2":"45 mm² isn't a size in Table 54.8; check the over 50 up to 95 mm² row.","3":"50 mm² applies at 200 A per phase or more (444.5.7.2); this supply is 150 A."}},{"id":"p5.1","t":"7","c":0,"q":"Wiring systems shall be supported so they will not be liable to premature collapse in the event of fire. This requirement:","o":["This only applies to containment in escape routes only","This doesn’t apply to systems that are RCD protected by a 30mA RCD","This applies to all containment systems","This doesn’t apply where MICC cable is being used"],"a":2,"x":"","r":"","n":"","k":1000444.0,"m":"","f":"Index: 'wiring systems, support' or 'premature collapse'. Go to Regulation 521.10.202 (Chapter 52), which applies throughout the installation.","w":{"0":"The 2018 rule isn't limited to escape routes; it applies to all wiring systems.","1":"RCD protection has nothing to do with cables collapsing in a fire; there's no such exemption.","3":"There's no exemption for MICC; the support method must still resist premature collapse."}},{"id":"p5.2","t":"8","c":0,"q":"Where protection against overvoltage is required, Type 1 or Type 2 SPD’s should be located as close as possible to the","o":["Origin of the installation","Equipment being protected","Main earthing terminal","Main distribution board"],"a":0,"x":"","r":"","n":"","k":1000445.0,"m":"","f":"Index: 'surge protective devices'. Go to Regulation 534.4.1.1 (Chapter 53): SPDs at the origin shall be Type 1 or Type 2.","w":{"1":"Type 2 or Type 3 SPDs go close to sensitive equipment; Type 1/2 go at the origin.","2":"The MET is where SPD conductors connect, but 534.4.1.1 places Type 1/2 SPDs at the origin.","3":"The main board is often at the origin, but the regulation's wording is 'origin of the installation'."}},{"id":"p5.3","t":"10","c":0,"q":"A lighting circuit in corporating E40 and B22 lampholders shall be protected by an overcurrent protective device of maximum rating","o":["3A","6A","10A","16A"],"a":3,"x":"","r":"","n":"","k":1000446.0,"m":"","f":"Index: 'lampholders'. Go to Regulation 559.5.1.204 (Chapter 55): B15, B22, E14, E27 or E40 lampholders, maximum 16 A device.","w":{"0":"3 A isn't a limit in 559.5.1.204; the maximum is 16 A.","1":"6 A is a common lighting MCB size, but the regulation's maximum is 16 A.","2":"10 A is a design choice, not the maximum allowed by 559.5.1.204."}},{"id":"p5.4","t":"7","c":0,"q":"A legible diagram, chart or table relating to an installation must be provided indicating in particular:","o":["The frequency of mcb checks","The information necessary for the identification of protective devices","The name of the distributer","The maximum demand in amps"],"a":1,"x":"","r":"","n":"","k":1000447.0,"m":"","f":"Index: 'diagrams' or 'charts'. Go to Regulation 514.9.1 (Chapter 51, identification).","w":{"0":"Device test frequencies aren't required on the circuit chart by 514.9.1.","2":"The distributor's name isn't one of the items listed in 514.9.1.","3":"Maximum demand goes on the certificate, not in the 514.9.1 list."}},{"id":"p5.5","t":"9","c":1,"q":"In order to calculate the minimum csa of a protective conductor, the following information is available: Fault current = 400A, operating time of protective device = 0.15s, constant, k, for protective conductor material = 134.  The selective size of a conductor should be","o":["1.5mm²","2.5mm²","4.0mm²","6.0mm²"],"a":0,"x":"Adiabatic equation: S = √(I²t) ÷ k = I × √t ÷ k<br>√0.15 = 0.387<br>400 × 0.387 = 154.9<br>154.9 ÷ 134 = 1.16 mm² → next size up: 1.5 mm²","r":"","n":"","k":1000448.0,"m":"","f":"Index: 'pr
